[project]
name = "atlas-opscenter"
version = "0.1.0"
description = "运营中心 —— 管平台本身：租户的开通与关闭、应用目录、容量、运行环境、系统参数与系统任务。"
requires-python = ">=3.13"

# ★ 独立系统（c4-model/opscenter/design-opscenter.html）：运营人员是用户中心里系统租户的人（统一登录、
#   按模块授权）；自己的库只存运营审计和租户操作的进度。只经各系统的运营接口（/ops/v1，签名）做事，
#   看不到任何租户的业务内容；与 atlas 其它服务包互不 import（根 pyproject 的 import-linter 守着）。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  # 运营接口的签名与 OperatorStamp（和各业务系统用同一份实现）
  "atlas-opsapi",
  # 后台任务：推进租户操作、到期检查
  "atlas-jobs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_opscenter"]
