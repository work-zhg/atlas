# MCP 网关（atlas-mcpgateway，原型 agent-platform/doc/prototype/mcp-gateway.html）：所有 MCP 调用的唯一入口。
#
#   Atlas / Pod 里的 CLI / 外部客户端 ──API Key──▶ MCP 网关 ──上游凭据──▶ MCP Server · REST · gRPC
#
# ★ 库是宿主 Postgres 上的独立 database atlas_mcpgateway（docker compose 的 mcpgateway-init-db；
#   服务器部署由 deploy/server/deploy.sh 建）。不用 Redis：数据面无状态，判权结果按 Key 进程内缓存 30 秒。
# ★ 上游凭据由管理员在管理端登记，存在网关库里、不回显；Atlas、Pod 只拿到智能体自己的 Key。
# ★ 管理端接口经网关（nginx）登录后访问；/mcp 数据面对外（外部客户端带用户 Key），/internal 只在集群内。
#   多副本、无状态：/health 就绪即可接流量。
# ★ Trace：OTLP/HTTP 发给 otel-collector（服务名 atlas-mcpgateway）；调用方带来的 traceparent 会接上。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-mcpgateway
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-mcpgateway}
  template:
    metadata:
      labels: {app: atlas-mcpgateway}
    spec:
      # ★ MCP 网关不碰 K8s：默认 SA，没有任何权限
      initContainers:
        # 先迁移再起服务。迁移脚本在包内，不依赖工作目录。
        - name: migrate
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_mcpgateway", "migrate"]
          env: &mcpgw-env
            - {name: ATLAS_MCPGW_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_mcpgateway"}
            - {name: ATLAS_MCPGW_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            # 外部客户端连网关的地址（管理端显示配置示例用）：经前端网关的 /mcp-gateway-api/mcp/{服务名}
            - {name: ATLAS_MCPGW_PUBLIC_URL, value: "__PUBLIC_ORIGIN__/mcp-gateway-api"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://__HOST_IP__:4318"}
            - {name: OTEL_SERVICE_NAME, value: atlas-mcpgateway}
      containers:
        - name: mcpgateway
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_mcpgateway", "serve"]
          ports: [{containerPort: 8070, name: http}]
          env: *mcpgw-env
          readinessProbe:
            httpGet: {path: /health, port: 8070}
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-mcpgateway
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-mcpgateway}
  ports: [{port: 8070, targetPort: 8070}]
