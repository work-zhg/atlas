# AI TeamFlow 后端（atlas_teamflow）：团队、流程模板与市场、项目、流程；API 进程内跑投递器（开 run、
# 取消 run，embedded_worker）和通知器。设计见 c4-model/teamflow/design-teamflow.html。
#
# ★ 镜像与 Atlas 共用 atlas-app:dev。没有自己的凭据：调用户中心、Agent 平台都是内网免令牌，
#   请求头 X-Uid + X-Tenant-Id + X-Caller-App: teamflow（内网身份传递 §10）。
# ★ 多实例经 Redis 互相唤醒（ATLAS_TF_REDIS_URL）；运营接口（租户开通 / 删除、定时任务）的签名密钥在
#   Secret atlas-ops-keys 的 teamflow 项（apply.sh 建，运营中心持有同一把）。
# ★ Service 名不叫 atlas-tf：理由同 15-usercenter.yaml（ATLAS_TF_ 是配置前缀）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-teamflow
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-teamflow}
  template:
    metadata:
      labels: {app: atlas-teamflow}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_teamflow", "migrate"]
          env: &tf-env
            - {name: ATLAS_TF_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_teamflow"}
            - {name: ATLAS_TF_REDIS_URL, value: "redis://__HOST_IP__:6380/0"}
            - {name: ATLAS_TF_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            - {name: ATLAS_TF_ATLAS_BASE_URL, value: "http://atlas-server.atlas-system.svc.cluster.local:8000"}
            - name: ATLAS_TF_OPS_API_KEY
              valueFrom: {secretKeyRef: {name: atlas-ops-keys, key: teamflow}}
      containers:
        - name: teamflow
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_teamflow", "serve"]
          ports: [{containerPort: 8040, name: http}]
          env: *tf-env
          readinessProbe:
            httpGet: {path: /health, port: 8040}
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 192Mi}
---
# ★ ClusterIP（内网身份传递 §4）：只经网关对外
apiVersion: v1
kind: Service
metadata:
  name: atlas-teamflow
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-teamflow}
  ports: [{port: 8040, targetPort: 8040}]
---
# 内部 Ingress：API 网关把 /teamflow/… 去掉前缀后发到这里，Host = teamflow.internal.techstz.com
#   （infra-platform/gateway/routes.yaml；Traefik 只在集群内，见 deploy/server/traefik-values.yaml）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-teamflow
  namespace: atlas-system
spec:
  ingressClassName: traefik
  rules:
    - host: teamflow.internal.techstz.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: atlas-teamflow, port: {number: 8040}}}}
