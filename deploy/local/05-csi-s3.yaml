# 本机的 S3 CSI 驱动：k8s-csi-s3（s3fs mounter）对接宿主的 MinIO
# （doc/sandbox-opensandbox-design.html §6、§17）。阿里云 ACK 上换成自带的 OSS CSI（ossfs），本文件不用。
#
# ★ 镜像要自己构建（docker/csi-s3/Dockerfile）：上游 cr.yandex 的镜像只有 amd64，而且带的 s3fs 1.97
#   会让嵌套目录 rename 失败一半；那份 Dockerfile 换成了 s3fs 1.95。
# ★ s3fs 进程跑在节点插件容器里：这个容器重启，节点上所有的挂载都会断（transport endpoint is not
#   connected），用到它的沙箱要删掉重建。所以这个 DaemonSet 不要随手 rollout restart。
# ★ 只有静态 PV（opensandbox.sh 建），用不到动态供给，所以不装 provisioner。
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ru.yandex.s3.csi
spec:
  attachRequired: false
  podInfoOnMount: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-s3
  namespace: kube-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-s3
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-s3
subjects:
  - kind: ServiceAccount
    name: csi-s3
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: csi-s3
  apiGroup: rbac.authorization.k8s.io
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-s3
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-s3
  template:
    metadata:
      labels:
        app: csi-s3
    spec:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      serviceAccount: csi-s3
      containers:
        - name: driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0
          args:
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
            - "--v=4"
            - "--csi-address=$(ADDRESS)"
          env:
            - {name: ADDRESS, value: /csi/csi.sock}
            - {name: DRIVER_REG_SOCK_PATH, value: /var/lib/kubelet/plugins/ru.yandex.s3.csi/csi.sock}
            - name: KUBE_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts:
            - {name: plugin-dir, mountPath: /csi}
            - {name: registration-dir, mountPath: /registration/}
        - name: csi-s3
          securityContext:
            privileged: true
            capabilities: {add: ["SYS_ADMIN"]}
            allowPrivilegeEscalation: true
          image: atlas-csi-s3:0.43.7
          imagePullPolicy: IfNotPresent
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--nodeid=$(NODE_ID)"
            - "--v=4"
          env:
            - {name: CSI_ENDPOINT, value: "unix:///csi/csi.sock"}
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          volumeMounts:
            - {name: plugin-dir, mountPath: /csi}
            - name: stage-dir
              mountPath: /var/lib/kubelet/plugins/kubernetes.io/csi
              mountPropagation: Bidirectional
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - {name: fuse-device, mountPath: /dev/fuse}
            - {name: systemd-control, mountPath: /run/systemd}
      volumes:
        - name: registration-dir
          hostPath: {path: /var/lib/kubelet/plugins_registry/, type: DirectoryOrCreate}
        - name: plugin-dir
          hostPath: {path: /var/lib/kubelet/plugins/ru.yandex.s3.csi, type: DirectoryOrCreate}
        - name: stage-dir
          hostPath: {path: /var/lib/kubelet/plugins/kubernetes.io/csi, type: DirectoryOrCreate}
        - name: pods-mount-dir
          hostPath: {path: /var/lib/kubelet/pods, type: Directory}
        - name: fuse-device
          hostPath: {path: /dev/fuse}
        - name: systemd-control
          hostPath: {path: /run/systemd, type: DirectoryOrCreate}
