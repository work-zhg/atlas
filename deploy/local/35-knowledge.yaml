# 知识库服务（atlas-knowledge，doc/atlas-rag-design.html §14）：api + Celery worker，同一镜像。
#
# ★ 库是宿主 Postgres 上的独立 database atlas_knowledge（docker compose 的 knowledge-init-db）；
#   Redis 用 3 号库作 Celery broker 与缓存；Qdrant 与记忆共用一个实例（collection 前缀 kb_）。
# ★ 内网免令牌（内网身份传递 §3、§8）：身份在请求头里；操作码按 X-Auth-Uid 取用户中心快照。
#   只剩知识库 MCP 的签名密钥（Secret atlas-knowledge-mcp，与 atlas-server 共用）—— 那是给会话
#   Pod（不可信代码）的能力凭据，不是服务间令牌。
# ★ 浏览器经网关 /atlas-knowledge-api 访问，Service 只需 ClusterIP。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-knowledge
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-knowledge}
  template:
    metadata:
      labels: {app: atlas-knowledge}
    spec:
      initContainers:
        - name: migrate
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_knowledge", "migrate"]
          env: &kb-env
            - {name: ATLAS_KB_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_knowledge"}
            - {name: ATLAS_KB_REDIS_URL, value: "redis://__HOST_IP__:6380/3"}
            - {name: ATLAS_KB_QDRANT_URL, value: "http://__HOST_IP__:6333"}
            - {name: ATLAS_KB_OSS_ENDPOINT, value: "http://__HOST_IP__:9000"}
            - {name: ATLAS_KB_OSS_BUCKET, value: atlas-dev}
            - {name: ATLAS_KB_OSS_ADDRESSING_STYLE, value: path}
            - {name: ATLAS_KB_OSS_REGION, value: us-east-1}
            - {name: ATLAS_KB_SERVER_URL, value: "http://atlas-server.atlas-system.svc.cluster.local:8000"}
            # 库级权限 = 用户中心数据权限（AtlasKnowledgeBase）：以 Atlas 应用的身份调用户中心，
            # 与 atlas-server 同一对 App Key / Secret。用户中心后端在集群里（15-usercenter.yaml）
            - {name: ATLAS_KB_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            - {name: ATLAS_KB_CORS_ORIGINS, value: '["http://localhost:3000","http://127.0.0.1:3000"]'}
            # 遥测：与 atlas-server 同一个 Collector（Jaeger 那路会删正文，Langfuse 那路保留）
            - {name: ATLAS_KB_OTEL_ENABLED, value: "true"}
            - {name: ATLAS_KB_OTEL_ENDPOINT, value: "http://__HOST_IP__:4318"}
            - {name: ATLAS_KB_TRACE_URL_TEMPLATE, value: "http://localhost:16686/trace/{trace_id}"}
            # ★ 不设 ATLAS_KB_MODEL_CACHE_DIR：它对向量模型同样生效，设了就不用镜像里预装的
            #   bge-small-zh、改去 HuggingFace 重新下载（Pod 里没有代理，会卡住）。
            #   重排模型（约 1GB）首次使用时下载到默认目录，Pod 重建后要重新下载。
            - {name: MEM0_TELEMETRY, value: "False"}
            - name: ATLAS_KB_OSS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: atlas-config-creds, key: oss_access_key_id}}
            - name: ATLAS_KB_OSS_ACCESS_KEY_SECRET
              valueFrom: {secretKeyRef: {name: atlas-config-creds, key: oss_access_key_secret}}
            - name: ATLAS_KB_MCP_SECRET
              valueFrom: {secretKeyRef: {name: atlas-knowledge-mcp, key: secret}}
            # 入库增强（上下文补全、表格摘要）与查询理解用的 LLM：OpenAI 兼容的 chat/completions。
            #   key 复用 server 的模型网关凭据（同一个 DeepSeek 账号）
            - {name: ATLAS_KB_LLM_BASE_URL, value: "https://api.deepseek.com"}
            - {name: ATLAS_KB_LLM_MODEL, value: deepseek-chat}
            - name: ATLAS_KB_LLM_API_KEY
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: litellm_key}}
            # 模型管理平台（agent-platform/doc/design/model-design.html 第 9 章）：ConfigMap
            #   atlas-model-platform 有了就带着平台上的服务级客户端 Key 直连 LiteLLM，上面的 LLM 地址、
            #   模型、Key 不再用（model-cutover.sh 建 ConfigMap 和这几把 Key）
            - name: ATLAS_KB_MODEL_PLATFORM_URL
              valueFrom: {configMapKeyRef: {name: atlas-model-platform, key: platform_url, optional: true}}
            - name: ATLAS_KB_MODEL_LITELLM_URL
              valueFrom: {configMapKeyRef: {name: atlas-model-platform, key: litellm_url, optional: true}}
            - {name: ATLAS_KB_CHAT_CLIENT, value: "Service:knowledge-chat"}
            - name: ATLAS_KB_ENRICH_MODEL
              valueFrom: {configMapKeyRef: {name: atlas-model-platform, key: kb_enrich_model, optional: true}}
            - {name: ATLAS_KB_EMBEDDING_CLIENT, value: "Service:knowledge-embedding"}
            - {name: ATLAS_KB_RERANK_CLIENT, value: "Service:knowledge-rerank"}
      containers:
        - name: api
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_knowledge", "serve"]
          ports: [{containerPort: 8050, name: http}]
          env: *kb-env
          readinessProbe:
            httpGet: {path: /health, port: 8050}
            periodSeconds: 3
          resources:
            # 查询向量在 api 进程里算：bge-small-zh 常驻约 300MB
            requests: {cpu: 100m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-knowledge-worker
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-knowledge-worker}
  template:
    metadata:
      labels: {app: atlas-knowledge-worker}
    spec:
      containers:
        - name: worker
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          # 解析与本地向量化是 CPU 活：并发 2，按机器调
          command: ["python", "-m", "atlas_knowledge", "worker", "--concurrency", "2"]
          # ★ YAML 锚点不跨 --- 文档：worker 这份要完整写出，改 api 的环境变量时同步改这里
          env:
            - {name: ATLAS_KB_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_knowledge"}
            - {name: ATLAS_KB_REDIS_URL, value: "redis://__HOST_IP__:6380/3"}
            - {name: ATLAS_KB_QDRANT_URL, value: "http://__HOST_IP__:6333"}
            - {name: ATLAS_KB_OSS_ENDPOINT, value: "http://__HOST_IP__:9000"}
            - {name: ATLAS_KB_OSS_BUCKET, value: atlas-dev}
            - {name: ATLAS_KB_OSS_ADDRESSING_STYLE, value: path}
            - {name: ATLAS_KB_OSS_REGION, value: us-east-1}
            - {name: ATLAS_KB_SERVER_URL, value: "http://atlas-server.atlas-system.svc.cluster.local:8000"}
            # 库级权限 = 用户中心数据权限（AtlasKnowledgeBase）：以 Atlas 应用的身份调用户中心，
            # 与 atlas-server 同一对 App Key / Secret。用户中心后端在集群里（15-usercenter.yaml）
            - {name: ATLAS_KB_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            - {name: ATLAS_KB_CORS_ORIGINS, value: '["http://localhost:3000","http://127.0.0.1:3000"]'}
            # 遥测：与 atlas-server 同一个 Collector（Jaeger 那路会删正文，Langfuse 那路保留）
            - {name: ATLAS_KB_OTEL_ENABLED, value: "true"}
            - {name: ATLAS_KB_OTEL_ENDPOINT, value: "http://__HOST_IP__:4318"}
            - {name: ATLAS_KB_TRACE_URL_TEMPLATE, value: "http://localhost:16686/trace/{trace_id}"}
            # ★ 不设 ATLAS_KB_MODEL_CACHE_DIR：它对向量模型同样生效，设了就不用镜像里预装的
            #   bge-small-zh、改去 HuggingFace 重新下载（Pod 里没有代理，会卡住）。
            #   重排模型（约 1GB）首次使用时下载到默认目录，Pod 重建后要重新下载。
            - {name: MEM0_TELEMETRY, value: "False"}
            - name: ATLAS_KB_OSS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: atlas-config-creds, key: oss_access_key_id}}
            - name: ATLAS_KB_OSS_ACCESS_KEY_SECRET
              valueFrom: {secretKeyRef: {name: atlas-config-creds, key: oss_access_key_secret}}
            - name: ATLAS_KB_MCP_SECRET
              valueFrom: {secretKeyRef: {name: atlas-knowledge-mcp, key: secret}}
            # 入库增强（上下文补全、表格摘要）与查询理解用的 LLM：OpenAI 兼容的 chat/completions。
            #   key 复用 server 的模型网关凭据（同一个 DeepSeek 账号）
            - {name: ATLAS_KB_LLM_BASE_URL, value: "https://api.deepseek.com"}
            - {name: ATLAS_KB_LLM_MODEL, value: deepseek-chat}
            - name: ATLAS_KB_LLM_API_KEY
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: litellm_key}}
            # 模型管理平台（agent-platform/doc/design/model-design.html 第 9 章）：ConfigMap
            #   atlas-model-platform 有了就带着平台上的服务级客户端 Key 直连 LiteLLM，上面的 LLM 地址、
            #   模型、Key 不再用（model-cutover.sh 建 ConfigMap 和这几把 Key）
            - name: ATLAS_KB_MODEL_PLATFORM_URL
              valueFrom: {configMapKeyRef: {name: atlas-model-platform, key: platform_url, optional: true}}
            - name: ATLAS_KB_MODEL_LITELLM_URL
              valueFrom: {configMapKeyRef: {name: atlas-model-platform, key: litellm_url, optional: true}}
            - {name: ATLAS_KB_CHAT_CLIENT, value: "Service:knowledge-chat"}
            - name: ATLAS_KB_ENRICH_MODEL
              valueFrom: {configMapKeyRef: {name: atlas-model-platform, key: kb_enrich_model, optional: true}}
            - {name: ATLAS_KB_EMBEDDING_CLIENT, value: "Service:knowledge-embedding"}
            - {name: ATLAS_KB_RERANK_CLIENT, value: "Service:knowledge-rerank"}
          resources:
            requests: {cpu: 200m, memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-knowledge
  namespace: atlas-system
spec:
  selector: {app: atlas-knowledge}
  ports: [{port: 8050, targetPort: 8050}]
