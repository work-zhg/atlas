# 模型管理平台 + 模型网关（agent-platform/doc/design/model-gateway-design.html，c4-model/modelgateway）。
# 同一个包、同一个镜像，两个进程：
#
#   管理端 ──登录后──▶ 管理平台 atlas-modelgateway（:8090）  账号、模型与线路、API Key、调用记录
#   Atlas / 知识库 ──/internal（按客户端类型 + 编码取 Key 和可用模型）──▶ 管理平台
#   Atlas / Pod 里的 CLI / 外部工具 ──Key──▶ 模型网关 atlas-llmgateway（:8091）──账号密钥──▶ 供应商
#
# ★ 包名、库名（atlas_modelgateway）、用户中心应用编码（model-gateway）沿用：已有的授权不用迁移。
# ★ 库是宿主 Postgres 上的独立 database atlas_modelgateway（服务器部署由 deploy/server/deploy.sh 建）。
# ★ Redis 5 号库：几个网关实例共用的线路冷却、账号异常、每分钟次数、当月花费、配置版本号。
#   连不上时网关退回只记在进程里，调用不受影响。
# ★ Secret atlas-modelgw-creds（apply.sh 建）：
#     secret_keys   账号密钥的主密钥（逗号分隔，第一把加密）。管理平台加密、网关解密。
#                   ★ 设了就不能删：删了库里已存的账号密钥就解不开了；轮换是在前面加一把新的
#                   （python -m atlas_modelgateway encrypt-secrets 用新的重新加密），旧的留着
#     egress_proxy  海外供应商的出网代理
# ★ 运营接口（/ops/v1）的签名密钥在 Secret atlas-ops-keys 的 modelgateway（apply.sh 建，运营中心持有同一把）
# ★ 迁移 m0004 把已有数据归到原平台租户：ConfigMap atlas-tenancy 的 backfill_uuid（apply.sh 按 .env 的
#   TENANT_BACKFILL_UUID 建）。表里有数据却没给，迁移失败、Pod 起不来。
# ★ 管理接口经网关（nginx）登录后访问；/internal（给 Atlas、知识库）只在集群内，nginx 不转发。
#   ★ /internal 要带 X-Tenant-Id（应用替自己的租户取 Key）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-modelgateway
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-modelgateway}
  template:
    metadata:
      labels: {app: atlas-modelgateway}
    spec:
      # ★ 不碰 K8s：默认 SA，没有任何权限
      initContainers:
        # 先迁移再起服务。迁移脚本在包内，不依赖工作目录。
        - name: migrate
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "migrate"]
          env:
            - {name: ATLAS_MODELGW_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_modelgateway"}
            - name: TENANT_BACKFILL_UUID
              valueFrom: {configMapKeyRef: {name: atlas-tenancy, key: backfill_uuid, optional: true}}
      containers:
        - name: modelgateway
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "serve"]
          ports: [{containerPort: 8090, name: http}]
          env:
            - {name: ATLAS_MODELGW_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_modelgateway"}
            - {name: ATLAS_MODELGW_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            - {name: ATLAS_MODELGW_REDIS_URL, value: "redis://__HOST_IP__:6380/5"}
            # 页面上的调用示例：同一个域名的 /llm（nginx 转给模型网关）
            - {name: ATLAS_MODELGW_GATEWAY_PUBLIC_URL, value: "__PUBLIC_ORIGIN__/llm"}
            - name: ATLAS_MODELGW_SECRET_KEYS
              valueFrom: {secretKeyRef: {name: atlas-modelgw-creds, key: secret_keys}}
            - name: ATLAS_MODELGW_OPS_API_KEY
              valueFrom: {secretKeyRef: {name: atlas-ops-keys, key: modelgateway}}
            # 海外供应商的出网代理（账号选「经出网代理」时用）；没配就只能连国内直连的供应商
            - name: ATLAS_MODELGW_EGRESS_PROXY
              valueFrom: {secretKeyRef: {name: atlas-modelgw-creds, key: egress_proxy, optional: true}}
            # 允许连的内网地址（JSON 数组）：默认内网一律不连（防 SSRF）。账号要连内网的自部署模型（vLLM 等）
            #   时才建 ConfigMap atlas-modelgw-config，只放行那几个地址
            - name: ATLAS_MODELGW_UPSTREAM_ALLOW_CIDRS
              valueFrom: {configMapKeyRef: {name: atlas-modelgw-config, key: upstream_allow_cidrs, optional: true}}
          readinessProbe:
            httpGet: {path: /health, port: 8090}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 160Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-modelgateway
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-modelgateway}
  ports: [{port: 8090, targetPort: 8090}]
---
# 模型网关：调用路径上唯一的一跳。不建表、不迁移（库由管理平台迁移），只读配置、写调用记录。
# ★ 无状态，可以多副本：共用状态在 Redis；同一个会话按线路粘在同一家（不靠实例粘连）。
# ★ 发版不打断正在流的回答：先起新的（maxUnavailable 0）；旧的先从 Service 摘掉（preStop 等几秒，
#   让 kube-proxy、nginx 不再把新请求发过来），收到 SIGTERM 后不接新连接、等手上的回答结束，
#   最多 ATLAS_MODELGW_DRAIN_TIMEOUT_S（120s），宽限期要比它长。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-llmgateway
  namespace: atlas-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: atlas-llmgateway}
  template:
    metadata:
      labels: {app: atlas-llmgateway}
    spec:
      terminationGracePeriodSeconds: 150
      containers:
        - name: gateway
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "gateway"]
          ports: [{containerPort: 8091, name: http}]
          env:
            - {name: ATLAS_MODELGW_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_modelgateway"}
            - {name: ATLAS_MODELGW_REDIS_URL, value: "redis://__HOST_IP__:6380/5"}
            - name: ATLAS_MODELGW_SECRET_KEYS
              valueFrom: {secretKeyRef: {name: atlas-modelgw-creds, key: secret_keys}}
            - name: ATLAS_MODELGW_EGRESS_PROXY
              valueFrom: {secretKeyRef: {name: atlas-modelgw-creds, key: egress_proxy, optional: true}}
            # 允许连的内网地址（JSON 数组）：默认内网一律不连（防 SSRF）。账号要连内网的自部署模型（vLLM 等）
            #   时才建 ConfigMap atlas-modelgw-config，只放行那几个地址
            - name: ATLAS_MODELGW_UPSTREAM_ALLOW_CIDRS
              valueFrom: {configMapKeyRef: {name: atlas-modelgw-config, key: upstream_allow_cidrs, optional: true}}
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          readinessProbe:
            httpGet: {path: /readyz, port: 8091}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8091}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-llmgateway
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-llmgateway}
  ports: [{port: 8091, targetPort: 8091}]
