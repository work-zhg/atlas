# 模型网关（atlas-modelgateway，doc/model-design.html）：所有模型调用的唯一入口。
#
#   Atlas / Pod 里的 CLI / 知识库 ──主体 Key 或 应用 + 用途──▶ 模型网关 ──网关凭据──▶ Higress ──供应商 Key──▶ 供应商
#
# ★ 库是宿主 Postgres 上的独立 database atlas_modelgateway（docker compose 的 modelgateway-init-db；
#   服务器部署由 deploy/server/deploy.sh 建）。不用 Redis：判权结果进程内缓存，用量记录异步写库。
# ★ 网关凭据（Secret atlas-modelgateway-creds，apply.sh 建）只在网关和 Higress 里：不下发给 Atlas 和 Pod。
#   Higress 上的模型路由要配成只认它（deploy/local/higress/models.py）—— 在那之前登记模型会因
#   「接入检查不通过」被拒。和 MCP 网关的凭据分开。
# ★ 管理端接口经网关（nginx）登录后访问；/internal（给 Atlas、知识库）与 /v1（数据面）只在集群内，
#   网关不转发。多副本、无状态：/health 就绪即可接流量。
# ★ Atlas、知识库什么时候切过来由 ConfigMap atlas-model-gateway 决定（deploy/server/model-cutover.sh 建）：
#   没有它时照旧直连供应商。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-modelgateway
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-modelgateway}
  template:
    metadata:
      labels: {app: atlas-modelgateway}
    spec:
      # ★ 模型网关不碰 K8s：默认 SA，没有任何权限
      initContainers:
        # 先迁移再起服务。迁移脚本在包内，不依赖工作目录。
        - name: migrate
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "migrate"]
          env: &modelgw-env
            - {name: ATLAS_MODELGW_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_modelgateway"}
            - {name: ATLAS_MODELGW_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            # 上游 = Higress 的 AI 路由（本机在宿主的 compose 里，--profile higress；服务器上是集群内的服务）
            - {name: ATLAS_MODELGW_HIGRESS_BASE_URL, value: "http://__HOST_IP__:18080"}
            - name: ATLAS_MODELGW_GATEWAY_CREDENTIAL
              valueFrom: {secretKeyRef: {name: atlas-modelgateway-creds, key: gateway_credential}}
      containers:
        - name: modelgateway
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "serve"]
          ports: [{containerPort: 8090, name: http}]
          env: *modelgw-env
          readinessProbe:
            httpGet: {path: /health, port: 8090}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 160Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-modelgateway
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-modelgateway}
  ports: [{port: 8090, targetPort: 8090}]
