# 模型管理平台（atlas-modelgateway，agent-platform/doc/design/model-design.html）：登记模型、私有模型授权、
# API Key（用户 Key / 客户端 Key），把结果同步到 LiteLLM（39-litellm.yaml）。不在调用路径上。
#
#   管理端 ──登录后──▶ 模型管理平台 ──master key──▶ LiteLLM 管理接口
#   Atlas / 知识库 ──/internal（按客户端类型 + 编码取 Key 和可用模型）──▶ 模型管理平台
#
# ★ 包名、库名（atlas_modelgateway）、用户中心应用编码（model-gateway）沿用自研网关时期的：已有的授权不用迁移。
# ★ 库是宿主 Postgres 上的独立 database atlas_modelgateway（docker compose 的 modelgateway-init-db；
#   服务器部署由 deploy/server/deploy.sh 建）。不用 Redis。
# ★ 管理端接口经网关（nginx）登录后访问；/internal（给 Atlas、知识库）只在集群内，网关不转发。
#   多副本、无状态：/health 就绪即可接流量（每个副本各自定期对账，同步是幂等的）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-modelgateway
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-modelgateway}
  template:
    metadata:
      labels: {app: atlas-modelgateway}
    spec:
      # ★ 不碰 K8s：默认 SA，没有任何权限
      initContainers:
        # 先迁移再起服务。迁移脚本在包内，不依赖工作目录。
        - name: migrate
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "migrate"]
          env: &modelgw-env
            - {name: ATLAS_MODELGW_DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas_modelgateway"}
            - {name: ATLAS_MODELGW_UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            - {name: ATLAS_MODELGW_LITELLM_BASE_URL, value: "http://atlas-litellm.atlas-system.svc.cluster.local:4000"}
            - name: ATLAS_MODELGW_LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: atlas-litellm-creds, key: master_key}}
      containers:
        - name: modelgateway
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "atlas_modelgateway", "serve"]
          ports: [{containerPort: 8090, name: http}]
          env: *modelgw-env
          readinessProbe:
            httpGet: {path: /health, port: 8090}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 160Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-modelgateway
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-modelgateway}
  ports: [{port: 8090, targetPort: 8090}]
