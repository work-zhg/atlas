# 运营中心前端（opscenter/web，basePath /opscenter-ui）：和 Atlas 等前端同一个镜像（atlas-frontends，产物在 /app/ops），
# 自己的 Deployment。运营人员是系统租户里的人，统一登录（c4-model/opscenter/design-opscenter.html）：
# 页面经 API 网关 /opscenter-ui/…，接口 /opscenter/…（网关验 JWT，转给 48-opscenter.yaml 的后端）。
#
# 内部 Ingress：Host = opscenter-ui.internal.techstz.com（网关写进 Host，见 40-frontends.yaml 的说明）。
# ★ deploy/local/frontends.sh 应用本文件，镜像标签和 40-frontends.yaml 一样替换。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-opscenter-web
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-opscenter-web}
  template:
    metadata:
      labels: {app: atlas-opscenter-web}
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: atlas-frontends:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/ops/opscenter/web/server.js"]
          env:
            - {name: PORT, value: "3300"}
          ports: [{containerPort: 3300, name: http}]
          readinessProbe:
            httpGet: {path: /opscenter-ui, port: 3300}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-opscenter-web
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-opscenter-web}
  ports: [{port: 3300, targetPort: 3300}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-opscenter-web
  namespace: atlas-system
spec:
  ingressClassName: traefik
  rules:
    - host: opscenter-ui.internal.techstz.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: atlas-opscenter-web, port: {number: 3300}}}}
