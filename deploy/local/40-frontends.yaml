# 三个前端（Atlas、用户中心、AI TeamFlow）放在一个 Pod 里：atlas-web（:3000）、uc-web（:3100）、tf-web（:3200）。
#
# ★ 对外入口是 API 网关（宿主机上的 OpenResty，infra-platform/gateway/routes.yaml）：
#   页面 /<名>-ui/… 原样发往集群里的内部 Ingress，Host = <名>-ui.internal.techstz.com（basePath = /<名>-ui）；
#   接口 /<名>/… 去掉 /<名> 发往 <名>.internal.techstz.com —— 各后端的 Ingress 写在它自己的清单里。
#   登录校验（验 JWT、写身份头、CSRF）都在网关，这里只是页面。
# ★ 内部 Ingress（Traefik）只在集群内，不占宿主机端口（deploy/server/traefik-values.yaml）；
#   这些域名不进 DNS，只是网关写进 Host 的名字。
# ★ 本机（Docker Desktop）没有网关和 Traefik：kubectl -n atlas-system port-forward svc/atlas-frontends 3000
#   只能看页面，接口要经网关。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-frontends
  namespace: atlas-system
  labels: {app: atlas-frontends}
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-frontends}
  template:
    metadata:
      labels: {app: atlas-frontends}
    spec:
      enableServiceLinks: false
      containers:
        - name: atlas-web
          image: atlas-frontends:dev
          imagePullPolicy: Never   # 本机构建的镜像（Docker Desktop 与 K8s 共用镜像存储）
          command: ["node", "/app/atlas/agent-platform/web/server.js"]
          env: [{name: PORT, value: "3000"}]
          ports: [{containerPort: 3000}]
          readinessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
        - name: uc-web
          image: atlas-frontends:dev
          imagePullPolicy: Never
          command: ["node", "/app/uc/server.js"]
          env: [{name: PORT, value: "3100"}]
          ports: [{containerPort: 3100}]
          readinessProbe:
            tcpSocket: {port: 3100}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
        - name: tf-web
          image: atlas-frontends:dev
          imagePullPolicy: Never
          command: ["node", "/app/tf/teamflow/web/server.js"]
          env: [{name: PORT, value: "3200"}]
          ports: [{containerPort: 3200}]
          readinessProbe:
            tcpSocket: {port: 3200}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-frontends
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-frontends}
  ports:
    - {name: atlas-ui, port: 3000, targetPort: 3000}
    - {name: uc-ui, port: 3100, targetPort: 3100}
    - {name: teamflow-ui, port: 3200, targetPort: 3200}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-frontends
  namespace: atlas-system
spec:
  ingressClassName: traefik
  rules:
    - host: atlas-ui.internal.techstz.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: atlas-frontends, port: {number: 3000}}}}
    - host: uc-ui.internal.techstz.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: atlas-frontends, port: {number: 3100}}}}
    - host: teamflow-ui.internal.techstz.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: atlas-frontends, port: {number: 3200}}}}
