# server：API + 进程内执行器 + HostRuntime（经会话 Pod 里的 bridge 执行 acp agent）。
#
# ★ 为什么 server 也跑在集群里，而不是留在宿主上跑 make serve：
#   cluster 交给 server 的是 `ws://<podIP>:8900`（manager._url 用 Pod IP，
#   不用 DNS 名）。而 Docker Desktop **不把 Pod 网段路由到 macOS 宿主**
#   —— 宿主上的 server 连不上任何 Pod。进了集群这一跳才是真的。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-server
  namespace: atlas-system
spec:
  replicas: 1
  # ★ Recreate 而不是默认的 RollingUpdate：滚动更新要求新旧 Pod 同时在，
  #   而本机节点的内存会被会话 Pod 吃掉（每个会话 = bridge + 3 个 rclone
  #   sidecar，且当前**没有闲置回收**，见 cluster 的 idle_ttl_s 未接线）。
  #   一旦排不下，新 Pod 卡在 Pending/Insufficient memory，而旧 Pod 还在跑 ——
  #   表现是「部署成功了但代码没更新」。单副本本来也没有滚动的意义。
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: atlas-server}
  template:
    metadata:
      labels: {app: atlas-server}
    spec:
      # ★ 不给 ServiceAccount 任何 Role：server 不碰 K8s，Pod 生命周期
      #   归 cluster。这里的默认 SA 什么权限都没有，正是想要的。
      # ★ 停机交接（doc/horizontal-scaling-design.html §6）：SIGTERM 后 native run 走到
      #   安全点、acp run 断开，交给别的副本（或重建后的本副本）接着跑。宽限期要盖过
      #   DRAIN_TIMEOUT_S（默认 60s）+ 关连接与 flush 遥测的时间。
      terminationGracePeriodSeconds: 90
      containers:
        - name: server
          image: atlas-app:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            # PG / Redis / MinIO 都留在宿主的 docker compose 里。
            - {name: DATABASE_URL, value: "postgresql+asyncpg://atlas:atlas@__HOST_IP__:5433/atlas"}
            - {name: REDIS_URL, value: "redis://__HOST_IP__:6380/0"}
            - {name: OSS_ENDPOINT, value: "http://__HOST_IP__:9000"}
            - {name: OSS_BUCKET, value: atlas-dev}
            - {name: OSS_ADDRESSING_STYLE, value: path}
            - {name: OSS_REGION, value: us-east-1}
            # 配置服务：技能目录（MCP 注册表已迁到 MCP 网关）
            - {name: CONFIG_BASE_URL, value: "http://atlas-config.atlas-system.svc.cluster.local:8020"}
            # 知识库服务（doc/atlas-rag-design.html §10）；内网免令牌，带身份请求头
            - {name: KNOWLEDGE_BASE_URL, value: "http://atlas-knowledge.atlas-system.svc.cluster.local:8050"}
            # 原生智能体的 Shell 沙箱（doc/sandbox-opensandbox-design.html）：由 OpenSandbox 的 opensandbox-sbx 创建。
            # ★ 前提：deploy/local/opensandbox.sh 已执行（CSI 驱动、整桶 PVC atlas-oss、控制器、
            #   opensandbox-sbx）；API key 由它写进 Secret atlas-opensandbox
            - {name: SANDBOX_ENABLED, value: "true"}
            # 沙箱与 ACP Pod 的 CPU request（limit 仍是 2 核）。★ 小机器（4 核）上 250m 只够同时开三四个会话
            - {name: SANDBOX_CPU_REQUEST, value: 100m}
            - {name: ACP_CPU_REQUEST, value: 100m}
            - {name: OPENSANDBOX_SBX_URL, value: "http://opensandbox-sbx.opensandbox-system.svc.cluster.local"}
            - name: OPENSANDBOX_SBX_API_KEY
              valueFrom: {secretKeyRef: {name: atlas-opensandbox, key: sbx_api_key}}
            # ACP 智能体的 CLI Pod：OpenSandbox 的 opensandbox-acp（设计 §11）。模型 key 不在这里：
            # 在 atlas-acp 的 Secret atlas-acp-model 里，由 ACP 模板以文件挂进 Pod
            - {name: OPENSANDBOX_ACP_URL, value: "http://opensandbox-acp.opensandbox-system.svc.cluster.local"}
            - name: OPENSANDBOX_ACP_API_KEY
              valueFrom: {secretKeyRef: {name: atlas-opensandbox, key: acp_api_key}}
            - {name: ACP_MODEL_NAME, value: deepseek-chat}
            - name: ACP_MODEL_BASE_URL
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: acp_model_base_url}}
            # git 凭据档案（JSON：名字 → 凭据 + 允许使用的业务应用），git-profile.sh 从 .env 建。
            # 凭据经 Credential Vault 交给 Pod 的 egress sidecar，Pod 里看不到（设计 §12）
            - name: GIT_PROFILES
              valueFrom: {secretKeyRef: {name: atlas-git-profiles, key: profiles, optional: true}}
            # 知识库 MCP 令牌的签名密钥：给会话 Pod（不可信代码）的能力凭据，不是服务间令牌
            # （内网身份传递 §5.3）。与知识库的 ATLAS_KB_MCP_SECRET 是同一个
            - name: KNOWLEDGE_MCP_SECRET
              valueFrom: {secretKeyRef: {name: atlas-knowledge-mcp, key: secret}}
            # 技能版本的磁盘缓存。容器里放 /tmp：丢了只是重新拉一次
            - {name: CONFIGPLANE_CACHE_DIR, value: /tmp/atlas-configplane}
            # 遥测（可观测性设计 §02）。Collector 跑在宿主的 compose 里，
            # 与 PG/Redis/MinIO 同款走 LAN IP —— host.docker.internal 会被
            # Docker Desktop 转发到宿主 loopback，命中不了 compose 的监听。
            - {name: OTEL_ENABLED, value: "true"}
            - {name: OTEL_ENDPOINT, value: "http://__HOST_IP__:4318"}
            # 跨会话记忆（doc/memory-design.html）：存储在记忆服务（36-memory.yaml）
            - {name: MEMORY_BASE_URL, value: "http://atlas-memory.atlas-system.svc.cluster.local:8060"}
            # 身份与鉴权（doc/identity-propagation-design.html）：网关校验用户中心登录态、写入 X-Uid；
            # 缺 X-Uid 一律 401。操作码按 X-Auth-Uid 取用户中心授权快照（内网免令牌）
            - {name: UC_BASE_URL, value: "http://atlas-usercenter.atlas-system.svc.cluster.local:8030"}
            # MCP 只经自研 MCP 网关（doc/mcp-design.html 第二版，37-mcpgateway.yaml）：服务、工具定义、
            # 复核结论都从网关读，调用带这一轮权限主体的 API Key。★ 这里只有网关地址 —— 没有 Higress
            # 的地址，也没有任何后端凭据。serpapi 的 90s 调用超时在网关登记时定（mcp-cutover.sh）
            - {name: MCP_GATEWAY_URL, value: "http://atlas-mcpgateway.atlas-system.svc.cluster.local:8070"}
            # ★ 会话文件预览的 frame-ancestors（previews.py）：经前端网关（:8080，见 40-frontends.yaml）
            #   打开的预览页要能 iframe 嵌入预览站点
            #   __PUBLIC_ORIGIN__ = 前端网关的对外地址（apply.sh 替换；本机 http://localhost:8080）
            - {name: CORS_ORIGINS, value: '["http://localhost:3000","http://127.0.0.1:3000","__PUBLIC_ORIGIN__","http://127.0.0.1:8080"]'}
            - name: OSS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: oss_access_key_id}}
            - name: OSS_ACCESS_KEY_SECRET
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: oss_access_key_secret}}
            - name: LITELLM_BASE_URL
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: litellm_base_url}}
            - name: LITELLM_KEY
              valueFrom: {secretKeyRef: {name: atlas-server-creds, key: litellm_key}}
          # ★ /readyz 在停机交接期间返回 503，负载均衡据此摘流量
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 3
          lifecycle:
            # 给 Endpoints 摘除一点传播时间，再发 SIGTERM
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
---
# ★ ClusterIP（内网身份传递 §4）：身份在请求头里、内网免令牌，所以只能经网关对外 ——
#   宿主直连 localhost:8000 就是绕过网关的后门。评测 / 运维用 kubectl port-forward
#   （deploy/local/forward.sh）。
apiVersion: v1
kind: Service
metadata:
  name: atlas-server
  namespace: atlas-system
spec:
  type: ClusterIP
  selector: {app: atlas-server}
  ports: [{port: 8000, targetPort: 8000}]
