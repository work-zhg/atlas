# collector.yaml + Langfuse。由 `docker compose --profile langfuse up` 挂载。
#
# ★ 为什么是**两份文件**而不是一份带开关的：Collector 的配置不支持条件
#   pipeline，用环境变量拼出来的话「现在到底导到哪里」要靠脑内求值。
#   两份显式文件可以直接 diff、直接 grep —— 与这个仓库「明确优于聪明」
#   的取向一致。代价是基线那几段要同步改两处，可接受。
#
# ★ Langfuse 不替代 Jaeger，是分流（§01）：
#   Langfuse 擅长 LLM 维度（按会话看提示词、评估打分、成本归因），
#   但它**不是 APM** —— Pod 冷启动慢、NAS 抖动、WS 断连在它那里看不出来。
#   用一个后端硬扛两类问题，最后两类都查不好。

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  attributes/strip-content:
    actions:
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      # server 的内容档位（otel_capture_content = io / full）产出的内容字段，
      # 与 atlas_server.telemetry.semconv.CONTENT_ATTRIBUTES 保持一致
      - {key: langfuse.trace.input, action: delete}
      - {key: langfuse.trace.output, action: delete}
      - {key: langfuse.observation.input, action: delete}
      - {key: langfuse.observation.output, action: delete}

  resource:
    attributes:
      - {key: deployment.environment, value: local, action: upsert}

  batch:
    timeout: 2s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # 接入方式照 Langfuse 官方文档核对过，不是凭记忆写的：
  #   · 端点是 /api/public/otel（自托管 >= v3.22.0）
  #   · Basic Auth，AUTH_STRING = base64("pk-lf-…:sk-lf-…")
  #   · 还要带 x-langfuse-ingestion-version 头 —— 少了会被拒
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      # base64("pk-lf-atlas-local-dev:sk-lf-atlas-local-dev")，与
      # docker-compose.yml 里 LANGFUSE_INIT_PROJECT_*_KEY 对应。
      # 本机固定值，所以写死；真部署时换成 ${env:LANGFUSE_AUTH}。
      Authorization: "Basic cGstbGYtYXRsYXMtbG9jYWwtZGV2OnNrLWxmLWF0bGFzLWxvY2FsLWRldg=="
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    # ★ 两条管道，同一份数据分别处理（langfuse-integration-design §10）：
    #   · Jaeger 是 APM，**永远不带内容** —— 不管 server 开到哪个档位
    #   · Langfuse 的内容由 server 的 otel_capture_content 决定（默认 off，
    #     那时 server 根本不产生内容字段），这里不再删；脱敏和截断在 server 端做
    #     （telemetry/content.py），因为 Collector core 版没有 redaction 处理器
    traces/jaeger:
      receivers: [otlp]
      processors: [attributes/strip-content, resource, batch]
      exporters: [otlp_grpc/jaeger]
    traces/langfuse:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp_http/langfuse]

  telemetry:
    logs:
      level: info
