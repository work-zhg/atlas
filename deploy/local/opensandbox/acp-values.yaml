# opensandbox-acp：ACP Pod 的 lifecycle server（doc/sandbox-opensandbox-design.html §7、§17）。
# 用上游 server chart（release-1.1.1）装：deploy/local/opensandbox.sh。
#
# ★ fullnameOverride 决定 Deployment / Service / ClusterRole 的名字：与 opensandbox-sbx 互不覆盖。
# ★ API key 从 Secret 来（OPENSANDBOX_SERVER_API_KEY 覆盖 TOML 里的空值），不进 YAML。
# ★ store 用 SQLite 放 emptyDir：只存快照 / 模板目录这类自管数据（Atlas 不用），沙箱本身是 CR。
fullnameOverride: opensandbox-acp
server:
  replicaCount: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  env:
    - name: OPENSANDBOX_SERVER_API_KEY
      valueFrom: {secretKeyRef: {name: opensandbox-acp-api-key, key: api-key}}
  volumes:
    - name: template
      configMap: {name: opensandbox-acp-template}
    - name: store
      emptyDir: {}
  volumeMounts:
    - {name: template, mountPath: /etc/opensandbox/templates, readOnly: true}
    - {name: store, mountPath: /var/lib/opensandbox}
configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  api_key = ""

  [log]
  level = "INFO"

  [runtime]
  type = "kubernetes"
  execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.1.1"
  # execd 作 PID 1：回收僵尸进程、转发信号（OSEP-0018）
  execd_run_as_init = true

  [kubernetes]
  namespace = "atlas-acp"
  workload_provider = "batchsandbox"
  batchsandbox_template_file = "/etc/opensandbox/templates/acp.yaml"
  sandbox_create_timeout_seconds = 180
  image_pull_policy = "IfNotPresent"

  [store]
  type = "sqlite"
  path = "/var/lib/opensandbox/opensandbox.db"

  # Credential Vault（git 档案）要透明 MITM：dns+nft，且请求里带 networkPolicy（设计 §12、§15）
  [egress]
  image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:release-1.1.1"
  mode = "dns+nft"
