# 对外入口：服务器上已有的 traefik（IngressClass traefik），按主机名路由 —— 与 gitea 的 *.nip.io 约定一致，
# 不占根路径。__ATLAS_HOST__ 由 deploy.sh 替换（默认 atlas.<服务器 IP>.nip.io，.env 的 ATLAS_PUBLIC_HOST 可指定域名）。
#
#   __ATLAS_HOST__     Atlas / 用户中心 / TeamFlow（前端网关 atlas-frontends，唯一校验登录的地方）
#   Langfuse 的入口在 11-observability.yaml（跟着 Langfuse 一起装）
#
# ★ Jaeger、MinIO 控制台不对外（没有登录或口令弱）：用 kubectl port-forward。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  namespace: atlas-system
spec:
  ingressClassName: traefik
  rules:
    - host: __ATLAS_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: atlas-frontends, port: {number: 8080}}}
