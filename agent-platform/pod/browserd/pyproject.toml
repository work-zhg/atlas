[project]
name = "atlas-browserd"
version = "0.1.0"
description = "Atlas 浏览器守护 —— 跑在浏览器沙箱镜像里：拉起并看着虚拟屏幕、Chromium、画面服务，给平台导入导出登录态、开关接管窗口；模型用的 browser 命令。"
requires-python = ">=3.11"

# ★ 不在 uv 工作区里：它只进浏览器镜像（docker/browser/），不该把 playwright 带进平台的环境。
#   与 Atlas 的唯一接口是命令行（atlas-browserd <子命令>，经 execd 执行）和登录态文件的 JSON 形状
#   （Playwright 的 storageState）—— 不共享代码。
# ★ playwright 只用它连本机的 Chromium（connect_over_cdp），不下载浏览器（PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD）。
dependencies = ["playwright>=1.50"]

[project.scripts]
atlas-browserd = "atlas_browserd.__main__:main"
browser = "atlas_browserd.command:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_browserd"]

# 用例：uv run --offline --no-project --with playwright --with pytest --with pytest-asyncio \
#   pytest -c agent-platform/pod/browserd/pyproject.toml agent-platform/pod/browserd/tests
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
