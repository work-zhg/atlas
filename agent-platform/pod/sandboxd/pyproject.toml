[project]
name = "atlas-sandboxd"
version = "0.1.0"
description = "Atlas sandbox daemon — runs inside the native agent's sandbox Pod, executes shell commands."
requires-python = ">=3.13"

# ★ 零依赖（只用标准库）：它由 init 容器注入到**任意镜像**里运行（评测题目镜像、团队的开发镜像），
#   连同一份独立的 Python 一起拷进去（docker/sandboxd/Dockerfile）。每多一个依赖就多一份要随包
#   携带的字节与 CVE 面。也不许依赖本仓任何其它包：与 server 的唯一接口是 HTTP 上的协议。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_sandboxd"]
