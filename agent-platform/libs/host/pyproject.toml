[project]
name = "atlas-host"
version = "0.1.0"
description = "Atlas host protocol — the server ⇄ bridge upstream protocol (messages, codes, limits)."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_host"]
