[project]
name = "atlas-devicelink"
version = "0.1.0"
description = "Atlas device link — multiplexes session and file channels over one connector ⇄ device gateway connection."
requires-python = ">=3.13"

# ★ 设备网关和连接器两边共用（c4-model/agent/device/design-device-cli.html 原理 1）。
#   连接器装在用户电脑上，所以本包不依赖任何第三方库：WebSocket 收发由两边各自适配成 Transport。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_devicelink"]
