          <div class="kv mb16">
            <div class="k">智能体 id</div><div class="mono">${k.client_code}</div>
            <div class="k">智能体 Key</div><div><span class="mono">mk-…${k.last4}</span> ${keyStatusBadge(k)}<div class="subnote">uid <span class="mono">${k.uid}…</span> · 和智能体的权限类型无关</div></div>
          </div>
          ${k.status !== 'active' ? `<div class="callout callout-warn mb12"><div>这个智能体的 Key 已停用，编辑器里没有可选的 MCP 工具，运行时也调不了。${isAdmin() ? ' <button class="btn-link" id="at-go">去 API Key 启用 →</button>' : ''}</div></div>` : ''}
          <div class="tree">${usable.map(({ s, tools }) => {
            const hidden = s.tools.filter(t => callable(s, t)).length - tools.length;
            return `<div class="srv"><div class="srv-h">${esc(s.display)} <span class="mono muted small">${s.name}</span> ${visBadge(s)}${hidden ? `<span class="subnote">另有 ${hidden} 个工具没有授权，不显示</span>` : ''}</div>
              <div class="tools">${tools.map(t => `<label class="check"><input type="checkbox" checked> <span class="mono">${t.name}</span> ${t.effect !== 'read' ? effectBadge(t) : ''}</label>`).join('')}</div></div>`;
          }).join('') || '<div class="empty">没有能用的 MCP 工具</div>'}</div>
          <div class="small muted mt8">列表来自 MCP 网关：这把 Key 能用的服务和工具（公开 + 授给它的）。工具级授权只露出授权的那几个。${isAdmin() ? ' <button class="btn-link" id="at-assign">给这把 Key 分配权限 →</button>' : ''}</div>
        </div></div>
      <div class="card"><div class="card-h"><h3>调用过程</h3></div>
        <div class="card-b">
          <div class="section-t">① 新建智能体时申请 Key（Atlas → MCP 网关）</div>
          <pre class="code">${esc(`POST /open/v1/client-keys\n${json({ client_type: 'Agent', client_code: k.client_code, client_name: k.client_name })}\n→ 201 {"key_uid": "${k.uid}…", "status": "active"}   // 按类型 + 编码幂等；新 Key 只能调公开服务`)}</pre>
          <div class="section-t mt16">② 编辑、每个 Run 段开始时获取 Key 和工具（Atlas → MCP 网关）</div>
          <pre class="code">GET /open/v1/client-keys?client_type=Agent&amp;client_code=${k.client_code}</pre>
          <pre class="code mt8">${esc(json(view).replace(/\[\n\s+("[^\]]*?)\n\s+\]/g, (_, x) => '[' + x.replace(/\n\s+/g, ' ') + ']'))}</pre>
          <div class="small muted mt8">每个工具实际还带描述、参数定义、副作用（审批要用），这里只列名字。</div>
          <div class="section-t mt16">③ 调工具（Atlas → MCP 网关）</div>
          <pre class="code">${esc(callText)}</pre>
          <div class="section-t mt16">④ 网关判权（MCP 网关 → 用户中心）</div>
          <pre class="code">${esc(`GET <用户中心>/open/v1/data-permissions/accessible?data_code=McpServer\nGET <用户中心>/open/v1/data-permissions/accessible?data_code=McpTool\nX-Auth-Uid: ${k.uid}…        ← 这把 Key 的 uid`)}</pre>
          <div class="small muted mt8">结果按 Key 缓存 30 秒；公开服务不查。${denied ? `调没有授权的工具（例如 ${denied.s.name} · ${denied.t.name}）时网关直接返回 <span class="mono">-32044 forbidden</span>，不转发。` : ''}</div>
          <div class="section-t mt16">⑤ 删除智能体时（Atlas → MCP 网关）</div>
          <pre class="code">DELETE /open/v1/client-keys?client_type=Agent&amp;client_code=${k.client_code}</pre>
          <div class="small muted mt8">同时删除用户中心里的 Key 主体和它的授权。ACP 智能体：Key 随任务下发进 Pod，Pod 里的 MCP 客户端直接连网关，走同一套判权和流量治理。</div>
        </div></div>
    </div>
    <div class="card mt16"><div class="card-h"><h3>外部客户端</h3><span class="small muted">本人在「API Key」里申请用户 Key 后自己配置</span></div>
      <div class="card-b"><pre class="code">${esc(json({ mcpServers: { gitlab: { type: 'http', url: `${GW_PUBLIC}/gitlab`, headers: { Authorization: 'Bearer ${MCP_API_KEY}' } }, crm: { type: 'http', url: `${GW_PUBLIC}/crm`, headers: { Authorization: 'Bearer ${MCP_API_KEY}' } } } }))}</pre>
        <div class="small muted mt8">判权规则和智能体 Key 一样：公开服务直接用，私有服务看授给这把用户 Key 的权限；tools/list 只返回有权限的工具。</div></div></div>`;
  $('#at-agent').onchange = e => { atlasAgent = e.target.value; renderAtlas(); };
  $('#at-new').onclick = () => {
    const a = { id: 'agt_' + rand(6), name: `新智能体 ${AGENTS.length + 1}` };
    AGENTS.push(a);
    const nk = { uuid: 'k-' + rand(4), uid: genUid(), type: 'client', client_type: 'Agent', client_code: a.id, client_name: a.name, last4: genKey().slice(-4), status: 'active', created_at: nowStr(), by: 'Atlas（接口）' };
    keys.push(nk);
    atlasAgent = a.id;
    renderAtlas();
    toast(`Atlas 已创建「${a.name}」`, `POST /open/v1/client-keys  client_type=Agent  client_code=${a.id} → 用户中心登记 Key 主体；只能调公开服务`);
  };
  const ga = $('#at-go');
  if (ga) ga.onclick = () => { keyTab = 'client'; go('/keys'); };
  const as = $('#at-assign');
  if (as) as.onclick = () => openAssign(k, renderAtlas);
}

/* =====================================================================
 * 骨架
 * ===================================================================== */
const ICONS = {
  servers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/><path d="M7.5 7.2h.1M7.5 16.7h.1" stroke-linecap="round" stroke-width="2.4"/></svg>',
  keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="15.5" r="4.2"/><path d="M11 12.5 20 3.5M16.5 7l3 3M14 9.5l2 2"/></svg>',
  traffic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 13l4-4"/></svg>',
  about: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg>',
  atlas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
};
const NAV = [
  { path: '/servers', label: 'MCP 服务', icon: 'servers' },
  { path: '/keys', label: 'API Key', icon: 'keys' },
  { path: '/about', label: '原型说明', icon: 'about' },
  { path: '/traffic', label: '流量治理', icon: 'traffic', group: '通用组件（单独设计）' },
  { path: '/atlas', label: 'Atlas 与外部客户端', icon: 'atlas', group: '接入方示意' },
];

function renderShell(sec, arg) {
  const cur = NAV.find(n => n.path === sec) || NAV[0];
  $('#nav').innerHTML = NAV.map(n => `${n.group ? `<div class="nav-group">${n.group}</div>` : ''}<a class="nav-item ${n === cur ? 'active' : ''}" href="#${n.path}">${ICONS[n.icon]}<span>${n.label}</span></a>`).join('');
  const u = USERS[me];
  $('#sidebar-foot').innerHTML = `<div class="me">${avatar(me)}<div><strong>${u.name}</strong><small>${deptOf(u.dept).name} · ${u.admin ? 'MCP 管理员' : '普通用户'}</small></div></div>`;
  const s = arg && cur.path === '/servers' ? serverOf(arg) : null;
  $('#topbar').innerHTML = `
    <div class="crumbs"><span>MCP 网关</span><span class="sep">/</span>${s ? `<a href="#/servers">${cur.label}</a><span class="sep">/</span><span class="cur">${esc(s.display)}</span>` : `<span class="cur">${cur.label}</span>`}</div>
    <div class="grow"></div>
    <label class="row small muted">演示身份
      <select class="select" id="who">${Object.entries(USERS).filter(([, x]) => x.demo).map(([id, x]) => `<option value="${id}" ${id === me ? 'selected' : ''}>${x.name}（${x.admin ? 'MCP 管理员' : deptOf(x.dept).name}）</option>`).join('')}</select>
    </label>`;
  $('#who').onchange = e => { me = e.target.value; closeModal(); render(); toast(`已切换为 ${USERS[me].name}（${USERS[me].admin ? 'MCP 管理员' : '普通用户'}）`); };
}

function render() {
  const parts = route().split('/');
  const sec = '/' + (parts[1] || 'servers');
  const arg = parts[2] ? decodeURIComponent(parts[2]) : '';
  renderShell(sec, arg);
  if (sec === '/servers' && arg) return renderServerDetail(arg);
  ({ '/keys': renderKeys, '/traffic': renderTraffic, '/about': renderAbout, '/atlas': renderAtlas }[sec] || renderServers)();
}
window.addEventListener('hashchange', () => { closeModal(); window.scrollTo(0, 0); render(); });
render();
</script>
</body>
