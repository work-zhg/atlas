<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCP 网关 — 原型</title>
<style>
/* 视觉与用户中心、TeamFlow 原型一致（同一套设计 token） */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #f59e0b; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --sidebar: #111827;
  --radius: 12px; --radius-sm: 10px; --radius-xs: 8px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); }
code { font-family: var(--mono); font-size: 12px; background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
[hidden] { display: none !important; }

/* ---------- 骨架 ---------- */
.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 232px; flex: 0 0 232px; background: var(--sidebar); color: #cbd5e1; display: flex; flex-direction: column; padding: 16px 12px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 6px 8px 18px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { color: #fff; font-size: 15px; }
.brand-text small { color: #8592a8; font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: #aeb8cb; font-weight: 550; font-size: 13.5px; position: relative; }
.nav-item svg { width: 17px; height: 17px; flex: none; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #e8edf6; }
.nav-item.active { background: linear-gradient(90deg, rgba(14,165,233,.26), rgba(99,102,241,.16)); color: #fff; }
.nav-item.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; background: var(--secondary); border-radius: 0 3px 3px 0; }
.nav-group { font-size: 11px; color: #64748b; padding: 14px 12px 4px; letter-spacing: .04em; }
.sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.me strong { color: #eef2f8; font-size: 13px; display: block; }
.me small { color: #8592a8; font-size: 11px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 10px 26px; display: flex; align-items: center; gap: 12px; min-height: 52px; }
.crumbs { display: flex; gap: 8px; color: var(--ink-3); font-size: 13px; }
.crumbs .sep { color: var(--ink-4); }
.crumbs .cur { color: var(--ink); font-weight: 650; }
.content { padding: 24px 26px 60px; }

/* ---------- 通用 ---------- */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 21px; }
.page-head .sub { color: var(--ink-3); font-size: 13px; margin-top: 3px; }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-xs); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line-2); min-height: 52px; flex-wrap: wrap; }
.card-h h3 { font-size: 14.5px; }
.card-b { padding: 16px 18px; }
.grid-2c { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 7px 13px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #cfd4e2; background: var(--surface-2); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.22); }
.btn-primary:hover { background: var(--primary-2); border-color: var(--primary-2); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; border-color: #b91c1c; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: var(--radius-xs); }
.btn-link { border: 0; background: none; color: var(--primary); padding: 2px 4px; font-size: 12.5px; cursor: pointer; font-weight: 600; }
.btn-link:hover { text-decoration: underline; }
.btn-link.danger { color: var(--danger); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.badge .bdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-gray { background: #f1f3f7; color: #64748b; border-color: #e6e9ef; }
.badge-blue { background: var(--secondary-weak); color: #0369a1; border-color: #cfeafb; }
.badge-orange { background: var(--warning-weak); color: #b45309; border-color: #fce6c0; }
.badge-green { background: var(--success-weak); color: #15803d; border-color: #cdecd6; }
.badge-red { background: var(--danger-weak); color: #b91c1c; border-color: #f7cfcf; }
.badge-purple { background: var(--primary-weak); color: var(--primary); border-color: #dcdcfb; }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; margin: 1px 0; }
.tag.mono { font-family: var(--mono); font-size: 11.5px; }
.tag.warn { background: var(--warning-weak); border-color: #fce6c0; color: #b45309; }
.tag.gone { color: var(--ink-4); text-decoration: line-through; }

.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12.5px; flex: none; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); color: var(--ink-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.click:hover td { background: var(--surface-2); cursor: pointer; }
.table .nowrap { white-space: nowrap; }
.mname { font-weight: 650; color: var(--ink); }

.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: var(--radius-xs); font-size: 13px; color: var(--ink-3); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { background: var(--primary-weak); color: var(--primary); font-weight: 650; }
.tabs.sm button { padding: 4px 10px; font-size: 12.5px; }
.tabs .n { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; background: var(--surface-2); }
.tabs .n.warn { background: var(--warning-weak); border-color: #fce6c0; color: #b45309; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.input, .select { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 11px; font-size: 13px; background: #fff; outline: none; }
.input:focus, .select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 12.5px; font-weight: 620; color: var(--ink-2); margin-bottom: 6px; }
.field .req { color: var(--danger); margin-left: 2px; }
.field .hint { color: var(--ink-4); font-size: 11.5px; margin-top: 5px; }
.err { color: var(--danger); font-size: 11.5px; margin-top: 5px; }
.field input[type=text], .field input[type=password], .field input[type=number], .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 11px; font-size: 13px; background: #fff; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.field input[disabled], .field select[disabled] { background: var(--surface-2); color: var(--ink-3); }
.field textarea { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin: 6px 0; cursor: pointer; }
.section-t { font-size: 12px; font-weight: 700; color: var(--ink-3); margin: 6px 0 12px; display: flex; align-items: center; gap: 8px; }
.section-t::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }

.callout { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px; border: 1px solid; }
.callout-info { background: var(--primary-weak); border-color: #dcdcfb; color: #3730a3; }
.callout-warn { background: var(--warning-weak); border-color: #fce6c0; color: #92400e; }
.empty { text-align: center; color: var(--ink-4); padding: 36px 0; font-size: 13px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 9px 16px; font-size: 13px; }
.kv .k { color: var(--ink-3); }

.modelchecks { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px 12px; margin-top: 4px; }
.grant-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.grant-box { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.keybox { font-family: var(--mono); font-size: 13px; background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; word-break: break-all; }
.keybox span { flex: 1; }
pre.code { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow: auto; margin: 0; white-space: pre; }
details.preview { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px; background: var(--surface-2); margin-top: 6px; }
details.preview summary { cursor: pointer; font-size: 12.5px; font-weight: 620; color: var(--ink-2); }
details.preview .pv-t { font-size: 12px; color: var(--ink-3); margin: 10px 0 6px; }

/* ---------- 弹窗 / 抽屉 / 提示 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.42); display: grid; place-items: center; z-index: 100; padding: 24px; }
.modal { background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); width: 580px; max-width: 100%; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.wide { width: 800px; }
.modal-h { padding: 15px 20px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; }
.modal-h h3 { font-size: 15.5px; }
.modal-b { padding: 18px 20px; overflow: auto; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.x { border: 0; background: none; font-size: 22px; color: var(--ink-4); cursor: pointer; margin-left: auto; line-height: 1; }
.x:hover { color: var(--ink-2); }
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.30); z-index: 100; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; background: #fff; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.toast-root { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { background: #0f172a; color: #e2e8f0; padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-md); font-size: 13px; max-width: 480px; animation: tin .18s ease-out; }
.toast .api { display: block; font-family: var(--mono); font-size: 11.5px; color: #93c5fd; margin-top: 3px; }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 原型说明 ---------- */
.doc ul, .doc ol { margin: 0; padding-left: 20px; }
.doc li { margin: 5px 0; color: var(--ink-2); font-size: 13px; }
.doc .table td { vertical-align: top; }
.diagram { width: 100%; max-width: 900px; display: block; margin: 0 auto; }
.diagram rect { stroke-width: 1.3; }
.diagram .b-gray { fill: #f8fafc; stroke: #cbd5e1; }
.diagram .b-pri { fill: var(--primary-weak); stroke: #a5b4fc; }
.diagram .b-sec { fill: var(--secondary-weak); stroke: #7dd3fc; }
.diagram text { font-family: var(--font); text-anchor: middle; }
.diagram .t { font-size: 14px; font-weight: 650; fill: var(--ink); }
.diagram .s { font-size: 11.5px; fill: var(--ink-3); }
.diagram .lbl { font-size: 11.5px; fill: var(--ink-2); }
.diagram .api { font-size: 10.5px; fill: var(--ink-4); font-family: var(--mono); }
.diagram line { stroke: #94a3b8; stroke-width: 1.4; }
</style>
<style>
/* ---------- 本原型增加的样式 ---------- */
.typecards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.typecard { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; background: #fff; }
.typecard:hover { border-color: #cfd4e2; }
.typecard.on { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(99,102,241,.12); background: var(--primary-weak); }
.typecard strong { display: block; font-size: 13.5px; margin-bottom: 4px; }
.typecard span { font-size: 12px; color: var(--ink-3); }
.detail-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.detail-head h1 { font-size: 21px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.endpoint { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 4px 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--success); } .dot.bad { background: var(--danger); } .dot.warn { background: var(--warning); }
.ptable td { padding: 5px 6px; }
.ptable th { padding: 7px 6px; }
.ptable input, .ptable select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; font-size: 12.5px; width: 100%; background: #fff; }
.disc { border: 1px solid var(--line); border-radius: var(--radius-sm); max-height: 300px; overflow: auto; }
.disc .table td { padding: 7px 10px; }
.disc tr.off td { color: var(--ink-4); }
.tree { border: 1px solid var(--line); border-radius: var(--radius-sm); }
.tree .srv { padding: 10px 14px; border-bottom: 1px solid var(--line-2); }
.tree .srv:last-child { border-bottom: 0; }
.tree .srv-h { display: flex; align-items: center; gap: 8px; font-weight: 650; flex-wrap: wrap; }
.tree .tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; padding: 4px 0 0 4px; }
.tree .check { margin: 3px 0; font-size: 12.5px; }
.radio-row { display: flex; gap: 18px; flex-wrap: wrap; }
.subnote { font-size: 11.5px; color: var(--ink-4); }
.pill-tools { display: flex; flex-wrap: wrap; gap: 4px; }
.field textarea.mono { font-family: var(--mono); font-size: 12px; }
.section-t.mt16 { margin-top: 20px; }
.out-t { font-size: 12px; font-weight: 700; color: var(--ink-3); margin: 14px 0 6px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#lg)"/>
        <path d="M9 11h14M9 16h14M9 21h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="11" r="2" fill="#fff"/><circle cx="20" cy="16" r="2" fill="#fff"/><circle cx="14" cy="21" r="2" fill="#fff"/>
        <defs><linearGradient id="lg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
      </svg>
      <div class="brand-text"><strong>MCP 网关</strong><small>服务接入 · API Key · 授权</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script>
/* =====================================================================
 * 演示数据（内存态，刷新后重置）
 * ===================================================================== */
const GW_PUBLIC = 'https://atlas.example.com/mcp';   // 外部客户端用的地址
const GW_INTERNAL = 'http://mcp-gateway.atlas:8070'; // 集群内（Atlas、ACP Pod）用的地址

const DEPTS = [
  { id: 'd-root', name: '总公司',   parent: null },
  { id: 'd-plat', name: '平台部',   parent: 'd-root' },
  { id: 'd-rd',   name: '研发中心', parent: 'd-root' },
  { id: 'd-rd1',  name: '研发一部', parent: 'd-rd' },
  { id: 'd-rd2',  name: '研发二部', parent: 'd-rd' },
  { id: 'd-cs',   name: '客服中心', parent: 'd-root' },
];
// 用户中心的用户（人）。admin = MCP 管理员（用户中心角色）
const USERS = {
  'sun.li':     { name: '孙丽', dept: 'd-plat', admin: true, color: '#6366f1', demo: true, uid: '0192f3a1-6c0e' },
  'zhang.ming': { name: '张明', dept: 'd-rd1', color: '#0ea5e9', demo: true, uid: '0192f3b7-1d42' },
  'li.gong':    { name: '李工', dept: 'd-cs',  color: '#f59e0b', demo: true, uid: '0192f3c2-9a7b' },
  'wang.fang':  { name: '王芳', dept: 'd-rd2', color: '#10b981', demo: true, uid: '0192f3d9-04ce' },
  'zhao.qiang': { name: '赵强', dept: 'd-rd1', color: '#ec4899', uid: '0192f3e4-5f13' },
};
// Atlas 里的智能体（接入方的数据，演示用）
let AGENTS = [
  { id: 'agt_7f3a21', name: '代码评审助手' },
  { id: 'agt_e4b812', name: '客服质检' },
  { id: 'agt_2c91be', name: '需求分析师' },
  { id: 'agt_0b5c6d', name: '平台巡检助手' },
  { id: 'agt_91aa03', name: '数据分析助手' }, // 还没有 Key：演示「为智能体申请」
];

const KINDS = {
  mcp:  { name: 'MCP 代理',  badge: 'badge-purple', desc: '连接已有的远程 MCP Server（Streamable HTTP / SSE），工具定义从上游拉取' },
  rest: { name: 'REST 转换', badge: 'badge-blue',   desc: '导入 OpenAPI 或手工定义，把 HTTP JSON 接口转换成 MCP 工具' },
  grpc: { name: 'gRPC 转换', badge: 'badge-orange', desc: '通过服务端反射或描述文件发现方法，把 gRPC 方法转换成 MCP 工具' },
};
// 副作用：对应 MCP 工具注解（read = readOnlyHint，destructive = destructiveHint）；Atlas 审批按它判断
const EFFECTS = {

    case 'basic': return `Basic 认证 · 用户 <span class="mono">${esc(c.user || '')}</span> · 密码 <span class="mono">${c.hint}</span>`;
    case 'oauth2': return `OAuth2 客户端凭据 · <span class="mono">${esc(c.tokenUrl || '')}</span> · client_secret <span class="mono">${c.hint}</span>`;
    case 'metadata': return `Metadata <span class="mono">${esc(c.key)}</span> · <span class="mono">${c.hint}</span>`;
    case 'mtls': return `mTLS 客户端证书 · <span class="mono">${c.hint}</span>`;
  }
  return c.type;
}

function toast(msg, api) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = esc(msg) + (api ? `<span class="api">${esc(api)}</span>` : '');
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
function openModal({ title, body, foot, wide, onMount }) {
  $('#modal-root').innerHTML = `
    <div class="modal-mask"><div class="modal ${wide ? 'wide' : ''}" role="dialog">
      <div class="modal-h"><h3>${title}</h3><button class="x" data-close aria-label="关闭">×</button></div>
      <div class="modal-b">${body}</div>
      ${foot ? `<div class="modal-f">${foot}</div>` : ''}
    </div></div>`;
  const mask = $('.modal-mask');
  mask.addEventListener('mousedown', e => { if (e.target === mask) closeModal(); });
  $$('[data-close]', mask).forEach(b => { b.onclick = closeModal; });
  onMount && onMount($('.modal', mask));
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox({ title, body, okText = '确定', danger = false, onOk }) {
  openModal({
    title, body,
    foot: `<button class="btn" data-close>取消</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cf-ok">${okText}</button>`,
    onMount: m => { $('#cf-ok', m).onclick = () => { closeModal(); onOk(); }; },
  });
}

/* =====================================================================
 * 权限
 *   公开服务：任何有效的 API Key 都能用全部工具，不判权
 *   私有服务：看授给这把 Key 的数据权限——服务级（McpServer）= 全部工具，含以后新增；工具级（McpTool）= 指定工具
 *   网关判权：认出 Key → 以 Key 的 uid 作 X-Auth-Uid 调用户中心
 *   所有者（人）能给 Key 分配自己服务的权限；管理员有数据编码级「全部 MCP 服务 · 所有者」
 * ===================================================================== */
const isOwner = (s, uid) => !!USERS[uid].admin || s.owners.includes(uid);
const canManage = () => isAdmin();
const canAssign = s => isOwner(s, me);
const grantOf = (s, k) => s.grants.find(g => g.key === k.uuid);
const grantCovers = (g, t) => g.scope === 'all' || g.tools.includes(t.name);
// Key 能不能用某个工具（不看 Key 和工具的状态）：返回来源说明，不能用返回 null
function keyVia(s, t, k) {
  if (!k) return null;
  if (s.visibility === 'public') return '公开';
  const g = grantOf(s, k);
  return g && grantCovers(g, t) ? (g.scope === 'all' ? '服务级授权' : '工具级授权') : null;
}
const callable = (s, t) => s.status === 'enabled' && t.status === 'active';
const usableTools = (s, k) => s.tools.filter(t => callable(s, t) && keyVia(s, t, k));
const usableSummary = k => servers.map(s => ({ s, tools: usableTools(s, k) })).filter(x => x.tools.length);
const dataRefs = (s, g) => g.scope === 'all' ? `McpServer ${s.name}` : g.tools.map(n => `McpTool ${s.name}/${n}`).join('、');
function visibleServers() {
  if (isAdmin()) return servers;
  const k = keyOfUser(me);
  return servers.filter(s => isOwner(s, me) || (s.status === 'enabled' && (s.visibility === 'public' || (k && grantOf(s, k)))));
}
function myAccess(s) {
  if (isAdmin()) return s.visibility === 'public' ? '<span class="muted small">公开，不需要授权</span>' : `${s.grants.length} 把 Key`;
  if (isOwner(s, me)) return `<span class="badge badge-purple">所有者</span>${s.visibility === 'private' ? ` <span class="small muted">已授权 ${s.grants.length} 把 Key</span>` : ''}`;
  if (s.visibility === 'public') return '<span class="badge badge-green">公开</span>';
  const k = keyOfUser(me), g = k && grantOf(s, k);
  if (!g) return '<span class="muted small">无</span>';
  return `<span class="badge badge-blue">我的 Key · ${g.scope === 'all' ? '全部工具' : g.tools.length + ' 个工具'}</span>`;
}

/* ---------- 工具定义：查看、编辑 ---------- */
const PARAM_IN = ['path', 'query', 'header', 'body'];
const PARAM_TYPES = ['string', 'integer', 'number', 'boolean', 'array', 'object'];

function schemaOf(t) {
  const props = {}, req = [];
  t.params.filter(p => !p.fixed).forEach(p => {
    props[p.name] = { type: p.type, ...(p.type === 'array' ? { items: { type: 'string' } } : {}), ...(p.desc ? { description: p.desc } : {}) };
    if (p.required) req.push(p.name);
  });
  return { type: 'object', properties: props, ...(req.length ? { required: req } : {}) };
}
const annotationsOf = t => t.effect === 'read' ? { readOnlyHint: true } : { readOnlyHint: false, destructiveHint: t.effect === 'destructive' };
const mcpDef = t => ({ name: t.name, description: t.desc, inputSchema: schemaOf(t), annotations: annotationsOf(t) });

function paramTable(s, t) {
  const rest = s.kind === 'rest';
  return `<table class="table"><thead><tr><th>参数</th>${rest ? '<th>位置</th>' : ''}<th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody>
    ${t.params.map(p => `<tr><td class="mono">${esc(p.name)}</td>${rest ? `<td>${p.in}</td>` : ''}<td class="mono">${p.type}</td>
      <td>${p.fixed ? '<span class="tag">固定值</span>' : p.required ? '是' : ''}</td>
      <td>${p.fixed ? `<span class="mono">${esc(p.fixed)}</span> <span class="subnote">不出现在工具参数里</span>` : esc(p.desc)}</td></tr>`).join('') || `<tr><td colspan="${rest ? 5 : 4}" class="muted">没有参数</td></tr>`}
    </tbody></table>`;
}
function paramEditor(params) {
  return `<table class="table ptable" id="pe"><thead><tr><th style="width:19%">参数</th><th style="width:11%">位置</th><th style="width:11%">类型</th><th style="width:6%">必填</th><th style="width:17%">固定值</th><th>说明（给模型看）</th><th></th></tr></thead><tbody>
    ${params.map((p, i) => `<tr>
      <td><input data-f="name" value="${esc(p.name)}"></td>
      <td><select data-f="in">${PARAM_IN.map(x => `<option ${p.in === x ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
      <td><select data-f="type">${PARAM_TYPES.map(x => `<option ${p.type === x ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
      <td style="text-align:center"><input type="checkbox" data-f="required" ${p.required ? 'checked' : ''} style="width:auto"></td>
      <td><input data-f="fixed" value="${esc(p.fixed || '')}" placeholder="—"></td>
      <td><input data-f="desc" value="${esc(p.desc)}"></td>
      <td><button class="btn-link danger" data-prm="${i}">删除</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted small">没有参数</td></tr>'}
    </tbody></table>
    <div class="row mt8"><button class="btn btn-sm" id="pe-add">＋ 添加参数</button><span class="subnote">填了固定值的参数每次都按固定值发给上游，不出现在工具参数里</span></div>`;

function readParams(m) {

function validateTool(s, t, isNew) {
  if (!/^[a-z][a-z0-9_]{0,63}$/.test(t.name)) return '工具名：小写字母开头，只能有小写字母、数字、下划线';
  if (isNew && s.tools.some(x => x.name === t.name)) return `工具名 ${t.name} 已存在`;
  if (!t.desc) return '请填写描述';
  if (s.kind !== 'rest') return '';
  if (!t.http.path.startsWith('/')) return '路径要以 / 开头';
  const names = t.params.map(p => p.name);
  if (names.some(n => !n)) return '有参数没填名称';
  if (new Set(names).size !== names.length) return '参数名重复';
  const holes = [...t.http.path.matchAll(/\{(\w+)\}/g)].map(x => x[1]);
  const pathParams = t.params.filter(p => p.in === 'path').map(p => p.name);
  const miss = holes.find(h => !pathParams.includes(h));
  if (miss) return `路径里的 {${miss}} 没有对应的 path 参数`;
  const extra = pathParams.find(p => !holes.includes(p));
  if (extra) return `path 参数 ${extra} 没出现在路径里`;
  return '';
}

function openToolView(s, t) {

function typeOk(type, v) {
  return { string: typeof v === 'string', integer: Number.isInteger(v), number: typeof v === 'number', boolean: typeof v === 'boolean',
    array: Array.isArray(v), object: v !== null && typeof v === 'object' && !Array.isArray(v) }[type];

// 网关在转发前的检查。返回 JSON-RPC 错误对象，通过返回 null
function rejectionFor(s, t, args, k) {
  const err = (code, reason, message, extra = {}) => ({ code, message, data: { reason, forwarded: false, service: s.name, tool: t.name, ...extra } });
  if (s.status !== 'enabled') return err(-32041, 'service_disabled', `服务 ${s.name} 已停用`);
  if (t.status !== 'active') return err(-32046, 'tool_unknown', `服务 ${s.name} 没有可用的工具 ${t.name}`);
  if (!keyVia(s, t, k)) return err(-32044, 'forbidden', `这把 Key 没有 ${s.name} · ${t.name} 的权限`, { key_uid: k.uid + '…' });
  for (const p of t.params.filter(x => !x.fixed)) {
    if (args[p.name] === undefined) { if (p.required) return err(-32602, 'invalid_params', `缺少必填参数 ${p.name}`); continue; }
    if (!typeOk(p.type, args[p.name])) return err(-32602, 'invalid_params', `参数 ${p.name} 应该是 ${p.type}`);
  }
  if (trafficOf(s.name).breaker === 'open') return err(-32054, 'circuit_open', `服务 ${s.name} 熔断中，暂停调用`, { retry_after: 20 });
  return null;
}
// 发给上游的调用者身份：X-Auth-Uid = Key 的 uid（权限主体）；X-Uid = 使用者（用户 Key 是持有人，智能体 Key 是调用方带来的）
const identityLines = (k, lower) => {
  const user = k.type === 'user' ? USERS[k.user].uid + '…' : '<调用方带来的使用者 uid>';
  return lower ? [`  x-auth-uid: ${k.uid}…`, `  x-uid: ${user}`] : [`X-Auth-Uid: ${k.uid}…`, `X-Uid: ${user}`];
};
function upstreamRequest(s, t, args, tp, k) {
  const c = s.cred;
  if (s.kind === 'rest') {
    const path = t.http.path.replace(/\{(\w+)\}/g, (_, x) => encodeURIComponent(args[x] ?? ''));
    const q = [], hs = [], body = {};
    t.params.forEach(p => {
      const v = p.fixed || args[p.name];
      if (v === undefined || v === '' || p.in === 'path') return;
      if (p.in === 'query') q.push(`${p.name}=${encodeURIComponent(v)}`);
      else if (p.in === 'header') hs.push(`${p.name}: ${v}`);
      else body[p.name] = v;
    });
    const cred = [];
    if (c.type === 'apikey' && c.where === 'query') q.push(`${c.key}=${c.hint}`);
    if (c.type === 'apikey' && c.where !== 'query') cred.push(`${c.key}: ${c.hint}`);
    if (c.type === 'bearer') cred.push(`Authorization: Bearer ${c.hint}`);
    if (c.type === 'basic') cred.push(`Authorization: Basic ${c.hint}`);
    if (c.type === 'oauth2') cred.push('Authorization: Bearer <网关用 client_credentials 换到的 Token>');
    const lines = [`${t.http.method} ${s.conn.base}${path}${q.length ? '?' + q.join('&') : ''}`, ...cred, ...hs,
      ...(s.identity ? identityLines(k) : []), `traceparent: ${tp}`];
    if (Object.keys(body).length) lines.push('Content-Type: application/json', '', json(body));
    return lines.join('\n');
  }
  if (s.kind === 'grpc') {
    const md = [];
    if (c.type === 'metadata') md.push(`  ${c.key}: ${c.hint}`);
    if (s.identity) md.push(...identityLines(k, true));
    md.push(`  traceparent: ${tp}`);
    return [`gRPC ${s.conn.addr}${s.conn.tls === 'plaintext' ? '' : `（${s.conn.tls === 'mtls' ? 'mTLS，网关出示客户端证书' : 'TLS'}）`}`,
      `${s.conn.service}/${t.grpc.method}（${STREAMS[t.grpc.stream]}）`, '', 'metadata:', ...md, '', `${t.grpc.req}（按 proto3 JSON 映射）:`, json(args)].join('\n');
  }
  const cred = c.type === 'bearer' ? `Authorization: Bearer ${c.hint}` : c.type === 'header' ? `${c.key}: ${c.hint}` : c.type === 'oauth2' ? 'Authorization: Bearer <网关换到的 Token>' : null;
  return [`POST ${s.conn.url}${s.conn.transport === 'sse' ? '  （旧版 SSE：发到 endpoint 事件给的消息地址，结果从 SSE 流回来）' : ''}`,
    ...(cred ? [cred] : []), 'Mcp-Session-Id: <上游会话，取自网关会话标识>', ...(s.identity ? identityLines(k) : []), `traceparent: ${tp}`, '',
    json({ jsonrpc: '2.0', id: 7, method: 'tools/call', params: { name: t.name, arguments: args, _meta: { traceparent: tp } } })].join('\n');
}
function pickResult(t, resp) {
  const m = t.http?.pick?.match(/^\$\.(\w+)$/);

function runTry(s, t, m) {
  const out = $('#tr-out', m);

  let args;
  try { args = JSON.parse($('#tr-args', m).value || '{}'); } catch (e) { out.innerHTML = `<div class="err">参数不是合法的 JSON：${esc(e.message)}</div>`; return; }
  const trace = hex(32), tp = `00-${trace}-${hex(16)}-01`;
  const traceLine = `<div class="small muted mt8">trace_id <span class="mono">${trace}</span> · Span 已经 OTLP 导出，在追踪系统里按 trace_id 查</div>`;
  const rej = rejectionFor(s, t, args, k);
  if (rej) {
    out.innerHTML = `<div class="out-t">网关直接返回（没有转发给上游）</div><pre class="code">${esc(json({ jsonrpc: '2.0', id: 1, error: rej }))}</pre>${traceLine}`;
    return;
  }
  const resp = SAMPLE_RESP[t.name] ?? { ok: true };
  const result = s.kind === 'rest' ? pickResult(t, resp) : resp;
  const text = JSON.stringify(result);
  const mcpResult = { content: [{ type: 'text', text: text.length > 140 ? text.slice(0, 140) + '…' : text }],
    ...(result && typeof result === 'object' && !Array.isArray(result) ? { structuredContent: '<同上，结构化>' } : {}), isError: false };
  const upResp = s.kind === 'rest' ? `HTTP/1.1 200 OK\nContent-Type: application/json\n\n${json(resp)}`
    : s.kind === 'grpc' ? `status: OK${t.grpc.stream === 'server' ? `（服务端流，共 ${Array.isArray(resp) ? resp.length : 1} 条消息，网关合并成数组）` : ''}\n${json(resp)}`
    : `200 OK（text/event-stream）\n${json({ jsonrpc: '2.0', id: 7, result: { content: [{ type: 'text', text: '…' }], isError: false } })}`;
  out.innerHTML = `
    <div class="out-t">① 网关发给上游的请求（上游凭据由网关注入；调用方的 Key 不转发）</div><pre class="code">${esc(upstreamRequest(s, t, args, tp, k))}</pre>
    <div class="out-t">② 上游响应</div><pre class="code">${esc(upResp)}</pre>
    <div class="out-t">③ 返回给调用方的 MCP 结果${s.kind === 'mcp' ? '（原样返回）' : s.kind === 'rest' && t.http.pick ? `（只取 ${esc(t.http.pick)}）` : ''}</div><pre class="code">${esc(json(mcpResult))}</pre>
    ${traceLine}`;
}

      <table class="table"><thead><tr><th>API Key</th><th>状态</th><th>范围</th><th></th></tr></thead><tbody>
      ${s.grants.map((g, i) => { const k = keyById(g.key); return `<tr><td>${keyCell(k)}</td><td>${keyStatusBadge(k)}</td><td>${scopeCell(g)}</td>
        <td class="nowrap"><button class="btn-link" data-ed="${i}">修改</button><button class="btn-link danger" data-rm="${i}">收回</button></td></tr>`; }).join('') || '<tr><td colspan="4"><div class="empty">还没有授权给任何 Key</div></td></tr>'}
      </tbody></table>
      <div class="card-b small muted" style="border-top:1px solid var(--line-2)">网关判权时以 Key 的 uid 作 X-Auth-Uid 调用户中心，结果按 Key 缓存 30 秒：新授、收回的授权最长 30 秒生效。</div></div>`}
    <div class="card"><div class="card-h"><h3>所有者</h3><span class="small muted">能给 API Key 分配这个服务的权限；不能改连接和工具</span><div class="grow"></div><button class="btn btn-sm" id="ow-add">＋ 添加所有者</button></div>
      <table class="table"><thead><tr><th>用户</th><th></th><th></th></tr></thead><tbody>
      ${s.owners.map(u => `<tr><td>${userCell(u)}</td><td class="small muted">${u === s.created_by ? '登记人' : ''}</td><td class="nowrap" style="text-align:right"><button class="btn-link danger" data-ow="${u}">移除</button></td></tr>`).join('')}
      </tbody></table>
      <div class="card-b small muted" style="border-top:1px solid var(--line-2)">所有者是人（数据权限 <code>McpServer</code> = OWNER），登记人自动成为所有者。管理员有「全部 MCP 服务 · 所有者」（数据编码级授权），不在列表里。</div></div>`;
  const add = $('#gr-add');
  if (add) add.onclick = () => openKeyGrant({ s });
  $$('[data-ed]', body).forEach(b => { b.onclick = () => openKeyGrant({ s, idx: +b.dataset.ed }); });
  $$('[data-rm]', body).forEach(b => { b.onclick = () => {
    const g = s.grants[+b.dataset.rm], k = keyById(g.key);
    confirmBox({
      title: '收回授权', danger: true, okText: '收回',
      body: `<p>收回「${esc(keyTitle(k))}」对「${esc(s.display)}」的权限？</p><p class="small muted">最长 30 秒后，带这把 Key 的调用开始被拒绝（forbidden）。</p>`,
      onOk: () => { s.grants.splice(s.grants.indexOf(g), 1); render(); toast('已收回授权', `用户中心：删除 ${dataRefs(s, g)} → Key ${k.uid}…`); },
    });
  }; });
  $('#ow-add').onclick = () => {
    const cands = Object.keys(USERS).filter(u => !s.owners.includes(u) && !USERS[u].admin);
    if (!cands.length) { toast('没有可以添加的用户'); return; }
    openModal({
      title: `添加所有者 · ${esc(s.display)}`,
      body: `<div class="field"><label>用户</label><select id="ow-u">${cands.map(u => `<option value="${u}">${USERS[u].name}（${deptOf(USERS[u].dept).name}）</option>`).join('')}</select>
        <div class="hint">所有者能给 API Key 分配这个服务的权限、增删所有者；改连接和工具仍然只有 MCP 管理员</div></div>`,
      foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="ow-ok">添加</button>',
      onMount: m => { $('#ow-ok', m).onclick = () => { const u = $('#ow-u', m).value; s.owners.push(u); closeModal(); render(); toast(`已添加所有者 ${USERS[u].name}`, `用户中心：写入 McpServer ${s.name} → 用户 ${USERS[u].name} · OWNER`); }; },
    });
  };
  $$('[data-ow]', body).forEach(b => { b.onclick = () => {
    const u = b.dataset.ow;
    confirmBox({ title: '移除所有者', danger: true, okText: '移除', body: `<p>移除 ${esc(USERS[u].name)} 的所有者权限？已经分配给 Key 的权限不受影响。</p>`,
      onOk: () => { s.owners = s.owners.filter(x => x !== u); render(); toast(`已移除所有者 ${USERS[u].name}`, `用户中心：删除 McpServer ${s.name} → 用户 ${USERS[u].name} · OWNER`); } });
  }; });
}

// 从服务的「授权」给某把 Key 授权（一个服务）
function openKeyGrant({ s, idx = -1 }) {
  const editing = idx >= 0 ? s.grants[idx] : null;
  const st = {
    key: editing ? editing.key : (keys.find(k => k.status === 'active' && !grantOf(s, k)) || keys[0]).uuid,
    scope: editing ? editing.scope : 'all',
    tools: new Set(editing ? editing.tools : []),
  };
  const draw = m => {
    const k = keyById(st.key);
    const old = grantOf(s, k);
    const g = { key: st.key, scope: st.scope, tools: [...st.tools] };
    $('.modal-b', m).innerHTML = `
      <div class="field"><label>服务</label><div>${esc(s.display)} <span class="mono muted">${s.name}</span> ${visBadge(s)}</div></div>
      <div class="field"><label>API Key</label>${editing ? keyCell(k) : `<select id="kg-key">${['user', 'client'].map(tp => `<optgroup label="${tp === 'user' ? '用户 Key' : '智能体 Key'}">${keys.filter(x => x.type === tp).map(x => `<option value="${x.uuid}" ${x.uuid === st.key ? 'selected' : ''}>${esc(keyLabel(x))}</option>`).join('')}</optgroup>`).join('')}</select>
        <div class="hint">授权授给 Key 在用户中心的 uid（<span class="mono">${k.uid}…</span>）</div>`}</div>
      <div class="field"><label>范围</label><div class="radio-row">
          <label class="check"><input type="radio" name="kg-scope" value="all" ${st.scope === 'all' ? 'checked' : ''}> 全部工具（含以后新增的）</label>
          <label class="check"><input type="radio" name="kg-scope" value="tools" ${st.scope === 'tools' ? 'checked' : ''}> 指定工具</label></div>
        ${st.scope === 'tools' ? `<div class="modelchecks">${s.tools.map(t => `<label class="check"><input type="checkbox" data-tool="${t.name}" ${st.tools.has(t.name) ? 'checked' : ''}> <span class="mono">${t.name}</span> ${effectBadge(t)} ${t.status !== 'active' ? toolStatusBadge(t) : ''} <span class="small muted">${esc(t.desc)}</span></label>`).join('')}</div>` : ''}</div>
      <details class="preview" open><summary>写入用户中心</summary><div class="small mt8">
        ${g.scope === 'tools' && !g.tools.length ? '<span class="muted">还没选工具</span>' : ucLines(s, k, g).join('<br>')}
        ${old && old !== editing ? `<div class="subnote mt8">这把 Key 已有授权，会替换掉：${esc(dataRefs(s, old))}</div>` : ''}
        ${editing ? `<div class="subnote mt8">原来的：${esc(dataRefs(s, editing))}</div>` : ''}
      </div></details>`;
    const on = (sel, fn) => $$(sel, m).forEach(el => { el.onchange = () => { fn(el); draw(m); }; });
    on('#kg-key', el => { st.key = el.value; });
    on('input[name=kg-scope]', el => { st.scope = el.value; });
    on('[data-tool]', el => { el.checked ? st.tools.add(el.dataset.tool) : st.tools.delete(el.dataset.tool); });
  };
  openModal({
    title: editing ? '修改授权' : `授权 Key · ${esc(s.display)}`, wide: true, body: '',
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="kg-ok">保存</button>',
    onMount: m => {
      draw(m);
      $('#kg-ok', m).onclick = () => {
        const k = keyById(st.key);
        const g = { key: st.key, scope: st.scope, tools: st.scope === 'tools' ? [...st.tools] : [] };
        if (g.scope === 'tools' && !g.tools.length) { toast('请至少选一个工具'); return; }
        const at = s.grants.findIndex(x => x.key === g.key);
        const old = at >= 0 ? s.grants[at] : null;
        if (at >= 0) s.grants[at] = g; else s.grants.push(g);
        closeModal(); render();
        toast(`已授权：${keyTitle(k)} · ${s.display}`, `用户中心：写入 ${dataRefs(s, g)} → Key ${k.uid}… READ${old ? `；删除原来的 ${dataRefs(s, old)}` : ''}。最长 30 秒生效`);
      };
    },
  });
}

// 从 API Key「分配权限」：一次给这把 Key 配多个服务；只能改自己是所有者的服务
function openAssign(k, onDone = render) {
  const priv = servers.filter(s => s.visibility === 'private');
  const pubs = servers.filter(s => s.visibility === 'public' && s.status === 'enabled');
  const st = new Map(priv.map(s => { const g = grantOf(s, k); return [s.name, { on: !!g, scope: g ? g.scope : 'all', tools: new Set(g ? g.tools : []) }]; }));
  const draw = m => {
    $('.modal-b', m).innerHTML = `
      <div class="field"><label>API Key</label>${keyCell(k)}</div>
      <div class="callout callout-info mb12"><div>公开服务不用分配，任何有效的 Key 都能调用：${pubs.map(s => esc(s.display)).join('、') || '（没有）'}。</div></div>
      <div class="tree">${priv.map(s => {
        const x = st.get(s.name), can = canAssign(s), dis = can ? '' : 'disabled';
        return `<div class="srv"><div class="srv-h"><label class="check" style="margin:0;font-weight:650"><input type="checkbox" data-on="${s.name}" ${x.on ? 'checked' : ''} ${dis}> ${esc(s.display)}</label>
            <span class="mono muted small">${s.name}</span> ${kindBadge(s)}${s.status === 'disabled' ? ' <span class="badge badge-gray">已停用</span>' : ''}${can ? '' : ' <span class="subnote">你不是所有者，只能看</span>'}</div>
          ${x.on ? `<div style="padding:6px 0 0 26px"><div class="radio-row">
              <label class="check"><input type="radio" name="sc-${s.name}" value="all" data-scope="${s.name}" ${x.scope === 'all' ? 'checked' : ''} ${dis}> 全部工具（含以后新增的）</label>
              <label class="check"><input type="radio" name="sc-${s.name}" value="tools" data-scope="${s.name}" ${x.scope === 'tools' ? 'checked' : ''} ${dis}> 指定工具</label></div>
            ${x.scope === 'tools' ? `<div class="tools">${s.tools.map(t => `<label class="check"><input type="checkbox" data-tool="${s.name}" value="${t.name}" ${x.tools.has(t.name) ? 'checked' : ''} ${dis}> <span class="mono">${t.name}</span> ${t.effect !== 'read' ? effectBadge(t) : ''}${t.status === 'disabled' ? ' <span class="badge badge-gray">已停用</span>' : ''}</label>`).join('')}</div>` : ''}</div>` : ''}
        </div>`;
      }).join('')}</div>
      <div class="small muted mt8">写进用户中心，授给这把 Key 的 uid；修改最长 30 秒生效，Key 本身不变。</div>`;
    $$('[data-on]', m).forEach(el => { el.onchange = () => { st.get(el.dataset.on).on = el.checked; draw(m); }; });
    $$('[data-scope]', m).forEach(el => { el.onchange = () => { st.get(el.dataset.scope).scope = el.value; draw(m); }; });
    $$('[data-tool]', m).forEach(el => { el.onchange = () => { const x = st.get(el.dataset.tool).tools; el.checked ? x.add(el.value) : x.delete(el.value); }; });
  };
  openModal({
    title: `分配权限 · ${esc(keyTitle(k))}`, wide: true, body: '',
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="as-ok">保存</button>',
    onMount: m => {
      draw(m);
      $('#as-ok', m).onclick = () => {
        const writes = [], dels = [];
        for (const s of priv.filter(canAssign)) {
          const x = st.get(s.name), old = grantOf(s, k);
          if (x.on && x.scope === 'tools' && !x.tools.size) { toast(`「${s.display}」至少选一个工具，或者取消勾选这个服务`); return; }
        }
        for (const s of priv.filter(canAssign)) {
          const x = st.get(s.name), old = grantOf(s, k);
          const g = x.on ? { key: k.uuid, scope: x.scope, tools: x.scope === 'tools' ? [...x.tools].sort() : [] } : null;
          const same = old && g && old.scope === g.scope && [...old.tools].sort().join() === g.tools.join();
          if (same || (!old && !g)) continue;
          if (old) { dels.push(dataRefs(s, old)); s.grants = s.grants.filter(y => y !== old); }
          if (g) { writes.push(dataRefs(s, g)); s.grants.push(g); }
        }
        closeModal(); onDone();
        toast(writes.length || dels.length ? `已更新「${keyTitle(k)}」的权限` : '没有变化',
          [writes.length ? `写入 ${writes.join('；')}` : '', dels.length ? `删除 ${dels.join('；')}` : ''].filter(Boolean).map(x => '用户中心：' + x).join('  ') + (writes.length || dels.length ? ` → Key ${k.uid}…` : ''));
      };
    },
  });
}

/* ---------- 连接与凭据 ---------- */
function connFieldsHtml(kind, c = {}) {
  if (kind === 'mcp') return `
    <div class="grid2" style="grid-template-columns:2fr 1fr"><div class="field"><label>地址<span class="req">*</span></label><input type="text" id="cf-url" value="${esc(c.url || '')}" placeholder="http://xxx-mcp.ns:8000/mcp"></div>
      <div class="field"><label>传输</label><select id="cf-transport"><option value="streamable" ${c.transport !== 'sse' ? 'selected' : ''}>Streamable HTTP</option><option value="sse" ${c.transport === 'sse' ? 'selected' : ''}>SSE（旧版协议）</option></select></div></div>
    <div class="hint" style="margin:-6px 0 12px">只接远程 MCP Server；stdio 的 MCP Server 先单独部署成 HTTP 服务（放在 K8s Pod 里）再登记。</div>`;
  if (kind === 'rest') {
    const src = c.src || 'openapi';
    return `
    <div class="field"><label>Base URL<span class="req">*</span></label><input type="text" id="cf-base" value="${esc(c.base || '')}" placeholder="http://xxx-api.ns:8080/api"></div>
    <div class="field"><label>接口定义</label>
      <div class="radio-row">${[['openapi', '导入 OpenAPI（地址或文件）'], ['manual', '手工添加']].map(([v, l]) => `<label class="check"><input type="radio" name="cf-src" value="${v}" ${src === v ? 'checked' : ''}> ${l}</label>`).join('')}</div>
      ${src === 'openapi' ? `<input type="text" id="cf-spec" value="${esc(c.spec || '')}" placeholder="http://xxx-api.ns:8080/openapi.json" style="margin-top:6px"><div class="hint">支持 OpenAPI 3.x、Swagger 2.0；一个操作（operation）转成一个工具</div>` : '<div class="hint">登记后在「工具」里逐个添加接口</div>'}</div>`;
  }
  return `
    <div class="grid2"><div class="field"><label>地址<span class="req">*</span></label><input type="text" id="cf-addr" value="${esc(c.addr || '')}" placeholder="xxx-svc.ns:9090"></div>
      <div class="field"><label>传输安全</label><select id="cf-tls">${[['plaintext', '明文（集群内）'], ['tls', 'TLS'], ['mtls', 'mTLS']].map(([v, l]) => `<option value="${v}" ${c.tls === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div class="field"><label>方法发现</label><div class="radio-row">
      <label class="check"><input type="radio" name="cf-disc" value="reflection" ${c.discovery !== 'descriptor' ? 'checked' : ''}> 服务端反射</label>
      <label class="check"><input type="radio" name="cf-disc" value="descriptor" ${c.discovery === 'descriptor' ? 'checked' : ''}> 上传描述文件（.proto 或 FileDescriptorSet）</label></div></div>`;
}
function readConnFields(m, kind) {
  const v = id => ($(id, m)?.value || '').trim();
  let conn, err = '';
  if (kind === 'mcp') {
    conn = { url: v('#cf-url'), transport: v('#cf-transport') || 'streamable' };
    if (!/^https?:\/\/\S+$/.test(conn.url)) err = '请填写 MCP Server 地址（http:// 或 https:// 开头）';
  } else if (kind === 'rest') {
    const src = $('input[name=cf-src]:checked', m)?.value || 'openapi';
    conn = { base: v('#cf-base'), src, spec: src === 'manual' ? '' : v('#cf-spec') };
    if (!/^https?:\/\/\S+$/.test(conn.base)) err = '请填写 Base URL（http:// 或 https:// 开头）';
    else if (src === 'openapi' && !conn.spec) err = '请填写 OpenAPI 地址';
  } else {
    conn = { addr: v('#cf-addr'), tls: v('#cf-tls') || 'plaintext', discovery: $('input[name=cf-disc]:checked', m)?.value || 'reflection' };
    if (!/^[\w.-]+:\d+$/.test(conn.addr)) err = '请填写 gRPC 地址（host:port）';
  }
  return { conn, err };
}
function credExtraHtml(type, cred = {}, val = '') {
  const ph = cred.hint ? `已保存（${cred.hint}），留空不修改` : '';
  const f = (id, label, v = '', place = '', t = 'text') => `<div class="field"><label>${label}</label><input type="${t}" id="${id}" value="${esc(v)}" placeholder="${esc(place)}"></div>`;
  return {
    none: '',
    apikey: `<div class="grid2"><div class="field"><label>位置</label><select id="cr-where"><option value="header" ${cred.where !== 'query' ? 'selected' : ''}>请求头</option><option value="query" ${cred.where === 'query' ? 'selected' : ''}>查询参数</option></select></div>${f('cr-key', '名称', cred.key || '', 'X-Api-Key')}</div>${f('cr-val', '值', val, ph, 'password')}`,
    bearer: f('cr-val', 'Token', val, ph, 'password'),
    header: `<div class="grid2">${f('cr-key', '请求头名称', cred.key || '', 'X-Token')}${f('cr-val', '值', val, ph, 'password')}</div>`,
    basic: `<div class="grid2">${f('cr-user', '用户名', cred.user || '')}${f('cr-val', '密码', val, ph, 'password')}</div>`,
    oauth2: `${f('cr-token', 'Token 地址', cred.tokenUrl || '', 'https://idp.example.com/oauth2/token')}<div class="grid2">${f('cr-user', 'client_id', cred.user || '')}${f('cr-val', 'client_secret', val, ph, 'password')}</div>${f('cr-scope', 'scope（可选）', cred.scope || '')}<div class="hint">网关用 client_credentials 换 Token，缓存到过期前；各实例各自换。</div>`,
    metadata: `<div class="grid2">${f('cr-key', '键', cred.key || '', 'authorization')}${f('cr-val', '值', val, ph, 'password')}</div>`,
    mtls: `<div class="grid2">${f('cr-cert', '客户端证书（PEM）', '', cred.hint ? '已保存，留空不修改' : '粘贴或上传')}${f('cr-val', '私钥（PEM）', val, ph, 'password')}</div>`,
  }[type] || '';
}
function credFieldsHtml(kind, cred = { type: 'none' }, val = '') {
  return `<div class="field"><label>上游凭据</label><select id="cr-type">${CRED_BY_KIND[kind].map(t => `<option value="${t}" ${cred.type === t ? 'selected' : ''}>${CRED_TYPES[t]}</option>`).join('')}</select>
      <div class="hint">网关调上游时注入，保存后不回显。调用方只带自己的 MCP Key，拿不到上游凭据。</div></div>
    <div id="cr-extra">${credExtraHtml(cred.type, cred, val)}</div>`;
}
function bindCred(m, cred = { type: 'none' }) {
  $('#cr-type', m).onchange = e => { $('#cr-extra', m).innerHTML = credExtraHtml(e.target.value, e.target.value === cred.type ? cred : {}); };
}
function readCred(m, prev = { type: 'none' }) {
  const type = $('#cr-type', m).value;
  const v = id => ($(id, m)?.value || '').trim();
  if (type === 'none') return { cred: { type } };
  const val = v('#cr-val');
  if (!val && !(prev.type === type && prev.hint)) return { err: '请填写上游凭据' };
  const cred = { type, hint: val ? '••••' + val.slice(-4) : prev.hint };
  if (['apikey', 'header', 'metadata'].includes(type)) { cred.key = v('#cr-key'); if (!cred.key) return { err: '请填写凭据的名称' }; }
  if (type === 'apikey') cred.where = v('#cr-where');
  if (type === 'basic' || type === 'oauth2') cred.user = v('#cr-user');
  if (type === 'oauth2') { cred.tokenUrl = v('#cr-token'); cred.scope = v('#cr-scope'); if (!cred.tokenUrl) return { err: '请填写 Token 地址' }; }
  return { cred };
}
const identityHtml = (kind, on) => `<label class="check"><input type="checkbox" id="cf-identity" ${on ? 'checked' : ''}> 向上游传递调用者身份（${kind === 'grpc' ? 'metadata x-auth-uid、x-uid' : '请求头 X-Auth-Uid、X-Uid'}）</label>`;

function renderConnTab(s) {
  const body = $('#sd-body');
  const ids = s.kind === 'grpc' ? 'metadata x-auth-uid（Key 的 uid）、x-uid（使用者）' : '请求头 X-Auth-Uid（Key 的 uid）、X-Uid（使用者）';
  const tp = { mcp: '请求头 traceparent，并写进 params._meta', rest: '请求头 traceparent', grpc: 'metadata traceparent' }[s.kind];
  const probe = { mcp: `initialize → ${s.conn.url}`, rest: `GET ${s.conn.base}`, grpc: `grpc.health.v1.Health/Check → ${s.conn.addr}` }[s.kind];
  body.innerHTML = `<div class="grid-2c">
    <div class="card"><div class="card-h"><h3>连接</h3><div class="grow"></div>${canManage() ? '<button class="btn btn-sm" id="cn-test">测试连接</button><button class="btn btn-sm" id="cn-edit">编辑</button>' : ''}</div>
      <div class="card-b"><div class="kv">${connRows(s).map(([k, v]) => `<div class="k">${k}</div><div>${v}</div>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>上游凭据与透传</h3>${canManage() ? '<div class="grow"></div><button class="btn btn-sm" id="cn-cred">替换凭据</button>' : ''}</div>
      <div class="card-b"><div class="kv">
        <div class="k">上游凭据</div><div>${credLabel(s.cred)}<div class="subnote">网关调上游时注入；保存后不回显，调用方拿不到</div></div>
        <div class="k">调用者身份</div><div>${s.identity ? ids : '不传（上游不区分调用者）'}</div>
        <div class="k">追踪上下文</div><div>${tp}</div>
        <div class="k">调用方的 Key</div><div>不转发：网关认完 Key 就去掉 <span class="mono">Authorization</span></div>
      </div></div></div>
  </div>`;
  if (!canManage()) return;
  $('#cn-test').onclick = () => trafficOf(s.name).breaker === 'open' ? toast('连接失败：连接超时（5 秒）', probe) : toast('连接正常', probe);
  $('#cn-edit').onclick = () => openModal({
    title: `编辑连接 · ${esc(s.display)}`, wide: true, body: connFieldsHtml(s.kind, s.conn) + identityHtml(s.kind, s.identity),
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="ce-ok">保存</button>',
    onMount: m => {
      $$('input[name=cf-src]', m).forEach(r => { r.onchange = () => { const { conn } = readConnFields(m, 'rest'); $('.modal-b', m).innerHTML = connFieldsHtml('rest', { ...s.conn, ...conn }) + identityHtml(s.kind, $('#cf-identity', m).checked); }; });
      $('#ce-ok', m).onclick = () => {
        const { conn, err } = readConnFields(m, s.kind);
        if (err) { toast(err); return; }
        Object.assign(s.conn, conn);
        s.identity = $('#cf-identity', m).checked;
        closeModal(); render();
        toast('已保存连接', s.kind === 'mcp' ? `已重新拉取工具定义：没有变化（${s.conn.url}）` : '各网关实例经配置变更通知立即生效');
      };
    },
  });
  $('#cn-cred').onclick = () => openModal({
    title: `替换上游凭据 · ${esc(s.display)}`, body: credFieldsHtml(s.kind, s.cred),
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="cc-ok">保存</button>',
    onMount: m => {
      bindCred(m, s.cred);
      $('#cc-ok', m).onclick = () => {
        const { cred, err } = readCred(m, s.cred);
        if (err) { toast(err); return; }
        s.cred = cred; closeModal(); render();
        toast('已替换上游凭据', '新凭据从下一次调用开始用；进行中的调用不受影响');
      };
    },
  });
}

const restEffect = method => method === 'GET' ? 'read' : method === 'DELETE' ? 'destructive' : 'write';

const discKey = (kind, d) => kind === 'rest' ? `${d.method} ${d.path}` : kind === 'grpc' ? d.method : d.name;

function openRegister() {
  const st = { kind: 'rest', name: '', display: '', desc: '', visibility: 'private', identity: true, conn: {}, cred: { type: 'none' }, credVal: '', found: null, picked: new Set() };
  const sync = m => {
    const v = id => ($(id, m)?.value ?? '').trim();
    st.name = v('#rg-name'); st.display = v('#rg-display'); st.desc = v('#rg-desc');
    st.visibility = $('input[name=rg-vis]:checked', m)?.value || st.visibility;
    st.identity = $('#cf-identity', m)?.checked ?? st.identity;
    st.conn = { ...st.conn, ...readConnFields(m, st.kind).conn };
    const type = $('#cr-type', m)?.value || 'none';
    st.cred = { type, key: v('#cr-key'), where: v('#cr-where'), user: v('#cr-user'), tokenUrl: v('#cr-token'), scope: v('#cr-scope') };
    st.credVal = v('#cr-val');
    $$('[data-pick]', m).forEach(c => { c.checked ? st.picked.add(c.dataset.pick) : st.picked.delete(c.dataset.pick); });
  };
  const foundHtml = () => {
    const k = st.kind;
    if (k === 'rest' && st.conn.src === 'manual') return '<div class="small muted">手工添加：登记后在服务的「工具」里逐个添加接口。</div>';
    if (!st.found) return `<div class="empty" style="padding:18px 0">还没有${{ mcp: '拉取工具', rest: '解析接口定义', grpc: '发现方法' }[k]}</div>`;
    if (k === 'mcp') return `<div class="disc"><table class="table"><thead><tr><th>工具</th><th>副作用（上游注解）</th><th>描述</th></tr></thead><tbody>
      ${st.found.map(d => `<tr><td class="mono">${d.name}</td><td>${effectBadge(d)}</td><td class="small">${esc(d.desc)}</td></tr>`).join('')}</tbody></table></div>
      <div class="small muted mt8">共 ${st.found.length} 个工具，全部登记，登记后即可用；不需要的工具登记后停用。</div>`;
    const rows = st.found.map(d => {
      const key = discKey(k, d);
      const name = toSnake(k === 'rest' ? d.op : d.method);
      const eff = { effect: k === 'rest' ? restEffect(d.method) : grpcEffect(d.method) };
      return `<tr class="${d.unsupported ? 'off' : ''}">
        <td style="width:30px"><input type="checkbox" data-pick="${esc(key)}" ${d.unsupported ? 'disabled' : st.picked.has(key) ? 'checked' : ''}></td>
        <td class="mono nowrap">${k === 'rest' ? `${d.method} ${esc(d.path)}` : `${d.method}`}${k === 'grpc' && d.stream !== 'unary' ? ` <span class="tag">${STREAMS[d.stream]}</span>` : ''}</td>
        <td class="mono">${d.unsupported ? '—' : name}</td>
        <td>${d.unsupported ? `<span class="small">不支持：${esc(d.unsupported)}</span>` : effectBadge(eff)}</td>
        <td class="small">${esc(d.desc)}</td></tr>`;
    }).join('');
    return `${k === 'grpc' ? `<div class="small mb12">服务 <span class="mono">${GRPC_SAMPLE_SERVICE}</span> <span class="muted">· grpc.health.v1、grpc.reflection 等系统服务不列出</span></div>` : ''}
      <div class="disc"><table class="table"><thead><tr><th></th><th>${k === 'rest' ? '接口' : '方法'}</th><th>工具名</th><th>副作用</th><th>说明</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="small muted mt8">副作用按${k === 'rest' ? ' HTTP Method' : '方法名'}推断，描述、副作用登记后都能改。${k === 'grpc' ? '服务端流的消息合并成数组返回。' : ''}</div>`;
  };
  const draw = m => {
    const k = st.kind;
    $('.modal-b', m).innerHTML = `
      <div class="section-t">类型</div>
      <div class="typecards">${Object.entries(KINDS).map(([key, v]) => `<div class="typecard ${k === key ? 'on' : ''}" data-kind="${key}"><strong>${v.name}</strong><span>${v.desc}</span></div>`).join('')}</div>
      <div class="section-t">基本信息 <button class="btn-link" id="rg-fill">填入示例</button></div>
      <div class="grid2">
        <div class="field"><label>服务名<span class="req">*</span></label><input type="text" id="rg-name" value="${esc(st.name)}" placeholder="小写字母、数字、连字符，如 crm">
          <div class="hint">工具名前缀、用户中心数据标识、服务地址的一段；登记后不能改，也不能复用</div></div>
        <div class="field"><label>显示名称<span class="req">*</span></label><input type="text" id="rg-display" value="${esc(st.display)}"></div>
      </div>
      <div class="field"><label>描述</label><input type="text" id="rg-desc" value="${esc(st.desc)}"></div>
      <div class="field"><label>可见性</label><div class="radio-row">
        <label class="check"><input type="radio" name="rg-vis" value="private" ${st.visibility === 'private' ? 'checked' : ''}> 私有：按授给 Key 的权限调用（可以细到工具）</label>
        <label class="check"><input type="radio" name="rg-vis" value="public" ${st.visibility === 'public' ? 'checked' : ''}> 公开：任何 Key 都能用全部工具，不需要授权</label></div></div>
      <div class="section-t">连接</div>
      ${connFieldsHtml(k, st.conn)}
      <div class="section-t mt16">上游凭据与透传</div>
      ${credFieldsHtml(k, st.cred, st.credVal)}
      ${identityHtml(k, st.identity)}
      <div class="section-t mt16">工具</div>
      ${k === 'rest' && st.conn.src === 'manual' ? '' : `<div class="row mb12"><button class="btn btn-sm" id="rg-disc">${{ mcp: '连接并拉取工具', rest: '解析 OpenAPI', grpc: '发现方法' }[k]}</button>
        <span class="small muted">${{ mcp: '调上游 initialize + tools/list', rest: '读取接口定义，每个操作转成一个工具', grpc: '通过服务端反射或描述文件列出服务和方法' }[k]}</span></div>`}
      ${foundHtml()}`;
    $$('.typecard', m).forEach(c => { c.onclick = () => {
      if (c.dataset.kind === st.kind) return;
      sync(m);
      Object.assign(st, { kind: c.dataset.kind, conn: {}, cred: { type: 'none' }, credVal: '', found: null });
      st.picked.clear();
      draw(m);
    }; });
    $('#rg-fill', m).onclick = () => {
      const x = SAMPLE_FILL[st.kind];
      Object.assign(st, { name: x.name, display: x.display, desc: x.desc, conn: clone(x.conn), cred: clone(x.cred), credVal: 'demo-' + rand(12), found: null });
      st.picked.clear();
      draw(m);
    };
    $$('input[name=cf-src]', m).forEach(r => { r.onchange = () => { sync(m); st.found = null; st.picked.clear(); draw(m); }; });
    const disc = $('#rg-disc', m);
    if (disc) disc.onclick = () => {
      sync(m);
      const { err } = readConnFields(m, st.kind);
      if (err) { toast(err); return; }
      st.found = clone(SAMPLE_DISCOVERY[st.kind]);
      st.picked = new Set(st.found.filter(d => !d.unsupported && !(st.kind === 'rest' && d.method === 'DELETE')).map(d => discKey(st.kind, d)));
      draw(m);
      toast({ mcp: `已连接，拉到 ${st.found.length} 个工具`, rest: `已解析 ${st.found.length} 个操作，${st.found.filter(d => d.unsupported).length} 个不支持`, grpc: `发现 ${st.found.length} 个方法，${st.found.filter(d => d.unsupported).length} 个不支持` }[st.kind],
        { mcp: `initialize + tools/list → ${st.conn.url}`, rest: `GET ${st.conn.spec}`, grpc: `grpc.reflection.v1.ServerReflection → ${st.conn.addr}` }[st.kind]);
    };
    bindCred(m, st.cred);
  };
  openModal({
    title: '登记 MCP 服务', wide: true, body: '',
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="rg-ok">登记</button>',
    onMount: m => {
      draw(m);
      $('#rg-ok', m).onclick = () => {
        sync(m);
        const k = st.kind;
        if (!/^[a-z][a-z0-9-]{1,23}$/.test(st.name)) { toast('服务名：小写字母开头，2–24 位小写字母、数字、连字符'); return; }
        if (servers.some(s => s.name === st.name)) { toast(`服务名 ${st.name} 已被使用（停用的服务也不能复用）`); return; }
        if (!st.display) { toast('请填写显示名称'); return; }
        const { conn, err } = readConnFields(m, k);
        if (err) { toast(err); return; }
        const cr = readCred(m);
        if (cr.err) { toast(cr.err); return; }
        const manual = k === 'rest' && conn.src === 'manual';
        if (!manual && !st.found) { toast({ mcp: '请先连接并拉取工具', rest: '请先解析 OpenAPI', grpc: '请先发现方法' }[k]); return; }
        const picked = manual ? [] : st.found.filter(d => k === 'mcp' || (!d.unsupported && st.picked.has(discKey(k, d))));
        if (!manual && !picked.length) { toast('请至少选一个接口'); return; }
        const tools = picked.map(d => k === 'mcp'
          ? { ...clone(d), status: 'active' }
          : k === 'rest'
            ? { name: toSnake(d.op), effect: restEffect(d.method), status: 'active', desc: d.desc, http: { method: d.method, path: d.path, pick: '', limit: 32 }, params: clone(d.params) }
            : { name: toSnake(d.method), effect: grpcEffect(d.method), status: 'active', desc: d.desc, grpc: { method: d.method, stream: d.stream, req: d.req }, params: clone(d.params) });
        servers.push({
          name: st.name, display: st.display, desc: st.desc, kind: k, visibility: st.visibility, status: 'enabled',
          conn: { ...conn, ...(k === 'grpc' ? { service: GRPC_SAMPLE_SERVICE } : {}) }, cred: cr.cred, identity: $('#cf-identity', m).checked,
          ...(k === 'mcp' ? { fetched_at: nowStr().slice(5) } : {}),
          created_by: me, created_at: nowStr(), tools, owners: [me], grants: [],
        });
        closeModal();
        go('/servers/' + st.name);
        toast(`已登记「${st.display}」，${tools.length} 个工具`, `用户中心：登记数据对象 McpServer ${st.name}（${USERS[me].name} 成为所有者）${tools.length ? ` + McpTool × ${tools.length}` : ''}；各网关实例经配置变更通知立即可用`);
      };
    },
  });
}

/* =====================================================================

const kf = { status: '', q: '' };
function permChips(k) {
  const gs = servers.filter(s => s.visibility === 'private').map(s => ({ s, g: grantOf(s, k) })).filter(x => x.g);
  if (!gs.length) return '<span class="small muted">只有公开服务</span>';
  return `<div class="pill-tools">${gs.map(({ s, g }) => `<span class="tag mono" title="${esc(dataRefs(s, g))}">${s.name} · ${g.scope === 'all' ? '全部' : g.tools.length + ' 个工具'}</span>`).join('')}</div>`;
}
function usableTableHtml(k) {
  return `<table class="table"><thead><tr><th>服务</th><th>能用的工具</th><th>来源</th></tr></thead><tbody>
    ${usableSummary(k).map(({ s, tools }) => {
      const all = tools.length === s.tools.filter(t => callable(s, t)).length;
      return `<tr><td><div class="mname">${esc(s.display)}</div><div class="mono muted">${s.name}</div></td>
        <td>${all ? `全部 ${tools.length} 个` : `<div class="pill-tools">${tools.map(t => `<span class="tag mono">${t.name}</span>`).join('')}</div>`}</td>
        <td class="small">${keyVia(s, tools[0], k)}</td></tr>`;
    }).join('') || '<tr><td colspan="3"><div class="empty">没有能用的服务</div></td></tr>'}</tbody></table>`;
}
const clientConfig = k => {
  const names = usableSummary(k).slice(0, 2).map(x => x.s.name);
  return { mcpServers: Object.fromEntries((names.length ? names : ['<服务名>']).map(n => [n, { type: 'http', url: `${GW_PUBLIC}/${n}`, headers: { Authorization: 'Bearer ${MCP_API_KEY}' } }])) };
};
// 能给自己的 Key 分配权限的人：管理员，或至少是一个私有服务的所有者
const canAssignAny = () => isAdmin() || servers.some(s => s.visibility === 'private' && canAssign(s));

function renderKeys() {
  const admin = isAdmin();
  if (!admin) keyTab = 'user';
  const own = keyOfUser(me);
  $('#content').innerHTML = `
    <div class="page-head"><div><h1>API Key</h1><div class="sub">${admin ? '用户 Key 由本人申请；智能体 Key 在 Atlas 新建智能体时自动申请，也可以在这里为智能体申请。' : '为你本人申请调用 MCP 服务的 Key。'}权限挂在 Key 上：每把 Key 在用户中心有自己的 uid，网关判权时以它作 X-Auth-Uid。</div></div>
      <div class="grow"></div>
      ${keyTab === 'user' ? `<button class="btn btn-primary" id="btn-apply" ${own ? 'disabled title="你已经有用户 Key 了"' : ''}>＋ 申请用户 Key</button>` : '<button class="btn btn-primary" id="btn-agent">＋ 为智能体申请 Key</button>'}</div>

      : '一个智能体一把 Key（客户端类型 Agent，客户端编码 = 智能体 id）。Atlas 新建智能体时调接口申请、删除智能体时调接口删除；还没有 Key 的智能体可以在这里补申请。Atlas 编辑、运行智能体时按类型 + 编码取 Key 和能用的工具，和智能体的权限类型无关。智能体 Key 不在页面上显示原文。'}</div></div>
    ${keyTab === 'client' ? `<div class="toolbar">
        <select class="select" id="kf-status"><option value="">全部状态</option><option value="active" ${kf.status === 'active' ? 'selected' : ''}>正常</option><option value="blocked" ${kf.status === 'blocked' ? 'selected' : ''}>已停用</option></select>
        <input class="input" id="kf-q" placeholder="搜索智能体 id / 名称" value="${esc(kf.q)}" style="width:220px"></div>` : ''}
    <div class="card" id="ktable"></div>
    <div id="kextra"></div>`;
  $$('#ktabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === keyTab); b.onclick = () => { keyTab = b.dataset.tab; renderKeys(); }; });
  const ap = $('#btn-apply');
  if (ap) ap.onclick = openApply;
  const ag = $('#btn-agent');
  if (ag) ag.onclick = openAgentApply;
  if (keyTab === 'client') {
    $('#kf-status').onchange = e => { kf.status = e.target.value; renderAgentKeyTable(); };
    $('#kf-q').oninput = e => { kf.q = e.target.value; renderAgentKeyTable(); };
    renderAgentKeyTable();
  } else {
    renderUserKeyTable();
  }
}

function keyOps(k) {
  const mine = k.type === 'user' && k.user === me;
  const ops = [];
  if (isAdmin() || (mine && canAssignAny())) ops.push('<button class="btn-link" data-op="assign">分配权限</button>');
  if (mine || k.type === 'client') ops.push('<button class="btn-link" data-op="reset">重置</button>');
  ops.push(`<button class="btn-link" data-op="${k.status === 'active' ? 'block' : 'unblock'}">${k.status === 'active' ? '停用' : '启用'}</button>`);
  if (mine || k.type === 'client') ops.push('<button class="btn-link danger" data-op="delete">删除</button>');
  return ops.join('');
}
function bindKeyOps(root) {
  $$('tr[data-key]', root).forEach(tr => {
    const k = keyById(tr.dataset.key);
    $$('[data-op]', tr).forEach(b => { b.onclick = () => ({
      apply: openApply,
      assign: () => openAssign(k, renderKeys),
      reset: () => resetKey(k),
      block: () => blockKey(k),
      unblock: () => { k.status = 'active'; renderKeys(); toast('已启用', '网关重新接受这把 Key；授权一直保留着'); },
      delete: () => deleteKey(k),
    })[b.dataset.op](); });
  });
}

function renderUserKeyTable() {
  const rows = keys.filter(k => k.type === 'user' && (isAdmin() || k.user === me));
  const own = keyOfUser(me);
  $('#ktable').innerHTML = `<table class="table"><thead><tr><th>持有人</th><th>Key</th><th>私有服务权限</th><th>状态</th><th>申请时间</th><th>操作</th></tr></thead><tbody>

      <td>${userCell(k.user)}</td>

      <div class="card"><div class="card-h"><h3>在外部客户端里用</h3><span class="small muted">Claude Code、Cursor 等</span></div><div class="card-b">
        <pre class="code">${esc(json(clientConfig(own)))}</pre><div class="small muted mt8">每个服务一个地址；tools/list 只返回这把 Key 有权限的工具。</div></div></div>
    </div>` : '';

function renderAgentKeyTable() {
  const q = kf.q.trim().toLowerCase();
  const rows = keys.filter(k => k.type === 'client' && (!kf.status || k.status === kf.status) && (!q || (k.client_code + k.client_name).toLowerCase().includes(q)));
  $('#ktable').innerHTML = rows.length ? `<table class="table"><thead><tr><th>智能体</th><th>Key</th><th>私有服务权限</th><th>状态</th><th>申请</th><th>操作</th></tr></thead><tbody>
    ${rows.map(k => `<tr data-key="${k.uuid}">
      <td><div class="mname">${esc(k.client_name)}</div><div class="mono small muted">${k.client_type} · ${k.client_code}</div></td>
      <td><div class="mono nowrap">mk-…${k.last4}</div><div class="subnote">uid <span class="mono">${k.uid}…</span></div></td>
      <td>${permChips(k)}</td><td>${keyStatusBadge(k)}</td>
      <td class="small nowrap">${k.by}<div class="muted">${k.created_at}</div></td>
      <td class="nowrap">${keyOps(k)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">没有符合条件的智能体 Key</div>';

}

function openApply() {
  if (keyOfUser(me)) { toast('你已经有用户 Key 了，需要新的请「重置」'); return; }
  const pubs = servers.filter(s => s.visibility === 'public' && s.status === 'enabled');
  openModal({
    title: '申请用户 Key',
    body: `<div class="field"><label>本人</label>${userCell(me)}</div>
      <div class="callout callout-info mb12"><div>申请后马上能调用公开服务：${pubs.map(s => esc(s.display)).join('、')}。私有服务要由服务所有者或管理员给这把 Key 分配权限。</div></div>
      <div class="small muted">申请时网关在用户中心为这把 Key 登记一个主体（没有密码、不能登录、没有部门），得到它的 uid，之后的授权都授给这个 uid。只能为本人申请；智能体的 Key 在「智能体 Key」里。</div>`,
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="a-ok">申请</button>',
    onMount: m => {
      $('#a-ok', m).onclick = () => {
        const full = genKey();
        const k = { uuid: 'k-' + rand(4), uid: genUid(), type: 'user', user: me, last4: full.slice(-4), status: 'active', created_at: nowStr() };
        keys.push(k);
        renderKeys();
        toast('已申请用户 Key', `用户中心：登记 Key 主体 uid ${k.uid}…（没有密码、不能登录、没有部门）`);
        showKey(full, '已申请用户 Key', k);
      };
    },
  });
}
// 只有用户 Key 会显示原文（只显示一次）；智能体 Key 由 Atlas 经接口获取
function showKey(full, title, k) {
  openModal({
    title,
    body: `
      <div class="keybox"><span id="kfull">${full}</span><button class="btn btn-sm" id="kcopy">复制</button></div>
      <div class="callout callout-warn mt12"><div>Key 只显示这一次，关闭后无法再查看；忘了可以「重置」（uid 和权限不变）。</div></div>
      <div class="section-t mt16">在外部客户端里用</div>
      <pre class="code">${esc(json(clientConfig(k)).split('${MCP_API_KEY}').join(full))}</pre>`,
    foot: '<button class="btn btn-primary" data-close>我已保存</button>',
    onMount: m => { $('#kcopy', m).onclick = () => { navigator.clipboard?.writeText(full); toast('已复制'); }; },
  });
}
function openAgentApply() {
  const free = AGENTS.filter(a => !keyOfAgent(a.id));
  if (!free.length) { toast('所有智能体都已经有 Key 了'); return; }
  openModal({
    title: '为智能体申请 Key',
    body: `
      <div class="callout callout-info mb12"><div>Atlas 新建智能体时会自动申请。这里给还没有 Key 的智能体补申请（例如接入前就建好的智能体）。</div></div>
      <div class="field"><label>智能体<span class="req">*</span></label><select id="ag-id">${free.map(a => `<option value="${a.id}">${esc(a.name)}（${a.id}）</option>`).join('')}</select>
        <div class="hint">列表来自 Atlas；一个智能体只有一把 Key（按客户端类型 + 编码唯一）</div></div>`,
    foot: '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="ag-ok">申请并分配权限</button>',
    onMount: m => {
      $('#ag-ok', m).onclick = () => {
        const a = AGENTS.find(x => x.id === $('#ag-id', m).value);
        const k = { uuid: 'k-' + rand(4), uid: genUid(), type: 'client', client_type: 'Agent', client_code: a.id, client_name: a.name, last4: genKey().slice(-4), status: 'active', created_at: nowStr(), by: `${USERS[me].name}（页面）` };
        keys.push(k);
        closeModal(); renderKeys();
        toast(`已为「${a.name}」申请 Key`, `用户中心：登记 Key 主体 uid ${k.uid}…；Atlas 下一次按 Agent:${a.id} 取 Key 时拿到`);
        openAssign(k, renderKeys);
      };
    },
  });
}
function resetKey(k) {
  confirmBox({
    title: '重置 Key', okText: '重置',
    body: `<div>为「${esc(keyTitle(k))}」生成新的原文，旧 Key <span class="mono">mk-…${k.last4}</span> 立即失效。</div>
      <div class="small muted mt8">uid 不变，分配的权限保持不变。${k.type === 'user' ? '用旧 Key 的外部客户端要换成新的。' : 'Atlas 下一次获取时拿到新的；正在用旧 Key 的调用会失败。'}</div>`,
    onOk: () => {
      const full = genKey();
      k.last4 = full.slice(-4);
      renderKeys();
      toast('已重置', '只换原文；用户中心里的主体和授权不动');
      if (k.type === 'user') showKey(full, '已重置用户 Key', k);
    },
  });
}
function blockKey(k) {
  confirmBox({
    title: '停用 Key', okText: '停用', danger: true,
    body: `<div>停用后网关拒绝「${esc(keyTitle(k))}」的所有调用（<code>key_invalid</code>）${k.type === 'client' ? '，这个智能体在 Atlas 里不能调 MCP 工具' : ''}。授权保留，可以随时启用。</div>`,
    onOk: () => { k.status = 'blocked'; renderKeys(); toast('已停用', '各网关实例经变更通知立即生效'); },
  });
}
function deleteKey(k) {
  const n = servers.filter(s => grantOf(s, k)).length;
  confirmBox({
    title: '删除 Key', okText: '删除', danger: true,
    body: `<div>删除「${esc(keyTitle(k))}」（<span class="mono">mk-…${k.last4}</span>），不可恢复。用户中心里的 Key 主体和它的 ${n} 个服务的授权一起删除。</div>
      <div class="small muted mt8">${k.type === 'client' ? 'Atlas 下次用到这个智能体时会重新申请一把（只能调公开服务，要重新分配权限）。' : '重新申请后要重新分配权限。'}只是临时不用，请选「停用」。</div>`,
    onOk: () => {
      keys = keys.filter(x => x !== k);
      servers.forEach(s => { s.grants = s.grants.filter(g => g.key !== k.uuid); });
      renderKeys();
      toast('已删除', `用户中心：删除 Key 主体 uid ${k.uid}… 及其授权`);
    },
  });
}

function renderTraffic() {
  $('#content').innerHTML = `<div class="doc">
    <div class="page-head"><div><h1>流量治理 <span class="badge badge-gray" style="vertical-align:middle">通用组件 · 单独设计</span></h1>
      <div class="sub">并发限制、限流、超时、熔断做成通用组件，MCP 网关是它的一个接入方。本原型不设计它的策略模型和页面，只列 MCP 网关对它的要求。</div></div></div>
    <div class="card mb16"><div class="card-h"><h3>MCP 网关要用的能力</h3></div><table class="table"><thead><tr><th>能力</th><th>维度</th><th>在网关里的执行点</th><th>被拒时调用方收到</th></tr></thead><tbody>
      <tr><td class="nowrap">并发限制</td><td>服务、工具、Key</td><td>判权之后、调上游之前占用；上游返回（流式结果结束）时释放</td><td class="mono small">-32053 concurrency_limited<br>没有转发</td></tr>
      <tr><td class="nowrap">限流</td><td>服务、工具、Key</td><td>同上；默认只对 tools/call 计数，initialize、tools/list 不计</td><td class="mono small">-32052 rate_limited<br>没有转发，带 retry_after</td></tr>
      <tr><td class="nowrap">超时</td><td>服务、工具</td><td>调上游时计时；超时后取消上游请求（HTTP 断开、gRPC 取消、MCP 发 notifications/cancelled）</td><td class="mono small">-32055 upstream_timeout<br>已转发，结果未知</td></tr>
      <tr><td class="nowrap">熔断</td><td>上游（服务）</td><td>按真实调用统计连接失败、5xx、超时；打开期间直接拒绝，半开时放少量探测</td><td class="mono small">-32054 circuit_open<br>没有转发，带 retry_after</td></tr>
    </tbody></table></div>
    <div class="card mb16"><div class="card-h"><h3>对通用组件的要求</h3></div><div class="card-b"><ol>
      <li><b>多实例下计数准确</b>：网关横向扩展后，并发、限流按全部实例合计，不能各算各的。</li>
      <li><b>策略不重启生效</b>：改了以后各实例秒级生效；支持默认值 → 服务级 → 工具级逐层覆盖。</li>
      <li><b>判定开销小</b>：每次工具调用都要过一遍，不能每次多一跳远程调用；允许短时误差。</li>
      <li><b>组件自己不可用时怎么办要定清楚</b>：放行还是拒绝由通用设计定。流量治理不是安全边界，MCP 网关倾向放行。</li>
      <li><b>被拒要能追查</b>：MCP 网关只接 Trace，被拒时在 Span 上记下原因和命中的策略。</li>
      <li><b>MCP 网关只提供维度和执行点</b>：服务名、工具名、Key 的 uid、上游地址；网关里不另做一套限流。</li>
    </ol></div></div>
    <div class="card"><div class="card-h"><h3>现在的超时怎么迁</h3></div><div class="card-b small">现在服务上配的「单次调用超时」由调用方（Atlas）执行。接入通用组件后改由网关执行，Atlas 只留一个比它略长的兜底，避免两边各算各的。</div></div>
  </div>`;
}
