<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>用户中心 · 登录 — 改版原型</title>
<style>
/* 设计 token 与 Atlas 控制台改版原型（atlas-console.html）、packages/chat-ui/src/theme/tokens.css 同一套 */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd; --hover: #f2f4f8;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff; --primary-ink: #4338ca;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #d97706; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 52px; --sider-w: 248px; --sider-w-min: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); }
h1 { font-size: 20px; font-weight: 650; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
input[type=checkbox], input[type=radio] { accent-color: var(--primary); width: 15px; height: 15px; margin: 0; flex: none; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.sm { font-size: 12.5px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { flex: 1; }

/* ---------- 顶栏：一级菜单 ---------- */
.top { height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px 0 14px; gap: 20px; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .01em; cursor: pointer; white-space: nowrap; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; }
.pnav { display: flex; gap: 2px; height: 100%; }
.pnav a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--ink-2); font-weight: 550; position: relative; white-space: nowrap; }
.pnav a:hover { color: var(--ink); background: var(--hover); }
.pnav a.on { color: var(--primary-ink); }
.pnav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 650; flex: none; vertical-align: middle; }
.sq { display: inline-grid; place-items: center; border-radius: 10px; flex: none; }
.sq svg { width: 52%; height: 52%; }

/* ---------- 左侧：二级菜单（可收缩） ---------- */
.body { display: flex; height: calc(100vh - var(--top-h)); }
.body.full { height: 100vh; }
.sider { width: var(--sider-w); flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; }
.sider.min { width: var(--sider-w-min); }
.sider-top { padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.snav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 520; white-space: nowrap; cursor: pointer; position: relative; }
.snav:hover { background: var(--hover); color: var(--ink); }
.snav.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.snav .badge { margin-left: auto; }
.sider.min .snav { justify-content: center; padding: 0; }
.sider.min .snav span, .sider.min .snav .badge { display: none; }
.hist { flex: 1; overflow-y: auto; padding: 4px 10px 10px; border-top: 1px solid var(--line-2); margin-top: 6px; }
.hist-group { font-size: 11.5px; color: var(--ink-4); padding: 10px 8px 4px; }
.hist-item { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; border-radius: var(--radius-sm); color: var(--ink-2); cursor: pointer; }
.hist-item:hover { background: var(--hover); }
.hist-item.on { background: #e9ebf3; color: var(--ink); font-weight: 550; }
.hist-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.sider-foot { border-top: 1px solid var(--line-2); padding: 8px 10px; }
.main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
.page { padding: 24px 32px 60px; max-width: 1280px; margin: 0 auto; }
.page.narrow { max-width: 880px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 36px; }
.page-head .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

/* ---------- 通用组件（与 Atlas 原型相同） ---------- */
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 550; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: #cfd3dd; background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 40px; font-size: 14.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ibtn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.ibtn.sm { width: 26px; height: 26px; }
.input, .select, textarea.input { height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 11px; background: var(--surface); outline: none; width: 100%; }
.input.lg { height: 40px; font-size: 14.5px; }
textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-weak); }
.input[readonly] { background: var(--surface-2); color: var(--ink-2); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--ink-4); }
.search .input { padding-left: 32px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.tag.xs { height: 18px; padding: 0 6px; font-size: 11px; }
.tag.primary { background: var(--primary-weak); color: var(--primary-ink); }
.tag.success { background: var(--success-weak); color: var(--success); }
.tag.warning { background: var(--warning-weak); color: #b45309; }
.tag.danger { background: var(--danger-weak); color: var(--danger); }
.tag.blue { background: var(--secondary-weak); color: #0369a1; }
.tag.mono { font-family: var(--mono); font-weight: 500; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 650; display: inline-grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card.pad { padding: 16px 18px; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line-2); min-height: 50px; }
.card-b { padding: 14px 16px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs a { padding: 10px 0; color: var(--ink-3); font-weight: 550; position: relative; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); }
.tabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.tabs.inner { padding: 0 16px; margin-bottom: 0; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg a { padding: 4px 12px; border-radius: 7px; color: var(--ink-3); font-weight: 550; font-size: 13px; white-space: nowrap; }
.seg a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
.seg a .n { color: var(--ink-4); font-weight: 500; margin-left: 3px; }
.seg.block { display: flex; } .seg.block a { flex: 1; text-align: center; }
.switch { display: inline-block; vertical-align: middle; width: 36px; height: 20px; border-radius: 10px; background: #d5d9e2; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 18px; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr.click:hover td { background: var(--surface-2); cursor: pointer; }
.table tr.grp td { background: var(--surface-2); font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 7px 14px; }
.table.flat { border: none; border-radius: 0 0 var(--radius) var(--radius); }
.table .acts { text-align: right; white-space: nowrap; }
.table .acts > * { vertical-align: middle; }
.nw { white-space: nowrap; }
.empty { text-align: center; padding: 48px 20px; color: var(--ink-3); }
.empty .ill { width: 52px; height: 52px; border-radius: 16px; background: var(--primary-weak); color: var(--primary); display: grid; place-items: center; margin: 0 auto 12px; }
.empty .ill svg { width: 24px; height: 24px; }
.empty h3 { margin-bottom: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
a.chip:hover { background: var(--hover); color: var(--ink); }
.chip .x { color: var(--ink-4); cursor: pointer; display: inline-grid; }
.chip .x:hover { color: var(--danger); }
.chip .x svg { width: 13px; height: 13px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 12px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.divider { height: 1px; background: var(--line-2); margin: 16px 0; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.help { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
.radio-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); }
.radio-card:hover { border-color: #cfd3dd; }
.radio-card.on { border-color: var(--primary-2); background: #f8f8ff; box-shadow: 0 0 0 3px var(--primary-weak); }
.radio-card .r { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c5cad6; flex: none; margin-top: 2px; }
.radio-card.on .r { border: 5px solid var(--primary); }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: box-shadow .15s, border-color .15s; position: relative; }
.acard:hover { border-color: #d6d9e3; box-shadow: var(--shadow-md); }
.acard .desc { color: var(--ink-3); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
.acard .foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); margin-top: auto; }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
.alert svg { margin-top: 1px; }
.alert.danger { background: var(--danger-weak); color: #b91c1c; }
.alert.warning { background: var(--warning-weak); color: #92400e; }
.alert.info { background: var(--primary-weak); color: var(--primary-ink); }
.alert.plain { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.pager { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line-2); }
.pager .pg { min-width: 26px; height: 26px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 13px; color: var(--ink-2); }
.pager .pg.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }

/* 浮层 */
.pop { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; min-width: 200px; }
.pop .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.pop .mi:hover { background: var(--hover); color: var(--ink); }
.pop .mi.on { color: var(--primary-ink); }
.pop .mi.danger { color: var(--danger); }
.pop .sep { height: 1px; background: var(--line-2); margin: 5px 4px; }
.pop .ph { font-size: 11.5px; color: var(--ink-4); padding: 6px 10px 2px; }
.mask { position: fixed; inset: 0; background: rgba(15,23,42,.36); z-index: 80; display: grid; place-items: center; }
.modal { background: var(--surface); border-radius: 14px; width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal.wide { width: 720px; }
.modal-h { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.modal-b { padding: 18px 20px; overflow-y: auto; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.2); z-index: 70; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 600px; max-width: 92vw; background: var(--surface); z-index: 71; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.drawer-b { flex: 1; overflow-y: auto; padding: 18px 20px; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: var(--shadow-md); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ---------- 用户中心专用 ---------- */
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.split.narrow { grid-template-columns: 250px minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; position: sticky; top: 0; max-height: calc(100vh - var(--top-h) - 48px); overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line-2); }
.panel-b { overflow-y: auto; padding: 6px; }
.tn { display: flex; align-items: center; gap: 6px; height: 32px; padding-right: 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-2); font-size: 13.5px; }
.tn:hover { background: var(--hover); }
.tn.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.tn .tw { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-4); flex: none; border-radius: 4px; }
.tn .tw:hover { background: var(--line-2); color: var(--ink); }
.tn .tw svg { width: 14px; height: 14px; }
.tn > svg { color: var(--ink-4); width: 15px; height: 15px; }
.tn.on > svg { color: var(--primary); }
.tn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn .n { font-size: 12px; color: var(--ink-4); font-weight: 500; }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.li:hover { background: var(--hover); }
.li.on { background: var(--primary-weak); }
.li.on b { color: var(--primary-ink); }
.lg-label { font-size: 11.5px; color: var(--ink-4); padding: 10px 10px 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 14px; }
.stat { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.stat .v { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.opt:hover { background: var(--hover); }
.opt input { margin-top: 3px; }
.grp { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grp + .grp { margin-top: 10px; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line-2); font-weight: 600; font-size: 13.5px; }
.opgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 8px; padding: 4px; }
.savebar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.secret { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.once { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
.once .r { display: grid; grid-template-columns: 80px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.once .r:last-child { border-bottom: none; }
.once .r .v { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.quota { display: flex; align-items: center; gap: 8px; }
.quota .bar { width: 72px; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.quota .bar i { display: block; height: 100%; background: var(--primary-2); }
.quota .bar i.warn { background: var(--warning); }
.stack { display: inline-flex; }
.stack .sq { border: 2px solid var(--surface); margin-left: -6px; }
.stack .sq:first-child { margin-left: 0; }
.apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.app-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px; border-radius: 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-align: center; line-height: 1.3; }
.app-tile:hover { background: var(--hover); }
.app-tile.cur { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.mini { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); font-size: 12.5px; }
.mini-top { height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.mini-top .logo { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; margin-right: 6px; }
.mini-top .p { color: var(--ink-3); padding: 0 8px; height: 100%; display: flex; align-items: center; position: relative; white-space: nowrap; }
.mini-top .p.on { color: var(--primary-ink); font-weight: 600; }
.mini-top .p.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.mini-body { display: flex; height: 200px; }
.mini-side { width: 150px; background: var(--surface-2); border-right: 1px solid var(--line); padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; }
.mini-side .it { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; color: var(--ink-2); }
.mini-side .it.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.mini-main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.mini-main i { display: block; height: 10px; border-radius: 4px; background: var(--line); }

/* ---------- 登录 ---------- */
.lg-main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: safe center; padding: 40px 20px; background: radial-gradient(900px 420px at 50% -8%, rgba(99,102,241,.10), transparent 70%), radial-gradient(700px 360px at 100% 100%, rgba(14,165,233,.07), transparent 70%), var(--bg); }
.lg-brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 700; margin-bottom: 20px; letter-spacing: .01em; }
.lg-brand .logo { width: 36px; height: 36px; border-radius: 10px; font-size: 17px; }
.lg-card { width: 400px; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-md); padding: 28px 28px 22px; }
.lg-sub { color: var(--ink-3); font-size: 13.5px; margin: 4px 0 18px; }
.lg-from { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--primary-weak); color: var(--primary-ink); font-size: 12.5px; margin-bottom: 14px; }
.lg-from svg { width: 14px; height: 14px; }
.field { margin-bottom: 14px; }
.pw { position: relative; }
.pw .input { padding-right: 40px; }
.pw .ibtn { position: absolute; right: 4px; top: 4px; }
.lg-help { display: flex; justify-content: space-between; margin-top: 14px; font-size: 13px; }
.lg-foot { margin-top: 22px; font-size: 12px; color: var(--ink-4); }
.tenant-chip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; }
.rule { display: flex; align-items: center; gap: 6px; color: var(--ink-3); }
.rule .dotc { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #c5cad6; display: grid; place-items: center; flex: none; }
.rule.ok { color: var(--success); }
.rule.ok .dotc { background: var(--success); border-color: var(--success); color: #fff; }
.rule .dotc svg { width: 10px; height: 10px; stroke-width: 3; }
.rule.bad { color: var(--danger); }
.who { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 10px; margin-bottom: 18px; }

.notes { width: 300px; flex: none; overflow-y: auto; background: #fffdf3; border-left: 1px solid #f3e3a6; padding: 14px 16px; font-size: 13px; }

.notes .diff { display: inline-block; font-size: 11px; background: #e0e7ff; color: #3730a3; border-radius: 4px; padding: 0 5px; margin-right: 4px; }

.demo .dl { font-size: 11.5px; color: #92400e; margin: 6px 0 3px; }

.notes .nav a { display: block; color: #78350f; padding: 2px 0; }

const deptOf = (id) => D.depts.find((d) => d.id === id);
const appOf = (id) => D.apps.find((a) => a.id === id);
const kidsOf = (id) => D.depts.filter((d) => d.p === id);
const deptPath = (id) => { const out = []; let d = deptOf(id); while (d) { out.unshift(d.name); d = deptOf(d.p); } return out; };
const ancestors = (id) => { const out = []; let d = deptOf(deptOf(id)?.p); while (d) { out.push(d); d = deptOf(d.p); } return out; };
const descIds = (id) => [id, ...kidsOf(id).flatMap((k) => descIds(k.id))];

}

/** 某个对象（部门 / 用户）的授权：自己的 + 继承的（部门链上「含下级」的；用户所在部门的不论是否含下级） */
function subjectGrants(s) {
  const own = D.grants.filter((g) => g.st === s.type && g.sid === s.id);
  let inherited = [];
  if (s.type === 'dept') {
    const anc = ancestors(s.id).map((d) => d.id);
    inherited = D.grants.filter((g) => g.st === 'dept' && anc.includes(g.sid) && g.sub);
  } else {
    const u = D.users.find((x) => x.id === s.id);
    if (u) {
      const anc = ancestors(u.dept).map((d) => d.id);
      inherited = D.grants.filter((g) => g.st === 'dept' && (g.sid === u.dept || (anc.includes(g.sid) && g.sub)));
    }
  }
  return { own, inherited };
}
/** 用户的有效角色：直接 + 部门继承 + 岗位默认角色，带来源（回答「他为什么有这个权限」） */
function effectiveRoles(uid) {
  const { own, inherited } = subjectGrants({ type: 'user', id: uid });
  const rows = [];
  const srcOf = (g) => (g.st === 'user' ? '直接授权' : `部门「${deptOf(g.sid).name}」${g.sub ? '（含下级）' : ''}`);
  for (const g of [...own, ...inherited]) {
    if (g.kind === 'role') rows.push({ app: g.app, role: g.target, src: srcOf(g) });
    else (posOf(g.target)?.roles || []).forEach(([app, role]) => rows.push({ app, role, src: `岗位「${g.target}」← ${srcOf(g)}` }));
  }
  return rows;
}

/* =====================================================================
 * 渲染
 * ===================================================================== */
function render() {
  const r = parseRoute();
  const app = document.getElementById('app');
  const tail = overlays() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  if (r.p === 'login') {
    app.innerHTML = `<div class="body full"><main class="main lg-main">${loginPage()}</main>${S.notes ? notesPanel(r) : ''}</div>` + tail;
    return afterRender(r);
  }
  if (r.p === 'ia') { app.innerHTML = `<div class="body full"><main class="main">${iaPage()}</main></div>` + tail; return; }
  const plat = PLATFORMS.find((p) => p.id === r.p);
  if (!plat || !plat.vis()) { location.replace('#/' + landing()); return; }
  app.innerHTML = topbar(r) + `<div class="body">${sider(r)}<main class="main">${page(r)}</main>${S.notes ? notesPanel(r) : ''}</div>` + tail;
  afterRender(r);
}

function page(r) {
  switch (r.p) {
    case 'org':
      if (r.a === 'users' && r.b) return userDetail(r.b);
      if (r.a === 'users') return usersPage();
      if (r.a === 'digital' && r.b) return userDetail(r.b);
      if (r.a === 'digital') return digitalPage();
      return orgPage();
    case 'perm':
      if (r.a === 'roles' && can('role.view')) return rolesPage();
      if (r.a === 'positions') return positionsPage();
      if (r.a === 'data' && can('data.all')) return dataPage('all');
      if (r.a === 'grants') return bySubject();
      location.replace(siderItems('perm')[0].h); return '';
    case 'apps':
      if (r.a) return appDetail(r.a);
      return appsPage();
    case 'tenants': return tenantsPage();
    case 'me':
      if (r.a === 'security') return securityPage();
      if (r.a === 'apps') return myAppsPage();
      if (r.a === 'data') return dataPage('me');
      return profilePage();
  }
  return '<div class="page">404</div>';
}

function toast(msg) {
  S.toast = msg; render();
  clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2200);
}

function head(title, right = '', sub = '') {

}
function seg(key, opts, cls = '') {
  return `<div class="seg ${cls}">${opts.map(([k, t, n]) => `<a class="${S[key] === k ? 'on' : ''}" data-act="setS" data-k="${key}" data-v="${k}">${t}${n !== undefined ? `<span class="n">${n}</span>` : ''}</a>`).join('')}</div>`;

function tabs(key, opts, cls = '') {

const searchBox = (ph, key, w = 260) => `<div class="search" style="width:${w}px">${ic('search')}<input class="input" placeholder="${ph}" ${key ? `data-input="${key}" value="${esc(S[key])}"` : ''}></div>`;

/** 部门树（组织架构、按对象授权共用） */
function treeHtml(act, selId, counts) {
  const q = (act === 'selDept' ? S.orgQ : '').trim();
  const hit = (d) => !q || descIds(d.id).some((id) => deptOf(id).name.includes(q));
  const node = (d, depth) => {
    if (!hit(d)) return '';
    const kids = kidsOf(d.id);
    const open = q || S.treeOpen[d.id];
    return `<div class="tn ${selId === d.id ? 'on' : ''}" style="padding-left:${4 + depth * 16}px" data-act="${act}" data-id="${d.id}">
        <span class="tw" ${kids.length ? `data-act="toggleTree" data-id="${d.id}"` : ''}>${kids.length ? ic(open ? 'down' : 'right') : ''}</span>
        ${ic(d.p ? 'folder' : 'building')}<span class="t">${esc(d.name)}</span>${counts ? `<span class="n">${membersOf(d.id, true).length}</span>` : ''}</div>
      ${kids.length && open ? kids.map((k) => node(k, depth + 1)).join('') : ''}`;
  };
  return D.depts.filter((d) => !d.p).map((d) => node(d, 0)).join('');
}

        <td>${personCell(u)}</td>
        <td><div class="row">${pav(o.name, 22)}<span>${esc(o.name)}</span>${o.status === 'disabled' ? '<span class="tag warning xs">负责人已停用</span>' : ''}</div></td>
        <td>${appTag(u.app)}</td><td class="sm">${u.pos.join('、') || '<span class="faint">—</span>'}</td><td>${statusTag(u.status)}</td>
        <td class="acts">${can('user.manage') ? (u.status === 'disabled' ? `<button class="btn sm" data-act="toast" data-msg="已启用「${esc(u.name)}」">启用</button>` : `<button class="btn sm danger" data-act="modal" data-type="disable" data-id="${u.id}">停用</button>`) : ''}</td></tr>`; }).join('')}
    </table></div>`;
}

function userDetail(id) {
  const u = userOf(id) || ME;
  const digital = !!u.owner;
  const back = digital ? '#/org/digital' : '#/org/users';
  const icon = digital ? sq('bot', '#0ea5e9', 44) : pav(u.name, 44);
  const tags = statusTag(u.status) + (digital ? '<span class="tag blue">数字员工</span>' : '') + (u.status === 'pending' ? '<span class="tag warning">须改密</span>' : '') + (u.uc || []).map((r) => `<span class="tag primary">${r}</span>`).join('');
  const sub = digital ? `${u.account} · 来源：${appOf(u.app).name}` : `${u.account} · ${deptPath(u.dept).join(' / ')}`;
  const right = !can('user.manage') ? '' : digital
    ? (u.status === 'disabled' ? '<button class="btn">启用</button>' : `<button class="btn danger" data-act="modal" data-type="disable" data-id="${u.id}">停用</button>`)
    : `<button class="btn" data-act="modal" data-type="userForm" data-id="${u.id}">${ic('pencil')}编辑</button><button class="btn" data-act="modal" data-type="resetPw" data-id="${u.id}">${ic('key')}重置密码</button><button class="ibtn" data-pop="user:${u.id}">${ic('more')}</button>`;
  const mgr = !digital && managerOf(u);
  const info = digital
    ? `<dl class="kv"><dt>负责人</dt><dd>${pav(userOf(u.owner).name, 22)}<a data-go="#/org/users/${u.owner}">${esc(userOf(u.owner).name)}</a>${userOf(u.owner).status === 'disabled' ? '<span class="tag warning xs">负责人已停用，请在 Atlas 里转交</span>' : ''}</dd>
        <dt>来源应用</dt><dd>${appTag(u.app)}</dd><dt>说明</dt><dd>${esc(u.desc)}</dd>
        <dt>岗位</dt><dd>${u.pos.join('、') || '—'}<a class="sm" data-act="grantFor" data-t="user" data-id="${u.id}">去授权</a></dd>
        ${u.reason ? `<dt>停用原因</dt><dd>${esc(u.reason)}</dd>` : ''}<dt>能否登录</dt><dd class="muted">不能（只作为智能体运行时的身份）</dd></dl>`
    : `<dl class="kv"><dt>邮箱</dt><dd>${u.account}@xinghai.com</dd><dt>手机</dt><dd>${u.phone || '—'}</dd>
        <dt>部门</dt><dd>${deptPath(u.dept).join(' / ')}</dd>
        <dt>岗位</dt><dd>${u.pos.join('、') || '—'}${can('grant.view') ? `<a class="sm" data-act="grantFor" data-t="user" data-id="${u.id}">去授权</a>` : ''}</dd>
        <dt>直属上级</dt><dd>${mgr ? `${pav(mgr.u.name, 22)}<a data-go="#/org/users/${mgr.u.id}">${esc(mgr.u.name)}</a><span class="sm muted">${mgr.d.id === u.dept ? '所在部门负责人' : '上级部门「' + esc(mgr.d.name) + '」负责人'}，按组织架构计算</span>` : '—'}</dd>
        ${u.reason ? `<dt>停用原因</dt><dd>${esc(u.reason)}</dd>` : ''}
        <dt>创建时间</dt><dd>${u.created}</dd><dt>最近登录</dt><dd>${u.last || '从未登录'}</dd></dl>`;
  const eff = effectiveRoles(u.id);
  const byApp = [...new Set(eff.map((x) => x.app))];
  const perm = `<div class="col" style="gap:14px">
      <div class="card"><div class="card-h"><h3>各应用的有效角色</h3><span class="sm muted">每个角色都写明来源</span><span class="sp"></span>${can('grant.view') ? `<a class="sm" data-act="grantFor" data-t="user" data-id="${u.id}">在权限管理中授权 →</a>` : ''}</div>
        ${eff.length ? `<table class="table flat"><tr><th style="width:200px">应用</th><th>角色</th><th>来源</th></tr>
          ${byApp.map((a) => eff.filter((x) => x.app === a).map((x, i) => `<tr>${i === 0 ? `<td rowspan="${eff.filter((y) => y.app === a).length}" style="vertical-align:top">${appTag(a)}</td>` : ''}<td><b>${esc(x.role)}</b></td><td class="sm muted">${esc(x.src)}</td></tr>`).join('')).join('')}</table>`
          : empty('shield', '没有任何角色', digital ? '数字员工只认直接授给它的角色和岗位' : '在「权限 › 授权」里给他授权')}</div>
      ${digital ? '' : `<div class="card"><div class="card-h"><h3>数据权限</h3><span class="sm muted">来自数据 Owner 的授权</span></div>
        <table class="table flat"><tr><th>数据</th><th>类型</th><th>权限</th><th>来源</th></tr>
        ${D.data.slice(0, 3).map((x) => `<tr><td><b>${esc(x.name)}</b></td><td><span class="tag mono">${x.code}</span></td><td>${levelTag(x.my)}</td><td class="sm muted">${x.my === 'OWNER' ? '创建人' : '部门「平台部」（含下级）'}</td></tr>`).join('')}</table></div>`}
    </div>`;
  const logins = `<table class="table"><tr><th>时间</th><th>来源应用</th><th>设备</th><th>IP</th><th>结果</th></tr>${D.logins.map((l) => `<tr><td class="sm">${l.at}</td><td class="sm">${l.app}</td><td class="sm muted">${l.ua}</td><td class="mono">${l.ip}</td><td>${l.ok ? '<span class="tag success">成功</span>' : `<span class="tag danger">失败</span> <span class="xs muted">${l.why}</span>`}</td></tr>`).join('')}</table>`;
  const apps = `<div class="grid">${D.apps.filter((a) => a.status === 'active' && (a.scopeAll || (a.scope || []).some((s) => descIds(s).includes(u.dept)))).map((a) => `<div class="acard" style="cursor:default"><div class="row">${sq(a.icon, a.color, 36)}<div class="grow"><b>${esc(a.name)}</b><div class="xs muted">${a.scopeAll ? '全员可访问' : '所在部门在可访问范围内'}</div></div></div></div>`).join('')}</div>`;
  const tabOpts = digital ? [['info', '基本信息'], ['perm', '权限']] : [['info', '基本信息'], ['perm', '权限'], ['logins', '登录记录'], ['apps', '可访问的应用']];
  if (!tabOpts.some(([k]) => k === S.userTab)) S.userTab = 'info';
  return `<div class="page">
    ${detailHead(back, icon, u.name, sub, tags, right)}
    ${tabs('userTab', tabOpts, '')}
    ${{ info: `<div class="card pad">${info}</div>`, perm, logins, apps }[S.userTab]}
  </div>`;
}

/* =====================================================================
 * 权限
 * ===================================================================== */
function bySubject() {
  const s = S.subj;
  const q = S.subjQ.trim();
  const people = D.users.filter((u) => !q || (u.name + u.account).includes(q));
  const bots = D.digital.filter((u) => !q || (u.name + u.account).includes(q));
  const left = S.subjMode === 'dept'
    ? `<div class="panel-b">${treeHtml('selSubjDept', s.type === 'dept' ? s.id : '', false)}</div>`
    : `<div style="padding:8px 8px 0">${searchBox('搜索姓名或账号', 'subjQ', 0).replace('width:0px', 'width:100%')}</div>
       <div class="panel-b">${people.map((u) => `<div class="li ${s.id === u.id ? 'on' : ''}" data-act="selSubjUser" data-id="${u.id}">${pav(u.name, 26)}<div class="grow"><b class="sm">${esc(u.name)}</b><div class="xs muted ellipsis">${esc(deptOf(u.dept).name)}</div></div>${u.status === 'disabled' ? '<span class="tag xs">停用</span>' : ''}</div>`).join('')}
         ${bots.length ? `<div class="lg-label">数字员工</div>${bots.map((u) => `<div class="li ${s.id === u.id ? 'on' : ''}" data-act="selSubjUser" data-id="${u.id}">${sq('bot', '#0ea5e9', 26)}<div class="grow"><b class="sm">${esc(u.name)}</b><div class="xs muted">${esc(u.account)}</div></div></div>`).join('')}` : ''}</div>`;
  return `<div class="page">
    ${head('授权', '', '按对象授权：选一个部门或人，看它有哪些岗位、角色，以及从哪来')}
    <div class="split">
      <div class="panel"><div class="panel-h">${seg('subjMode', [['dept', '组织'], ['user', '人员']], 'block').replace('class="seg block"', 'class="seg block" style="flex:1"')}</div>${left}</div>
      ${subjectPanel(s)}
    </div></div>`;
}

function subjectPanel(s) {
  const { own, inherited } = subjectGrants(s);
  const isDept = s.type === 'dept';
  const u = !isDept && userOf(s.id);
  const digital = u && !!u.owner;
  const header = isDept
    ? `${sq('building', '#6366f1', 40)}<div class="grow"><div class="xs muted">${deptPath(s.id).slice(0, -1).join(' / ') || '根部门'}</div><h2 style="font-size:18px">${esc(deptOf(s.id).name)}</h2></div>`
    : `${digital ? sq('bot', '#0ea5e9', 40) : pav(u.name, 40)}<div class="grow"><div class="row"><h2 style="font-size:18px">${esc(u.name)}</h2>${statusTag(u.status)}${digital ? '<span class="tag blue">数字员工</span>' : ''}</div><div class="sm muted">${esc(u.account)} · ${digital ? '负责人 ' + userOf(u.owner).name : deptPath(u.dept).join(' / ')}</div></div>`;
  const hint = isDept ? '授予本部门的岗位和角色，部门成员自动获得；选「含下级」时下级部门的成员也获得。'
    : digital ? '数字员工只认直接授给它的角色和岗位，授给部门的对它不生效。'
      : '有效授权 = 直接授给本人的 + 所在部门的 + 上级部门「含下级」的。';
  const table = (kind) => {
    const rows = [...own.map((g) => ({ g, own: true })), ...inherited.map((g) => ({ g, own: false }))].filter((x) => x.g.kind === kind);
    if (!rows.length) return `<div class="card-b sm muted">${kind === 'role' ? '没有角色' : '没有岗位'}</div>`;
    return `<table class="table flat"><tr><th>${kind === 'role' ? '角色' : '岗位'}</th><th>来源</th><th></th></tr>
      ${rows.map(({ g, own: mine }) => `<tr>
        <td><b class="nw">${esc(g.target)}</b><div style="margin-top:3px">${kind === 'role' ? appTag(g.app) : `<span class="xs muted">默认角色：${(posOf(g.target)?.roles || []).map(([a, r]) => r).join('、')}</span>`}</div></td>
        <td class="sm nw">${mine ? (isDept ? `本部门${g.sub ? ' · <span class="tag xs">含下级</span>' : ' · 仅本部门'}` : '直接授权')
          : `继承自 <a data-act="selSubjDept" data-id="${g.sid}">${esc(deptOf(g.sid).name)}</a>${g.sub ? '（含下级）' : ''}`}<div class="xs muted" style="margin-top:3px">${g.by} · ${g.at}</div></td>
        <td class="acts">${mine ? (can('grant.manage') ? `${isDept ? `<button class="btn sm ghost" data-act="toast" data-msg="已改为${g.sub ? '仅本部门' : '含下级部门'}">${g.sub ? '改为仅本部门' : '改为含下级'}</button>` : ''}<button class="btn sm ghost danger" data-act="modal" data-type="revoke" data-id="${g.id}">撤销</button>` : '') : '<span class="xs faint">在来源处管理</span>'}</td></tr>`).join('')}</table>`;
  };
  return `<div class="col" style="gap:14px;min-width:0">
    <div class="card pad"><div class="row" style="gap:12px">${header}
      ${can('grant.manage') ? `<button class="btn" data-act="modal" data-type="grant" data-kind="position">${ic('briefcase')}授予岗位</button><button class="btn primary" data-act="modal" data-type="grant" data-kind="role">${ic('plus')}授予角色</button>` : ''}</div>
      <div class="sm muted" style="margin-top:10px">${hint}</div></div>
    <div class="card"><div class="card-h"><h3>岗位</h3><span class="sm muted">岗位的默认角色随岗位一起生效</span></div>${table('position')}</div>
    <div class="card"><div class="card-h"><h3>角色</h3></div>${table('role')}</div>
    ${!isDept && !digital ? `<div style="text-align:right"><a class="sm" data-go="#/org/users/${u.id}" data-act="userTabPerm">查看他在各应用的有效角色 →</a></div>` : ''}
  </div>`;
}


function positionsPage() {
  return `<div class="page">
    ${head('岗位', can('position.manage') ? `<button class="btn primary" data-act="modal" data-type="position">${ic('plus')}新建岗位</button>` : '', '岗位 = 一组默认角色。把岗位授给人或部门，拿到岗位的人自动拥有它的默认角色。')}
    <table class="table"><tr><th>岗位</th><th>默认角色</th><th>授予给</th><th>持有人</th><th></th></tr>
      ${D.positions.map((p) => `<tr>
        <td><b>${esc(p.name)}</b>${p.desc ? `<div class="xs muted">${esc(p.desc)}</div>` : ''}</td>
        <td><div class="row" style="flex-wrap:wrap;gap:6px">${p.roles.map(([a, r]) => `<span class="chip" style="height:24px;gap:5px">${sq(appOf(a).icon, appOf(a).color, 16)}${esc(r)}</span>`).join('')}</div></td>
        <td class="sm">${p.to.length > 2 ? `${p.to.slice(0, 2).join('、')} 等 ${p.to.length} 个` : p.to.join('、')}</td>
        <td class="sm">${p.holders} 人</td>
        <td class="acts">${can('position.manage') ? `<button class="btn sm ghost" data-act="toast" data-msg="授予岗位：选择人员或部门">授予</button><button class="btn sm ghost" data-act="modal" data-type="position" data-id="${p.id}">编辑</button><button class="ibtn sm" data-pop="pos:${p.id}">${ic('more')}</button>` : ''}</td></tr>`).join('')}
    </table></div>`;
}

/* 数据权限：个人中心「我的数据」（我管理的 / 我可访问的）与 权限「数据」共用 */
function dataPage(where) {
  const mine = D.data.filter((x) => x.mine), access = D.data.filter((x) => x.access);
  const list = where === 'all' ? D.data : S.dataScope === 'mine' ? mine : access;
  const title = where === 'all' ? '数据' : '我的数据';
  const sub = where === 'all' ? '各应用登记的全部数据及其授权（只读）。授权由每条数据的 Owner 管理。' : '';
  return `<div class="page">
    ${head(title, '', sub)}
    <div class="toolbar">${where === 'me' ? seg('dataScope', [['mine', '我管理的', mine.length], ['access', '我可访问的', access.length]]) : ''}
      <select class="select" style="width:200px"><option>全部数据类型</option><option>agent · 智能体</option><option>dataset · 知识库</option><option>flow · 流程</option></select>${searchBox('搜索数据名称或 Id', '', 240)}</div>
    ${list.length ? `<table class="table"><tr><th>数据</th><th>类型</th>${where === 'me' ? '<th>我的权限</th>' : ''}<th>Owner</th><th>授权</th><th>创建</th></tr>
      ${list.map((x) => `<tr class="click" data-act="drawer" data-type="data" data-id="${x.id}">
        <td><b>${esc(x.name)}</b><div class="xs muted mono">${x.did}</div></td>
        <td><div class="row"><span class="tag mono">${x.code}</span>${appTag(x.app)}</div></td>
        ${where === 'me' ? `<td>${levelTag(x.my)}</td>` : ''}
        <td class="sm">${x.owners.length ? x.owners.join('、') : '<span style="color:var(--danger)">无可用 Owner</span>'}</td>
        <td class="sm muted">${x.users} 个人 · ${x.depts} 个组织</td><td class="sm muted">${x.created}</td></tr>`).join('')}</table>`
      : `<div class="card">${empty('database', '还没有数据', S.dataScope === 'mine' ? '在应用里创建智能体、知识库时，你会自动成为它的 Owner' : '还没有人把数据授权给你或你所在的部门')}</div>`}
  </div>`;
}

/* =====================================================================
 * 应用

function appsPage() {
  return `<div class="page">
    ${head('应用目录', `<button class="btn primary" data-act="modal" data-type="newApp">${ic('plus')}接入应用</button>`)}
    <div class="toolbar"><div class="seg"><a class="on">全部<span class="n">${D.apps.length}</span></a><a>已启用</a><a>已停用</a></div>${searchBox('搜索应用名称或编码')}</div>
    <div class="grid">${D.apps.map((a) => `<div class="acard" data-go="#/apps/${a.id}">
      <div class="row">${sq(a.icon, a.color, 40)}<div class="grow"><div class="row"><b class="ellipsis">${esc(a.name)}</b>${a.builtin ? '<span class="tag xs">内置</span>' : a.status === 'disabled' ? '<span class="tag xs">已停用</span>' : ''}</div>
        <div class="xs muted mono">${a.code || '内置应用'}</div></div></div>
      <div class="desc">${esc(a.desc)}</div>
      <div class="foot">${ic('users')}<span>${a.status === 'disabled' ? '不可访问' : a.scopeAll ? '全员' : `${a.scope.map((s) => deptOf(s).name).join('、')} · ${a.users} 人`}</span><span class="sp"></span><span>${a.roles} 个角色 · ${a.ops} 个操作</span></div></div>`).join('')}</div>
  </div>`;
}

function appDetail(id) {
  const a = appOf(id) || D.apps[1];
  const tabOpts = [
    ...(!a.builtin ? [['conf', '接入配置']] : []),
    ['ops', `操作 ${a.ops}`], ['menus', `菜单 ${a.menus}`],
    ...(!a.builtin ? [['dtypes', `数据编码 ${a.dtypes}`]] : []),
  ];
  if (!tabOpts.some(([k]) => k === S.appTab)) S.appTab = tabOpts[0][0];
  const right = a.builtin ? '' : a.status === 'active'
    ? `<button class="btn danger" data-act="modal" data-type="confirm" data-title="停用应用 · ${esc(a.name)}" data-msg="停用后该应用不能再获取接口令牌，已签发的令牌立即失效；角色、菜单与授权全部保留。" data-ok="停用">停用</button>`
    : '<button class="btn primary" data-act="toast" data-msg="已启用，应用可以重新获取接口令牌">启用</button>';
  const body = { conf: appConf, ops: appOps, menus: appMenus, dtypes: appDtypes }[S.appTab](a);
  return `<div class="page">
    ${detailHead('#/apps', sq(a.icon, a.color, 44), a.name, a.builtin ? '本系统 · 操作与菜单随版本发布（只读）' : `${esc(a.desc)} · 接入于 ${a.created}`, a.builtin ? '<span class="tag">内置</span>' : a.status === 'active' ? '<span class="tag success">已启用</span>' : '<span class="tag">已停用</span>', right)}
    ${a.status === 'disabled' ? `<div class="alert warning" style="margin:10px 0 0">${ic('alert')}<span>应用已停用：开放接口拒绝该应用的调用。</span></div>` : ''}
    <div style="margin-top:12px">${tabs('appTab', tabOpts)}</div>
    ${body}
  </div>`;
}

function appConf(a) {
  const all = S.scope[a.id]?.all ?? a.scopeAll;
  const depts = S.scope[a.id]?.depts ?? (a.scope || []);
  const n = all ? D.users.filter((u) => u.status !== 'disabled').length : D.users.filter((u) => u.status !== 'disabled' && depts.some((d) => descIds(d).includes(u.dept))).length;
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
    <div class="col" style="gap:16px">
      <div class="card"><div class="card-h"><h3>应用凭据</h3><span class="tag blue xs">服务端调用开放接口</span></div><div class="card-b">
        <dl class="kv"><dt>应用编码</dt><dd><span class="secret">${a.code}</span><button class="ibtn sm" title="修改">${ic('pencil')}</button><span class="xs muted">内网调用时请求头 X-Caller-App 写它</span></dd>
          <dt>App Key</dt><dd><span class="secret">${a.key}</span><button class="ibtn sm" title="复制" data-act="toast" data-msg="已复制 App Key">${ic('copy')}</button></dd>
          <dt>App Secret</dt><dd><span class="secret">••••••••••••${a.tail}</span><button class="btn sm" data-act="modal" data-type="confirm" data-title="重新生成 Secret · ${esc(a.name)}" data-msg="旧 Secret 及其签发的接口令牌立即失效，应用更新配置前无法调用开放接口。" data-ok="重新生成">${ic('refresh')}重新生成</button></dd>
          <dt>入口地址</dt><dd><span class="secret">${a.url}</span><button class="ibtn sm" title="修改">${ic('pencil')}</button><span class="tag warning xs">新</span></dd></dl>
        <div class="help" style="margin-top:12px">Secret 只在生成时显示一次，只能保存在应用后端。入口地址用于「应用切换」和「我的应用」。</div></div></div>
      <div class="card"><div class="card-h"><h3>开放接口</h3></div><div class="card-b">
        <dl class="kv"><dt>Base URL</dt><dd><span class="secret">/open/v1</span></dd><dt>获取令牌</dt><dd><span class="secret">POST /auth/token</span></dd>
          <dt>主要接口</dt><dd class="sm">用户与部门查询、授权快照（可否访问 / 角色 / 操作码 / 菜单）、实时校验、数据权限</dd></dl></div></div>
    </div>
    <div class="card"><div class="card-h"><h3>可访问范围</h3><span class="sm muted">本租户</span><span class="sp"></span><span class="tag ${n ? 'success' : 'danger'}">当前 ${n} 人可访问</span></div><div class="card-b col" style="gap:10px">
      <div class="radio-card ${all ? 'on' : ''}" data-act="scopeAll" data-id="${a.id}" data-v="1"><span class="r"></span><div><b>全员</b><div class="sm muted">本租户所有未停用的人</div></div></div>
      <div class="radio-card ${!all ? 'on' : ''}" data-act="scopeAll" data-id="${a.id}" data-v="0"><span class="r"></span><div class="grow"><b>指定部门</b><div class="sm muted">含这些部门的下级部门</div>
        ${!all ? `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${depts.map((d) => `<span class="chip">${ic('folder')}${esc(deptOf(d).name)}<span class="x" data-act="scopeDel" data-id="${a.id}" data-d="${d}">${ic('x')}</span></span>`).join('')}
          <a class="chip" data-pop="scopeAdd:${a.id}" style="border-style:dashed">${ic('plus')}添加部门</a></div>
          ${!depts.length ? '<div class="sm" style="color:var(--danger);margin-top:8px">还没选部门：没有人能访问</div>' : ''}` : ''}</div></div>
      <div class="row" style="margin-top:4px"><span class="xs muted">访问不了的人在应用里会看到「没有访问权限」</span><span class="sp"></span><button class="btn primary" data-act="toast" data-msg="已保存，当前 ${n} 人可访问">保存</button></div>
    </div></div>
  </div>`;
}

function appOps(a) {
  const ops = opsOf(a);
  const mods = [...new Set(ops.map((o) => o[0]))];
  const used = (code) => rolesOf(a.id).filter((r) => roleHas(a, r, code)).length;
  return `<div class="toolbar">${searchBox('搜索操作码或名称')}<span class="sp"></span>${can('role.view') ? `<a class="sm" data-act="rolesOfApp" data-id="${a.id}">用这些操作配角色：权限 › 角色 →</a>` : ''}${a.builtin ? '<span class="sm muted">内置应用的操作随版本发布</span>' : `<button class="btn" data-act="toast" data-msg="新增操作：模块、操作码、名称">${ic('plus')}新增操作</button>`}</div>
    <table class="table"><tr><th>操作码</th><th>名称</th><th>来源</th><th>使用它的角色</th><th></th></tr>
      ${mods.map((m) => `<tr class="grp"><td colspan="5">${esc(m)}</td></tr>${ops.filter((o) => o[0] === m).map(([, c, t, src]) => `<tr><td class="mono">${c}</td><td>${esc(t)}</td><td><span class="tag xs ${src === '手动' ? 'warning' : ''}">${src === '上报' ? '应用上报' : src}</span></td><td class="sm">${used(c)} 个</td><td class="acts">${src === '手动' ? `<button class="ibtn sm">${ic('more')}</button>` : ''}</td></tr>`).join('')}`).join('')}
    </table>`;
}

function miniShell(appId, dirs, title) {
  const first = dirs[0];
  return `<div class="mini"><div class="mini-top"><span class="logo">A</span><b style="margin-right:6px">${title}</b>${dirs.map((d, i) => `<span class="p ${i === 0 ? 'on' : ''}">${d.name}</span>`).join('')}<span class="sp"></span>${pav(ME.name, 20)}</div>
    <div class="mini-body"><div class="mini-side">${first ? first.items.map(([t], i) => `<div class="it ${i === 0 ? 'on' : ''}">${t}</div>`).join('') : ''}</div>
      <div class="mini-main"><i style="width:40%;height:14px"></i><i style="width:90%"></i><i style="width:80%"></i><i style="width:85%"></i></div></div></div>`;
}
function appMenus(a) {
  const menus = D.menus[a.id] || [{ name: a.name, icon: a.icon, items: [['首页', '/'], ['设置', '/settings']] }];
  const roles = rolesOf(a.id);
  const role = roles.find((r) => r.id === S.menuRole) || roles[0];
  const visible = menus.filter((d) => !role || !role.menus || role.menus.includes(d.name));
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start">
    <div class="card"><div class="card-h"><h3>菜单</h3><span class="sm muted">目录 = 顶部一级，菜单 = 左侧二级</span><span class="sp"></span>${a.builtin ? '' : `<button class="btn sm" data-act="toast" data-msg="新增菜单：目录或菜单、名称、路由、图标">${ic('plus')}新增</button>`}</div>
      <table class="table flat"><tr><th>名称</th><th>路由</th><th>类型</th><th></th></tr>
        ${menus.map((d) => `<tr><td><div class="row">${ic(d.icon)}<b>${esc(d.name)}</b>${d.tag ? `<span class="tag xs">${d.tag}</span>` : ''}</div></td><td class="faint">—</td><td><span class="tag xs">目录</span></td><td class="acts">${a.builtin ? '' : `<button class="ibtn sm">${ic('more')}</button>`}</td></tr>
          ${d.items.map(([t, p]) => `<tr><td style="padding-left:40px">${esc(t)}</td><td class="mono">${p}</td><td><span class="tag primary xs">菜单</span></td><td class="acts">${a.builtin ? '' : `<button class="ibtn sm">${ic('more')}</button>`}</td></tr>`).join('')}`).join('')}
      </table></div>
    <div class="card" style="position:sticky;top:0"><div class="card-h"><h3>预览</h3><span class="sp"></span><select class="select" style="width:170px;height:30px" data-change="menuRole">${roles.map((r) => `<option value="${r.id}" ${r === role ? 'selected' : ''}>按「${esc(r.name)}」看</option>`).join('')}</select></div>
      <div class="card-b">${miniShell(a.id, visible, a.builtin ? '用户中心' : a.name.replace('Atlas 智能平台', 'Atlas'))}<div class="help">登录人只看到自己角色包含的菜单；目录下没有可见菜单时整个目录不显示。</div></div></div>
  </div>`;
}

function rolesPage() {
  const apps = D.apps.filter((a) => (!S.roleApp || a.id === S.roleApp) && rolesOf(a.id).length);
  const all = apps.flatMap((a) => rolesOf(a.id));
  const cur = all.find((r) => r.id === S.roleSel) || all[0];
  return `<div class="page">
    ${head('角色', can('role.manage') ? `<button class="btn primary" data-act="toast" data-msg="新建角色：选应用，填名称、编码、说明，再勾选操作与菜单">${ic('plus')}新建角色</button>` : '')}
    <div class="split narrow">
      <div class="panel">
        <div class="panel-h"><select class="select" data-change="roleApp"><option value="">全部应用</option>${D.apps.filter((a) => rolesOf(a.id).length).map((a) => `<option value="${a.id}" ${S.roleApp === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
        <div class="panel-b">${apps.map((a) => `<div class="lg-label row" style="gap:6px">${sq(a.icon, a.color, 16)}${esc(a.name)}<span class="sp"></span>${rolesOf(a.id).length}</div>
          ${rolesOf(a.id).map((r) => `<div class="li ${r === cur ? 'on' : ''}" data-act="selRole" data-id="${r.id}"><div class="grow"><div class="row"><b class="sm">${esc(r.name)}</b>${r.builtin ? '<span class="tag xs">内置</span>' : ''}</div><div class="xs muted mono">${r.code}</div></div><span class="xs muted">${r.holders} 人</span></div>`).join('')}`).join('')}</div>
      </div>
      ${cur ? roleCard(cur) : `<div class="card">${empty('badge', '还没有角色', '先在应用的「操作」里登记操作，再新建角色')}</div>`}
    </div></div>`;
}

function roleCard(cur) {
  const a = appOf(cur.app);
  const ops = opsOf(a);
  const has = (c) => roleHas(a, cur, c);
  const mods = [...new Set(ops.map((o) => o[0]))];
  const nOps = ops.filter((o) => has(o[1])).length;
  const menus = D.menus[a.id] || [];
  const holders = D.users.filter((u) => effectiveRoles(u.id).some((x) => x.app === a.id && x.role === cur.name));
  const grants = D.grants.filter((g) => g.kind === 'role' && g.app === a.id && g.target === cur.name);
  const ro = (a.builtin && cur.builtin) || !can('role.manage');
  const dis = ro ? 'disabled' : '';
  const content = {
    ops: `<div class="card-b">${mods.map((m) => { const items = ops.filter((o) => o[0] === m); const n = items.filter((o) => has(o[1])).length; return `<div class="grp">
        <label class="grp-h"><input type="checkbox" data-act="opGroup" data-g="${esc(m)}" ${n === items.length ? 'checked' : ''} ${dis}>${esc(m)}<span class="xs muted" style="font-weight:500">${n}/${items.length}</span></label>
        <div class="opgrid">${items.map(([, c, t]) => `<label class="opt"><input type="checkbox" data-g="${esc(m)}" ${has(c) ? 'checked' : ''} ${dis}><div><div class="sm">${esc(t)}</div><div class="xs muted mono">${c}</div></div></label>`).join('')}</div></div>`; }).join('')}</div>
      ${a.builtin && cur.builtin ? '<div class="savebar"><span class="sm muted">内置角色随版本发布，不能修改</span></div>'
        : !can('role.manage') ? '<div class="savebar"><span class="sm muted">你只能查看角色；修改需要「管理角色」权限</span></div>'
        : `<div class="savebar"><span class="sm muted">保存后，拥有该角色的 ${cur.holders} 人在应用下次刷新授权时生效</span><span class="sp"></span><button class="btn primary" data-act="toast" data-msg="已保存角色「${esc(cur.name)}」的操作权限">保存</button></div>`}`,
    menus: `<div class="card-b">${menus.length ? menus.map((d) => `<div class="grp"><label class="grp-h"><input type="checkbox" ${!cur.menus || cur.menus.includes(d.name) ? 'checked' : ''} ${dis}>${ic(d.icon)}${esc(d.name)}</label>
        <div class="opgrid">${d.items.map(([t, p]) => `<label class="opt"><input type="checkbox" ${!cur.menus || cur.menus.includes(d.name) ? 'checked' : ''} ${dis}><div><div class="sm">${esc(t)}</div><div class="xs muted mono">${p}</div></div></label>`).join('')}</div></div>`).join('') : '<span class="sm muted">该应用没有登记菜单</span>'}</div>`,
    grants: `<div class="card-h" style="border-top:none"><span class="sm muted">直接授予的人和组织；通过岗位获得的见「拥有者」</span><span class="sp"></span>${can('grant.manage') ? `<button class="btn sm primary" data-act="toast" data-msg="授予角色「${esc(cur.name)}」：选择人员或部门">${ic('plus')}授权</button>` : ''}</div>
      ${grants.length ? `<table class="table flat"><tr><th>对象</th><th>范围</th><th>授权人 · 时间</th><th></th></tr>${grants.map((g) => `<tr><td><div class="row">${g.st === 'dept' ? sq('building', '#6366f1', 24) : pav(subjName(g.st, g.sid), 24)}<a data-act="grantFor" data-t="${g.st}" data-id="${g.sid}">${esc(subjName(g.st, g.sid))}</a></div></td><td class="sm">${g.st === 'dept' ? (g.sub ? '含下级部门' : '仅本部门') : '—'}</td><td class="sm muted">${g.by} · ${g.at}</td><td class="acts">${can('grant.manage') ? `<button class="btn sm ghost danger" data-act="modal" data-type="revoke" data-id="${g.id}">撤销</button>` : ''}</td></tr>`).join('')}</table>` : '<div class="card-b sm muted">还没有直接授予</div>'}`,
    holders: holders.length ? `<table class="table flat"><tr><th>拥有者</th><th>来源</th></tr>${holders.map((u) => `<tr><td>${personCell(u)}</td><td class="sm muted">${effectiveRoles(u.id).filter((x) => x.app === a.id && x.role === cur.name).map((x) => esc(x.src)).join('；')}</td></tr>`).join('')}</table>` : '<div class="card-b sm muted">暂无</div>',
  }[S.roleTab];
  return `<div class="card">
      <div class="card-h" style="min-height:68px"><div class="grow"><div class="row"><h2>${esc(cur.name)}</h2><span class="xs muted mono">${cur.code}</span>${cur.builtin ? '<span class="tag xs">内置</span>' : ''}</div>
        <div class="row sm muted" style="margin-top:2px;gap:6px">${appTag(a.id)}<span>·</span><span class="ellipsis">${esc(cur.desc)}</span></div></div>
        ${ro ? '' : `<button class="btn sm" data-act="toast" data-msg="复制为新角色（操作与菜单一起复制）">${ic('copy')}复制</button><button class="btn sm" data-act="toast" data-msg="编辑名称、说明">${ic('pencil')}编辑</button><button class="ibtn sm" data-pop="role">${ic('more')}</button>`}</div>
      ${tabs('roleTab', [['ops', `操作权限 ${nOps}`], ['menus', `菜单权限`], ['grants', `授权 ${grants.length}`], ['holders', `拥有者 ${holders.length}`]], 'inner')}
      ${content}
    </div>`;
}

function appDtypes(a) {
  const list = D.dtypes[a.id] || [];
  return `<div class="toolbar"><span class="sm muted">应用创建数据时登记到这里，创建人自动成为 Owner；Owner 之外的人要经授权才能访问。</span><span class="sp"></span><button class="btn" data-act="toast" data-msg="登记数据编码：编码、名称、说明">${ic('plus')}登记数据编码</button></div>
    ${list.length ? `<table class="table"><tr><th>编码</th><th>名称</th><th>数据条数</th><th>编码级授权</th><th></th></tr>
      ${list.map((t) => `<tr><td class="mono">${t.code}</td><td><b>${esc(t.name)}</b><div class="xs muted">${esc(t.desc)}</div></td><td class="sm">${t.count}</td>
        <td class="sm">${t.typeGrants ? `${t.typeGrants} 条 <span class="xs muted">（如「平台部 · 只读全部智能体」）</span>` : '<span class="faint">无</span>'}</td>
        <td class="acts">${can('data.all') ? `<button class="btn sm" data-act="toast" data-msg="全部数据授权：把「${esc(t.name)}」下的全部数据授给某人 / 某部门（只有超级管理员能做）">${ic('shield')}全部数据授权</button>` : ''}</td></tr>`).join('')}</table>`
      : `<div class="card">${empty('database', '还没有数据编码', '应用需要按条控制访问权限时再登记')}</div>`}`;
}

    ${head('租户', `<button class="btn primary" data-act="modal" data-type="newTenant">${ic('plus')}新建租户</button>`, '每个租户是一个相互隔离的组织空间。这里只管理租户本身与开通的应用，看不到租户内的人员与授权。')}
    <div class="toolbar"><div class="seg"><a class="on">全部<span class="n">${D.tenants.length}</span></a><a>正常</a><a>已到期</a><a>已停用</a></div>${searchBox('搜索租户名称或企业代码')}</div>
    <table class="table"><tr><th>租户 · 企业代码</th><th>状态</th><th>人数 / 配额</th><th>已开通应用</th><th>到期</th><th></th></tr>

        <td>${st(t)}</td>
        <td><div class="quota">${t.max ? `<span class="bar"><i class="${pct >= 90 ? 'warn' : ''}" style="width:${pct}%"></i></span>` : ''}<span class="sm nw">${t.users} / ${t.max ?? '不限'}</span></div></td>
        <td><span class="stack" title="${t.apps.map((a) => appOf(a).name).join('、')}">${t.apps.map((a) => sq(appOf(a).icon, appOf(a).color, 24)).join('')}</span></td>

    </table></div>`;
}

    const edit = m.mode === 'edit';
    return modalShell(edit ? `编辑部门 · ${esc(d.name)}` : `新建子部门 · ${esc(d.name)}`, `<div class="form">
      <div><label class="label">部门名称</label><input class="input" value="${edit ? esc(d.name) : ''}" placeholder="不能包含 /"></div>
      ${edit && d.p ? `<div><label class="label">上级部门</label><select class="select">${D.depts.filter((x) => !descIds(d.id).includes(x.id)).map((x) => `<option ${x.id === d.p ? 'selected' : ''}>${'　'.repeat(deptPath(x.id).length - 1)}${esc(x.name)}</option>`).join('')}</select><div class="help">移动部门会连同子部门和成员一起移动，保存前会显示影响</div></div>` : ''}
      ${edit ? `<div><label class="label">负责人</label><select class="select"><option>不设置</option>${membersOf(d.id, true).filter((u) => u.status !== 'disabled').map((u) => `<option ${u.id === d.leader ? 'selected' : ''}>${esc(u.name)}（${u.account}）</option>`).join('')}</select><div class="help">从本部门及下级部门的人里选；直属上级按负责人计算</div></div>` : '<div class="help" style="margin:0">新部门还没有成员，调入成员后再设置负责人。</div>'}
    </div>`, okBtn('保存', edit ? '部门已保存' : '已新建部门'));
  }
  if (m.type === 'delDept') {
    const d = deptOf(S.orgSel);
    return modalShell(`删除部门 · ${esc(d.name)}`, `<p>确定删除「${deptPath(d.id).join(' / ')}」？</p>
      <div class="col" style="margin-top:12px">${alertBox('warning', '将从「AI TeamFlow」的可访问范围中移除')}${alertBox('warning', '将撤销授予该部门的 2 条角色授权、1 条数据授权')}</div>
      <div class="help">部门里还有人时不能删除，请先把成员调走。</div>`, okBtn('删除', '已删除', 'danger solid'));
  }
  if (m.type === 'changePw') {
    return modalShell('修改密码', `<div class="form">
      <div><label class="label">当前密码</label><input class="input" type="password"></div>
      <div><label class="label">新密码</label><input class="input" type="password" data-input="pw1" value="${esc(S.login.pw1)}"><div class="rules" id="rules">${rulesHtml(S.login.pw1)}</div></div>
      <div><label class="label">确认新密码</label><input class="input" type="password" data-input="pw2" value="${esc(S.login.pw2)}"><div id="match">${matchHtml()}</div></div>
      <div class="help" style="margin:0">修改后，其他设备上的登录会退出。</div></div>`, okBtn('修改', '密码已修改；其他设备上的登录已退出'));
  }
  if (m.type === 'position') {
    const p = m.id && D.positions.find((x) => x.id === m.id);
    const has = (a, r) => p && p.roles.some(([x, y]) => x === a && y === r);
    return modalShell(p ? `编辑岗位 · ${esc(p.name)}` : '新建岗位', `<div class="form">
      <div class="form-2"><div><label class="label">岗位名称</label><input class="input" value="${p ? esc(p.name) : ''}"></div><div><label class="label">说明 <span class="faint" style="font-weight:400">选填</span></label><input class="input" value="${p ? esc(p.desc) : ''}"></div></div>
      <div><span class="label">默认角色</span><div class="help" style="margin:-2px 0 8px">拿到这个岗位的人自动拥有这些角色</div>
        ${D.apps.filter((a) => !a.builtin && a.status === 'active').map((a) => `<div class="grp"><div class="grp-h">${sq(a.icon, a.color, 20)}${esc(a.name)}</div><div class="opgrid">${rolesOf(a.id).map((r) => `<label class="opt"><input type="checkbox" ${has(a.id, r.name) ? 'checked' : ''}><span class="sm">${esc(r.name)}</span></label>`).join('')}</div></div>`).join('')}</div>
    </div>`, okBtn('保存', '岗位已保存'), true);
  }

    return modalShell('接入应用', `<div class="form">
      <div class="form-2"><div><label class="label">应用名称</label><input class="input" placeholder="如 客户管理"></div><div><label class="label">应用编码</label><input class="input mono" placeholder="如 crm"><div class="help">内网调用时 X-Caller-App 写它，创建后不建议改</div></div></div>

      <div><label class="label">说明</label><input class="input" placeholder="一句话说明这个应用做什么"></div>
      <div class="help" style="margin:0">创建后生成 App Key / Secret；可访问范围默认「无人可访问」，在「接入配置」里设置。</div></div>`,
      `<button class="btn" data-act="closeModal">取消</button><button class="btn primary" data-act="modal" data-type="once" data-kind="newApp">创建</button>`);
  }

    return modalShell('新建租户', `<div class="form">

      <div class="form-2"><div><label class="label">人数上限 <span class="faint" style="font-weight:400">选填</span></label><input class="input" placeholder="不填 = 不限"></div><div><label class="label">到期日 <span class="faint" style="font-weight:400">选填</span></label><input class="input" type="date"></div></div>
      <div class="divider" style="margin:4px 0"></div><b class="sm">首个管理员</b>
      <div class="form-2"><div><label class="label">账号</label><input class="input mono" value="admin"></div><div><label class="label">姓名</label><input class="input"></div></div>

  }
  if (m.type === 'confirm') {
    return modalShell(m.title, `<p>${m.msg}</p>`, okBtn(m.ok, `已${m.ok}`, 'danger solid'));
  }
  return '';
}

function drawerShell(title, body, foot) {
  return `<div class="drawer-mask" data-act="closeDrawer"></div><div class="drawer">
    <div class="modal-h">${title}<span class="sp"></span><button class="ibtn sm" data-act="closeDrawer">${ic('x')}</button></div>
    <div class="drawer-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
}
function drawer() {
  const d = S.drawer;
  if (!d) return '';
  if (d.type === 'data') {
    const x = D.data.find((y) => y.id === d.id);
    const owner = x.my === 'OWNER';
    const creator = D.users.find((u) => u.name === (x.owners[0] || '马超'));
    const acl = [
      { t: 'user', id: creator.id, level: 'OWNER', sub: false, by: '系统（创建人）', at: x.created },
      { t: 'dept', id: 'plat', level: 'READ', sub: true, by: creator.name, at: '11-02' },
      owner ? { t: 'user', id: 'u3', level: 'WRITE', sub: false, by: '周景行', at: '11-05' } : { t: 'user', id: 'u1', level: x.my, sub: false, by: creator.name, at: '11-05' },
    ];
    return drawerShell(`<div class="row" style="gap:10px">${sq(x.code === 'agent' ? 'bot' : x.code === 'flow' ? 'flow' : 'book', '#6366f1', 34)}<div><h2>${esc(x.name)}</h2><div class="xs muted"><span class="mono">${x.code}</span> · ${appOf(x.app).name} · <span class="mono">${x.did}</span></div></div></div>`, `
      ${owner ? '' : `<div style="margin-bottom:14px">${alertBox('plain', `你对它的权限是「${LEVEL[x.my][0]}」。只有 Owner 能修改授权。`)}</div>`}
      <div class="row" style="margin-bottom:8px"><h3>授权</h3><span class="sm muted">${acl.length} 条</span><span class="sp"></span>${owner ? `<button class="btn sm primary" data-act="toast" data-msg="添加授权：选人或部门 + 只读 / 读写 / Owner">${ic('plus')}添加授权</button>` : ''}</div>
      <table class="table"><tr><th>对象</th><th>权限</th><th>授权人 · 时间</th><th></th></tr>
        ${acl.map((a) => `<tr><td><div class="row">${a.t === 'dept' ? sq('building', '#6366f1', 24) : pav(subjName('user', a.id), 24)}<span>${esc(subjName(a.t, a.id))}</span>${a.sub ? '<span class="tag xs">含下级</span>' : ''}${a.t === 'user' && userOf(a.id).status === 'disabled' ? '<span class="tag warning xs">已停用</span>' : ''}</div></td>
          <td>${owner && a.by.indexOf('创建人') < 0 ? `<select class="select" style="width:96px;height:28px">${Object.entries(LEVEL).map(([k, [t]]) => `<option ${k === a.level ? 'selected' : ''}>${t}</option>`).join('')}</select>` : levelTag(a.level)}</td>
          <td class="xs muted">${a.by} · ${a.at}</td><td class="acts">${owner && a.by.indexOf('创建人') < 0 ? `<button class="ibtn sm" title="撤销" data-act="toast" data-msg="已撤销">${ic('x')}</button>` : ''}</td></tr>`).join('')}</table>
      ${owner ? '<div class="help">至少保留一个 Owner；Owner 之间权限相同。</div>' : ''}
      <div class="row" style="margin:20px 0 8px"><h3>实际可访问的人</h3><span class="sm muted">按授权自动计算，多个来源取最高级别</span></div>
      <div class="card">${['周景行', '王芳', '高原', '陈晨'].map((n, i) => `<div class="row" style="padding:9px 14px;border-bottom:1px solid var(--line-2)">${pav(n, 26)}<span class="grow">${n}</span><span class="xs muted">${['创建人', '直接授权', '平台部（含下级）', '平台部（含下级）'][i]}</span>${levelTag(['OWNER', 'WRITE', 'READ', 'READ'][i])}</div>`).join('')}<div class="row sm muted" style="padding:9px 14px">还有 2 人</div></div>`);
  }
  if (d.type === 'tenantApps') {
    const t = D.tenants.find((x) => x.id === d.id);
    return drawerShell(`<h2>开通应用 · ${esc(t.name)}</h2>`, `
      <p class="sm muted" style="margin-bottom:14px">开通后，租户管理员在「应用 › 接入配置」里设置本租户内谁能访问。</p>
      <div class="card">${D.apps.filter((a) => !a.builtin).map((a) => `<div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line-2);gap:12px">${sq(a.icon, a.color, 34)}<div class="grow"><b>${esc(a.name)}</b><div class="xs muted">${t.apps.includes(a.id) ? '已开通 · 本租户 ' + Math.min(t.users, 12) + ' 人可访问' : esc(a.desc)}</div></div>${a.status === 'disabled' ? '<span class="tag xs">应用已停用</span>' : `<span class="switch ${t.apps.includes(a.id) ? 'on' : ''}" data-act="toggleSwitch"></span>`}</div>`).join('')}</div>`,
      `<button class="btn" data-act="closeDrawer">取消</button><button class="btn primary" data-act="toastClose" data-msg="已保存「${esc(t.name)}」的开通应用">保存</button>`);
  }
  return '';
}

function overlays() {
  let pop = '';
  if (S.pop) pop = `<div class="pop" style="position:fixed;left:${S.pop.x}px;top:${S.pop.y}px;max-height:calc(100vh - ${S.pop.y + 12}px);overflow-y:auto" data-stop>${popContent(S.pop.id)}</div>`;
  return pop + modal() + drawer();
}

  if (r.p === 'apps') return N('应用 · 应用目录', [
    '应用用卡片（同 Atlas 智能体卡片）：编码、说明、可访问范围、角色与操作数（角色在「权限 › 角色」里配）',
    '左侧直接列出全部应用，配置几个应用时不用来回返回列表',
    '接入应用：名称、编码、入口地址、说明 → 生成 App Key / Secret（只显示一次，可一键复制）',
  ], ['应用加「入口地址」字段（应用切换、我的应用要用）']);
  if (r.p === 'tenants') return N('租户（仅平台租户）', [
    '一张表看全：企业代码、状态（正常 / 已到期 / 已停用）、人数与配额条（≥90% 变色）、已开通应用',
    '开通应用用右侧抽屉，每个应用一个开关',
    '新建租户后弹窗给出首个管理员的整段登录信息，一键复制',
    '注销是不可恢复操作：收进「…」，确认时输入企业代码',
  ]);
  if (r.p === 'me' && r.a === 'security') return N('个人中心 · 账号安全', [
    '修改密码改成弹窗，规则逐条打勾；改完提示「其他设备已退出」',
    '最近登录：时间、登录到哪个应用、设备、IP、结果；失败的也列出，便于本人发现异常',
  ], ['新增 /me/login-logs（现在只有管理员看别人的 /users/{id}/login-logs）', '登录记录加「登录到」（按 next 记）和设备（解析 User-Agent）']);
  if (r.p === 'me' && r.a === 'apps') return N('个人中心 · 我的应用', [
    '我能访问的应用，点「打开」进入；与右上角应用切换同一份数据',
  ], ['应用「入口地址」字段'], ['现在只列名字和说明，不能点开']);
  if (r.p === 'me') return N('个人中心 · 个人资料', [
    '个人中心对所有人可见，放顶部最后一个；普通员工进用户中心只看到它（头像菜单切到「普通员工」看效果）',
    '姓名、部门、岗位只读并注明「由管理员维护」；邮箱、手机可改',
    '直属上级按组织架构计算，直接显示',
  ], [], ['原来个人信息、改密码、可访问应用挤在一页两栏']);
  return N('', []);
}

function loginDemo() {
  const L = S.login;
  const row = (label, key, opts) => `<div class="dl">${label}</div><div class="opts">${opts.map(([k, t]) => `<a class="${L[key] === k ? 'on' : ''}" data-act="loginSet" data-k="${key}" data-v="${k}">${t}</a>`).join('')}</div>`;
  return `<div class="demo"><b style="font-size:12px;color:#92400e">演示控制</b>
    ${row('部署', 'tenants', [['single', '单租户'], ['remembered', '多租户 · 记住上次'], ['new', '多租户 · 首次']])}
    ${row('从哪来', 'from', [['atlas', 'Atlas'], ['teamflow', 'TeamFlow'], ['direct', '直接打开']])}
    ${row('点「登录」的结果', 'result', [['ok', '成功'], ['first', '首次登录'], ['must', '须改密'], ['failed', '密码错误'], ['locked', '已锁定'], ['disabled', '已停用'], ['tenant', '企业停用'], ['temp', '临时密码过期']])}
    <div class="dl">其他</div><div class="opts"><a class="${L.expired ? 'on' : ''}" data-act="loginToggle" data-k="expired">登录已过期跳来</a><a class="${L.caps ? 'on' : ''}" data-act="loginToggle" data-k="caps">大写锁定</a></div></div>`;
}

function notesPanel(r) {
  const n = notesFor(r);
  if (!n.items.length) return '';
  return `<div class="notes"><div class="row"><b style="color:#92400e">${ic('bulb')} ${n.title}</b><span class="sp"></span><button class="ibtn sm" data-act="toggleNotes">${ic('x')}</button></div>
    ${r.p === 'login' ? loginDemo() : ''}
    <h4>设计要点</h4><ul>${n.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
    ${n.be.length ? `<h4>需要后端配合</h4><ul>${n.be.map((i) => `<li><span class="be">后端</span>${esc(i)}</li>`).join('')}</ul>` : ''}
    ${n.diff.length ? `<h4>与现状的差异</h4><ul>${n.diff.map((i) => `<li><span class="diff">现状</span>${esc(i)}</li>`).join('')}</ul>` : ''}
    ${r.p !== 'login' ? `<h4>全局</h4><ul>${GLOBAL_NOTES.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
    <h4>导航</h4><div class="nav"><a href="#/ia">信息架构 · 现状对照 · 页面导览</a>${r.p === 'login' ? '<a data-act="doLoginOk">跳过登录，进入管理台 →</a>' : '<a href="#/login">回到登录页</a>'}</div>
    <div class="xs" style="color:#a8a29e;margin-top:10px">右上角「设计说明」可关闭；头像菜单可切换演示身份</div></div>`;
}

/* =====================================================================
 * 交互
 * ===================================================================== */
const ACT = {
  toggleNotes: () => { S.notes = !S.notes; },
  collapse: () => { S.collapsed = !S.collapsed; },
  toast: (el) => { S.pop = null; toast(el.dataset.msg || '（原型）'); return false; },
  toastClose: (el) => { S.modal = null; S.drawer = null; toast(el.dataset.msg); return false; },
  setS: (el) => { S[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'subjMode') S.subj = el.dataset.v === 'dept' ? { type: 'dept', id: 'rd' } : { type: 'user', id: 'u1' }; },
  role: (el) => { S.role = el.dataset.v; S.pop = null; const r = parseRoute(); const p = PLATFORMS.find((x) => x.id === r.p); if (!p || !p.vis()) location.hash = '#/' + landing(); },
  logout: () => { S.login.step = 'form'; S.login.err = ''; go('#/login'); return false; },
  // 部门树
  toggleTree: (el) => { S.treeOpen[el.dataset.id] = !S.treeOpen[el.dataset.id]; },
  selDept: (el) => { S.orgSel = el.dataset.id; S.treeOpen[deptOf(el.dataset.id).p] = true; },
  orgSub: () => { S.orgSub = !S.orgSub; },
  grantFor: (el) => { S.subjMode = el.dataset.t; S.subj = { type: el.dataset.t, id: el.dataset.id }; S.pop = null; go('#/perm/grants'); return false; },
  selSubjDept: (el) => { S.subjMode = 'dept'; S.subj = { type: 'dept', id: el.dataset.id }; },
  selSubjUser: (el) => { S.subj = { type: 'user', id: el.dataset.id }; },
  userTabPerm: () => { S.userTab = 'perm'; },
  // 应用
  selRole: (el) => { S.roleSel = el.dataset.id; },
  rolesOfApp: (el) => { S.roleApp = el.dataset.id; S.roleSel = rolesOf(el.dataset.id)[0]?.id; go('#/perm/roles'); return false; },
  scopeAll: (el) => { const a = appOf(el.dataset.id); const cur = S.scope[a.id] || { all: a.scopeAll, depts: [...(a.scope || [])] }; cur.all = el.dataset.v === '1'; S.scope[a.id] = cur; },
  scopeDel: (el) => { const a = appOf(el.dataset.id); const cur = S.scope[a.id] || { all: a.scopeAll, depts: [...(a.scope || [])] }; cur.depts = cur.depts.filter((d) => d !== el.dataset.d); S.scope[a.id] = cur; },
  scopeAdd: (el) => { const a = appOf(el.dataset.id); const cur = S.scope[a.id] || { all: a.scopeAll, depts: [...(a.scope || [])] }; if (!cur.depts.includes(el.dataset.d)) cur.depts.push(el.dataset.d); S.scope[a.id] = cur; S.pop = null; },
  opGroup: (el) => { document.querySelectorAll(`input[data-g="${el.dataset.g}"]`).forEach((x) => { if (x !== el) x.checked = el.checked; }); return false; },
  toggleSwitch: (el) => { el.classList.toggle('on'); return false; },
  // 浮层
  modal: (el) => { S.pop = null; S.modal = { ...el.dataset }; if (el.dataset.type === 'changePw') { S.login.pw1 = ''; S.login.pw2 = ''; } },
  closeModal: () => { S.modal = null; },
  drawer: (el) => { S.drawer = { ...el.dataset }; },
  closeDrawer: () => { S.drawer = null; },
  // 登录
  togglePw: () => { S.login.showPw = !S.login.showPw; },
  tenantChange: () => { S.login.tenants = 'new'; },
  loginSet: (el) => { S.login[el.dataset.k] = el.dataset.v; S.login.err = ''; S.login.step = 'form'; },
  loginToggle: (el) => { S.login[el.dataset.k] = !S.login[el.dataset.k]; },
  loginBack: () => { S.login.step = 'form'; S.login.pw1 = ''; S.login.pw2 = ''; },
  doLogin: () => {
    const L = S.login;
    L.expired = false;
    if (LOGIN_ERR[L.result]) { L.err = L.result; return; }
    L.err = '';
    if (L.result === 'first' || L.result === 'must') { L.step = 'setpw'; L.pw1 = ''; L.pw2 = ''; S.refocus = { sel: '[data-input="pw1"]', pos: 0 }; return; }
    ACT.doLoginOk(); return false;
  },
  doSetPw: () => { S.login.step = 'form'; ACT.doLoginOk(); return false; },
  doLoginOk: () => {
    const t = FROM[S.login.from];
    S.toast = t ? `登录成功，正在返回 ${t}…（原型里进入用户中心）` : '登录成功';
    clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2200);
    go('#/' + landing()); return false;
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-go],[data-pop]');
  if (!el) { if (S.pop && !e.target.closest('[data-stop]')) { S.pop = null; render(); } return; }
  if (el.dataset.act === 'closeModal' && el.classList.contains('mask') && e.target !== el) return; // 点在弹窗内部
  if (el.tagName !== 'INPUT') e.preventDefault();
  if (S.pop && !el.dataset.pop && !el.closest('.pop')) S.pop = null;
  if (el.dataset.pop) {
    const id = el.dataset.pop;
    if (S.pop?.id === id) { S.pop = null; return render(); }
    const rc = el.getBoundingClientRect();
    const w = id === 'apps' ? 314 : 240;
    const x = Math.max(12, Math.min(rc.left, window.innerWidth - w - 12));
    S.pop = { id, x, y: rc.bottom + 6 }; return render();
  }
  if (el.dataset.go && !el.dataset.act) return go(el.dataset.go);
  const fn = ACT[el.dataset.act];
  if (fn) { if (fn(el, e) !== false) render(); if (el.dataset.go) go(el.dataset.go); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (S.modal || S.drawer || S.pop)) { S.modal = null; S.drawer = null; S.pop = null; render(); }
  if (e.key === 'Enter' && e.target.dataset?.enter === 'login') { ACT.doLogin(); render(); }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset?.input; if (!k) return;
  if (k === 'pw1' || k === 'pw2') {
    // 只局部更新，不整页重绘（保住输入焦点）
    S.login[k] = e.target.value;
    const rules = document.getElementById('rules'); if (rules) rules.innerHTML = rulesHtml(S.login.pw1);
    const match = document.getElementById('match'); if (match) match.innerHTML = matchHtml();
    const btn = document.getElementById('setpwBtn'); if (btn) btn.disabled = !pwOk();
    return;
  }
  S[k] = e.target.value; S.refocus = { sel: `[data-input="${k}"]`, pos: e.target.selectionStart }; render();
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset?.change; if (!k) return;
  if (k === 'userDept') S.userDept = e.target.value;
  if (k === 'menuRole') S.menuRole = e.target.value;
  if (k === 'roleApp') { S.roleApp = e.target.value; S.roleSel = (S.roleApp ? rolesOf(S.roleApp)[0] : D.roles[0])?.id; }
  render();
});

function afterRender() {
  if (S.refocus) { const el = document.querySelector(S.refocus.sel); if (el) { el.focus(); el.setSelectionRange?.(S.refocus.pos, S.refocus.pos); } S.refocus = null; }
}

render();
</script>
</body>
</html>
