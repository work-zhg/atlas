<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas · 我的工作空间 — 原型</title>
<style>
/* 视觉与 atlas-console.html 一致（同一套浅色设计 token） */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd; --hover: #f2f4f8;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff; --primary-ink: #4338ca;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #d97706; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --radius: 12px; --radius-sm: 8px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 52px; --sider-w: 248px; --sider-w-min: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); }
h1 { font-size: 20px; font-weight: 650; }
p { margin: 0; }
code { font-family: var(--mono); font-size: 12px; background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.sm { font-size: 12.5px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { flex: 1; }
.hide { display: none !important; }
mark { background: #fff1a8; color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------- 顶栏 / 左侧菜单（同控制台） ---------- */
.top { height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px 0 14px; gap: 20px; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; display: grid; place-items: center; font-size: 14px; }
.pnav { display: flex; gap: 2px; height: 100%; }
.pnav a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--ink-2); font-weight: 550; position: relative; }
.pnav a:hover { color: var(--ink); background: var(--hover); }
.pnav a.on { color: var(--primary-ink); }
.pnav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 650; flex: none; }
.avatar.sq { border-radius: 7px; }
.body { display: flex; height: calc(100vh - var(--top-h)); }
.sider { width: var(--sider-w); flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; }
.sider.min { width: var(--sider-w-min); }
.sider-top { padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.snav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 520; white-space: nowrap; cursor: pointer; }
.snav:hover { background: var(--hover); color: var(--ink); }
.snav.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.sider.min .snav { justify-content: center; padding: 0; }
.sider.min .snav span, .sider.min .new-chat span { display: none; }
.new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; cursor: pointer; margin-bottom: 8px; box-shadow: var(--shadow-xs); white-space: nowrap; color: var(--ink); }
.new-chat:hover { background: var(--hover); }
.hist { flex: 1; overflow-y: auto; padding: 4px 10px 10px; border-top: 1px solid var(--line-2); margin-top: 6px; }
.hist-head { padding: 8px 6px 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.hist-item { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); cursor: pointer; font-size: 13.5px; }
.hist-item:hover { background: var(--hover); }
.hist-item.on { background: var(--primary-weak); color: var(--primary-ink); }
.hist-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.run { background: var(--success); box-shadow: 0 0 0 3px var(--success-weak); }
.sider-foot { border-top: 1px solid var(--line-2); padding: 8px 10px; }
.main { flex: 1; min-width: 0; position: relative; background: var(--surface); }
.page { padding: 22px 32px 80px; max-width: 1180px; margin: 0 auto; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; min-height: 40px; }

/* ---------- 通用组件 ---------- */
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 550; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: #cfd3dd; background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.ibtn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: none; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.ibtn.sm { width: 26px; height: 26px; }
.ibtn[disabled] { opacity: .35; cursor: not-allowed; }
.input { height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 11px; background: var(--surface); outline: none; width: 100%; }
.input:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-weak); }
.search { position: relative; }
.search > svg { position: absolute; left: 10px; top: 9px; color: var(--ink-4); }
.search .input { padding-left: 32px; padding-right: 30px; }
.search .clr { position: absolute; right: 4px; top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.switch { display: inline-block; vertical-align: middle; width: 32px; height: 18px; border-radius: 9px; background: #d5d9e2; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 16px; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-height: 34px; flex-wrap: wrap; }
.empty { text-align: center; padding: 64px 20px; color: var(--ink-3); }
.empty .ill { width: 56px; height: 56px; border-radius: 16px; background: var(--primary-weak); color: var(--primary); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .ill svg { width: 26px; height: 26px; }
.empty h3 { margin-bottom: 6px; font-size: 15px; }
.spin { width: 14px; height: 14px; border: 2px solid #c7cbf6; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 浮层 / 弹窗 / 提示 */
.pop { position: fixed; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; min-width: 196px; }
.pop .mi { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.pop .mi:hover { background: var(--hover); color: var(--ink); }
.pop .mi.danger { color: var(--danger); }
.pop .mi.on { color: var(--primary-ink); }
.pop .sep { height: 1px; background: var(--line-2); margin: 5px 4px; }
.pop .ph { font-size: 11.5px; color: var(--ink-4); padding: 6px 10px 2px; }
.mask { position: fixed; inset: 0; background: rgba(15,23,42,.36); z-index: 80; display: grid; place-items: center; }
.modal { background: var(--surface); border-radius: 14px; width: 480px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal-h { display: flex; align-items: center; padding: 16px 20px 6px; font-weight: 650; font-size: 15.5px; }
.modal-b { padding: 8px 20px 16px; overflow-y: auto; color: var(--ink-2); }
.modal-f { padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 8px; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.err { font-size: 12.5px; color: var(--danger); margin-top: 6px; }
.warnbox, .infobox { display: flex; gap: 8px; border-radius: 9px; padding: 9px 11px; font-size: 13px; margin-top: 12px; }
.warnbox { background: var(--warning-weak); color: #92400e; }
.warnbox.danger { background: var(--danger-weak); color: #991b1b; }
.infobox { background: var(--primary-weak); color: var(--primary-ink); }
.warnbox svg, .infobox svg { margin-top: 2px; }
.names { margin: 10px 0 0; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 9px; font-size: 13px; }
.names div { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
.ck { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer; font-size: 13px; user-select: none; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: var(--shadow-md); max-width: 560px; }

/* ---------- 设计说明（评审用，非产品界面） ---------- */
.notes { width: 300px; flex: none; overflow-y: auto; background: #fffdf3; border-left: 1px solid #f3e3a6; padding: 14px 16px; font-size: 13px; }
.notes h4 { font-size: 13px; margin: 12px 0 4px; color: #92400e; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 3px 0; color: #57534e; }
.notes .be { display: inline-block; font-size: 11px; background: #fde68a; color: #92400e; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
.notes .q { display: inline-block; font-size: 11px; background: #fecaca; color: #991b1b; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
.notes .btn { width: 100%; justify-content: flex-start; background: #fffbea; border-color: #f3e3a6; color: #92400e; }

/* ---------- 工作空间 ---------- */
.ws { display: flex; height: 100%; }
.ws-list { flex: 1; min-width: 0; overflow-y: auto; }
.usage { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.usage b { color: var(--ink-2); font-weight: 600; }
.crumbs { display: flex; align-items: center; gap: 1px; min-width: 0; font-size: 18px; font-weight: 650; overflow: hidden; }
.crumbs a { color: var(--ink-3); padding: 2px 6px; border-radius: 6px; white-space: nowrap; min-width: 0; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; }
.crumbs a:hover { background: var(--hover); color: var(--ink); }
.crumbs .s { color: var(--ink-4); display: inline-flex; flex: none; }
.crumbs .cur { color: var(--ink); padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs a:first-child { padding-left: 0; }
.pvopen .page-head .search { display: none; }
.metarow { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 13px; margin: -6px 0 16px; flex-wrap: wrap; }

.ft { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.ft th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.ft th.s { cursor: pointer; }
.ft th.s:hover { color: var(--ink); }
.ft th .ar { display: inline-flex; vertical-align: -3px; }
.ft td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; font-size: 13.5px; }
.ft tr.click td { cursor: pointer; }
.ft tbody tr:hover td { background: var(--surface-2); }
.ft tr.sel td { background: #f6f6ff; }
.ft tr.cur td { background: var(--primary-weak) !important; }
.ft .c-cb { width: 40px; padding-right: 0; }
.ft .c-size { width: 100px; color: var(--ink-3); }
.ft .c-time { width: 116px; color: var(--ink-3); }
.ft .c-loc { width: 240px; }
.ft .c-ops { width: 112px; text-align: right; white-space: nowrap; padding-right: 6px; }
.ft td.c-ops .ibtn { opacity: 0; }
.ft tr:hover td.c-ops .ibtn, .ft tr.cur td.c-ops .ibtn { opacity: 1; }
.ft td.c-ops .ibtn.chat { color: var(--primary); }
.pvopen .ft .c-time { display: none; }
.pvopen .page { padding-left: 24px; padding-right: 24px; }
.nm { display: flex; align-items: center; gap: 10px; min-width: 0; }
.nm .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm .sub { font-size: 12px; color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #c5cad6; background: #fff; display: inline-grid; place-items: center; cursor: pointer; vertical-align: middle; color: #fff; }
.cb svg { width: 12px; height: 12px; stroke-width: 3; }
.cb.on, .cb.part { background: var(--primary); border-color: var(--primary); }
.cb.part::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 1px; }
.lockt { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--ink-4); font-weight: 500; white-space: nowrap; }
.lockt svg { width: 12px; height: 12px; }

/* 文件类型图标 */
.fi { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--line-2); color: var(--ink-3); }
.fi svg { width: 16px; height: 16px; }
.fi.sm { width: 26px; height: 26px; border-radius: 7px; }
.fi.sm svg { width: 14px; height: 14px; }
.fi.dir { background: #fff3d6; color: #c98a04; }
.fi.md { background: var(--primary-weak); color: var(--primary); }
.fi.code { background: var(--secondary-weak); color: #0369a1; }
.fi.img { background: #fdeaf4; color: #db2777; }
.fi.pdf { background: var(--danger-weak); color: var(--danger); }
.fi.sheet { background: var(--success-weak); color: var(--success); }
.fi.html { background: #fff0e5; color: #ea580c; }
.fi.json { background: #fef7dc; color: #b45309; }
.fi.doc { background: #e8f0fe; color: #1d4ed8; }

/* 右侧预览 */
.pv { width: 50%; min-width: 420px; max-width: 920px; flex: none; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.pv-h { height: 54px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line-2); }
.pv-h .nm2 { min-width: 0; flex: 1; }
.pv-h .nm2 .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-h .nm2 .m { font-size: 12px; color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
.seg a { padding: 2px 10px; border-radius: 6px; color: var(--ink-3); font-weight: 550; font-size: 12.5px; }
.seg a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
.pv-b { flex: 1; min-height: 0; overflow: auto; position: relative; }
.pv-tip { display: flex; align-items: center; gap: 8px; padding: 7px 14px; background: var(--warning-weak); color: #92400e; font-size: 12.5px; position: sticky; top: 0; left: 0; z-index: 1; }
.pv-msg { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ink-3); padding: 40px; text-align: center; }
.pv-msg .fi { width: 56px; height: 56px; border-radius: 16px; }
.pv-msg .fi svg { width: 26px; height: 26px; }
.pv-code { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; padding: 10px 0 30px; min-width: max-content; }
.pv-code .l { display: flex; }
.pv-code .n { width: 52px; flex: none; text-align: right; padding-right: 16px; color: #b6bdca; user-select: none; }
.pv-code .c { white-space: pre; padding-right: 24px; }
.tk { color: #7c3aed; } .ts { color: #047857; } .tc { color: #94a3b8; font-style: italic; } .tn { color: #c2410c; }
.pv-md { padding: 26px 34px 60px; max-width: 820px; font-size: 14.5px; line-height: 1.8; }
.pv-md h1 { font-size: 22px; margin: 0 0 14px; }
.pv-md h2 { font-size: 17px; margin: 24px 0 10px; }
.pv-md h3 { font-size: 15px; margin: 18px 0 8px; }
.pv-md p { margin: 0 0 12px; }
.pv-md ul, .pv-md ol { margin: 0 0 12px; padding-left: 22px; }
.pv-md li { margin: 3px 0; }
.pv-md table { border-collapse: collapse; margin: 6px 0 14px; font-size: 13.5px; }
.pv-md th, .pv-md td { border: 1px solid var(--line); padding: 6px 12px; }
.pv-md th { background: var(--surface-2); }
.pv-md img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; display: block; }
.pv-md pre { background: #f6f7fb; border: 1px solid var(--line-2); padding: 10px 12px; border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: 12.5px; }
.pv-md blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--ink-3); }
.pv-md hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.pv-img { min-height: 100%; display: grid; place-items: center; padding: 28px; background-color: #f1f2f6; background-image: linear-gradient(45deg, #e7e9ef 25%, transparent 25%, transparent 75%, #e7e9ef 75%), linear-gradient(45deg, #e7e9ef 25%, transparent 25%, transparent 75%, #e7e9ef 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
.pv-img img { max-width: 100%; box-shadow: var(--shadow-md); border-radius: 4px; background: #fff; }
.pv-frame { width: 100%; height: 100%; border: none; display: block; background: #fff; }
.pv-pdf { min-height: 100%; background: #525659; padding: 24px; }
.pv-pdf .pg { background: #fff; max-width: 600px; margin: 0 auto 18px; aspect-ratio: 1 / 1.414; padding: 52px 56px; box-shadow: 0 2px 10px rgba(0,0,0,.3); font-size: 12px; line-height: 1.85; color: #1f2937; overflow: hidden; }
.pv-pdf .pg h2 { font-size: 15px; margin: 14px 0 6px; }
.pv-pdf .pn { text-align: center; color: #cbd0d8; font-size: 12px; margin: -8px 0 16px; }
.pv-csv { padding: 14px; }
.pv-csv table { border-collapse: collapse; font-size: 12.5px; }
.pv-csv th, .pv-csv td { border: 1px solid var(--line); padding: 4px 10px; white-space: nowrap; }
.pv-csv th { background: var(--surface-2); position: sticky; top: 0; font-weight: 600; }
.pv-csv td.num { text-align: right; font-variant-numeric: tabular-nums; }
.pv-csv .rn { color: var(--ink-4); background: var(--surface-2); text-align: right; }

/* 上传 */
.upq { position: fixed; right: 20px; bottom: 20px; width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 65; overflow: hidden; }

import time

import httpx

from parser import parse_list

CONFIG = json.load(open("crawler/config.json"))


def crawl(page: int) -> list[dict]:
    resp = httpx.get(CONFIG["base_url"], params={"page": page}, timeout=10)
    resp.raise_for_status()
    return parse_list(resp.text)


def main() -> None:
    with open("data/items.jsonl", "w", encoding="utf-8") as out:
        for page in range(1, CONFIG["max_pages"] + 1):
            for item in crawl(page):
                out.write(json.dumps(item, ensure_ascii=False) + "\\n")
            time.sleep(CONFIG["delay"])


if __name__ == "__main__":
    main()`,

  if (kindOf(p) === 'md') return `# ${n}\n\n（示例内容）`;
  if (kindOf(p) === 'csv') return 'name,value\na,1\nb,2';
  return `# ${n}\n# （示例内容）`;
}
function imgUrl(p) {
  if (S.blobs[p]) return (S.urls[p] ||= URL.createObjectURL(S.blobs[p]));
  if (IMG[p]) return dataUrl(IMG[p]());
  return dataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300"><rect width="480" height="300" fill="#eef0f4"/><text x="240" y="156" font-size="15" font-family="sans-serif" fill="#94a3b8" text-anchor="middle">${esc(base(p))}</text></svg>`);
}
function resolvePath(dir, href) {
  const out = dir ? dir.split('/') : [];
  for (const s of href.replace(/^\.\//, '').split('/')) { if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); }
  return out.join('/');
}

/** 没选目录时新建的工作目录：对话/{开始时间}；要同时避开已有目录和别的对话记录里的路径（目录写了文件才会出现） */
function autoDir() {
  const d = new Date(NOW + (Date.now() - LOADED));
  const name = `${ymd(d)} ${pad(d.getHours())}.${pad(d.getMinutes())}`;
  const taken = (p) => isDirPath(p) || exists(p) || THREADS.some((t) => inside(t.dir, p));
  let p = `${AUTO_ROOT}/${name}`;
  for (let i = 2; taken(p); i++) p = `${AUTO_ROOT}/${name} (${i})`;
  return p;
}
function uniqueName(p) {
  const d = parent(p), n = base(p), dot = n.lastIndexOf('.');
  const stem = dot > 0 ? n.slice(0, dot) : n, ext = dot > 0 ? n.slice(dot) : '';
  for (let i = 1; ; i++) { const c = join(d, `${stem} (${i})${ext}`); if (!exists(c)) return c; }
}

function render() {
  const ae = document.activeElement;
  const refocus = ae && ['q', 'msg'].includes(ae.id) ? ae.id : null;
  const mIn = document.getElementById('mIn');
  if (mIn && S.modal) S.modal.value = mIn.value;
  const keep = {};
  if (!S.resetScroll) document.querySelectorAll('[data-scroll]').forEach((el) => (keep[el.dataset.scroll] = el.scrollTop));
  S.resetScroll = false;
  const r = route();
  const pvOpen = !!(S.pv && !S.q && r.page === 'ws' && !S.noOss);
  let content;
  if (r.page === 'new') content = newChatView(r);
  else if (r.page === 'chat') content = chatView(r);
  else content = S.noOss ? noOssView() : S.q ? searchView() : dirView(r.dir);
  document.getElementById('app').innerHTML =
    topbar() +
    `<div class="body">${sider(r)}<main class="main"><div class="ws ${pvOpen ? 'pvopen' : ''}">

    popover() + modal() + uploadPanel() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  document.querySelectorAll('[data-scroll]').forEach((el) => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
  afterRender(S.focus || refocus);
}
function afterRender(focusId) {
  S.focus = null;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  const i = document.getElementById('mIn');
  if (S.modal && i) {
    i.focus();
    if (!S.modal.focused) { const dot = i.value.lastIndexOf('.'); i.setSelectionRange(0, dot > 0 && S.modal.type === 'rename' && !S.modal.isDir ? dot : i.value.length); }
    else i.setSelectionRange(i.value.length, i.value.length);
  }
  if (S.modal) S.modal.focused = true;
  if (S.scrollCur) { document.querySelector('tr.cur')?.scrollIntoView({ block: 'nearest' }); S.scrollCur = false; }
  const pv = S.pv && S.pv.path;
  if (pv && S.blobs[pv] && S.texts[pv] == null && needsText(pv) && S.blobs[pv].size < 2 * 1024 * 1024) {
    S.texts[pv] = '';
    S.blobs[pv].text().then((t) => { S.texts[pv] = t; render(); });
  }
}
function toast(msg) {

}
const searchBox = () => `<div class="search" style="width:260px">${ic('search')}<input class="input" id="q" placeholder="搜索文件和文件夹" value="${esc(S.q)}" autocomplete="off">${S.q ? `<button class="ibtn sm clr" data-act="clearQ" title="清除">${ic('x')}</button>` : ''}</div>`;

/* =====================================================================

function crumbs(dir) {
  const parts = dir.split('/');

  parts.forEach((p, i) => {
    const last = i === parts.length - 1;

}
function dirView(dir) {

  const pvPath = S.pv ? S.pv.path : null;

      ${isDir ? (canWrite(p) ? `<button class="ibtn sm chat" data-act="newChat" data-path="${esc(p)}" title="在这个目录新建对话">${ic('chatPlus')}</button>` : '')

/* =====================================================================
 * 搜索（整个工作空间，按名称）
 * ===================================================================== */
function searchView() {
  const q = S.q.trim().toLowerCase();
  const hit = (s) => { const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
  const dirSet = new Set(), files = [];
  for (const x of FILES) {
    if (!S.hidden && isHidden(x.p)) continue;
    for (let d = parent(x.p); d; d = parent(d)) dirSet.add(d);
    if (!x.dir && base(x.p).toLowerCase().includes(q)) files.push(x);
  }
  const dirs = [...dirSet].filter((d) => base(d).toLowerCase().includes(q)).sort((a, b) => a.localeCompare(b, 'zh'));
  files.sort((a, b) => a.m - b.m);
  const n = dirs.length + files.length;
  const loc = (p) => `<span class="row" style="gap:6px">${dirIcon(true)}<span class="ellipsis">${esc(p || '我的工作空间')}</span></span>`;
  const rows = [
    ...dirs.map((d) => `<tr class="click" data-go="${wsHref(d)}"><td><div class="nm">${dirIcon()}<span class="t">${hit(base(d))}</span></div></td>
      <td class="c-loc sm">${loc(parent(d))}</td><td class="c-size">${fmtSize(stat(d).size)}</td><td class="c-time"></td></tr>`),
    ...files.map((x) => `<tr class="click" data-act="openResult" data-path="${esc(x.p)}">
      <td><div class="nm">${fileIcon(x.p)}<span class="t">${hit(base(x.p))}</span></div></td>
      <td class="c-loc sm">${loc(parent(x.p))}</td><td class="c-size">${fmtSize(x.size)}</td><td class="c-time">${rel(x.m)}</td></tr>`),
  ].join('');
  return `<div class="page">
    <div class="page-head"><div class="grow"><h1>搜索「${esc(S.q.trim())}」</h1><div class="usage">在整个工作空间里找到 ${n} 项${S.hidden ? '' : '（不含隐藏文件）'}</div></div>${searchBox()}</div>
    ${n ? `<table class="ft"><thead><tr><th>名称</th><th class="c-loc">所在位置</th><th class="c-size">大小</th><th class="c-time">修改时间</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty"><div class="ill">${ic('search')}</div><h3>没有找到</h3><p>只按名称搜索，不搜文件内容</p></div>`}
  </div>`;
}
function noOssView() {

    <div class="empty"><div class="ill" style="background:var(--line-2);color:var(--ink-3)">${ic('hdd')}</div><h3>工作空间暂不可用</h3><p>这个部署没有配置文件存储，请联系管理员</p></div></div>`;

/* =====================================================================

    : `${ic('folderPlus')}<span>没选目录：发送后新建 <code>${esc(autoDir())}</code> 作为工作目录。要用已有的文件，去<a href="#/ws">工作空间</a>在文件夹上点「新建对话」</span>`;
  return `<div class="hero">
    <h1>${greet}，${esc(ME.name.slice(1))}</h1>
    <div class="composer">${chip}

      <div class="bar">
        <button class="ibtn" title="添加文件" data-act="toast" data-msg="添加的文件传到工作目录${dir ? '「' + dir + '」' : '（发送时新建）'}，智能体直接能读到">${ic('clip')}</button>
        <span class="pill" data-pop="agent">${av(a.name, a.color, 18)}${esc(a.name)}${ic('down')}</span>
        <span class="pill" data-act="toast" data-msg="审批模式（同控制台原型）">${ic('shield')}自动${ic('down')}</span>

      </div>

}
function send() {
  const text = S.draft.trim();
  if (!text) { S.focus = 'msg'; toast('先输入要做的事'); return; }
  const r = route();
  const dir = r.dir || autoDir();
  const id = Math.random().toString(16).slice(2, 10);
  const t = { id, title: text.length > 18 ? text.slice(0, 18) + '…' : text, agent: S.agent, dir, auto: !r.dir, state: 'run', live: { text, phase: 0 } };
  THREADS.unshift(t);
  S.draft = '';
  location.hash = chatHref(id);
  // 演示：智能体在工作目录里写一个文件 —— 写了文件，目录才出现在工作空间里
  setTimeout(() => { t.live.phase = 1; render(); }, 900);
  setTimeout(() => {
    let p = join(t.dir, '回答.md');
    if (exists(p)) p = uniqueName(p);
    TEXT[p] = `# ${t.title}\n\n> ${text}\n\n（原型演示：智能体在工作目录 ${t.dir} 里写的文件）`;
    FILES.push({ p, size: new Blob([TEXT[p]]).size, m: 0 });
    t.live.file = p; t.live.phase = 2; t.state = '';
    render();
  }, 2300);
}

/* =====================================================================

function chatView(r) {
  const t = THREADS.find((x) => x.id === r.id);

  const a = AGENTS[t.agent];

    const reply = L.phase === 2
      ? `<div class="prose"><p>写好了：<a data-act="openFile" data-path="${esc(L.file)}">${esc(base(L.file))}</a>，在工作目录 <a href="${wsHref(t.dir)}">${esc(t.dir)}</a> 里。</p></div>` : '';
    body = `<div class="m-user"><div class="b">${esc(L.text)}</div></div><div class="m-ai">${who}${steps}${reply}</div>`;
  } else {

      <div class="m-ai">${who}<div class="prose"><p class="muted">（原型：对话内容略。这一页只演示工作目录存在对话记录里、怎么显示）</p></div></div>`;

    </div>
    <div class="chat-scroll"><div class="chat-col">
      <div class="chat-meta">${ic('folder')}工作目录 <b style="color:var(--ink-3);font-weight:600">${esc(t.dir)}</b>
        <span>·</span>${t.auto ? '没选目录，开始对话时新建的' : '从工作空间的文件夹开始的对话'}</div>
      ${body}
    </div></div>
    <div class="chat-foot"><div class="composer"><textarea rows="1" placeholder="继续对话…" data-act="noop"></textarea>
      <div class="bar"><button class="ibtn" title="添加文件" data-act="toast" data-msg="添加的文件传到工作目录「${esc(t.dir)}」">${ic('clip')}</button>
      <button class="send" data-act="toast" data-msg="原型只演示开始对话">${ic('arrowUp')}</button></div></div></div>
  </div>`;
}

/* =====================================================================

  if (k === 'html' && S.pvView === 'preview') return `<iframe class="pv-frame" sandbox="allow-scripts allow-forms" srcdoc="${esc(htmlDoc(dir, text))}"></iframe>`;

function mdRender(src, dir) {

    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => `<img alt="${a}" src="${imgUrl(resolvePath(dir, u))}">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a>$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

    if (/^\d+\.\s+/.test(l)) { const it = []; while (i < L.length && /^\d+\.\s+/.test(L[i])) it.push(L[i++].replace(/^\d+\.\s+/, '')); h += '<ol>' + it.map((x) => `<li>${inl(x)}</li>`).join('') + '</ol>'; continue; }

const LIMIT = 1024 ** 3; // 单个文件上限（演示值，待定）

  const title = up ? `正在上传 ${up} 项` : `上传完成 ${done} 项` + (fail ? `，${fail} 项失败` : '') + (skip ? `，跳过 ${skip} 项` : '');
  const icon = up ? '<span class="spin"></span>' : fail ? `<span style="color:var(--danger);display:flex">${ic('alert')}</span>` : `<span style="color:var(--success);display:flex">${ic('check')}</span>`;
  const items = S.uploads.map((u, i) => {

        ${u.state === 'up' ? `<div class="prog"><i style="width:${u.pct}%"></i></div>` : ''}</div>

      ${up ? '' : `<button class="ibtn sm" data-act="upClose" title="关闭">${ic('x')}</button>`}</div>
    ${S.upMin ? '' : `<div class="upq-b">${items}</div>`}</div>`;

/* ---------- 上传流程：冲突 → 排队 → 进度 ---------- */
function uploadTarget() {
  const r = route();
  if (r.page !== 'ws' || S.q || S.noOss) return null;
  return canWrite(r.dir) ? { dir: r.dir } : null;
}
function enqueue(items, dir) {
  if (!items.length) return;
  S.pending.push(...items.map((it) => ({ ...it, dir })));
  S.conflictAll = null;
  S.upMin = false;
  processPending();
}
function processPending() {
  while (S.pending.length) {
    const it = S.pending[0], full = join(it.dir, it.name);
    if (exists(full) && !S.conflictAll) { S.modal = { type: 'conflict', it, all: false }; render(); return; }
    S.pending.shift();
    if (exists(full)) resolveConflict(it, S.conflictAll); else startUpload(it, full, false);
  }
  render();
}
function resolveConflict(it, how) {
  const full = join(it.dir, it.name);
  if (how === 'skip') S.uploads.push({ ...it, path: full, size: it.size, state: 'skip', pct: 0 });
  else if (how === 'keep') startUpload(it, uniqueName(full), false);
  else startUpload(it, full, true);
}
let upTimer = null;
function startUpload(it, path, replaced) {
  const u = { path, size: it.size, file: it.file, replaced, pct: 0, state: 'up' };
  if (it.size > LIMIT) { u.state = 'fail'; u.err = `超过单个文件 ${fmtSize(LIMIT)} 的上限`; }
  const secs = Math.min(6, 0.8 + it.size / 25e6);
  u.rate = (100 * 0.16) / secs;
  S.uploads.push(u);
  if (!upTimer) upTimer = setInterval(tick, 160);
}
function tick() {
  let finished = false, active = false;
  for (const u of S.uploads) {
    if (u.state !== 'up') continue;
    active = true;
    u.pct = Math.min(100, u.pct + u.rate);
    if (u.pct >= 100) { u.state = 'done'; finishUpload(u); finished = true; }
  }
  if (!active) { clearInterval(upTimer); upTimer = null; }
  if (finished) render();
  else { const el = document.getElementById('upq'); if (el) el.outerHTML = uploadPanel(); }
}
function finishUpload(u) {
  FILES = FILES.filter((x) => x.p !== u.path);
  FILES.push({ p: u.path, size: u.size, m: 0 });
  const k = u.path;
  delete S.texts[k]; delete S.urls[k]; delete TEXT[k]; delete IMG[k];
  if (u.file) S.blobs[k] = u.file; else delete S.blobs[k];
}

];

  if (r.page === 'new') return N('新对话 · 工作目录', [

  if (r.page === 'chat') return N('对话 · 工作目录', [

  if (S.noOss) return N('工作空间 · 不可用', ['部署没配对象存储时，入口保留、页面说明原因（对话里的文件抽屉已有同样的判断）']);
  if (S.q) return N('工作空间 · 搜索', [

  if (S.pv) return N('工作空间 · 预览', [

  if (!r.dir) return N('工作空间 · 根目录', [

  ], [

}
function notesPanel(r) {
  const n = notesFor(r);
  return `<div class="notes"><div class="row"><b style="color:#92400e;display:flex;gap:6px;align-items:center">${ic('bulb')}${n.title}</b><span class="sp"></span><button class="ibtn sm" data-act="toggleNotes">${ic('x')}</button></div>
    <h4>设计要点</h4><ul>${n.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
    ${n.be.length ? `<h4>需要后端配合</h4><ul>${n.be.map((i) => `<li><span class="be">后端</span>${esc(i)}</li>`).join('')}</ul>` : ''}
    ${n.qs.length ? `<h4>待确认</h4><ul>${n.qs.map((i) => `<li><span class="q">待定</span>${esc(i)}</li>`).join('')}</ul>` : ''}
    <h4>演示</h4><div class="col">
      <button class="btn sm" data-act="demoNewChat">${ic('play')}从「Q3 销售分析」新建对话</button>
      <button class="btn sm" data-act="demoRename">${ic('play')}重命名一个对话正在用的目录</button>
      <button class="btn sm" data-act="demoUpload">${ic('play')}模拟一次上传（同名、超限）</button>
      <button class="btn sm" data-act="demoNoOss">${ic('play')}${S.noOss ? '恢复正常' : '切换：没有配置文件存储'}</button>
    </div>
    <div class="xs" style="color:#a8a29e;margin-top:10px">也可以把本机文件拖进任意文件夹试试：文本、图片能直接预览</div></div>`;
}

/* =====================================================================
 * 交互
 * ===================================================================== */
function download(p) {
  if (S.blobs[p]) { const a = document.createElement('a'); a.href = URL.createObjectURL(S.blobs[p]); a.download = base(p); a.click(); return; }
  toast(`开始下载 ${base(p)}`);
}
function removePaths(paths) {
  FILES = FILES.filter((x) => !paths.some((p) => inside(x.p, p)));
  if (S.pv && paths.some((p) => inside(S.pv.path, p))) S.pv = null;
}
function step(d) {
  const i = S.curFiles.indexOf(S.pv.path), j = i + d;
  if (i < 0 || j < 0 || j >= S.curFiles.length) return;
  S.pv = { path: S.curFiles[j] }; S.pvView = 'preview'; S.scrollCur = true;
  render();
}
/** 跳到文件所在目录并打开预览 */
function reveal(p) {
  const h = wsHref(parent(p));
  if (location.hash === h) { S.q = ''; S.pv = { path: p }; S.scrollCur = true; render(); }
  else { S.pvNext = { path: p }; location.hash = h; }
}
const ACT = {
  noop: () => false,
  toggleNotes: () => { S.notes = !S.notes; },
  collapse: () => { S.collapsed = !S.collapsed; },
  toast: (el) => { toast(el.dataset.msg); return false; },
  sort: (el) => { const k = el.dataset.k; S.sort = S.sort.k === k ? { k, asc: !S.sort.asc } : { k, asc: k === 'name' }; },
  toggleHidden: () => { S.hidden = !S.hidden; S.sel = new Set(); },
  clearQ: () => { S.q = ''; },
  open: (el) => { S.pv = { path: el.dataset.path }; S.pvView = 'preview'; },
  closePv: () => { S.pv = null; },
  pvView: (el) => { S.pvView = el.dataset.v; },
  pvStep: (el) => { step(+el.dataset.d); return false; },
  sel: (el) => { const p = el.dataset.path; S.sel.has(p) ? S.sel.delete(p) : S.sel.add(p); },
  selAll: () => {
    const { dirs, files } = listDir(route().dir);
    const all = [...dirs.map((d) => d.p), ...files.map((x) => x.p)];
    S.sel = all.every((p) => S.sel.has(p)) ? new Set() : new Set(all);
  },
  selClear: () => { S.sel = new Set(); },
  download: (el) => { download(el.dataset.path); return false; },
  zip: (el) => {
    const p = el.dataset.path;
    const n = FILES.filter((x) => !x.dir && x.p.startsWith(p + '/') && (S.hidden || !isHidden(x.p))).length;
    toast(`正在打包「${base(p)}」（${n} 个文件），完成后自动下载`); return false;
  },
  dlSel: () => {
    const ps = [...S.sel];
    if (ps.length === 1 && !isDirPath(ps[0])) return ACT.download({ dataset: { path: ps[0] } });
    toast(`正在打包 ${ps.length} 项，完成后自动下载`); return false;
  },
  copyPath: (el) => {
    const p = el.dataset.path;
    navigator.clipboard?.writeText(p).catch(() => {});
    toast(`已复制 ${p}`); return false;
  },
  newChat: (el) => { S.draft = ''; S.focus = 'msg'; location.hash = newHref(el.dataset.path); return false; },
  dropDir: () => { S.focus = 'msg'; location.hash = newHref(); return false; },
  setAgent: (el) => { S.agent = el.dataset.id; S.focus = 'msg'; },
  send: () => { send(); return false; },
  openFile: (el) => { reveal(el.dataset.path); return false; },
  newFolder: () => { S.modal = { type: 'newFolder', dir: route().dir, value: '新建文件夹' }; },
  rename: (el) => { const p = el.dataset.path; S.modal = { type: 'rename', path: p, isDir: isDirPath(p), value: base(p) }; },
  del: (el) => { S.modal = { type: 'del', paths: [el.dataset.path] }; },
  delSel: () => { S.modal = { type: 'del', paths: [...S.sel] }; },
  modalCancel: () => {
    if (S.modal?.type === 'conflict') { S.pending = []; S.modal = null; return; }
    S.modal = null;
  },
  modalOk: () => {
    const m = S.modal;
    if (!m) return;
    const val = document.getElementById('mIn')?.value.trim();
    if (m.type === 'newFolder' || m.type === 'rename') {
      if (m.type === 'rename' && refsNote([m.path], '重命名').blocked) return;
      const dir = m.type === 'newFolder' ? m.dir : parent(m.path);
      const target = join(dir, val || '');
      const bad = (e) => { m.err = e; m.value = val; m.focused = false; };
      if (!val) return bad('名称不能为空');
      if (/[\\/]/.test(val)) return bad('名称里不能有 / 或 \\');
      if (val.startsWith('.')) return bad('不能以 . 开头（这类名称是隐藏文件）');
      if (target !== m.path && (exists(target) || isDirPath(target))) return bad('已有同名的文件或文件夹');
      if (m.type === 'newFolder') { FILES.push({ p: target + '/', size: 0, m: 0, dir: true }); toast(`已创建文件夹 ${val}`); }
      else {
        const moved = refsUnder(m.path);
        FILES.forEach((x) => { if (inside(x.p, m.path)) x.p = target + x.p.slice(m.path.length); });
        THREADS.forEach((t) => { if (inside(t.dir, m.path)) t.dir = target + t.dir.slice(m.path.length); });
        if (S.pv && inside(S.pv.path, m.path)) S.pv.path = target + S.pv.path.slice(m.path.length);
        S.sel = new Set();
        toast(`已重命名为 ${val}${moved.length ? `，${moved.length} 个对话的工作目录已跟着改` : ''}`);
      }
    }
    if (m.type === 'del') {
      if (refsNote(m.paths, '删除').blocked) return;
      removePaths(m.paths); S.sel = new Set(); toast(`已删除 ${m.paths.length} 项`);
    }
    S.modal = null;
  },
  toggleCfAll: () => { S.modal.all = !S.modal.all; },
  conflict: (el) => {
    const how = el.dataset.how, m = S.modal;
    if (m.all) S.conflictAll = how;
    S.modal = null; S.pending.shift();
    resolveConflict(m.it, how);
    processPending(); return false;
  },
  pickFiles: () => { document.getElementById('pick').click(); return false; },
  pickDir: () => { document.getElementById('pickDir').click(); return false; },
  upMin: () => { S.upMin = !S.upMin; },
  upClose: () => { S.uploads = []; },
  upLocate: (el) => {
    const u = S.uploads[+el.dataset.i];
    if (!exists(u.path)) return toast('文件已不存在'), false;
    reveal(u.path); return false;
  },
  openResult: (el) => { reveal(el.dataset.path); return false; },
  demoNewChat: () => { S.draft = '按 report/summary.md 的结论做一页汇报 PPT'; S.focus = 'msg'; location.hash = newHref(Q3); return false; },
  demoRename: () => {
    const go = () => { S.modal = { type: 'rename', path: Q3, isDir: true, value: base(Q3) }; render(); };
    if (location.hash !== wsHref()) { location.hash = wsHref(); setTimeout(go, 60); } else go();
    return false;
  },
  demoUpload: () => {
    const dir = `${Q3}/uploads`;
    const doIt = () => enqueue([
      { name: 'sales_q3.csv', size: 291204 },
      { name: '区域目标.xlsx', size: 51200 },
      { name: 'region_map.png', size: 642000 },
      { name: 'raw_dump_2026Q3.zip', size: 2.3 * 1024 ** 3 },
      { name: 'notes.md', size: 3200 },
    ], dir);
    if (location.hash !== wsHref(dir)) { location.hash = wsHref(dir); setTimeout(doIt, 60); return false; }
    doIt(); return false;
  },
  demoNoOss: () => { S.noOss = !S.noOss; S.pv = null; if (route().page !== 'ws') { location.hash = '#/ws'; return false; } },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-go],[data-pop]');
  const inPop = e.target.closest('.pop');
  if (!el) { if (S.pop && !inPop) { S.pop = null; render(); } return; }
  if (el.dataset.pop) {
    e.preventDefault();
    const rc = el.getBoundingClientRect();
    const anchor = el.dataset.pop + (el.dataset.path || '');
    S.pop = S.pop && S.pop.anchor === anchor ? null : {
      id: el.dataset.pop, path: el.dataset.path, anchor,
      x: Math.min(rc.left, window.innerWidth - 240), y: Math.min(rc.bottom + 4, window.innerHeight - 240),
    };
    render(); return;
  }
  S.pop = null;
  if (el.dataset.act) {
    if (el.classList.contains('mask') && e.target !== el) return; // 点在弹窗里面
    if (el.dataset.act === 'noop') return;
    e.preventDefault();
    const res = ACT[el.dataset.act]?.(el, e);
    if (res !== false) render();
    return;
  }
  if (el.dataset.go) location.hash = el.dataset.go;
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  if (e.target.id === 'msg') S.draft = e.target.value;
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'msg') {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    return;
  }
  if (e.target.matches('input, textarea')) {
    if (e.key === 'Enter' && S.modal && e.target.id === 'mIn') { ACT.modalOk(); render(); }
    if (e.key === 'Escape') { if (S.modal) { ACT.modalCancel(); render(); } else if (e.target.id === 'q' && S.q) { S.q = ''; render(); } }
    return;
  }
  if (e.key === 'Escape') {
    if (S.modal) ACT.modalCancel(); else if (S.pop) S.pop = null; else if (S.pv) S.pv = null; else return;
    render();
  }
  if (S.pv && !S.modal && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); step(e.key === 'ArrowDown' ? 1 : -1); }
});

/* ---------- 文件选择 / 拖放 ---------- */
document.getElementById('pick').addEventListener('change', (e) => {
  const t = uploadTarget();
  if (t) enqueue([...e.target.files].map((f) => ({ name: f.name, size: f.size, file: f })), t.dir);
  e.target.value = '';
});
document.getElementById('pickDir').addEventListener('change', (e) => {
  const t = uploadTarget();
  if (t) enqueue([...e.target.files].map((f) => ({ name: f.webkitRelativePath || f.name, size: f.size, file: f })), t.dir);
  e.target.value = '';
});
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
function paintDrop(on) {
  const ov = document.getElementById('dropov'), t = uploadTarget(), r = route();
  ov.classList.toggle('on', on);
  ov.classList.toggle('no', !t);
  if (on) {
    ov.querySelector('.in').innerHTML = t
      ? `${ic('upload')}<div>松开上传到「${esc(t.dir || '我的工作空间')}」</div>`
      : `${ic('folder')}<div>${r.page === 'ws' && isHidden(r.dir) ? '对话的内部记录，只读' : '打开工作空间的文件夹再上传'}</div>`;
  }
}
document.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); if (dragDepth++ === 0) paintDrop(true); });
document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; paintDrop(false); } });
document.addEventListener('drop', async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; paintDrop(false);
  const t = uploadTarget();
  if (!t) return;
  // 条目要在 await 之前取出来：事件结束后 dataTransfer 就失效了
  const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const plain = [...e.dataTransfer.files];
  const out = [];
  const walk = async (entry, prefix) => {
    if (entry.isFile) { const file = await new Promise((res, rej) => entry.file(res, rej)); out.push({ name: prefix + file.name, size: file.size, file }); return; }
    const reader = entry.createReader();
    let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const c of batch) await walk(c, prefix + entry.name + '/'); } while (batch.length);
  };
  if (entries.length) { for (const en of entries) await walk(en, ''); } else plain.forEach((f) => out.push({ name: f.name, size: f.size, file: f }));
  enqueue(out, t.dir);
});

if (!location.hash) history.replaceState(null, '', '#/ws');
render();
