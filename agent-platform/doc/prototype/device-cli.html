<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas · 本机 CLI 智能体 — 原型</title>
<style>
/* 视觉与用户中心、TeamFlow、模型平台原型一致（同一套浅色设计 token） */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd; --hover: #f2f4f8;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff; --primary-ink: #4338ca;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #d97706; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 52px; --sider-w: 248px; --sider-w-min: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); }
h1 { font-size: 20px; font-weight: 650; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.sm { font-size: 12.5px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { flex: 1; }
.hide { display: none !important; }

/* ---------- 顶栏：一级菜单（平台） ---------- */
.top { height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px 0 14px; gap: 20px; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .01em; cursor: pointer; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; display: grid; place-items: center; font-size: 14px; }
.pnav { display: flex; gap: 2px; height: 100%; }
.pnav a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--ink-2); font-weight: 550; position: relative; }
.pnav a:hover { color: var(--ink); background: var(--hover); }
.pnav a.on { color: var(--primary-ink); }
.pnav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 650; flex: none; }
.avatar.sq { border-radius: 8px; }

/* ---------- 左侧：二级菜单（可收缩） ---------- */
.body { display: flex; height: calc(100vh - var(--top-h)); }
.sider { width: var(--sider-w); flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; }
.sider.min { width: var(--sider-w-min); }
.sider-top { padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.snav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 520; white-space: nowrap; cursor: pointer; position: relative; }
.snav:hover { background: var(--hover); color: var(--ink); }
.snav.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.snav .badge { margin-left: auto; }
.sider.min .snav { justify-content: center; padding: 0; }
.sider.min .snav span, .sider.min .snav .badge, .sider.min .hist, .sider.min .new-chat span, .sider.min .sider-foot span { display: none; }
.new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; color: var(--ink); cursor: pointer; margin-bottom: 8px; box-shadow: var(--shadow-xs); white-space: nowrap; }
.new-chat:hover { border-color: #cfd3dd; background: var(--hover); }
.hist { flex: 1; overflow-y: auto; padding: 4px 10px 10px; border-top: 1px solid var(--line-2); margin-top: 6px; }
.hist-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 4px; }
.hist-group { font-size: 11.5px; color: var(--ink-4); padding: 10px 8px 4px; }
.hist-item { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); cursor: pointer; }
.hist-item:hover { background: var(--hover); }
.hist-item.on { background: #e9ebf3; color: var(--ink); font-weight: 550; }
.hist-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.hist-item .more { opacity: 0; }
.hist-item:hover .more { opacity: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.run { background: var(--success); box-shadow: 0 0 0 3px var(--success-weak); }
.dot.wait { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-weak); }
.sider-foot { border-top: 1px solid var(--line-2); padding: 8px 10px; }
.main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
.main.white { background: var(--surface); }
.page { padding: 24px 32px 60px; max-width: 1280px; margin: 0 auto; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 36px; }

/* ---------- 通用组件 ---------- */
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 550; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: #cfd3dd; background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ibtn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.ibtn.sm { width: 26px; height: 26px; }
.ibtn.on { background: var(--primary-weak); color: var(--primary-ink); }
.input, .select, textarea.input { height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 11px; background: var(--surface); outline: none; width: 100%; }
textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-weak); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--ink-4); }
.search .input { padding-left: 32px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.tag.primary { background: var(--primary-weak); color: var(--primary-ink); }
.tag.success { background: var(--success-weak); color: var(--success); }
.tag.warning { background: var(--warning-weak); color: var(--warning); }
.tag.danger { background: var(--danger-weak); color: var(--danger); }
.tag.blue { background: var(--secondary-weak); color: #0369a1; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 650; display: inline-grid; place-items: center; }
.badge.gray { background: var(--line); color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card.pad { padding: 16px 18px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs a { padding: 10px 0; color: var(--ink-3); font-weight: 550; position: relative; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); }
.tabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg a { padding: 4px 12px; border-radius: 7px; color: var(--ink-3); font-weight: 550; font-size: 13px; }
.seg a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
.switch { display: inline-block; vertical-align: middle; width: 36px; height: 20px; border-radius: 10px; background: #d5d9e2; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 18px; }
.switch.dis { opacity: .45; cursor: not-allowed; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr.click:hover td { background: var(--surface-2); cursor: pointer; }
.empty { text-align: center; padding: 56px 20px; color: var(--ink-3); }
.empty .ill { width: 56px; height: 56px; border-radius: 16px; background: var(--primary-weak); color: var(--primary); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .ill svg { width: 26px; height: 26px; }
.empty h3 { margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.chip .x { color: var(--ink-4); cursor: pointer; }
.chip .x:hover { color: var(--danger); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.divider { height: 1px; background: var(--line-2); margin: 14px 0; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.help { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.radio-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); }
.radio-card:hover { border-color: #cfd3dd; }
.radio-card.on { border-color: var(--primary-2); background: #f8f8ff; box-shadow: 0 0 0 3px var(--primary-weak); }
.radio-card .r { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c5cad6; flex: none; margin-top: 2px; }
.radio-card.on .r { border: 5px solid var(--primary); }

/* 下拉菜单 / 浮层 */
.pop { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; min-width: 200px; }
.pop .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.pop .mi:hover { background: var(--hover); color: var(--ink); }
.pop .mi.on { color: var(--primary-ink); }
.pop .mi.danger { color: var(--danger); }
.pop .sep { height: 1px; background: var(--line-2); margin: 5px 4px; }
.pop .ph { font-size: 11.5px; color: var(--ink-4); padding: 6px 10px 2px; }
.mask { position: fixed; inset: 0; background: rgba(15,23,42,.36); z-index: 80; display: grid; place-items: center; }
.modal { background: var(--surface); border-radius: 14px; width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal.wide { width: 760px; }
.modal-h { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.modal-b { padding: 18px 20px; overflow-y: auto; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; }
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.2); z-index: 70; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 92vw; background: var(--surface); z-index: 71; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: var(--shadow-md); }

/* ---------- 设计说明（评审用，非产品界面） ---------- */
.notes { width: 300px; flex: none; overflow-y: auto; background: #fffdf3; border-left: 1px solid #f3e3a6; padding: 14px 16px; font-size: 13px; }
.notes h4 { font-size: 13px; margin: 10px 0 4px; color: #92400e; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 3px 0; color: #57534e; }
.notes .be { display: inline-block; font-size: 11px; background: #fde68a; color: #92400e; border-radius: 4px; padding: 0 5px; margin-right: 4px; }

/* ---------- 智能平台首页 ---------- */
.hero { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 90px; }
.hero h1 { font-size: 28px; font-weight: 650; margin-bottom: 26px; letter-spacing: .01em; }
.hero .composer { width: 100%; max-width: 760px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; max-width: 760px; }
.quick .chip { cursor: pointer; height: 34px; border-radius: 17px; color: var(--ink-2); }
.quick .chip:hover { background: var(--hover); }
.composer { background: var(--surface); border: 1px solid #dfe2ea; border-radius: 18px; box-shadow: 0 2px 10px rgba(16,24,40,.06); padding: 12px 12px 10px 16px; }
.composer:focus-within { border-color: #c7cbf6; box-shadow: 0 0 0 4px var(--primary-weak), 0 2px 10px rgba(16,24,40,.06); }
.composer textarea { width: 100%; border: none; outline: none; resize: none; min-height: 52px; max-height: 220px; font-size: 15px; line-height: 1.6; background: transparent; padding: 2px 0; }
.composer .bar { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; color: var(--ink-2); font-weight: 550; white-space: nowrap; }
.pill:hover { background: var(--hover); }
.send { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; margin-left: auto; }
.send[disabled] { background: #c7cbd6; cursor: not-allowed; }
.attach { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

/* ---------- 对话页 ---------- */
.chat { display: flex; flex-direction: column; height: 100%; }
.chat-head { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 22px; border-bottom: 1px solid var(--line-2); background: var(--surface); }
.chat-scroll { flex: 1; overflow-y: auto; }
.chat-col { max-width: 780px; margin: 0 auto; padding: 24px 24px 20px; }
.chat-foot { flex: none; padding: 0 24px 18px; }
.chat-foot .composer { max-width: 780px; margin: 0 auto; }
.m-user { display: flex; justify-content: flex-end; margin: 6px 0 22px; }
.m-user .b { background: #f1f3f9; padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 78%; white-space: pre-wrap; }
.m-ai { margin-bottom: 26px; }
.m-ai .who { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; font-size: 13.5px; }
.m-ai .prose { font-size: 15px; line-height: 1.75; color: var(--ink); }
.m-ai .prose p { margin: 0 0 10px; }
.m-ai .prose ul { margin: 0 0 10px; padding-left: 22px; }
.m-ai .prose.aside { color: var(--ink-3); font-size: 14px; }
.m-actions { display: flex; gap: 2px; margin-top: 4px; }
.m-actions .ibtn { width: 28px; height: 28px; color: var(--ink-4); }
.m-actions .ibtn:hover { color: var(--ink); }
.steps { border: 1px solid var(--line); border-radius: 12px; margin: 4px 0 12px; background: var(--surface); overflow: hidden; }
.steps-h { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; color: var(--ink-2); font-size: 13.5px; font-weight: 550; }
.steps-h:hover { background: var(--surface-2); }
.steps-b { border-top: 1px solid var(--line-2); padding: 6px 12px 8px; }
.step { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13.5px; color: var(--ink-2); }
.step .ic { width: 24px; height: 24px; border-radius: 7px; background: var(--line-2); display: grid; place-items: center; color: var(--ink-3); flex: none; }
.step .ic svg { width: 14px; height: 14px; }
.step .tm { margin-left: auto; color: var(--ink-4); font-size: 12px; }
.spin { width: 14px; height: 14px; border: 2px solid #c7cbf6; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.subcard { border: 1px solid var(--line); border-left: 3px solid var(--secondary); border-radius: 10px; margin: 8px 0; background: var(--surface); }
.subcard .h { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-size: 13.5px; }
.subcard .b { border-top: 1px solid var(--line-2); padding: 8px 12px 10px 14px; font-size: 13.5px; color: var(--ink-2); }
.ask { border: 1px solid #f5d38b; background: #fffbf0; border-radius: 12px; padding: 14px 16px; margin: 8px 0 12px; }
.ask pre { background: #fff; border: 1px solid #f3e2b8; border-radius: 8px; padding: 8px 10px; margin: 8px 0 10px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
.todo { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 6px 0 12px; }
.todo .it { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13.5px; }
.todo .ck { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c5cad6; flex: none; display: grid; place-items: center; }
.todo .ck.done { background: var(--success); border-color: var(--success); color: #fff; }
.todo .ck.doing { border-color: var(--primary); border-top-color: transparent; animation: spin 1.2s linear infinite; }
.todo .done-t { color: var(--ink-4); text-decoration: line-through; }
.cursor { display: inline-block; width: 8px; height: 16px; background: var(--primary); vertical-align: -2px; animation: blink 1s step-end infinite; border-radius: 2px; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 列表卡片 ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: box-shadow .15s, border-color .15s; position: relative; }
.acard:hover { border-color: #d6d9e3; box-shadow: var(--shadow-md); }
.acard .desc { color: var(--ink-3); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
.acard .foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); margin-top: auto; }
.acard .acts { position: absolute; top: 12px; right: 10px; }

/* ---------- 智能体编辑（编排 + 调试预览） ---------- */

          : `<div class="row sm muted" style="margin-top:10px"><span class="spin"></span>等电脑连上…<span class="sp"></span><a data-act="pairDone">（演示）连上了</a></div>`}</div></div>
      </div>`, done ? `<button class="btn primary" data-act="closeModal">完成</button>` : `<button class="btn" data-act="closeModal">稍后再说</button>`);
  }
  if (M.type === 'revoke') {
    const d = devOf(M.id);
    return modalShell(`吊销「${esc(d.name)}」`, `<div class="col" style="gap:10px"><p>吊销后：</p><ul style="margin:0;padding-left:20px;line-height:1.9">
      <li>这台电脑立即断开，它的设备令牌作废；要再用得重新配对</li>

      ${d.isDefault ? '<li>默认设备改为「公司台式机」（剩下设备里最近连过的一台）</li>' : ''}</ul>
      <div class="sm muted">电脑上的项目文件不受影响。</div></div>`,
      `<button class="btn" data-act="closeModal">取消</button><button class="btn danger solid" data-act="toastClose" data-msg="已吊销，${esc(d.name)} 已断开">吊销</button>`);
  }
  if (M.type === 'newAgent') {
    const T2 = [['blank', '空白', '从零开始配置'], ['general', '通用助手', '写作、编程、数据分析都能做'], ['coder', '编程助手', '用 Claude Code 写代码、改文件、跑测试'], ['kbqa', '知识问答', '只根据指定知识库回答，附出处']];
    return modalShell('创建智能体', `<span class="label">名称</span><input class="input" placeholder="例如：本机编程助手">

        <div class="radio-card ${M.where === 'pod' ? 'on' : ''}" data-act="where" data-v="pod"><span class="r"></span><div><b>平台的隔离环境</b><div class="sm muted">每个对话一个独立的开发环境，文件在平台上；谁用都一样</div></div></div>

        <div class="help">建好后不能改：换运行位置等于换掉整套运行环境，要换就新建一个</div></div>` : ''}`,

  }

}

function pop() {
  if (!S.pop) return '';
  const [kind, arg] = S.pop.id.split(':');
  const mi = (attrs, inner, cls = '') => `<div class="mi ${cls}" ${attrs}>${inner}</div>`;
  let html = '';
  if (kind === 'agentPick') {
    html = `<div class="ph">选择智能体</div>${D.agents.map((a) => mi(`data-act="setAgent" data-id="${a.id}"`, `${av(a.name, a.color, 22)}<span class="grow"><b style="font-weight:550">${esc(a.name)}</b> ${a.kind === 'device' ? '<span class="tag success">本机</span>' : ''}</span>${S.composerAgent === a.id ? ic('check') : ''}`, S.composerAgent === a.id ? 'on' : '')).join('')}`;
  } else if (kind === 'devPick') {
    html = `<div class="ph">在哪台电脑上运行</div>${D.devices.map((d) => {
      const ok = d.online && !S.allOffline;
      return mi(ok ? `data-act="setDev" data-id="${d.id}"` : 'style="opacity:.55;cursor:not-allowed"', `${ic(d.icon)}<div class="grow"><b style="font-weight:550">${esc(d.name)}</b>${d.isDefault ? ' <span class="tag primary">默认</span>' : ''}<div class="xs muted">${ok ? `在线 · Claude Code ${d.clis[0][1]}` : `离线 · ${esc(d.seen.replace('最近在线 ', '最近在线 '))}`}</div></div>${ok && S.homeDev === d.id ? ic('check') : ''}`);
    }).join('')}<div class="sep"></div>${mi('data-go="#/ai/devices"', `${ic('laptop')}<span class="grow">管理我的设备</span>`)}`;
  } else if (kind === 'dirPick') {
    const d = devOf(S.homeDev);
    html = `<div class="ph">项目目录 · 建好对话后不能换</div>
      ${mi('data-act="setDir" data-v="new"', `${ic('plus')}<div class="grow"><b style="font-weight:550">新目录</b><div class="xs muted mono">~/atlas-projects/{这次对话的 id}</div></div>${S.homeDir.kind === 'new' ? ic('check') : ''}`)}
      <div class="sep"></div><div class="ph">已有项目（${esc(d.name)} 允许的目录里）</div>
      ${Object.entries(D.projects).map(([root, list]) => list.map((n) => {
        const p = root + '/' + n.split('（')[0];
        return mi(`data-act="setDir" data-v="${esc(p)}"`, `${ic(n.includes('（') ? 'folder' : 'git')}<span class="grow mono" style="font-size:12.5px">${esc(root + '/' + n)}</span>${S.homeDir.path === p ? ic('check') : ''}`);
      }).join('')).join('')}
      <div class="sep"></div>${mi('data-act="dirInput"', `${ic('pencil')}<span class="grow">输入路径…</span>`)}`;
  } else if (kind === 'devMore') {
    const d = devOf(arg);
    html = `${mi('data-act="toast" data-msg="改名"', `${ic('pencil')}<span class="grow">改名</span>`)}${mi(`data-act="devDetail" data-id="${d.id}"`, `${ic('eye')}<span class="grow">详情</span>`)}<div class="sep"></div>${mi(`data-act="revoke" data-id="${d.id}"`, `${ic('trash')}<span class="grow">吊销</span>`, 'danger')}`;
  }
  return `<div class="pop" style="position:fixed;left:${S.pop.x}px;top:${S.pop.y}px;min-width:300px" data-stop>${html}</div>`;
}

/* =====================================================================
 * 交互
 * ===================================================================== */
const ACT = {
  toggleNotes: () => { S.notes = !S.notes; },
  toast: (el) => { toast(el.dataset.msg || '（原型）'); return false; },
  toastClose: (el) => { S.modal = null; S.drawer = null; toast(el.dataset.msg); return false; },
  setS: (el) => { const v = el.dataset.v; S[el.dataset.k] = v === 'true' ? true : v === 'false' ? false : v; },
  closeModal: () => { S.modal = null; },
  closeDrawer: () => { S.drawer = null; },
  setAgent: (el) => { S.composerAgent = el.dataset.id; S.pop = null; },
  setDev: (el) => { S.homeDev = el.dataset.id; S.pop = null; },
  setDir: (el) => { S.homeDir = el.dataset.v === 'new' ? { kind: 'new' } : { kind: 'existing', path: el.dataset.v }; S.pop = null; },
  dirInput: () => { S.pop = null; S.modal = { type: 'dirInput' }; },
  sendHome: () => { toast(`已在 ${devOf(S.homeDev).name} 上开始（原型：跳到示例对话）`); setTimeout(() => go('#/ai/c/l1'), 600); return false; },
  chatWith: (el, e) => { e.stopPropagation(); S.composerAgent = el.dataset.id; go('#/ai'); return false; },
  newAgent: () => { S.modal = { type: 'newAgent', tpl: 'coder', where: 'device' }; },
  tpl: (el) => { S.modal.tpl = el.dataset.v; },
  where: (el) => { S.modal.where = el.dataset.v; },
  edModel: (el) => { S.edModel = el.dataset.v; },
  edMode: (el) => { S.edMode = +el.dataset.v; },
  pair: () => { S.modal = { type: 'pair' }; },
  pairDone: () => { S.modal.done = true; },
  setDefault: (el) => { D.devices.forEach((d) => { d.isDefault = d.id === el.dataset.id; }); toast('已设为默认设备'); return false; },
  devDetail: (el) => { S.pop = null; S.drawer = { type: 'device', id: el.dataset.id }; },
  revoke: (el) => { S.pop = null; S.drawer = null; S.modal = { type: 'revoke', id: el.dataset.id }; },
  files: (el) => { S.drawer = { type: 'files', id: el.dataset.id }; },
  fileTab: (el) => { S.fileTab = el.dataset.v; },
  tree: (el) => { S.tree[el.dataset.k] = !S.tree[el.dataset.k]; },
  openFile: (el, e) => { e.stopPropagation(); const tid = S.drawer?.id || 'l1'; window.open(`#/ai/f/${tid}/${el.dataset.p}`, '_blank'); return false; },
};
document.addEventListener('click', (e) => {
  if (e.target.matches('input:not([type=checkbox]),select,textarea')) return;
  const el = e.target.closest('[data-go],[data-act],[data-pop]');
  if (!el) { if (S.pop && !e.target.closest('[data-stop]')) { S.pop = null; render(); } return; }
  if (el.dataset.act === 'closeModal' && el.classList.contains('mask') && e.target !== el) return;
  if (el.dataset.act === 'closeDrawer' && el.classList.contains('drawer-mask') && e.target !== el) return;
  e.preventDefault();
  if (el.dataset.pop) {
    e.stopPropagation();
    const rc = el.getBoundingClientRect();
    S.pop = S.pop?.id === el.dataset.pop ? null : { id: el.dataset.pop, x: Math.max(12, Math.min(rc.left, window.innerWidth - 340)), y: rc.bottom + 6 };
    return render();
  }
  if (el.dataset.go) { S.modal = null; return go(el.dataset.go); }
  const fn = ACT[el.dataset.act];
  if (fn) { if (fn(el, e) !== false) render(); }
});
