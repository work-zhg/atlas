<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>运营中心 — 改版原型</title>
<style>
/* 设计 token 与 Atlas 控制台改版原型（atlas-console.html）、用户中心改版原型（usercenter.html）、packages/chat-ui/src/theme/tokens.css 同一套 */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd; --hover: #f2f4f8;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff; --primary-ink: #4338ca;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #d97706; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 52px; --sider-w: 248px; --sider-w-min: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); }
h1 { font-size: 20px; font-weight: 650; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
input[type=checkbox], input[type=radio] { accent-color: var(--primary); width: 15px; height: 15px; margin: 0; flex: none; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.sm { font-size: 12.5px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { flex: 1; }

/* ---------- 顶栏：一级菜单 ---------- */
.top { height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px 0 14px; gap: 20px; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .01em; cursor: pointer; white-space: nowrap; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; }
.pnav { display: flex; gap: 2px; height: 100%; }
.pnav a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--ink-2); font-weight: 550; position: relative; white-space: nowrap; }
.pnav a:hover { color: var(--ink); background: var(--hover); }
.pnav a.on { color: var(--primary-ink); }
.pnav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 650; flex: none; vertical-align: middle; }
.sq { display: inline-grid; place-items: center; border-radius: 10px; flex: none; }
.sq svg { width: 52%; height: 52%; }

/* ---------- 左侧：二级菜单（可收缩） ---------- */
.body { display: flex; height: calc(100vh - var(--top-h)); }
.body.full { height: 100vh; }
.sider { width: var(--sider-w); flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; }
.sider.min { width: var(--sider-w-min); }
.sider-top { padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.snav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 520; white-space: nowrap; cursor: pointer; position: relative; }
.snav:hover { background: var(--hover); color: var(--ink); }
.snav.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.snav .badge { margin-left: auto; }
.sider.min .snav { justify-content: center; padding: 0; }
.sider.min .snav span, .sider.min .snav .badge { display: none; }
.hist { flex: 1; overflow-y: auto; padding: 4px 10px 10px; border-top: 1px solid var(--line-2); margin-top: 6px; }
.hist-group { font-size: 11.5px; color: var(--ink-4); padding: 10px 8px 4px; }
.hist-item { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; border-radius: var(--radius-sm); color: var(--ink-2); cursor: pointer; }
.hist-item:hover { background: var(--hover); }
.hist-item.on { background: #e9ebf3; color: var(--ink); font-weight: 550; }
.hist-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.sider-foot { border-top: 1px solid var(--line-2); padding: 8px 10px; }
.main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
.page { padding: 24px 32px 60px; max-width: 1280px; margin: 0 auto; }
.page.narrow { max-width: 880px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 36px; }
.page-head .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

/* ---------- 通用组件（与 Atlas 原型相同） ---------- */
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 550; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: #cfd3dd; background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.lg { height: 40px; font-size: 14.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ibtn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.ibtn.sm { width: 26px; height: 26px; }
.input, .select, textarea.input { height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 11px; background: var(--surface); outline: none; width: 100%; }
.input.lg { height: 40px; font-size: 14.5px; }
textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-weak); }
.input[readonly] { background: var(--surface-2); color: var(--ink-2); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--ink-4); }
.search .input { padding-left: 32px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.tag.xs { height: 18px; padding: 0 6px; font-size: 11px; }
.tag.primary { background: var(--primary-weak); color: var(--primary-ink); }
.tag.success { background: var(--success-weak); color: var(--success); }
.tag.warning { background: var(--warning-weak); color: #b45309; }
.tag.danger { background: var(--danger-weak); color: var(--danger); }
.tag.blue { background: var(--secondary-weak); color: #0369a1; }
.tag.mono { font-family: var(--mono); font-weight: 500; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 650; display: inline-grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card.pad { padding: 16px 18px; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line-2); min-height: 50px; }
.card-b { padding: 14px 16px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs a { padding: 10px 0; color: var(--ink-3); font-weight: 550; position: relative; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); }
.tabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.tabs.inner { padding: 0 16px; margin-bottom: 0; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg a { padding: 4px 12px; border-radius: 7px; color: var(--ink-3); font-weight: 550; font-size: 13px; white-space: nowrap; }
.seg a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
.seg a .n { color: var(--ink-4); font-weight: 500; margin-left: 3px; }
.seg.block { display: flex; } .seg.block a { flex: 1; text-align: center; }
.switch { display: inline-block; vertical-align: middle; width: 36px; height: 20px; border-radius: 10px; background: #d5d9e2; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 18px; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr.click:hover td { background: var(--surface-2); cursor: pointer; }
.table tr.grp td { background: var(--surface-2); font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 7px 14px; }
.table.flat { border: none; border-radius: 0 0 var(--radius) var(--radius); }
.table .acts { text-align: right; white-space: nowrap; }
.table .acts > * { vertical-align: middle; }
.nw { white-space: nowrap; }
.empty { text-align: center; padding: 48px 20px; color: var(--ink-3); }
.empty .ill { width: 52px; height: 52px; border-radius: 16px; background: var(--primary-weak); color: var(--primary); display: grid; place-items: center; margin: 0 auto 12px; }
.empty .ill svg { width: 24px; height: 24px; }
.empty h3 { margin-bottom: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
a.chip:hover { background: var(--hover); color: var(--ink); }
.chip .x { color: var(--ink-4); cursor: pointer; display: inline-grid; }
.chip .x:hover { color: var(--danger); }
.chip .x svg { width: 13px; height: 13px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 12px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.divider { height: 1px; background: var(--line-2); margin: 16px 0; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.help { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
.radio-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); }
.radio-card:hover { border-color: #cfd3dd; }
.radio-card.on { border-color: var(--primary-2); background: #f8f8ff; box-shadow: 0 0 0 3px var(--primary-weak); }
.radio-card .r { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c5cad6; flex: none; margin-top: 2px; }
.radio-card.on .r { border: 5px solid var(--primary); }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: box-shadow .15s, border-color .15s; position: relative; }
.acard:hover { border-color: #d6d9e3; box-shadow: var(--shadow-md); }
.acard .desc { color: var(--ink-3); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
.acard .foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); margin-top: auto; }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
.alert svg { margin-top: 1px; }
.alert.danger { background: var(--danger-weak); color: #b91c1c; }
.alert.warning { background: var(--warning-weak); color: #92400e; }
.alert.info { background: var(--primary-weak); color: var(--primary-ink); }
.alert.plain { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.pager { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line-2); }
.pager .pg { min-width: 26px; height: 26px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 13px; color: var(--ink-2); }
.pager .pg.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }

/* 浮层 */
.pop { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; min-width: 200px; }
.pop .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.pop .mi:hover { background: var(--hover); color: var(--ink); }
.pop .mi.on { color: var(--primary-ink); }
.pop .mi.danger { color: var(--danger); }
.pop .sep { height: 1px; background: var(--line-2); margin: 5px 4px; }
.pop .ph { font-size: 11.5px; color: var(--ink-4); padding: 6px 10px 2px; }
.mask { position: fixed; inset: 0; background: rgba(15,23,42,.36); z-index: 80; display: grid; place-items: center; }
.modal { background: var(--surface); border-radius: 14px; width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal.wide { width: 720px; }
.modal-h { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.modal-b { padding: 18px 20px; overflow-y: auto; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.2); z-index: 70; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 600px; max-width: 92vw; background: var(--surface); z-index: 71; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.drawer-b { flex: 1; overflow-y: auto; padding: 18px 20px; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: var(--shadow-md); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ---------- 用户中心专用 ---------- */
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.split.narrow { grid-template-columns: 250px minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; position: sticky; top: 0; max-height: calc(100vh - var(--top-h) - 48px); overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line-2); }
.panel-b { overflow-y: auto; padding: 6px; }
.tn { display: flex; align-items: center; gap: 6px; height: 32px; padding-right: 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-2); font-size: 13.5px; }
.tn:hover { background: var(--hover); }
.tn.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.tn .tw { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-4); flex: none; border-radius: 4px; }
.tn .tw:hover { background: var(--line-2); color: var(--ink); }
.tn .tw svg { width: 14px; height: 14px; }
.tn > svg { color: var(--ink-4); width: 15px; height: 15px; }
.tn.on > svg { color: var(--primary); }
.tn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn .n { font-size: 12px; color: var(--ink-4); font-weight: 500; }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.li:hover { background: var(--hover); }
.li.on { background: var(--primary-weak); }
.li.on b { color: var(--primary-ink); }
.lg-label { font-size: 11.5px; color: var(--ink-4); padding: 10px 10px 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 14px; }
.stat { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.stat .v { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.opt:hover { background: var(--hover); }
.opt input { margin-top: 3px; }
.grp { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grp + .grp { margin-top: 10px; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line-2); font-weight: 600; font-size: 13.5px; }
.opgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 8px; padding: 4px; }
.savebar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.secret { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.once { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
.once .r { display: grid; grid-template-columns: 80px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.once .r:last-child { border-bottom: none; }
.once .r .v { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.quota { display: flex; align-items: center; gap: 8px; }
.quota .bar { width: 72px; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.quota .bar i { display: block; height: 100%; background: var(--primary-2); }
.quota .bar i.warn { background: var(--warning); }
.stack { display: inline-flex; }
.stack .sq { border: 2px solid var(--surface); margin-left: -6px; }
.stack .sq:first-child { margin-left: 0; }
.apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.app-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px; border-radius: 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-align: center; line-height: 1.3; }
.app-tile:hover { background: var(--hover); }
.app-tile.cur { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.mini { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); font-size: 12.5px; }

function render() {

  const app = document.getElementById('app');
  const tail = overlays() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  if (r.p === 'login') {
    app.innerHTML = `<div class="body full"><main class="main lg-main">${loginPage()}</main>${S.notes ? notesPanel(r) : ''}</div>` + tail;
    return afterRender();
  }
  if (r.p === 'ia') { app.innerHTML = `<div class="body full"><main class="main">${iaPage()}</main></div>` + tail; return; }
  if (!PLATFORMS.find((p) => p.id === r.p)) { location.replace('#/home'); return; }
  if (r.p === 'ops' && !r.a) { location.replace('#/ops/operators'); return; }
  app.innerHTML = topbar(r) + `<div class="body">${sider(r)}<main class="main">${page(r)}</main>${S.notes ? notesPanel(r) : ''}</div>` + tail;
  afterRender();
}

function page(r) {
  switch (r.p) {
    case 'home': return homePage();
    case 'tenants':
      if (r.a === 'capacity') return capacityPage();
      if (r.a) return tenantDetail(r.a);
      return tenantsPage();
    case 'apps': return r.a ? appDetail(r.a) : appsPage();
    case 'system':
      switch (r.a) {
        case 'templates': return templatesPage();
        case 'skills': return skillsPage();
        case 'scopes': return scopesPage();
        case 'params': return paramsPage();
        case 'jobs': return jobsPage();
      }
      return systemsPage();
    case 'ops': return r.a === 'audit' ? auditPage() : operatorsPage();
  }
  return '<div class="page">404</div>';
}

      <h2>登录</h2><div class="lg-sub">平台运营专用。这里能开通、停用所有企业，请用自己的账号登录</div>

function homePage() {
  const act = TENANTS.filter((t) => t.status === 'active');
  const todo = [];
  for (const t of running()) {
    const op = OPS[t.id].find((o) => o.status === 'RUNNING');
    const bad = op.steps.find((s) => s.status === 'FAILED');
    todo.push({ lv: op.stuck ? 'danger' : 'primary', icon: op.stuck ? 'alert' : 'refresh', t,
      title: `${t.name}：${KIND[op.kind][0]}${op.stuck ? '卡住了' : '进行中'}`,
      text: bad ? `${sysOf(bad.system).name}「${ACTION_LABEL[op.kind][bad.system] || ACTION_LABEL[op.kind]._}」第 ${bad.attempts} 次失败，${bad.next} 自动再试。${esc(bad.error)}` : '各系统依次处理中',
      acts: `<button class="btn sm" data-go="#/tenants/${t.id}">查看</button>${op.stuck ? `<button class="btn sm" ${guard()} data-act="toast" data-msg="马上重做失败的步骤">立即重做</button>` : ''}` });
  }
  for (const t of TENANTS.filter(expired)) todo.push({ lv: 'danger', icon: 'calendar', t, title: `${t.name}：${t.exp} 已到期`, text: `${t.users} 人都登录不了；续期后马上恢复`, acts: `<button class="btn sm" ${guard()} data-act="modal" data-type="editTenant" data-id="${t.id}">续期</button>` });
  for (const t of TENANTS.filter(expiringSoon)) todo.push({ lv: 'warning', icon: 'calendar', t, title: `${t.name}：还有 ${daysTo(t.exp)} 天到期`, text: `${t.exp} 到期后自动停用`, acts: `<button class="btn sm" ${guard()} data-act="modal" data-type="editTenant" data-id="${t.id}">续期</button>` });
  for (const s of SYSTEMS.filter((x) => !x.key)) todo.push({ lv: 'warning', icon: 'key', title: `${s.name}：没有配运营密钥`, text: '运营中心调不了它：开通、挂起、关闭租户时这一步会一直失败', acts: '<button class="btn sm" data-go="#/system">查看</button>' });
  const users = act.reduce((a, t) => a + t.users, 0);
  const stat = (icon, color, k, v, sub, h) => `<div class="kpi" ${h ? `data-go="${h}"` : ''}>${sq(icon, color, 36)}<div class="grow"><div class="k">${k}</div><div class="v">${v}</div><div class="xs muted">${sub}</div></div></div>`;
  const atlasU = CAPACITY.atlas.usage;
  return `<div class="page wide">
    ${head('总览', '', `${TODAY} 16:30 · 每 10 秒刷新`)}
    <div class="kpis">
      ${stat('building', '#4f46e5', '租户', `${act.length}<span class="u"> 个在用</span>`, `挂起 ${TENANTS.filter((t) => t.status === 'suspended').length} · 已关闭 ${TENANTS.filter((t) => t.status === 'closed').length}`, '#/tenants')}
      ${stat('users', '#0ea5e9', '用户', `${users}<span class="u"> 人</span>`, '在用租户里的账号总数', '#/tenants')}
      ${stat('refresh', running().some((t) => OPS[t.id][0].stuck) ? '#dc2626' : '#16a34a', '进行中的操作', `${running().length}<span class="u"> 个</span>`, running().some((t) => OPS[t.id][0].stuck) ? '<span style="color:var(--danger)">1 个有步骤失败</span>' : '都在正常推进', '#/tenants')}
      ${stat('calendar', '#d97706', '到期', `${TENANTS.filter(expiringSoon).length}<span class="u"> 个 30 天内</span>`, `已过期 ${TENANTS.filter(expired).length} 个`, '#/tenants')}
    </div>
    <div class="home-grid">
      <div class="card">
        <div class="card-h"><h3>需要处理</h3><span class="tag ${todo.length ? 'danger' : 'success'} xs">${todo.length}</span></div>
        ${todo.length ? todo.map((x) => `<div class="todo">
          <span class="todo-i ${x.lv}">${ic(x.icon)}</span>
          <div class="grow"><b>${esc(x.title)}</b><div class="sm muted" style="margin-top:2px">${x.text}</div></div>
          <div class="row" style="gap:6px">${x.acts}</div></div>`).join('') : empty('check2', '没有要处理的事', '卡住的操作、快到期的租户会出现在这里')}
      </div>
      <div class="col" style="gap:16px">
        <div class="card">
          <div class="card-h"><h3>系统用量</h3><span class="sp"></span><a class="sm" href="#/tenants/capacity">份额与容量 ${ic('right')}</a></div>
          <div class="card-b col" style="gap:12px">
            <div class="usage-row">${sq('spark', '#4f46e5', 28)}<div class="grow"><b>Atlas</b><div class="xs muted">每个实例 ${CAPACITY.atlas.perInstance} 个并发槽位</div></div>
              <div class="mini-stat"><b>${atlasU.running_runs}</b><span>运行中</span></div><div class="mini-stat"><b>${atlasU.sandboxes}</b><span>沙箱</span></div><div class="mini-stat"><b>${bytes(atlasU.storage_bytes)}</b><span>存储</span></div></div>
            <div class="usage-row">${sq('book', '#0ea5e9', 28)}<div class="grow"><b>知识库</b><div class="xs muted">文档与向量</div></div><div class="mini-stat"><b>${bytes(CAPACITY.knowledge.usage.storage_bytes)}</b><span>存储</span></div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>最近的运营操作</h3><span class="sp"></span><a class="sm" href="#/ops/audit">运营审计 ${ic('right')}</a></div>
          <div class="card-b" style="padding-top:6px;padding-bottom:6px">${AUDIT.slice(0, 6).map((a) => `<div class="feed">${pav(a.who, 24)}<div class="grow ellipsis"><b>${esc(a.who)}</b> <span class="muted">${esc(auditLabel(a))}</span> ${esc(a.target || '')}</div>${resultTag(a.result)}<span class="xs faint nw">${a.at.slice(5, 16)}</span></div>`).join('')}</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
 * 租户
 * ===================================================================== */
function tenantsPage() {
  const q = S.tQ.trim().toLowerCase();
  const by = {
    all: () => true, active: (t) => t.status === 'active' && !expired(t), expired: (t) => expired(t) || expiringSoon(t),
    suspended: (t) => t.status === 'suspended', closed: (t) => t.status === 'closed',
  };
  const rows = TENANTS.filter(by[S.tStatus]).filter((t) => !q || t.name.toLowerCase().includes(q) || t.code.includes(q));
  const n = (k) => TENANTS.filter(by[k]).length;
  return `<div class="page">
    ${head('租户', `<button class="btn primary" ${guard()} data-act="modal" data-type="openTenant">${ic('plus')}开通租户</button>`, '每个企业一个租户：账号、数据、份额彼此隔开。运营中心只看得到元数据和数字，看不到企业的业务内容')}
    <div class="toolbar">${searchBox('搜索名称或企业代码', 'tQ')}
      ${seg('tStatus', [['all', '全部', n('all')], ['active', '正常', n('active')], ['expired', '到期', n('expired')], ['suspended', '已挂起', n('suspended')], ['closed', '已关闭', n('closed')]])}</div>
    ${rows.length ? `<table class="table"><thead><tr><th>租户</th><th>状态</th><th>人数 / 名额</th><th>开通的应用</th><th>到期</th><th></th></tr></thead><tbody>
      ${rows.map((t) => `<tr class="click" data-go="#/tenants/${t.id}">
        <td><div class="row" style="gap:10px">${tenantIcon(t)}<div><b class="nw">${esc(t.name)}</b><div class="xs muted mono">${esc(t.code)}</div></div></div></td>
        <td><div class="row" style="gap:4px;flex-wrap:wrap">${tenantStatus(t)}</div></td>
        <td>${seatCell(t)}</td>
        <td>${t.status === 'closed' ? '<span class="muted">—</span>' : `<span class="stack">${S.enabledApps[t.id].map((id) => { const a = appOf(id); return `<span title="${esc(a.name)}">${sq(a.icon, a.color, 24)}</span>`; }).join('')}</span>`}</td>
        <td class="sm">${expiryCell(t)}</td>
        <td class="acts"><button class="ibtn sm" data-pop="tenantMore" data-id="${t.id}">${ic('more')}</button></td></tr>`).join('')}
    </tbody></table>` : `<div class="card">${empty('building', '没有符合条件的租户', '换个筛选条件，或者开通一个新租户')}</div>`}
  </div>`;
}

function opTimeline(op, openByDefault) {
  const open = S.opOpen[op.id] ?? openByDefault;
  const st = (s) => s.status === 'DONE' ? `<span class="step-i done">${ic('check')}</span>` : s.status === 'FAILED' ? `<span class="step-i fail">${ic('x')}</span>` : `<span class="step-i wait">${ic('dot')}</span>`;
  return `<div class="op">
    <div class="op-h" data-act="toggleOp" data-id="${op.id}">
      <span class="tag ${KIND[op.kind][1]}">${KIND[op.kind][0]}</span>
      <b class="sm">${op.status === 'DONE' ? `完成于 ${op.done}` : op.stuck ? '有步骤失败，自动重试中' : '进行中'}</b>
      <span class="sm muted">${esc(op.by)} · ${op.at}${op.reason ? ` · ${esc(op.reason)}` : ''}</span>
      <span class="sp"></span>
      ${op.status === 'RUNNING' && op.stuck ? `<button class="btn sm" ${guard()} data-act="toast" data-msg="马上重做失败的步骤（不等退避）">${ic('refresh')}立即重做</button>` : ''}
      <span class="faint">${ic(open ? 'down' : 'right')}</span>
    </div>
    ${open ? `<div class="steps">${op.steps.map((s) => `<div class="step ${s.status.toLowerCase()}">${st(s)}
      <div class="grow"><div class="row" style="gap:6px">${sq(sysOf(s.system).icon, sysOf(s.system).color, 20)}<b class="sm">${sysOf(s.system).name}</b><span class="sm muted">${ACTION_LABEL[op.kind][s.system] || ACTION_LABEL[op.kind]._}</span></div>
        ${s.error ? `<div class="xs" style="color:var(--danger);margin-top:3px">${esc(s.error)}</div>` : ''}
        ${s.deleted ? `<div class="xs muted" style="margin-top:3px">删了 ${Object.entries(s.deleted).map(([k, v]) => `${k} ${v}`).join('、')}</div>` : ''}</div>
      <span class="xs muted nw">${s.status === 'DONE' ? `完成 ${s.finished}` : s.status === 'FAILED' ? `第 ${s.attempts} 次失败 · ${s.next} 再试` : '等前面的步骤'}</span></div>`).join('')}</div>` : ''}
  </div>`;
}

function tenantDetail(id) {
  const t = tenantOf(id);
  if (!t) return '<div class="page">租户不存在</div>';
  const ops = OPS[t.id] || [];
  const run = ops.find((o) => o.status === 'RUNNING');
  const admins = { t4: 'liu.admin', t1: 'xh.admin', t2: 'moshi.admin', t3: 'yf.admin', t5: 'qh.admin', t6: 'lj.admin', t0: 'admin' };
  const right = t.status === 'closed' ? '' : `<div class="row">
    <button class="btn" ${guard()} data-act="modal" data-type="editTenant" data-id="${t.id}">${ic('pencil')}编辑</button>
    ${t.status === 'suspended' ? `<button class="btn" ${guard()} ${run ? 'disabled' : ''} data-act="toast" data-msg="已发起恢复：先放开各系统，最后放开用户中心的入口">${ic('play')}恢复</button>` : ''}
    <button class="ibtn" data-pop="tenantMore" data-id="${t.id}">${ic('more')}</button></div>`;
  const tabsHtml = tabs('tenantTab', [['overview', '概况'], ['apps', '应用', S.enabledApps[t.id].length], ['quota', '份额与用量'], ['ops', '操作记录', ops.length]]);
  let body = '';
  if (S.tenantTab === 'overview') {
    const au = CAPACITY.atlas.tenantUsage[t.id] || {};
    const aq = quotaOf('atlas', t.id) || CAPACITY.atlas.def;
    body = `<div class="detail-grid">
      <div class="card"><div class="card-h"><h3>基本信息</h3></div><div class="card-b"><dl class="kv">
        <dt>企业代码</dt><dd>${mono(t.code)}<span class="xs muted">登录时输入，建好不能改</span></dd>
        <dt>名称</dt><dd>${esc(t.name)}</dd>
        <dt>状态</dt><dd>${tenantStatus(t)}</dd>
        <dt>人数 / 名额</dt><dd>${seatCell(t)}</dd>
        <dt>到期</dt><dd>${t.exp ? expiryCell(t) : '不到期'}</dd>
        <dt>首个管理员</dt><dd>${mono(admins[t.id])}${t.status === 'active' ? `<a class="sm" ${admin() ? 'data-act="modal" data-type="reissue"' : ''} data-id="${t.id}">补发临时密码</a>` : ''}</dd>
        <dt>开通时间</dt><dd>${t.created}</dd>
        <dt>租户 id</dt><dd><span class="mono xs">${'44351406-5cd8-4936-99ea-56be6ea18edb'.replace('4435', '44' + t.id.slice(1) + '5')}</span>${copyBtn()}</dd>
      </dl></div></div>
      <div class="card"><div class="card-h"><h3>用量</h3><span class="sp"></span><a class="sm" data-act="setS" data-k="tenantTab" data-v="quota">份额与用量 ${ic('right')}</a></div><div class="card-b col" style="gap:14px">
        ${t.status === 'closed' ? '<div class="muted sm">已关闭，数据已删除</div>' : ['running_runs', 'sandboxes', 'storage_bytes'].map((f) => usageBar(`Atlas · ${QF[f][0]}`, f, au[f] ?? 0, aq[f])).join('') + usageBar('知识库 · 存储', 'storage_bytes', CAPACITY.knowledge.tenantUsage[t.id]?.storage_bytes ?? 0, (quotaOf('knowledge', t.id) || CAPACITY.knowledge.def).storage_bytes)}
      </div></div>
    </div>`;
  } else if (S.tenantTab === 'apps') {
    body = `<div class="card"><div class="card-h"><h3>开通的应用</h3><span class="sm muted">关掉后这个企业的所有人都用不了它；谁能用由企业管理员在用户中心定</span></div>
      <table class="table flat"><thead><tr><th>应用</th><th>入口</th><th>状态</th><th style="width:120px">为这个企业开通</th></tr></thead><tbody>
      ${APPS.map((a) => { const on = S.enabledApps[t.id].includes(a.id); return `<tr>
        <td><div class="row" style="gap:10px">${sq(a.icon, a.color, 28)}<div><b>${esc(a.name)}</b><div class="xs muted mono">${esc(a.code)}</div></div></div></td>
        <td class="sm mono muted">${esc(a.home || '—')}</td>
        <td>${a.status === 'disabled' ? '<span class="tag">平台已停用</span>' : '<span class="tag success">可用</span>'}</td>
        <td>${a.code === 'usercenter' ? '<span class="xs muted">必开</span>' : `<span class="switch ${on ? 'on' : ''} ${admin() && t.status !== 'closed' ? '' : 'off-dis'}" ${admin() && t.status !== 'closed' ? `data-act="toggleApp" data-t="${t.id}" data-id="${a.id}"` : ''}></span>`}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  } else if (S.tenantTab === 'quota') {
    body = `<div class="col" style="gap:14px">${withCap('capacity').map((s) => {
      const own = quotaOf(s.code, t.id);
      const q = own || CAPACITY[s.code].def;
      const u = CAPACITY[s.code].tenantUsage[t.id] || {};
      const fields = Object.keys(CAPACITY[s.code].def);
      return `<div class="card"><div class="card-h">${sq(s.icon, s.color, 24)}<h3>${s.name}</h3>${own ? `<span class="tag primary xs">单独定的份额</span><span class="xs muted">${esc(own.by)} · ${own.at}</span>` : '<span class="tag xs">用默认份额</span>'}<span class="sp"></span>
        ${own ? `<button class="btn sm ghost" ${guard()} data-act="toast" data-msg="已改回默认份额">改回默认</button>` : ''}<button class="btn sm" ${guard()} data-act="modal" data-type="quota" data-sys="${s.code}" data-t="${t.id}">${own ? '修改' : '单独定份额'}</button></div>
        <div class="card-b quota-grid">${fields.map((f) => usageBar(QF[f][0], f, u[f] ?? 0, q[f])).join('')}</div></div>`;
    }).join('')}
    ${alertBox('plain', '企业里每个人的上限由企业管理员在这份额度内自己定。超了份额的新请求会被拒（已在跑的不打断）')}</div>`;
  } else {
    body = ops.length ? `<div class="col" style="gap:10px">${ops.map((o, i) => opTimeline(o, i === 0)).join('')}</div>` : `<div class="card">${empty('history', '还没有操作', '开通、挂起、恢复、关闭都会记在这里')}</div>`;
  }
  return `<div class="page">
    ${detailHead('#/tenants', tenantIcon(t, 40), t.name, `企业代码 <span class="mono">${esc(t.code)}</span> · 开通于 ${t.created.slice(0, 10)}`, `<div class="row" style="gap:4px">${tenantStatus(t)}</div>`, right)}
    ${run ? `<div style="margin:12px 0 4px">${alertBox(run.stuck ? 'danger' : 'info', `${KIND[run.kind][0]}还没做完：${run.steps.filter((s) => s.status === 'DONE').length} / ${run.steps.length} 个系统已完成${run.stuck ? '，有一步失败了，在自动重试' : ''}。<a data-act="setS" data-k="tenantTab" data-v="ops">看进度</a>`)}</div>` : ''}
    ${t.status === 'suspended' ? `<div style="margin:12px 0 4px">${alertBox('warning', `已挂起：${esc(OPS[t.id][0].reason || '')}。登录和各系统调用都被拒绝，数据都留着，恢复后接着用`)}</div>` : ''}
    ${t.status === 'closed' ? `<div style="margin:12px 0 4px">${alertBox('plain', '已关闭：各系统的数据已删除，企业代码不能再用')}</div>` : ''}
    <div style="margin-top:14px">${tabsHtml}</div>${body}
  </div>`;
}
function usageBar(label, f, used, cap) {
  const p = cap ? Math.min(100, Math.round((used * 100) / cap)) : 0;
  return `<div class="ubar"><div class="row"><span class="sm">${label}</span><span class="sp"></span><span class="sm"><b>${fmtQ(f, used)}</b><span class="muted"> / ${fmtQ(f, cap)}</span></span></div>
    <div class="ubar-t"><i class="${p >= 90 ? 'warn' : ''}" style="width:${cap ? p : 0}%"></i></div></div>`;
}

    ${head('份额与容量', '', '份额管的是每个企业最多能占多少共用资源（同时运行的对话、沙箱、存储）。没单独定的企业用默认份额')}

          <div class="def-row"><b class="sm">默认份额</b>${fields.map((f) => `<span class="chip">${QF[f][0]} <b>${fmtQ(f, c.def[f])}</b></span>`).join('')}<span class="sp"></span>

        </div>
        <div class="sub-h">单独定了份额的企业 <span class="muted">${c.tenants.length}</span></div>

            ${fields.map((f) => `<td class="sm">${usageMini(f, c.tenantUsage[t.id]?.[f] ?? 0, q[f])}</td>`).join('')}

      <table class="table"><thead><tr><th>编码</th><th>名称</th><th>说明</th><th>登记的数据</th><th></th></tr></thead><tbody>
      ${APP_DATA.map((d) => `<tr><td>${mono(d[0])}</td><td>${d[1]}</td><td class="sm muted">${d[2]}</td><td class="sm">${d[3]} 条</td><td class="acts">${admin() ? '<button class="btn sm ghost">编辑</button>' : ''}</td></tr>`).join('')}</tbody></table>`;
  } else {
    const r = APP_ROLES.find((x) => x.id === S.roleSel) || APP_ROLES[0];
    const mods = [...new Set(APP_OPS.map((o) => o[0]))];
    body = `<div class="split">
      <div class="panel"><div class="panel-h"><b class="sm grow">内置角色</b><button class="ibtn sm" ${guard()} title="新增内置角色">${ic('plus')}</button></div><div class="panel-b">
        ${APP_ROLES.map((x) => `<div class="li ${x.id === r.id ? 'on' : ''}" data-act="setS" data-k="roleSel" data-v="${x.id}">${sq('badge', colorOf(x.code), 28)}<div class="grow"><b class="sm">${x.name}</b><div class="xs muted mono">${x.code}</div></div>${x.shared ? '<span class="tag xs blue" title="开通应用时自动授给企业里的所有人">全员</span>' : ''}</div>`).join('')}
      </div></div>
      <div class="card">

        <div style="padding:0 16px">${tabs('roleTab', [['ops', '操作码', r.ops.length], ['menus', '菜单', r.menus.length]], 'inner')}</div>
        <div class="card-b">${S.roleTab === 'ops' ? mods.map((m) => `<div class="grp"><div class="grp-h">${m}</div><div class="opgrid">${APP_OPS.filter((o) => o[0] === m).map((o) => `<label class="opt"><input type="checkbox" ${r.ops.includes(o[1]) ? 'checked' : ''} ${admin() ? '' : 'disabled'}><div><div class="sm">${o[2]}</div><div class="xs muted mono">${o[1]}</div></div></label>`).join('')}</div></div>`).join('')
          : APP_MENUS.map((m) => `<label class="opt" style="padding-left:${m.p ? 32 : 10}px"><input type="checkbox" ${r.menus.includes(m.id) ? 'checked' : ''} ${admin() ? '' : 'disabled'}><span class="sm">${m.name}</span></label>`).join('')}</div>
        ${admin() ? `<div class="savebar"><span class="xs muted">内置角色改了，所有企业里的这个角色都跟着变（企业自建的角色不受影响）</span><span class="sp"></span><button class="btn primary sm" data-act="toast" data-msg="已保存">保存</button></div>` : ''}

  </div>`;
}

    const p = Object.values(PARAMS).flat().find((x) => x.key === d.id);
    if (d.type === 'paramHist') return frame(p.name, `<span class="tag xs mono">${p.key}</span>`, `<table class="table"><thead><tr><th>版本</th><th>值</th><th>修改说明</th><th>修改人 · 时间</th><th></th></tr></thead><tbody>
      ${(p.changed ? [[3, JSON.stringify(p.value), '加了 node:22', '周周 · 11-20 10:12', true], [2, '["atlas-sandbox:dev","python:3.13-slim"]', '', '运营管理员 · 11-15 02:01'], [1, '默认', '', '—']] : [[1, '默认', '', '—', true]]).map(([v, val, note, who, cur]) => `<tr><td class="sm">v${v}${cur ? ' <span class="tag xs success">当前</span>' : ''}</td><td class="sm mono">${esc(val)}</td><td class="sm muted">${esc(note) || '—'}</td><td class="sm muted">${who}</td><td class="acts">${!cur && admin() ? '<button class="btn sm ghost" data-act="toastClose" data-msg="已回滚，存成新的一版">回滚到这一版</button>' : ''}</td></tr>`).join('')}</tbody></table>`);
    return frame(`修改：${p.name}`, `<span class="tag xs mono">${p.key}</span>`, `<div class="form">
      <div><label class="label">值</label>${p.type === 'list' ? `<div class="col" style="gap:6px">${p.value.map((v) => `<div class="row"><input class="input mono" value="${esc(v)}"><button class="ibtn sm">${ic('x')}</button></div>`).join('')}<button class="btn sm" style="align-self:flex-start">${ic('plus')}加一项</button></div>` : p.type === 'bool' ? `<span class="switch ${p.value ? 'on' : ''}" data-act="toggleSwitch"></span>` : `<input class="input mono" value="${esc(String(p.value))}">`}</div>
      <div><label class="label">修改说明</label><input class="input" placeholder="会记进修订历史，如：加了 node:22"></div>
      ${alertBox('plain', '下一次用到时生效（不用重启）；改坏了可以在「历史」里回滚')}</div>`, `<button class="btn ghost" data-act="toastClose" data-msg="已恢复默认值">恢复默认</button><span class="sp"></span><button class="btn" data-act="closeDrawer">取消</button><button class="btn primary" data-act="toastClose" data-msg="已保存，存成新的一版">保存</button>`);
  }
  if (d.type === 'job') {
    const j = Object.values(JOBS).flat().find((x) => x[0] === d.id);
    return frame(j[0], j[3] === 'fail' ? '<span class="tag xs danger">上次失败</span>' : '<span class="tag xs success">正常</span>', `<dl class="kv" style="margin-bottom:14px"><dt>做什么</dt><dd>${j[1]}</dd><dt>触发</dt><dd>${j[2]}</dd><dt>运行份数</dt><dd>每个实例一份</dd></dl>

  }
  if (d.type === 'audit') {
    const a = AUDIT.find((x) => x.at === d.id);
    return frame(auditLabel(a), resultTag(a.result), `<dl class="kv"><dt>时间</dt><dd>${a.at}</dd><dt>运营人员</dt><dd>${pav(a.who, 22)}${esc(a.who)}</dd><dt>操作</dt><dd class="mono">${a.action}</dd><dt>对象</dt><dd>${esc(a.target || '—')}</dd>${a.result === null ? '<dt>结果</dt><dd>跨系统的操作还在进行，做完后补记</dd>' : ''}</dl>

      <div class="xs muted" style="margin-top:8px">响应里的密钥、临时密码不进审计</div>`);
  }
  return '';
}

function popContent(id) {
  if (id === 'me') return `<div class="row" style="padding:8px 10px;gap:10px">${pav(ME.name, 34)}<div><b>${esc(ME.name)}</b><div class="xs muted">${esc(ME.account)} · ${ROLE[S.role][0]}</div></div></div><div class="sep"></div>
    <a class="mi" data-act="modal" data-type="myPw">${ic('key')}修改密码</a>
    <div class="ph">演示：切换身份</div>
    <a class="mi ${S.role === 'ADMIN' ? 'on' : ''}" data-act="role" data-v="ADMIN">${ic(S.role === 'ADMIN' ? 'check' : 'user')}运营管理员（能改）</a>
    <a class="mi ${S.role === 'OBSERVER' ? 'on' : ''}" data-act="role" data-v="OBSERVER">${ic(S.role === 'OBSERVER' ? 'check' : 'eye')}运营观察员（只能看）</a>
    <div class="sep"></div><a class="mi danger" data-act="logout">${ic('logout')}退出登录</a>`;
  if (id === 'tenantMore') {
    const t = tenantOf(S.pop.tid);
    const dis = admin() ? '' : 'style="opacity:.5;pointer-events:none"';
    if (t.status === 'closed') return `<a class="mi" data-go="#/tenants/${t.id}">${ic('eye')}查看</a>`;
    return `<a class="mi" data-go="#/tenants/${t.id}">${ic('eye')}查看</a>
      <a class="mi" ${dis} data-act="modal" data-type="editTenant" data-id="${t.id}">${ic('pencil')}编辑名称、名额、到期</a>
      ${t.status === 'active' ? `<a class="mi" ${dis} data-act="modal" data-type="reissue" data-id="${t.id}">${ic('key')}补发首个管理员的临时密码</a>` : ''}
      <div class="sep"></div>
      ${t.status === 'active' ? `<a class="mi" ${dis} data-act="modal" data-type="suspend" data-id="${t.id}">${ic('pause')}挂起</a>` : `<a class="mi" ${dis} data-act="toast" data-msg="已发起恢复">${ic('play')}恢复</a>`}
      <a class="mi danger" ${dis} data-act="modal" data-type="close" data-id="${t.id}">${ic('trash')}关闭并删除数据</a>`;
  }
  if (id === 'appMore') {
    const a = appOf(S.pop.tid);
    const dis = admin() ? '' : 'style="opacity:.5;pointer-events:none"';
    return `<a class="mi" ${dis} data-act="modal" data-type="rotate" data-id="${a.id}">${ic('refresh')}轮换 App Secret</a>
      ${a.builtin ? '<div class="mi" style="cursor:default;color:var(--ink-4)">' + ic('lock') + '产品自带，不能停用</div>' : a.status === 'active' ? `<a class="mi danger" ${dis} data-act="modal" data-type="disableApp" data-id="${a.id}">${ic('ban')}停用</a>` : `<a class="mi" ${dis} data-act="toast" data-msg="已启用">${ic('power')}启用</a>`}`;
  }
  return '';
}

function overlays() {
  let pop = '';
  if (S.pop) pop = `<div class="pop" style="position:fixed;left:${S.pop.x}px;top:${S.pop.y}px;max-height:calc(100vh - ${S.pop.y + 12}px);overflow-y:auto" data-stop>${popContent(S.pop.id)}</div>`;
  return pop + modal() + drawer();
}

    ['份额与容量', '#/tenants/capacity', ''], ['应用目录', '#/apps', ''], ['应用详情', '#/apps/a1', '五个页签'],
    ['接入的系统', '#/system', '新增'], ['沙箱模板', '#/system/templates', '点行打开抽屉'], ['技能市场', '#/system/skills', ''],
    ['记忆作用域', '#/system/scopes', ''], ['系统参数', '#/system/params', ''], ['系统任务', '#/system/jobs', ''],
    ['运营账号', '#/ops/operators', ''], ['运营审计', '#/ops/audit', ''],
  ];
  const map = [
    ['（无，登录后进租户列表）', '总览', '新增'], ['租户', '租户 › 租户', ''], ['容量', '租户 › 份额与容量', '挪位置'],
    ['应用目录', '应用 › 应用目录', ''], ['系统设置 › 沙箱模板', '系统 › 运行资源 › 沙箱模板', ''], ['系统设置 › 技能市场', '系统 › 运行资源 › 技能市场', ''],
    ['系统设置 › 记忆作用域', '系统 › 运行资源 › 记忆作用域', ''], ['系统设置 › 系统参数', '系统 › 配置 › 系统参数', ''], ['系统设置 › 系统任务', '系统 › 配置 › 系统任务', ''],
    ['（无）', '系统 › 接入的系统', '新增'], ['运营 › 运营账号', '运营 › 运营账号', ''], ['运营 › 运营审计', '运营 › 运营审计', ''], ['/password 页', '登录第二步 + 账号菜单「修改密码」', '合并'],
  ];
  return `<div class="ia">
    <div class="row"><span class="logo">A</span><h1>运营中心改版 · 信息架构</h1><span class="sp"></span><a class="btn" href="#/home">进入原型 ${ic('right')}</a></div>
    <p class="muted" style="margin-top:8px">照 Atlas 的前端风格重画：浅色、顶部一级菜单 + 左侧二级菜单、线性图标、卡片和表格样式同 Atlas。功能不变，只多两页（总览、接入的系统），页面里的信息重新组织。</p>
    <h2>一级菜单</h2>
    <table class="table"><thead><tr><th>一级</th><th>二级</th><th>给谁看</th></tr></thead><tbody>
      <tr><td>总览</td><td>—（整页，没有左侧菜单）</td><td>每天先看这里</td></tr>
      <tr><td>租户</td><td>租户、份额与容量；下方列出进行中的操作</td><td>开通、续期、挂起、关闭企业</td></tr>
      <tr><td>应用</td><td>应用目录；下方列出已接入的应用</td><td>接入应用、维护操作码 / 菜单 / 内置角色</td></tr>
      <tr><td>系统</td><td>接入的系统；运行资源（沙箱模板、技能市场、记忆作用域）；配置（系统参数、系统任务）</td><td>平台本身的配置</td></tr>
      <tr><td>运营</td><td>运营账号、运营审计</td><td>运营团队自己</td></tr>
    </tbody></table>
    <h2>现状对照</h2>
    <table class="table"><thead><tr><th>现在</th><th>改版后</th><th></th></tr></thead><tbody>${map.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${c ? `<span class="tag xs ${c === '新增' ? 'primary' : ''}">${c}</span>` : ''}</td></tr>`).join('')}</tbody></table>
    <h2>页面导览</h2>
    <table class="table"><tbody>${pages.map(([n, h, d]) => `<tr><td style="width:240px"><a href="${h}">${n}</a></td><td class="sm muted">${d}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

/* =====================================================================
 * 交互
 * ===================================================================== */
const ACT = {
  toggleNotes: () => { S.notes = !S.notes; },
  collapse: () => { S.collapsed = !S.collapsed; },
  toast: (el) => { S.pop = null; toast(el.dataset.msg || '（原型）'); return false; },
  toastClose: (el) => { S.modal = null; S.drawer = null; toast(el.dataset.msg); return false; },
  setS: (el) => { S[el.dataset.k] = el.dataset.v; },
  role: (el) => { S.role = el.dataset.v; S.pop = null; },
  logout: () => { S.login.step = 'form'; S.login.err = ''; go('#/login'); return false; },
  toggleOp: (el) => { const id = el.dataset.id; const first = Object.values(OPS).some((l) => l[0]?.id === id); S.opOpen[id] = !(S.opOpen[id] ?? first); },
  toggleApp: (el) => { const l = S.enabledApps[el.dataset.t]; const i = l.indexOf(el.dataset.id); if (i >= 0) l.splice(i, 1); else l.push(el.dataset.id); toast(i >= 0 ? '已关闭：这个企业的人马上用不了' : '已开通'); return false; },
  toggleSkill: (el) => { S.skillOpen = S.skillOpen === el.dataset.id ? '' : el.dataset.id; },
  toggleDefSkill: (el) => { S.defSkills[el.dataset.id] = !S.defSkills[el.dataset.id]; },
  toggleSwitch: (el) => { el.classList.toggle('on'); return false; },
  openQuota: (el) => { S.openQuota[el.dataset.sys] = !!el.dataset.v; },
  openSubmit: () => { S.openStep = 'done'; },
  openDone: () => { S.modal = null; S.openStep = 'form'; go('#/tenants/t4'); return false; },
  modal: (el) => { S.pop = null; S.modal = { ...el.dataset }; },
  closeModal: () => { S.modal = null; S.openStep = 'form'; },
  drawer: (el) => { S.drawer = { ...el.dataset }; S.tplTab = 'yaml'; },
  closeDrawer: () => { S.drawer = null; },
  togglePw: () => { S.login.showPw = !S.login.showPw; },
  loginSet: (el) => { S.login.result = el.dataset.v; S.login.err = ''; S.login.step = 'form'; },
  loginBack: () => { S.login.step = 'form'; },
  doLogin: () => {
    const L = S.login;
    if (LOGIN_ERR[L.result]) { L.err = L.result; return; }
    L.err = '';
    if (L.result === 'must') { L.step = 'setpw'; return; }
    ACT.doLoginOk(); return false;
  },
  doSetPw: () => { S.login.step = 'form'; ACT.doLoginOk(); return false; },
  doLoginOk: () => { go('#/home'); return false; },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-go],[data-pop]');
  // 可点的行里的链接（审计里的租户名）：链接优先，不触发整行
  const link = e.target.closest('a[href]');
  if (link && !link.dataset.act && (!el || el.contains(link))) { e.preventDefault(); return go(link.getAttribute('href')); }
  if (!el) { if (S.pop && !e.target.closest('[data-stop]')) { S.pop = null; render(); } return; }
  if (el.dataset.act === 'closeModal' && el.classList.contains('mask') && e.target !== el) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  if (S.pop && !el.dataset.pop && !el.closest('.pop')) S.pop = null;
  if (el.dataset.pop) {
    const id = el.dataset.pop;
    if (S.pop?.id === id && S.pop.tid === el.dataset.id) { S.pop = null; return render(); }
    const rc = el.getBoundingClientRect();
    const w = 240;
    const x = Math.max(12, Math.min(rc.right - w, window.innerWidth - w - 12));
    S.pop = { id, tid: el.dataset.id, x, y: rc.bottom + 6 }; return render();
  }
  if (el.dataset.go && !el.dataset.act) return go(el.dataset.go);
  const fn = ACT[el.dataset.act];
  if (fn) { if (fn(el, e) !== false) render(); if (el.dataset.go) go(el.dataset.go); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (S.modal || S.drawer || S.pop)) { S.modal = null; S.drawer = null; S.pop = null; S.openStep = 'form'; render(); }
  if (e.key === 'Enter' && e.target.dataset?.enter === 'login') { ACT.doLogin(); render(); }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset?.input; if (!k) return;
  if (k === 'pw1' || k === 'pw2') { S.login[k] = e.target.value; return; }
  S[k] = e.target.value; S.refocus = { sel: `[data-input="${k}"]`, pos: e.target.selectionStart }; render();
});
function afterRender() {
  if (S.refocus) { const el = document.querySelector(S.refocus.sel); if (el) { el.focus(); el.setSelectionRange?.(S.refocus.pos, S.refocus.pos); } S.refocus = null; }
}
render();

</script>
