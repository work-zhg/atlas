<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas 手机端 · 对话与工作空间（原型）</title>
<style>
/* 视觉沿用 atlas-console / workspace / device-cli 原型的浅色设计 token */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd; --hover: #f2f4f8;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff; --primary-ink: #4338ca;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #d97706; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  /* 手机：状态栏高度、底部安全区（评审外壳里是假的，真机上取 env()） */
  --sb: 47px; --safe-b: 22px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: #eceef3; color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font-family: var(--mono); }
.avatar { border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 650; flex: none; }
.avatar.sq { border-radius: 30%; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; flex: none; }
.tag.primary { background: var(--primary-weak); color: var(--primary-ink); }
.tag.success { background: var(--success-weak); color: var(--success); }
.tag.warning { background: var(--warning-weak); color: var(--warning); }
.tag.danger { background: var(--danger-weak); color: var(--danger); }
.tag.blue { background: var(--secondary-weak); color: #0369a1; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.run { background: var(--success); box-shadow: 0 0 0 3px var(--success-weak); }
.dot.wait { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-weak); }
.dot.off { background: var(--ink-4); }

/* ---------- 评审外壳：左侧屏幕目录 + 手机 + 设计说明（不是产品界面） ---------- */
.stage { display: flex; height: 100vh; }
.index { width: 232px; flex: none; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px 40px; }
.index .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; padding: 0 6px 4px; }
.index .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; display: grid; place-items: center; font-size: 14px; }
.index .sub { font-size: 12px; color: var(--ink-3); padding: 0 6px 8px; }
.index h5 { font-size: 11.5px; color: var(--ink-4); margin: 14px 8px 4px; font-weight: 600; letter-spacing: .04em; }
.index a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13px; }
.index a:hover { background: var(--hover); }
.index a.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.index .tg { display: flex; align-items: center; gap: 6px; margin: 4px 6px 0; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
.center { flex: 1; min-width: 0; display: grid; place-items: center; overflow: auto; padding: 20px; }
.frame { width: 414px; height: 868px; border-radius: 60px; background: #0b0d12; padding: 12px; box-shadow: 0 30px 80px rgba(15,23,42,.25), inset 0 0 0 2px #2a2f3a; flex: none; }
@media (max-height: 920px) { .frame { zoom: .9; } }
@media (max-height: 820px) { .frame { zoom: .8; } }
.screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: var(--surface); }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: var(--sb); display: flex; align-items: center; justify-content: space-between; padding: 4px 28px 0 44px; font-weight: 650; font-size: 15px; z-index: 50; pointer-events: none; }
.statusbar .r { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 60; }
.homeind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #0f172a; z-index: 60; pointer-events: none; }
.notes { width: 320px; flex: none; overflow-y: auto; background: #fffdf3; border-left: 1px solid #f3e3a6; padding: 14px 16px 40px; font-size: 13px; }
.notes .scope { background: #fef3c7; border-radius: 8px; padding: 8px 10px; color: #78350f; margin-bottom: 6px; }
.notes h4 { font-size: 13px; margin: 12px 0 4px; color: #92400e; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 3px 0; color: #57534e; }
.notes .be { display: inline-block; font-size: 11px; background: #fde68a; color: #92400e; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
.notes .demo { margin-top: 12px; padding: 10px; border: 1px dashed #e7c66b; border-radius: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.seg a { padding: 3px 10px; border-radius: 6px; border: 1px solid #e7d9a8; color: #78350f; font-size: 12.5px; background: #fff; }
.seg a.on { background: #92400e; border-color: #92400e; color: #fff; }

/* 真手机上打开：去掉外壳，界面铺满 */
@media (max-width: 640px) {
  :root { --sb: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  body { background: var(--surface); }
  .index, .notes, .statusbar, .island, .homeind { display: none !important; }
  .center { padding: 0; display: block; }
  .frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1 !important; }
  .screen { width: 100%; height: 100%; border-radius: 0; }
}

/* =====================================================================
 * 手机界面
 * ===================================================================== */
.app { position: absolute; inset: var(--sb) 0 0 0; display: flex; flex-direction: column; background: var(--surface); font-size: 15px; }
.mh { height: 52px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--surface); position: relative; z-index: 5; }
.mh.line { border-bottom: 1px solid var(--line-2); }
.mh .tt { flex: 1; min-width: 0; text-align: center; padding: 0 4px; cursor: pointer; line-height: 1.3; }
.mh .tt b { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 650; }
.mh .tt b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mh .tt small { display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.mh .sp44 { width: 44px; flex: none; }
.ib { width: 44px; height: 44px; border: none; background: none; display: grid; place-items: center; border-radius: 12px; cursor: pointer; color: var(--ink-2); flex: none; position: relative; padding: 0; }
.ib:active { background: var(--hover); }
.ib svg.i { width: 22px; height: 22px; }
.ib .bdg { position: absolute; top: 5px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.foot { flex: none; padding: 6px 12px calc(8px + var(--safe-b)); background: var(--surface); }
.banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 16px; font-size: 13px; line-height: 1.5; }
.banner svg.i { margin-top: 2px; }
.banner.info { background: var(--primary-weak); color: var(--primary-ink); }
.banner.warn { background: var(--warning-weak); color: #92400e; }
.banner.err { background: var(--danger-weak); color: #b91c1c; }
.banner .act { margin-left: auto; font-weight: 600; white-space: nowrap; color: inherit; text-decoration: underline; }
.mb { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0 16px; color: var(--ink); }
.mb.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.mb.danger { color: var(--danger); }
.mb.solid-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.mb.block { width: 100%; }
.mb.sm { height: 36px; font-size: 14px; border-radius: 10px; padding: 0 12px; }
.mb[disabled] { opacity: .45; cursor: not-allowed; }
.ta { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; line-height: 1.5; outline: none; resize: none; background: var(--surface); }
.ta:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-weak); }
.mtoast { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); background: rgba(15,23,42,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 90; max-width: 82%; text-align: center; box-shadow: var(--shadow-md); }
.spin { width: 14px; height: 14px; border: 2px solid var(--primary-weak); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.typing { display: inline-flex; gap: 4px; padding: 6px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ---------- 抽屉（左） ---------- */
.mask { position: absolute; inset: 0; background: rgba(15,23,42,.32); z-index: 30; animation: fade .18s; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 84%; background: var(--surface); z-index: 31; display: flex; flex-direction: column; padding-top: var(--sb); animation: slideIn .22s ease; box-shadow: var(--shadow-lg); }
@keyframes slideIn { from { transform: translateX(-100%); } }
.dsearch { margin: 8px 12px 6px; height: 40px; border-radius: 12px; background: var(--hover); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--ink-4); font-size: 15px; cursor: pointer; }
.dnav { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; margin: 0 8px; border-radius: 12px; font-size: 15.5px; font-weight: 550; color: var(--ink); cursor: pointer; }
.dnav svg.i { width: 20px; height: 20px; color: var(--ink-2); }
.dnav.on { background: var(--primary-weak); color: var(--primary-ink); }
.dnav.on svg.i { color: var(--primary-ink); }
.dlist { flex: 1; overflow-y: auto; padding: 4px 8px 12px; border-top: 1px solid var(--line-2); margin-top: 8px; }
.dgroup { font-size: 12px; color: var(--ink-4); padding: 14px 12px 4px; }
.ditem { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 15px; color: var(--ink-2); cursor: pointer; }
.ditem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ditem.on { background: #eef0f6; color: var(--ink); font-weight: 600; }
.dfoot { border-top: 1px solid var(--line-2); padding: 10px 16px calc(10px + var(--safe-b)); display: flex; align-items: center; gap: 10px; cursor: pointer; }

/* ---------- 底部面板 ---------- */
.mask.s { z-index: 40; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; z-index: 41; max-height: 90%; display: flex; flex-direction: column; animation: up .24s ease; padding-bottom: var(--safe-b); box-shadow: 0 -10px 40px rgba(15,23,42,.12); }
.sheet.tall { height: 82%; }
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: #d6d9e0; margin: 8px auto 2px; flex: none; }
.shd { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 20px; flex: none; }
.shd .h { flex: 1; min-width: 0; }
.shd .h b { display: block; font-size: 16.5px; font-weight: 650; }
.shd .h small { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbd { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.sgroup { font-size: 12px; color: var(--ink-4); padding: 12px 8px 4px; }
.srow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px; border-radius: 12px; cursor: pointer; font-size: 15px; color: var(--ink); }
.srow:active { background: var(--hover); }
.srow svg.i { width: 20px; height: 20px; color: var(--ink-2); }
.srow.danger, .srow.danger svg.i { color: var(--danger); }
.srow .sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }
.srow .ck { color: var(--primary); }
.srow[disabled] { opacity: .45; }
.sfoot { padding: 8px 20px 4px; font-size: 12px; color: var(--ink-4); text-align: center; }
.sact { display: flex; gap: 8px; padding: 8px 16px 6px; }
.sact .mb { flex: 1; }
.kv { padding: 0 8px; }
.kv .lbl { font-size: 12px; color: var(--ink-3); margin: 12px 0 4px; }
.pre { font-family: var(--mono); font-size: 12px; background: #f6f7fb; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; max-height: 240px; overflow-y: auto; }
.chipset { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 8px; }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.chip.on { border-color: var(--primary-2); background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }

/* ---------- 首页 ---------- */
.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 24px 12px; }
.hero h1 { font-size: 26px; font-weight: 650; line-height: 1.3; margin: 16px 0 6px; }
.hero .d { color: var(--ink-3); font-size: 15px; }
.sugg { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; flex: none; }
.sugg::-webkit-scrollbar { display: none; }
.sugg a { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-size: 14px; }
.ctx { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.ctxchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 10px; border-radius: 16px; font-size: 13px; cursor: pointer; max-width: 100%; }
.ctxchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxchip.dir { background: #fef3c7; color: #92400e; }
.ctxchip.dev { background: var(--secondary-weak); color: #0369a1; }
.ctxchip .x { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }

/* ---------- 输入框 ---------- */
.cmp { border: 1px solid #dfe2ea; border-radius: 24px; padding: 8px 8px 8px 14px; background: var(--surface); box-shadow: 0 2px 10px rgba(16,24,40,.06); }
.cmp:focus-within { border-color: #c7cbf6; box-shadow: 0 0 0 4px var(--primary-weak), 0 2px 10px rgba(16,24,40,.06); }
.cmp textarea { width: 100%; border: none; outline: none; resize: none; font-size: 16px; line-height: 1.5; height: 32px; max-height: 120px; padding: 4px 0; background: transparent; display: block; }
.cmp .bar { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.add { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; color: var(--ink-2); }
.add svg.i { width: 18px; height: 18px; }
.pill { height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; font-weight: 550; max-width: 156px; white-space: nowrap; cursor: pointer; flex: none; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.pill svg.i { width: 14px; height: 14px; }
.send { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; cursor: pointer; padding: 0; }
.send svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
.send.stop { background: var(--ink); }
.send.stop svg.i { width: 14px; height: 14px; }
.send[disabled] { background: #c7cbd6; cursor: not-allowed; }
.atts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.att { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 10px; border-radius: 10px; background: var(--hover); font-size: 13px; color: var(--ink-2); max-width: 220px; }
.att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att a { width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-3); }
.hint-b { text-align: center; font-size: 11.5px; color: var(--ink-4); margin-top: 6px; }
.locked { border: 1px dashed var(--line); border-radius: 16px; padding: 12px 14px; font-size: 13.5px; color: var(--ink-3); background: var(--surface-2); display: flex; gap: 10px; align-items: flex-start; }
.locked svg.i { margin-top: 2px; }

/* ---------- 对话 ---------- */
.devbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-3); flex: none; }
.devbar b { color: var(--ink-2); font-weight: 600; }
.msgs { padding: 12px 16px 16px; }
.mu { display: flex; flex-direction: column; align-items: flex-end; margin: 4px 0 20px; }
.mu .b { background: #f1f3f9; padding: 10px 14px; border-radius: 20px 20px 6px 20px; max-width: 86%; white-space: pre-wrap; }
.mu .atts { justify-content: flex-end; margin-bottom: 6px; }
.ma { margin-bottom: 22px; }
.ma .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
.md { line-height: 1.7; }
.md h3 { font-size: 16px; font-weight: 650; margin: 14px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { padding-left: 22px; margin: 0 0 10px; }
.md li { margin: 3px 0; }
.md code { font-family: var(--mono); font-size: 13px; background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
.tbl { overflow-x: auto; margin: 4px -16px 12px; padding: 0 16px; }
.tbl table { border-collapse: collapse; font-size: 14px; white-space: nowrap; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line-2); padding: 8px 18px 8px 0; text-align: left; }
.tbl th { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
.tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--success); } .down { color: var(--danger); }
.codeb { background: #0f172a; color: #e2e8f0; border-radius: 12px; margin: 4px 0 12px; overflow: hidden; }
.codeb .h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 2px 12px; font-size: 12px; color: #94a3b8; background: #1e293b; }
.codeb .h .ib { width: 36px; height: 36px; color: #94a3b8; }
.codeb .h .ib svg.i { width: 16px; height: 16px; }
.codeb pre { margin: 0; padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
.acts { display: flex; gap: 0; margin: 2px 0 0 -10px; }
.acts .ib { width: 40px; height: 40px; color: var(--ink-4); }
.acts .ib svg.i { width: 18px; height: 18px; }
.acts .ib.on { color: var(--primary); }

const BY_EXT = { html: 'html', htm: 'html', md: 'markdown', markdown: 'markdown', png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image', svg: 'image', pdf: 'pdf' };
const TEXT_EXT = new Set('txt log json jsonl yaml yml toml csv tsv xml css js mjs ts tsx jsx py go java rs sh sql'.split(' '));
const extOf = (p) => { const n = baseName(p).toLowerCase(); const d = n.lastIndexOf('.'); return d > 0 ? n.slice(d + 1) : n; };
const kindOf = (f) => (f.size === 0 ? 'empty' : BY_EXT[extOf(f.path)] || (TEXT_EXT.has(extOf(f.path)) ? 'text' : 'unknown'));

const FILE_LOOK = {
  markdown: ['filetext', '#eef0ff', '#4f46e5'], image: ['image', '#e7f6ec', '#16a34a'], pdf: ['filetext', '#fdeaea', '#dc2626'],
  html: ['globe', '#fff1e6', '#ea580c'], code: ['code', '#e6f6fe', '#0369a1'], sheet: ['table', '#e6f7f1', '#0f766e'],
  doc: ['filetext', '#e8efff', '#1d4ed8'], other: ['file', '#f1f5f9', '#64748b'], dir: ['folder', '#fef3c7', '#d97706'],
};
function lookOf(path, isDir = false) {
  if (isDir) return FILE_LOOK.dir;
  const e = extOf(path);
  if (['csv', 'tsv', 'xlsx', 'xls'].includes(e)) return FILE_LOOK.sheet;
  if (['docx', 'doc', 'pptx'].includes(e)) return FILE_LOOK.doc;
  const k = kindOf({ path, size: 1 });
  if (k === 'text') return ['txt', 'log'].includes(e) ? FILE_LOOK.other : FILE_LOOK.code;
  return FILE_LOOK[k] || FILE_LOOK.other;
}

/** 列出一层：目录在前；名称里的数字按数值排（同电脑版） */
function ls(dir, list = FILES) {
  const pre = dir ? `${dir}/` : '';
  const dirs = new Map();
  const files = [];
  for (const f of list) {
    if (!f.path.startsWith(pre)) continue;
    const rest = f.path.slice(pre.length);
    const i = rest.indexOf('/');
    if (i < 0) { files.push({ ...f, name: rest, isDir: false }); continue; }
    const name = rest.slice(0, i);
    const d = dirs.get(name) || { name, path: pre + name, isDir: true, kids: new Set(), ago: f.ago };
    d.kids.add(rest.slice(i + 1).split('/')[0]);
    d.ago = Math.min(d.ago, f.ago);
    dirs.set(name, d);
  }
  const cmp = S.sort === 'time' ? (a, b) => a.ago - b.ago : (a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true });
  return [...[...dirs.values()].sort(cmp), ...files.sort(cmp)];
}

  toggleNotes() { S.notes = !S.notes; render(); },

    render();
  },
  pick(el) { S[el.dataset.k] = el.dataset.v; S.sheet = null; render(); },

  send() {

    toast('已发送');
  },
  stop() { toast('已停止这一轮'); },
  t1retry() { S.t1 = 'running'; render(); },
  toggleSteps(el) {

  qpick(el) {

    render();
  },
  qsend() { S.qsent = true; render(); },
  tree(el) { S.tree[el.dataset.k] = !S.tree[el.dataset.k]; render(); },

    '每题一组：单选和多选的选项都是整行可点，高度 46px；多选下面可以直接写「其他」',
    '必答题没答完时「提交」是灰的；「跳过」= 让智能体自己判断',
    '提交后卡片收成答案摘要，刷新后也在',
  ], [], [], `<a class="sm" data-act="resetQ">重置为未回答</a>`);
  if (r.p === 'c' && r.a === 't4') return N('对话 · 本机 CLI', [
    '头部副标题和顶部设备栏显示电脑名、在线状态、项目目录',
    '断线等待：不报错、不设超时，提示「这一轮还在你的电脑上进行，连上后接着显示」，可以停止',
    '电脑离线：对话记录照常看，输入框换成说明（怎么让电脑重新上线），恢复后不用刷新',
    '文件面板是「改动 / 全部」：打开时从电脑上现读，只读，平台不存副本',
    '步骤名就是 CLI 给的标题（Read / Write / Bash），同电脑版',
  ], [], [], `<b>演示</b>${demoSeg('t4', [['online', '在线'], ['waiting', '断线等待中'], ['offline', '电脑离线']])}`);
  if (r.p === 'c' && r.a === 't5') return N('对话 · 子智能体', [
    '子智能体卡片：名字、状态、用时、委派任务（两行，点「过程」看全文）、返回结果',
    '过程进单独一页（手机上不在卡片里展开整段过程）',
    '上下文压缩分隔线：一行说明，「查看摘要」从底部弹出',
  ]);
  if (r.p === 'c' && r.a === 't6') return N('对话 · 知识库问答', ['知识库检索作为一个步骤显示，点开看命中的条目和分数']);
  if (r.p === 'c') return N('对话 · 回答与步骤', [
    '头部：标题（点开是重命名、上下文用量、工作目录、删除）+ 智能体名和状态；右边是文件（数字 = 文件数）和新对话',
    '步骤默认收成一行「已完成 6 个步骤」，点开逐条看；点某一步从底部弹出参数和结果，不在原地展开长 JSON',
    '手机端新增：步骤里写入或修改的文件右侧有「预览」，直接打开那个文件',
    '表格、代码块在回答里横向滑动，不撑破屏幕；代码块右上角可复制',
    '回答下面：复制、重新生成（只在最后一条）、有帮助、没帮助（没帮助会弹出原因）',
    '运行中发送键变成停止；切到后台再回来自动接上（沿用按序号续传）',
    '报错沿用平台的口径：系统忙只说忙，给「重试」；额度用完或欠费就提示换模型',
  ], [], [], `<b>演示</b>${demoSeg('t1', [['done', '已完成'], ['running', '运行中'], ['busy', '系统忙'], ['quota', '额度用完']])}`);
  if (r.p === 'sub') return N('子智能体的过程', [
    '单独一页：委派任务全文、过程步骤、中间说明、返回结果',
    '只能看：子智能体不接受直接追问，要追问回主对话',
    '步骤点开同样从底部弹出参数和结果',
  ]);
  if (r.p === 'ws' && !r.a) return N('工作空间 · 根目录', [
    '和电脑版一样是普通目录树，不按对话分',
    '目录在前；按名称排时数字按数值排，也可以切换成按修改时间',
    '隐藏文件（.atlas 等）在手机上不显示',
    '设了配额时顶部显示已用 / 总量；不限额（quota_mb = 0）时不显示',
    '每行「⋯」：文件夹可以在里面新建对话、下载 zip；文件可以预览、分享、下载',
    '手机上只看不改：上传、新建文件夹、重命名、移动、删除留在电脑上',
  ], ['沿用 /v1/workspace（entries、search、download、zip、preview）'], [],
  `<b>演示</b>${demoSeg('quota', [[true, '有配额'], [false, '不限额']])}`);
  if (r.p === 'ws') return N('工作空间 · 子目录', [
    '左上角返回上一级，标题下面是上级路径；面包屑可以横着滑，点任意一级直接跳过去',
    '右下角主按钮「在这里新建对话」，单手拇指够得到：新对话以这个目录为工作目录',
    '没选目录的对话，工作目录名是「日期 / 对话 id」，手机上不好认（见待定）',
  ], [], ['对话的工作目录在手机上只显示一长串 id。要不要在列表里补上对话标题？这和「工作空间不显示对话信息」的决定有冲突']);
  if (r.p === 'search') return N('搜索文件', [
    '按文件名搜整个工作空间（沿用 /v1/workspace/search），边输入边出结果',
    '还没输入时显示最近搜索',
    '每条结果都带所在目录',
  ]);
  if (r.p === 'p') {
    const f = fileOf(r.a, r.b);
    const kind = kindOf(f);
    const common = ['全屏一页：左上返回、文件名和大小、右上「⋯」（下载、分享、在所在目录新建对话 / 在工作空间中查看）',
      '「分享」调起系统的分享面板，把文件本身发出去，不生成公开链接',
      '用哪种方式显示，和电脑版查同一张扩展名表'];
    const by = {
      markdown: ['Markdown：默认渲染，可切换看源码；表格横向滑动'],
      text: ['代码和文本：带行号、等宽字体，默认不换行、横向滑动，可以打开自动换行', '超过 1 MB 只读开头，顶部提示并给出下载'],
      image: ['图片：黑底，按屏宽显示，可以双指缩放', '超过 20 MB 不显示（同电脑版；手机内存更紧，要不要降到 10 MB 见待定）'],
      pdf: ['PDF：一页一页往下翻，底部显示页码'],
      html: ['HTML：在沙箱里运行，拿不到登录信息、调不了平台接口；可切换看源码', '运行中文件被改了：只提示「已更新」，点了才刷新（自动刷新会把页面里点到的状态清掉）'],
      empty: ['空文件：直接说明，不显示空白页'],
      unknown: ['Office 等不能在线预览的：说明原因，给「下载」和「分享」，用手机上的 WPS 或系统预览打开'],
    };
    const demo = kind === 'html' ? `<b>演示</b>${demoSeg('htmlUpdated', [[false, '正常'], [true, '运行中文件有更新']])}` : r.a === 'dev' ? `<b>演示</b>${demoSeg('t4', [['online', '电脑在线'], ['offline', '电脑离线']])}` : '';
    const devNote = r.a === 'dev' || threadOf(r.a)?.device ? ['本机文件：打开时经设备网关从电脑上现读，只读；电脑离线时看不到'] : [];
    const fe = kind === 'pdf' ? ['手机端用 pdf.js 渲染：iOS Safari 在 iframe 里只显示 PDF 的第一页，不能沿用电脑版的 iframe'] : kind === 'html' ? ['生成的页面很多按电脑宽度写，手机上要默认按屏宽缩放'] : [];
    const todo = kind === 'image' ? ['图片的大小上限要不要在手机上降到 10 MB'] : [];
    return N('文件预览', [...(by[kind] || []), ...devNote, ...common], fe, todo, demo);
  }
  return N('', []);
}
function notesPanel(r) {
  const n = notesFor(r);
  return `<aside class="notes">
    <div class="scope"><b>手机端只做三样：</b>对话、工作空间、文件预览。智能体管理、知识库、技能、MCP、模型、个性化、系统都留在电脑上。</div>
    <h4>${esc(n.title)}</h4>
    <ul>${n.items.map((i) => `<li>${i}</li>`).join('')}</ul>
    ${n.be.length ? `<h4>依赖</h4><ul>${n.be.map((i) => `<li><span class="be">依赖</span>${i}</li>`).join('')}</ul>` : ''}
    ${n.todo.length ? `<h4>待定</h4><ul>${n.todo.map((i) => `<li><span class="be">待定</span>${i}</li>`).join('')}</ul>` : ''}
    ${n.demo ? `<div class="demo">${n.demo}</div>` : ''}
  </aside>`;
}
ACT.resetT2 = () => { S.dec.t2 = undefined; render(); };
ACT.resetQ = () => { S.qsent = false; S.qa = { n: null, b: null, k: [] }; render(); };

render();
