<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI TeamFlow — 原型（面向团队协作的 AI 工作流平台）</title>
<style>
/* 视觉与 Atlas、用户中心、运营中心、定时任务原型一致（同一套浅色设计 token） */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #fbfbfd; --hover: #f2f4f8;
  --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
  --line: #e6e8ee; --line-2: #eef0f4;
  --primary: #4f46e5; --primary-2: #6366f1; --primary-weak: #eef0ff; --primary-ink: #4338ca;
  --secondary: #0ea5e9; --secondary-weak: #e6f6fe;
  --success: #16a34a; --success-weak: #e7f6ec;
  --warning: #d97706; --warning-weak: #fef3e2;
  --danger: #dc2626; --danger-weak: #fdeaea;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 6px 18px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(16,24,40,.16);
  --font: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --top-h: 52px; --sider-w: 248px; --sider-w-min: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); }
h1 { font-size: 20px; font-weight: 650; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--line-2); padding: 1px 5px; border-radius: 5px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.sm { font-size: 12.5px; }
.xs { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { flex: 1; }
.hide { display: none !important; }

/* ---------- 顶栏：一级菜单（平台） ---------- */
.top { height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px 0 14px; gap: 20px; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .01em; cursor: pointer; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; display: grid; place-items: center; font-size: 14px; }
.pnav { display: flex; gap: 2px; height: 100%; }
.pnav a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--ink-2); font-weight: 550; position: relative; }
.pnav a:hover { color: var(--ink); background: var(--hover); }
.pnav a.on { color: var(--primary-ink); }
.pnav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 650; flex: none; }
.avatar.sq { border-radius: 8px; }

/* ---------- 左侧：二级菜单（可收缩） ---------- */
.body { display: flex; height: calc(100vh - var(--top-h)); }
.sider { width: var(--sider-w); flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; }
.sider.min { width: var(--sider-w-min); }
.sider-top { padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.snav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 520; white-space: nowrap; cursor: pointer; position: relative; }
.snav:hover { background: var(--hover); color: var(--ink); }
.snav.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 600; }
.snav .badge { margin-left: auto; }
.sider.min .snav { justify-content: center; padding: 0; }
.sider.min .snav span, .sider.min .snav .badge, .sider.min .hist, .sider.min .new-chat span, .sider.min .sider-foot span { display: none; }
.new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; color: var(--ink); cursor: pointer; margin-bottom: 8px; box-shadow: var(--shadow-xs); white-space: nowrap; }
.new-chat:hover { border-color: #cfd3dd; background: var(--hover); }
.hist { flex: 1; overflow-y: auto; padding: 4px 10px 10px; border-top: 1px solid var(--line-2); margin-top: 6px; }
.hist-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 4px; }
.hist-group { font-size: 11.5px; color: var(--ink-4); padding: 10px 8px 4px; }
.hist-item { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 10px; border-radius: var(--radius-sm); color: var(--ink-2); cursor: pointer; }
.hist-item:hover { background: var(--hover); }
.hist-item.on { background: #e9ebf3; color: var(--ink); font-weight: 550; }
.hist-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.hist-item .more { opacity: 0; }
.hist-item:hover .more { opacity: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.run { background: var(--success); box-shadow: 0 0 0 3px var(--success-weak); }
.dot.wait { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-weak); }
.sider-foot { border-top: 1px solid var(--line-2); padding: 8px 10px; }
.main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
.main.white { background: var(--surface); }
.page { padding: 24px 32px 60px; max-width: 1280px; margin: 0 auto; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 36px; }

/* ---------- 通用组件 ---------- */
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 550; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: #cfd3dd; background: var(--hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ibtn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.ibtn.sm { width: 26px; height: 26px; }
.ibtn.on { background: var(--primary-weak); color: var(--primary-ink); }
.input, .select, textarea.input { height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 11px; background: var(--surface); outline: none; width: 100%; }
textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-weak); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--ink-4); }
.search .input { padding-left: 32px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.tag.primary { background: var(--primary-weak); color: var(--primary-ink); }
.tag.success { background: var(--success-weak); color: var(--success); }
.tag.warning { background: var(--warning-weak); color: var(--warning); }
.tag.danger { background: var(--danger-weak); color: var(--danger); }
.tag.blue { background: var(--secondary-weak); color: #0369a1; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 650; display: inline-grid; place-items: center; }
.badge.gray { background: var(--line); color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card.pad { padding: 16px 18px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs a { padding: 10px 0; color: var(--ink-3); font-weight: 550; position: relative; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); }
.tabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg a { padding: 4px 12px; border-radius: 7px; color: var(--ink-3); font-weight: 550; font-size: 13px; }
.seg a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
.switch { display: inline-block; vertical-align: middle; width: 36px; height: 20px; border-radius: 10px; background: #d5d9e2; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 18px; }
.switch.dis { opacity: .45; cursor: not-allowed; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-3); background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr.click:hover td { background: var(--surface-2); cursor: pointer; }
.empty { text-align: center; padding: 56px 20px; color: var(--ink-3); }
.empty .ill { width: 56px; height: 56px; border-radius: 16px; background: var(--primary-weak); color: var(--primary); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .ill svg { width: 26px; height: 26px; }
.empty h3 { margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.chip .x { color: var(--ink-4); cursor: pointer; }
.chip .x:hover { color: var(--danger); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.divider { height: 1px; background: var(--line-2); margin: 14px 0; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.help { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.radio-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); }
.radio-card:hover { border-color: #cfd3dd; }
.radio-card.on { border-color: var(--primary-2); background: #f8f8ff; box-shadow: 0 0 0 3px var(--primary-weak); }
.radio-card .r { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c5cad6; flex: none; margin-top: 2px; }
.radio-card.on .r { border: 5px solid var(--primary); }

/* 下拉菜单 / 浮层 */
.pop { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; min-width: 200px; }
.pop .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.pop .mi:hover { background: var(--hover); color: var(--ink); }
.pop .mi.on { color: var(--primary-ink); }
.pop .mi.danger { color: var(--danger); }
.pop .sep { height: 1px; background: var(--line-2); margin: 5px 4px; }
.pop .ph { font-size: 11.5px; color: var(--ink-4); padding: 6px 10px 2px; }
.mask { position: fixed; inset: 0; background: rgba(15,23,42,.36); z-index: 80; display: grid; place-items: center; }
.modal { background: var(--surface); border-radius: 14px; width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal.wide { width: 760px; }
.modal-h { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.modal-b { padding: 18px 20px; overflow-y: auto; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; }
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.2); z-index: 70; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 92vw; background: var(--surface); z-index: 71; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: var(--shadow-md); }

/* ---------- 设计说明（评审用，非产品界面） ---------- */
.notes { width: 300px; flex: none; overflow-y: auto; background: #fffdf3; border-left: 1px solid #f3e3a6; padding: 14px 16px; font-size: 13px; }
.notes h4 { font-size: 13px; margin: 10px 0 4px; color: #92400e; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 3px 0; color: #57534e; }
.notes .be { display: inline-block; font-size: 11px; background: #fde68a; color: #92400e; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
.notes .demo { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #f3e3a6; }
.notes .demo .seg { flex-wrap: wrap; }
.notes .demo .seg a { font-size: 12px; padding: 3px 8px; }
/* ---------- TeamFlow 原型 ---------- */
.logo.tf { background: linear-gradient(135deg, #4f46e5, #0ea5e9); }
.teamsw { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 550; font-size: 13px; color: var(--ink-2); background: var(--surface); }
.teamsw:hover { background: var(--hover); }
.sgroup { font-size: 11.5px; color: var(--ink-4); font-weight: 600; padding: 14px 10px 4px; letter-spacing: .02em; }
.sider .snav .badge { margin-left: auto; }
.tenant { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-3); margin-right: -10px; }
.tenant svg { width: 14px; height: 14px; }

/* 状态 */
.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.pending { background: #f1f3f7; color: #64748b; }
.st.working { background: #e6f6fe; color: #0369a1; }
.st.exit_review { background: #fef3e2; color: #b45309; }
.st.exited { background: #e6faf6; color: #0f766e; }
.st.admit_review { background: #f5edff; color: #7e22ce; }
.st.passed { background: var(--success-weak); color: var(--success); }
.st.returned { background: var(--danger-weak); color: var(--danger); }
.st.running { background: #e6f6fe; color: #0369a1; }
.st.completed { background: var(--success-weak); color: var(--success); }
.st.terminated { background: #f1f3f7; color: #64748b; }

/* 流程图 */
.flow { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 22px 18px 18px; }
.flow .arrow { width: 26px; flex: none; height: 2px; background: #cfd5df; position: relative; }
.flow .arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid #cfd5df; border-right: 0; }
.flow .par { display: flex; flex-direction: column; gap: 12px; padding: 10px; border: 1px dashed #c9cfdc; border-radius: 12px; position: relative; flex: none; }
.flow .par .plabel { position: absolute; top: -10px; left: 10px; background: var(--surface); padding: 0 6px; font-size: 11.5px; color: var(--ink-4); font-weight: 600; }
.fnode { width: 152px; flex: none; border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); padding: 10px 11px; cursor: pointer; transition: box-shadow .12s; }
.fnode:hover { box-shadow: var(--shadow-md); }
.fnode.on { box-shadow: 0 0 0 3px var(--primary-weak); border-color: var(--primary-2) !important; }
.fnode .nm { font-weight: 650; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.fnode .who { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 12px; color: var(--ink-3); }
.fnode .rv { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.fnode.pending { border-color: #e6e8ee; }
.fnode.working { border-color: #7cc7ee; background: #fbfdff; }
.fnode.exit_review { border-color: #f5c46b; background: #fffdf7; }
.fnode.exited { border-color: #6fd3c4; background: #f9fefd; }
.fnode.admit_review { border-color: #c9a2f2; background: #fdfaff; }
.fnode.passed { border-color: #8fd5a6; }
.fnode.returned { border-color: #f1a3a3; background: #fffafa; }
.rtag { white-space: nowrap; font-size: 11px; height: 18px; padding: 0 6px; border-radius: 5px; display: inline-flex; align-items: center; background: var(--line-2); color: var(--ink-3); font-weight: 600; }
.rtag.exit { background: #fef3e2; color: #b45309; }
.rtag.admit { background: #f5edff; color: #7e22ce; }
.rtag.exec { background: #e6f6fe; color: #0369a1; }
.legend { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-3); }

/* 进度条（流程列表里每个节点一格） */
.pbar { display: flex; gap: 3px; }
.pbar i { width: 16px; height: 7px; border-radius: 3px; background: #e6e8ee; }
.pbar i.working { background: #38bdf8; } .pbar i.exit_review { background: #f59e0b; } .pbar i.exited { background: #2dd4bf; }
.pbar i.admit_review { background: #a855f7; } .pbar i.passed { background: #22c55e; } .pbar i.returned { background: #ef4444; }

/* 节点页：左对话 + 右面板 */
.nodepage { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100%; }
.nodesw { margin-top: 8px; overflow-x: auto; max-width: 100%; display: flex; }
.nodesw a { white-space: nowrap; }
.nodepage .left { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--surface); }
.nodepage .right { overflow-y: auto; background: var(--bg); }
.nhead { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.nhead .crumb { font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; }
.locks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.lock { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.lock svg { width: 12px; height: 12px; color: var(--ink-4); }
.conv { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; max-width: 760px; }
.msg .bd { min-width: 0; flex: 1; }
.msg .who { font-size: 12.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.msg .who .t { color: var(--ink-4); font-weight: 500; }
.msg .txt { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; line-height: 1.65; }
.msg.me .txt { background: var(--primary-weak); border-color: #dfe2ff; }
.msg.agent .txt { background: var(--surface); }
.sysline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); padding: 2px 0; }
.sysline::before, .sysline::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.instr { border: 1px solid #dfe2ff; background: #f8f8ff; border-radius: 10px; padding: 10px 12px; }
.instr .h { font-size: 12px; font-weight: 650; color: var(--primary-ink); display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.inchip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; margin: 4px 6px 0 0; }
.inchip code { background: none; padding: 0; color: var(--ink-3); }
.stepsbox { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stepsbox .sh { padding: 7px 12px; font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.stepsbox .sb { padding: 2px 12px 10px 32px; font-size: 12.5px; color: var(--ink-2); }
.stepsbox .sb div { padding: 2px 0; }
.save { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 9px 12px; display: flex; gap: 10px; align-items: flex-start; }
.hash { font-family: var(--mono); font-size: 12px; color: var(--primary-ink); background: var(--primary-weak); border-radius: 5px; padding: 1px 6px; }
.snap { font-size: 12px; font-weight: 550; color: var(--primary-ink); background: var(--primary-weak); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.files { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.files .a { color: var(--success); } .files .d { color: var(--danger); }
.askcard { border: 1px solid #c7d2fe; border-radius: 10px; background: #fff; padding: 11px 13px; }
.askcard .q { font-weight: 600; margin-bottom: 8px; }
.askopt { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; cursor: pointer; }
.askopt:hover { background: var(--hover); }
.askopt.on { border-color: var(--primary-2); background: #f8f8ff; }
.checkcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
.checkcard .row2 { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 13px; }
.ok { color: var(--success); } .bad { color: var(--danger); } .warn { color: var(--warning); }
.nfoot { border-top: 1px solid var(--line); padding: 12px 20px 14px; background: var(--surface); }
.nfoot textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: none; min-height: 64px; outline: none; line-height: 1.6; }
.nfoot textarea:focus { border-color: #c7cbf6; box-shadow: 0 0 0 3px var(--primary-weak); }
.readonly { padding: 10px 14px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-3); font-size: 13px; }

/* 右侧面板 */
.rp { padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 12px; }
.rp .tabs { margin-bottom: 4px; gap: 18px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.pcard h3 { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; line-height: 1.7; font-size: 13.5px; }
.doc h1 { font-size: 17px; margin: 0 0 8px; } .doc h2 { font-size: 14.5px; margin: 14px 0 6px; } .doc ul { margin: 4px 0; padding-left: 20px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0; } .doc td, .doc th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.doc .add { background: #e7f6ec; } .doc .del { background: #fdeaea; text-decoration: line-through; color: #9b1c1c; }
.dochead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-3); }
.vote { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
.vote:last-child { border-bottom: none; }
.decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.banner2.danger { background: var(--danger-weak); color: #7f1d1d; border: 1px solid #f7caca; }

.banner2.purple { background: #f5edff; color: #581c87; border: 1px solid #e4cffb; }

.editor { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%; }
.flow.v { flex-direction: column; align-items: center; }
.flow.v .arrow { width: 2px; height: 24px; }

.flow.v .par { flex-direction: row; align-items: center; }
.flow.v .addbtn { margin: 4px 0; }

.canvas .flow { padding: 40px 32px; min-height: 100%; align-items: center; }

.issue { display: flex; gap: 8px; padding: 6px 0; font-size: 13px; }

/* 卡片栅格 */

  if (!S.pop) return '';
  const style = `style="left:${S.pop.x}px;top:${S.pop.y}px;min-width:320px"`;
  if (S.pop.id === 'team') {
    return `<div class="pop" ${style} data-stop><div class="xs faint" style="padding:6px 10px">${esc(TENANT.name)} · 我能进的团队</div>${Object.entries(TEAMS).filter(([, t]) => t.members[ME.id]).map(([k, t]) => `<div class="mi ${S.team === k ? 'on' : ''}" data-act="team" data-v="${k}">${ic('users')}<span class="grow">${esc(t.name)}</span><span class="xs faint">${LEVEL[t.members[ME.id]]}</span></div>`).join('')}
      ${ME.canCreateTeam ? `<div class="sep"></div><div class="mi" data-act="newTeam">${ic('plus')}新建团队</div>` : ''}</div>`;
  }
  if (S.pop.id === 'me') {
    const x = Math.max(12, window.innerWidth - 360);
    return `<div class="pop" style="left:${x}px;top:${S.pop.y}px;min-width:340px" data-stop><div class="ph">演示身份（原型用，产品里就是登录的人）</div>
      <div class="mi ${S.who !== 'ops' ? 'on' : ''}" data-act="who" data-v="li">${av('李', '#0ea5e9', 22, false)}<div class="grow"><div class="sm">李工 · ${esc(TENANT.name)}</div><div class="xs faint">研发一部团队管理员、内容运营组读写成员</div></div></div>
      <div class="mi ${S.who === 'ops' ? 'on' : ''}" data-act="who" data-v="ops">${av('林', '#64748b', 22, false)}<div class="grow"><div class="sm">林运营 · ${esc(SYS_TENANT.name)}（系统租户）</div><div class="xs faint">运营管理员：维护流程市场</div></div></div>
      <div class="sep"></div><div class="mi" data-act="toast" data-msg="（原型）退出登录">${ic('logout')}退出登录</div></div>`;
  }
  return `<div class="pop" ${style} data-stop><div class="row" style="padding:6px 10px"><b>通知</b><span class="sp"></span><a class="xs" data-act="readAll">全部已读</a></div>

    <div class="sep"></div><div class="xs faint" style="padding:4px 10px 6px">也推到企业微信 / 钉钉（个人设置里绑定）</div></div>`;
}
const demoSeg = (k, opts) => `<div class="seg">${opts.map(([v, t]) => `<a class="${S[k] === v ? 'on' : ''}" data-act="setS" data-k="${k}" data-v="${v}">${t}</a>`).join('')}</div>`;

}
function projectPage(pid, tab) {
  const p = PROJECTS[pid];
  if (!p) return '<div class="page">项目不存在</div>';
  const canStart = levelOf(p.team) && levelOf(p.team) !== 'ro';
  const cfg = tab === 'config';
  return `<div class="page">
    <div class="xs muted" style="margin-bottom:6px">${esc(p.name)} / ${cfg ? '配置' : '流程'}</div>
    <div class="page-head" style="align-items:flex-start"><div class="grow"><h1>${cfg ? '项目配置' : '流程'}</h1>
      <div class="row sm muted" style="margin-top:4px;flex-wrap:wrap"><b style="color:var(--ink-2)">${esc(p.name)}</b><span>·</span>${esc(p.desc)}<span>·</span>${esc(TEAMS[p.team].name)}</div></div>
      ${!cfg && canStart ? `<button class="btn primary" data-act="newFlow" data-v="${pid}">${ic('plus')}发起流程</button>` : ''}</div>
    ${cfg ? projectConfig(pid) : projectFlows(pid)}</div>`;
}
function projectFlows(pid) {
  const p = PROJECTS[pid];
  const rows = Object.entries(FLOWS).filter(([, f]) => f.project === pid && (S.ffilter === 'all' || f.status === S.ffilter)).sort((a, b) => (b[1].fresh ? 1 : 0) - (a[1].fresh ? 1 : 0));
  return `<div class="row" style="margin-bottom:12px">${demoSeg('ffilter', [['running', '进行中'], ['completed', '已完成'], ['terminated', '已终止'], ['all', '全部']])}
      <select class="select" style="width:170px"><option>全部模板</option>${Object.keys(p.bind).map((t) => `<option>${esc(TPLS[t].name)}</option>`).join('')}</select>

}
function flowTable(rows) {
  return `<table class="table"><thead><tr><th style="width:90px">编号</th><th style="width:200px">标题</th><th>当前进展</th><th style="width:130px">各节点</th><th style="width:150px">模板</th><th style="width:120px">等你</th><th style="width:84px">更新</th></tr></thead><tbody>

      <td>${todosOf(id).map((t) => { const [k, , c, bg] = TODO_KIND[t.kind]; return `<a class="tag" style="background:${bg};color:${c}" data-go="${nodeHref(id, t.node)}" title="${esc(t.what)}">${k}</a>`; }).join(' ') || '<span class="faint sm">—</span>'}</td><td class="sm muted" style="white-space:nowrap">${f.upd}</td></tr>`).join('')}
    </tbody></table>`;
}
function projectConfig(pid) {
  const p = PROJECTS[pid];
  const tm = TEAMS[p.team];
  const adm = isAdmin(p.team);
  const bound = Object.keys(p.bind);
  return `${adm ? '' : `<div class="banner2 info" style="margin-bottom:12px">${ic('lock')}<div>项目配置只有团队管理员能改；你在「${esc(tm.name)}」的权限是${LEVEL[levelOf(p.team)]}</div></div>`}
    <div class="card pad" style="margin-bottom:16px"><h2 style="margin-bottom:10px">基本信息</h2><dl class="kv"><dt>名称</dt><dd>${esc(p.name)}</dd><dt>说明</dt><dd>${esc(p.desc)}</dd><dt>团队</dt><dd>${esc(tm.name)}</dd>
      <dt>流程空间</dt><dd class="sm">每条流程发起时向 Atlas 申请一个，这条流程所有节点的数字员工会话都挂载它<div class="xs faint">节点提交评审时，由执行人从流程空间选这一轮的产出物</div></dd></dl></div>
    <div class="row" style="margin-bottom:10px"><h2>流程</h2><span class="sm muted">本项目能发起的流程：绑定流程模板，再给模板里的每个角色分配成员和数字员工</span><span class="sp"></span>${adm ? `<button class="btn" data-act="bindTpl" data-v="${pid}">${ic('plus')}绑定流程模板</button>` : ''}</div>
    ${bound.length ? bound.map((tid) => bindCard(pid, tid, adm)).join('') : `<div class="card"><div class="empty"><div class="ill">${ic('flow')}</div><h3>还没绑定流程模板</h3><div class="sm">绑定后给角色分配成员和数字员工，就能在这个项目里发起</div></div></div>`}`;
}
function bindCard(pid, tid, adm) {
  const p = PROJECTS[pid];
  const tpl = TPLS[tid];
  const bind = p.bind[tid];
  const miss = missingRoles(tid, bind);
  const tm = TEAMS[p.team];
  return `<div class="card" style="margin-bottom:14px"><div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line-2)"><span class="ic2" style="background:${tpl.color};width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff">${ic(tpl.icon)}</span><div class="grow"><b>${esc(tpl.name)}</b><div class="xs faint">${tpl.ver ? `跟随最新发布版 v${tpl.ver}，发起时锁定版本` : '还没发布'}</div></div>
      ${miss.length ? `<span class="tag warning">还差 ${miss.length} 个角色：${esc(miss.map((r) => tpl.roles[r]).join('、'))}</span>` : '<span class="tag success">已配齐，可以发起</span>'}
      ${adm ? `<a class="sm" href="#/team/templates/${tid}">看模板</a><button class="ibtn sm" data-act="toast" data-msg="解绑：已发起的流程不受影响，之后不能再用这个模板发起" title="解绑">${ic('trash')}</button>` : ''}</div>
    <table class="table" style="border:none;border-radius:0 0 12px 12px"><thead><tr><th style="width:90px">角色</th><th>负责的节点</th><th style="width:290px">成员（下指令、评审）</th><th style="width:220px">数字员工（执行）</th></tr></thead><tbody>
    ${Object.entries(tpl.roles).map(([rk, rn]) => {
      const ex = flat(tpl).filter((n) => tpl.nodes[n].exec === rk).map((n) => tpl.nodes[n].name);
      const ad = flat(tpl).filter((n) => (tpl.nodes[n].admit || []).includes(rk)).map((n) => tpl.nodes[n].name);
      const et = flat(tpl).filter((n) => tpl.nodes[n].exit.includes(rk)).map((n) => tpl.nodes[n].name);
      const a = bind[rk] || { m: [], a: '' };
      const mem = a.m.map((m) => `<span class="chip" style="height:28px;margin:2px">${pc(m, 18)}${adm ? `<span class="x">${ic('x')}</span>` : ''}</span>`).join('')
        + (adm ? `<span class="chip" style="height:28px;margin:2px;color:var(--ink-3);cursor:pointer" data-act="toast" data-msg="从本团队「读写」以上的成员里选（只读的人不能担任角色）">${ic('plus')}</span>` : '')
        + (a.m.length ? '' : ' <span class="warn sm">未分配</span>');
      const skills = a.a ? `<div class="xs faint" style="margin-top:4px" title="产出物的格式由技能约定">技能：${esc(AGENTS[a.a].skills.join('、'))}</div>` : '';
      const ag = !ex.length ? '<span class="faint sm">只评审，不执行</span>'
        : adm ? `<select class="select" style="width:100%">${a.a ? '' : '<option selected>未分配</option>'}${tm.agents.map((id) => `<option ${id === a.a ? 'selected' : ''}>${esc(AGENTS[id].name)}</option>`).join('')}</select>${skills}`
        : a.a ? ac(a.a, 18) + skills : '<span class="warn sm">未分配</span>';
      return `<tr><td><b>${rn}</b></td><td class="sm">${ex.length ? `<div><span class="rtag exec">执行</span> ${ex.join('、')}</div>` : ''}${ad.length ? `<div style="margin-top:3px"><span class="rtag admit">准入</span> ${ad.join('、')}</div>` : ''}${et.length ? `<div style="margin-top:3px"><span class="rtag exit">准出</span> ${et.join('、')}</div>` : ''}</td><td>${mem}</td><td>${ag}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function flowDetail(fid) {
  const f = FLOWS[fid];
  if (!f) return '<div class="page">流程不存在</div>';
  const tpl = tplOf(f);
  const first = flat(tpl)[0];
  const fs = f.nodes[first];
  const reqCard = f.req && ['passed', 'exited'].includes(fs.st)
    ? `<div class="row xs muted" style="margin-bottom:4px">${ic('file')}需求 · 取自「${esc(tpl.nodes[first].name)}」提交的 ${(fs.sub || []).map((p) => esc(base(p))).join('、')}<span class="sp"></span><a href="#/flows/${fid}/space">在流程空间看</a></div>${esc(f.req)}`
    : `<div class="xs muted" style="margin-bottom:4px">需求</div><span class="muted">发起时只写了标题。「${esc(tpl.nodes[first].name)}」的数字员工正在找执行人问清楚，准出后这里显示它提交的文件</span>`;
  const subs = flat(tpl).filter((n) => f.nodes[n].sub);
  return `<div class="page">
    <div class="xs muted" style="margin-bottom:6px">${crumbs(fid)}</div>
    <div class="page-head" style="align-items:flex-start"><div class="grow"><div class="row"><h1>${esc(f.title)}</h1>${fstTag(f.status)}</div>
      <div class="row sm muted" style="margin-top:6px;flex-wrap:wrap">${esc(tpl.name)} <b style="color:var(--ink-2)">v${f.ver}</b>${lockChip('发起时锁定', '模板之后发布的新版本不影响这条流程')}<span>·</span>${spaceChip(fid)}<span>·</span>${pc(f.by, 18)} ${f.at} 发起</div></div>
      <button class="btn" data-go="#/flows/${fid}/space">${ic('folder')}流程空间</button><button class="btn" data-go="#/flows/${fid}/trace">${ic('history')}追溯</button><button class="ibtn" data-act="toast" data-msg="终止流程：进行中的数字员工会话停下，未完成的评审取消；流程空间转只读保留">${ic('more')}</button></div>
    <div class="card pad" style="margin-bottom:14px">${reqCard}</div>
    <div class="card">${flowView(tpl, f, '', { fid })}${legend()}</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px">
      <div class="card pad"><div class="row" style="margin-bottom:8px"><h2>产出物</h2><span class="xs faint">各节点提交评审时从流程空间选的文件</span><span class="sp"></span><a class="sm" href="#/flows/${fid}/space">打开流程空间</a></div>
        ${subs.length ? subs.map((n) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line-2);align-items:flex-start"><b class="sm" style="width:72px;flex:none;margin-top:5px">${esc(tpl.nodes[n].name)}</b><span class="grow">${f.nodes[n].sub.map(fileChip).join('')}</span><span class="xs faint" style="margin-top:6px;white-space:nowrap">${subLabel(f, n)}</span></div>`).join('') : '<div class="sm muted">还没有节点提交过产出物</div>'}</div>
      <div class="card pad"><div class="row" style="margin-bottom:8px"><h2>最近</h2><span class="sp"></span><a class="sm" href="#/flows/${fid}/trace">完整追溯</a></div>
        ${traceEvents(fid).slice(-5).reverse().map((e) => `<div class="row" style="padding:5px 0;align-items:flex-start"><span class="xs faint" style="width:76px;flex:none">${e.at}</span><span class="sm">${e.html}</span></div>`).join('')}</div>
    </div>
    <div class="card pad" style="margin-top:16px"><div class="row" style="margin-bottom:6px"><h2>角色分配</h2><span class="xs faint">来自项目配置；改分配只影响还没开工的节点，已开工节点的执行 Agent 已锁定</span><span class="sp"></span>${isAdmin(projOf(f).team) ? `<a class="sm" href="#/projects/${f.project}/config">去项目配置改</a>` : ''}</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px">${Object.entries(tpl.roles).map(([rk, rn]) => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line-2)"><b class="sm" style="width:72px">${rn}</b><span class="grow">${membersOf(f, rk).map((m) => pc(m, 18)).join(' ')}</span>${agentOfRole(f, rk) ? ac(agentOfRole(f, rk), 18) : ''}</div>`).join('')}</div></div>
    </div>`;
}
/* 流程空间：向 Atlas 申请的工作空间，这条流程所有节点共用 */
function spacePage(fid) {
  const f = FLOWS[fid];
  if (!f) return '<div class="page">流程不存在</div>';
  const tpl = tplOf(f);
  /* 按节点在流程里的顺序排，直接上传的在前 */
  const order = (node) => (node ? flat(tpl).indexOf(node) : -1);
  const files = [...filesOf(fid)].sort((a, b) => order(a[2]) - order(b[2]) || a[0].localeCompare(b[0], 'zh'));
  const pick = S.spaceSel[fid] || files.find(([p]) => docOf(fid, p))?.[0] || files[0]?.[0];
  const canWrite = levelOf(projOf(f).team) && levelOf(projOf(f).team) !== 'ro' && f.status === 'running';
  const row = ([p, by, node, at, size]) => {
    const dir = p.endsWith('/');
    const parts = p.replace(/\/$/, '').split('/');
    const subs = subsOfFile(fid, p);
    return `<tr class="click ${p === pick ? 'sel' : ''}" ${dir ? '' : `data-act="spacePick" data-k="${fid}" data-v="${esc(p)}"`}><td><span class="row" style="gap:6px">${ic(dir ? 'folder' : 'file')}<span class="mono xs" style="white-space:nowrap"><span class="faint">${esc(parts.slice(0, -1).join('/'))}${parts.length > 1 ? '/' : ''}</span>${esc(parts[parts.length - 1])}${dir ? '/' : ''}</span></span></td>
      <td>${subs.map((n) => `<span class="tag success" title="${esc(tpl.nodes[n].name)}把它选为第 ${subR(f.nodes[n])} 轮的产出物">${esc(tpl.nodes[n].name)} · 第 ${subR(f.nodes[n])} 轮</span>`).join(' ') || '<span class="faint xs">过程文件</span>'}</td>
      <td class="sm" style="white-space:nowrap">${who(by, 16)}<div class="xs faint">${node ? `在「${esc(tpl.nodes[node].name)}」会话里` : '直接上传'} · ${at}</div></td><td class="xs muted" style="white-space:nowrap">${size}</td></tr>`;
  };
  const doc = pick ? docOf(fid, pick) : null;
  return `<div class="page">
    <div class="xs muted" style="margin-bottom:6px">${crumbs(fid, '流程空间')}</div>
    <div class="page-head" style="align-items:flex-start"><div class="grow"><h1>流程空间 · ${esc(f.title)}</h1>
      <div class="row sm muted" style="margin-top:6px;flex-wrap:wrap">${ic('folder')}Atlas 工作空间 <span class="mono xs">${esc(f.space)}</span><span>·</span>发起时向 Atlas 申请<span>·</span>这条流程所有节点的数字员工会话都挂载它</div></div>
      ${canWrite ? `<button class="btn" data-act="toast" data-msg="上传到流程空间：参考资料、代码副本……数字员工在会话里直接能读">${ic('upload')}上传</button>` : ''}<button class="btn" data-act="toast" data-msg="打包下载整个流程空间（zip）">${ic('dl')}下载全部</button></div>
    ${f.status === 'running' ? '' : `<div class="banner2 info" style="margin-bottom:12px">${ic('lock')}<div>流程${FST[f.status]}：流程空间只读保留</div></div>`}
    ${files.length ? `<div style="display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px;align-items:start">
      <table class="table"><thead><tr><th>文件</th><th style="width:120px">提交</th><th style="width:165px">最后修改</th><th style="width:64px">大小</th></tr></thead><tbody>${files.map(row).join('')}</tbody></table>
      <div>${pick ? `<div class="dochead">${ic('file')}<b style="color:var(--ink)">${esc(pick)}</b><span class="sp"></span><a data-act="toast" data-msg="下载这个文件" title="下载">${ic('dl')}</a></div>${doc ? `<div class="doc">${doc}</div>` : '<div class="pcard sm muted">（原型没画这个文件的内容）</div>'}` : ''}
        <div class="xs faint" style="margin-top:8px">产物不做版本管理：这里永远是文件的当前内容。「提交」列记的是哪个节点第几轮把它选为产出物</div></div></div>`
      : `<div class="card"><div class="empty"><div class="ill">${ic('folder')}</div><h3>流程空间还是空的</h3><div class="sm">数字员工在节点会话里写的文件、成员上传的资料都会出现在这里</div></div></div>`}</div>`;
}
/* 追溯：指令、产出依据、评审意见、修改轮次全程留痕 */
function traceEvents(fid) {
  const fl = (...ps) => ps.map((p) => `<span class="mono xs" style="color:var(--primary-ink)">${esc(p)}</span>`).join('、');
  if (fid !== 'F-1024') {
    const f = FLOWS[fid];
    return [{ at: f.at, node: '', k: 'lock', html: `${pc(f.by, 16)} 在「${esc(projOf(f).name)}」发起流程，锁定模板 v${f.ver}；向 Atlas 申请流程空间 <span class="mono xs">${esc(f.space)}</span>` }];
  }
  return [
    { at: '11-24 10:12', node: '', k: 'lock', html: `${pc('u-zhang', 16)} 在「Atlas 控制台」发起流程（只填了标题），锁定模板「软件研发（标准）」<b>v3</b>；向 Atlas 申请流程空间 <span class="mono xs">ws-7f3a2c</span>` },

      <dt>技能</dt><dd class="sm">${ag ? AGENTS[ag].skills.map((k) => `<span class="tag" style="margin:0 4px 4px 0">${esc(k)}</span>`).join('') : '—'}<div class="xs faint">产出物的格式由数字员工的技能约定</div></dd>
      <dt>产出目录</dt><dd class="sm"><span class="mono xs">${esc(n.name)}/</span><div class="xs faint">开工指令里的约定；提交时由执行人选文件，不限目录</div></dd>
      ${n.admit ? `<dt>准入</dt><dd class="sm">${esc(roleNames(tpl, n.admit))}</dd>` : ''}<dt>准出</dt><dd class="sm">${esc(roleNames(tpl, n.exit))} · ${ruleText(n)}</dd></dl></div>`;
  } else if (s.sub && subR(s) === s.r && !['working', 'pending'].includes(s.st)) {
    body = `<div class="row" style="flex-wrap:wrap">${s.sub.map(fileChip).join('')}<span class="xs faint">${subLabel(f, nid)}</span></div>${docView(fid, s.sub[0], '流程空间当前内容')}`;
  } else if (s.st === 'working') {
    body = `<div class="banner2 info">${ic('send2')}<div>本轮还没提交。点「提交评审」时从流程空间选这一轮的产出物${s.sub ? `（第 ${subR(s)} 轮提交过：${s.sub.map(base).join('、')}）` : ''}</div></div>
      ${touched.length ? `<div class="xs muted">本节点会话改过的文件</div><div class="row" style="flex-wrap:wrap">${touched.map(fileChip).join('')}</div>${docView(fid, touched.find((p) => docOf(fid, p)) || touched[0], '流程空间当前内容')}` : `<div class="pcard sm muted">本节点的会话还没写文件</div>`}`;
  } else {
    body = `<div class="pcard sm muted">还没有产出物：开工后数字员工写进流程空间，提交评审时由执行人选</div>`;
  }
  return `<div class="rp">${tabs}${body}</div>`;
}

/* 编排器：团队模板和流程市场模板共用，mode = team / market */

    S.modal = null;
    go(`#/projects/${k}/config`);
    toast(`已建项目「${name}」：绑定流程模板、分配角色后就能发起`);
    return false;
  },
  selNode: (el) => { S.selNode = el.dataset.id; },
  steps: (el) => { S.stepsOpen[el.dataset.id] = !S.stepsOpen[el.dataset.id]; },
  r1open: () => { S.r1open = !S.r1open; },
  ptab: (el) => { S.ptab[el.dataset.k] = el.dataset.v; },
  dec: (el) => { S.dec[el.dataset.k] = el.dataset.v; },
  ask: (el) => {
    S.ask[el.dataset.id] = +el.dataset.v;
    S.done.td3 = true;
    AGENTS['a-arch'].st = 'busy';
    AGENTS['a-arch'].now = 'F-1022 · 技术方案（第 2 轮改完，等提交评审）';
    const f = FILES['F-1022'].find(([p]) => p === '技术方案/技术方案.md');
    f[3] = '刚刚'; f[4] = '7 KB';
    toast('已回答：架构师改完方案，写进了流程空间');
    return false;
  },
  /* 提交评审：从流程空间选这一轮的产出物 */
  submit: (el) => { const [fid, nid] = el.dataset.k.split('/'); S.modal = { type: 'submit', fid, nid, sel: [] }; },
  subPick: (el) => { const s = S.modal.sel; const p = el.dataset.v; const i = s.indexOf(p); if (i < 0) s.push(p); else s.splice(i, 1); },
  subGo: () => {
    const { fid, nid, sel } = S.modal;
    const f = FLOWS[fid];
    const s = f.nodes[nid];
    s.st = 'exit_review'; s.sub = [...sel]; delete s.subR;
    if (fid === 'F-1022' && nid === 'design') S.done.d1022 = true;
    const revs = reviewersOf(f, nid).map((u) => PEOPLE[u].name).join('、');
    S.modal = null;
    toast(`已提交准出评审（第 ${s.r} 轮）：产出物 ${sel.map(base).join('、')}；锁定评审人 ${revs}`);
    return false;
  },
  admit: (el) => {
    const key = el.dataset.k;
    const [fid, nid] = key.split('/');
    const f = FLOWS[fid];
    const tpl = tplOf(f);
    const up = ups(tpl, nid)[0];
    let msg;
    if (S.dec[key] === 'ok') {
      f.nodes[nid].st = 'working'; f.nodes[nid].r = 1;
      const all = downs(tpl, up).every((x) => !['pending', 'admit_review'].includes(f.nodes[x].st));
      if (all) f.nodes[up].st = 'passed';
      msg = `准入通过：「${tpl.nodes[nid].name}」开工${all ? `；「${tpl.nodes[up].name}」的下游都已开工 → 已通过` : ''}`;
    } else {
      f.nodes[up].st = 'working'; f.nodes[up].subR = f.nodes[up].r; f.nodes[up].r += 1;
      f.nodes[up].back = { by: ME.id, from: nid, why: '（你刚写的打回意见）' };
      const hit = [];
      downs(tpl, up).forEach((x) => {
        if (x === nid) f.nodes[x].st = 'pending';
        else if (!['pending', 'admit_review'].includes(f.nodes[x].st)) { f.nodes[x].st = 'returned'; hit.push(tpl.nodes[x].name); }
      });
      msg = `已打回「${tpl.nodes[up].name}」，回到第 ${f.nodes[up].r} 轮${hit.length ? `；「${hit.join('、')}」标记为已打回` : ''}`;
    }
    const t = todoOf(fid, nid);
    if (t) S.done[t.id] = true;
    go(`#/flows/${fid}`);
    toast(msg);
    return false;
  },
  exitReview: (el) => {
    const key = el.dataset.k;
    const [fid, nid] = key.split('/');
    const f = FLOWS[fid];
    S.done.td2 = true;
    if (S.dec[key] === 'ok') {
      f.nodes[nid].st = 'exited';
      if (f.nodes.cases.st === 'exited') f.nodes.exec.st = 'admit_review';
      toast('全部同意 → 编码准出；「测试执行」的两个上游都已准出，进入准入评审（陈运）');
    } else {
      f.nodes[nid].st = 'working'; f.nodes[nid].subR = f.nodes[nid].r; f.nodes[nid].r += 1;
      toast('已驳回：开发工程师开始第 2 轮，你的意见作为第一条指令');
    }
    go(`#/flows/${fid}`);
    return false;
  },
  validate: (el) => { S.modal = { type: 'validate', mode: el.dataset.v, key: el.dataset.k }; },
  publish: () => {
    const m = S.modal;
    const t = editTarget(m);
    t.ver += 1; t.draft = false;
    if (m.mode === 'market' && t.status === 'draft') t.status = 'on';
    if (m.mode === 'team') t.status = '已发布';
    S.modal = null;
    toast(m.mode === 'market' ? `已发布市场 v${t.ver}：之后拷贝的租户拿到这一版，已经拷走的不受影响` : `已发布 v${t.ver}：新发起的流程用这一版`);
    return false;
  },
  /* 流程市场 */
  copy: (el) => { S.modal = { type: 'copy', mid: el.dataset.v, name: MARKET[el.dataset.v].name }; },
  copyOk: () => {
    const { mid } = S.modal;
    const name = (S.modal.name || '').trim();
    if (!name) { toast('写个模板名称'); return false; }
    const g = MARKET[mid];
    const k = `tpl-${Object.keys(TPLS).length + 1}`;
    TPLS[k] = { ...clone({ roles: g.roles, steps: g.steps, nodes: g.nodes }), name, ver: 0, team: S.team, color: g.color, icon: g.icon, status: '草稿', used: 0, draft: true, desc: g.desc, from: { mid, ver: g.ver } };
    g.copies += 1;
    S.modal = null;
    S.selNode = flat(g)[0];
    go(`#/team/templates/${k}`);
    toast(`已拷贝为「${TEAMS[S.team].name}」的草稿：改完发布，再到项目配置里绑定`);
    return false;
  },
  mToggle: (el) => {
    const m = MARKET[el.dataset.v];
    m.status = m.status === 'on' ? 'off' : 'on';
    toast(m.status === 'on' ? '已上架：各租户能看到、能拷贝' : '已下架：租户不能再拷贝；已经拷走的不受影响');
    return false;
  },
  mNew: () => {
    const k = `m-${Object.keys(MARKET).length + 1}`;
    MARKET[k] = { name: '未命名模板', cat: S.mcat === 'all' ? 'rd' : S.mcat, ver: 0, status: 'draft', copies: 0, tenants: 0, color: '#64748b', icon: 'flow', who: '—', desc: '（还没写说明）', roles: { r1: '执行人' }, steps: ['n1'], nodes: { n1: { name: '第一步', exec: 'r1', exit: ['r1'], desc: '' } } };
    S.selNode = 'n1';
    go(`#/market/${k}/edit`);
    toast('已建草稿：编排好后发布，第一次发布即上架');
    return false;
  },
};
document.addEventListener('click', (e) => {
  if (e.target.matches('input:not([type=checkbox]),select,textarea')) return;
  const el = e.target.closest('[data-go],[data-act],[data-pop]');
  if (!el) { if (S.pop && !e.target.closest('[data-stop]')) { S.pop = null; render(); } return; }
  if (el.dataset.act === 'closeModal' && el.classList.contains('mask') && e.target !== el) return;
  if (el.hasAttribute('disabled')) return;
  e.preventDefault();
  if (el.dataset.pop) {
    e.stopPropagation();
    const rc = el.getBoundingClientRect();
    S.pop = S.pop?.id === el.dataset.pop ? null : { id: el.dataset.pop, x: Math.max(12, Math.min(rc.left, window.innerWidth - 360)), y: rc.bottom + 6 };
    return render();
  }
  if (el.dataset.go) { S.modal = null; S.pop = null; if (location.hash === el.dataset.go) return render(); return go(el.dataset.go); }
  const fn = ACT[el.dataset.act];
  if (fn) { if (fn(el, e) !== false) render(); }
});
/* 弹窗里的输入框：重绘前把值记进 S.modal，切换选项不丢字 */
document.addEventListener('input', (e) => { if (S.modal && e.target.dataset.bind) S.modal[e.target.dataset.bind] = e.target.value; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.modal || S.pop)) { S.modal = null; S.pop = null; render(); } });
render();

</script>
</body>
</html>
