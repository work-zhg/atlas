# LIFE-01 闲置回收后重建（§2.3）：第二轮重建沙箱、输出前带「环境已重建」提示，模型据此重装后继续
# ★ 两轮之间等 1900 秒：要大于部署的 sandbox_idle_ttl_s（默认 1800），并赶上一轮维护者的闲置回收
category: eng
tags: [sandbox, slow, multi-turn, case-LIFE-01]
instruction: |
  请调用 execute 原样运行：
    mkdir -p /tmp/lib && echo 'VALUE = 42' > /tmp/lib/cfg.py && PYTHONPATH=/tmp/lib python3 -c 'import cfg; print(cfg.VALUE)'
turns:
  - wait_s: 1900
