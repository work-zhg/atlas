# CAN-03 取消父 run（§2.4，端到端用例 6.5 cancel-cascade）：子智能体在共享沙箱里的命令也都被中断
category: eng
tags: [sandbox, fast, cancel, subagent, multi-turn, case-CAN-03]
instruction: |
  请在同一轮里并行做三件事（三条命令都会运行 2 分钟）：
    1. 发起一个 task，交给 runner 子智能体运行 `sh marks/mark.sh sub1 120`
    2. 再发起一个 task，交给 runner 子智能体运行 `sh marks/mark.sh sub2 120`
    3. 你自己用 execute 运行 `sh marks/mark.sh top 120`
agent_patch:
  subagents:
    - name: runner
      description: 在工作区里运行交给它的一条 shell 命令，并原样返回输出的最后一行
      system_prompt: 你负责用 execute 运行交给你的那一条命令（只运行一次，不要放到后台），然后只回复命令输出的最后一行。
      model: {model: deepseek-v4-pro, provider: anthropic}
      tool_names: [filesystem, bash]
      session_mode: ephemeral
actions:
  - desc: 子智能体的命令跑到第 10 秒时取消父 run
    do: cancel_run
    when: {event: tool.started, mark: sub1}
    after_s: 10
turns:
  - wait_s: 20
    text: |
      请调用 execute 原样运行 `pgrep -fa '[m]ark.sh' | wc -l > left.txt`。
expect:
  - desc: 取消做了（场景生效）
    gate: false
    metric: actions_done
    count: "==1"
  - desc: 子智能体的命令被中断
    metric: marks.sub1.end
    count: "==0"
  - desc: 另一个子智能体的命令被中断
    metric: marks.sub2.end
    count: "==0"
  - desc: 父智能体自己的命令被中断
    metric: marks.top.end
    count: "==0"
budget: {wall_s: 900}
