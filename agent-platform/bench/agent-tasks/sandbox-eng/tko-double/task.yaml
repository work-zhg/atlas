# TKO-11 连续两次接管（§2.5）：接手的实例在同一条命令执行中又被杀，照样接上
category: eng
tags: [sandbox, chaos, case-TKO-11]
instruction: |
  请调用 execute 运行 `sh marks/mark.sh dbl 150`（只运行一次，不要放到后台，不要设置 timeout，也不要重复运行）。
  结束后用 write_file 把输出的最后一行（MARK-DONE 开头）写入 done.txt。
actions:
  - desc: 命令跑到第 10 秒，强删 server Pod
    do: kill_server
    when: {event: tool.started, mark: dbl}
    after_s: 10
  - desc: 第一次接管 15 秒后，再强删接手的 server Pod
    do: kill_server
    when: {event: run.resumed}
    after_s: 15
expect:
  - desc: 故障注入都做了（场景生效）
    gate: false
    metric: actions_done
    count: "==2"
  - desc: 接管了两次（场景生效）
    gate: false
    event: run.resumed
    count: ">=2"
  - desc: 平台没有替模型重跑命令
    metric: platform_reruns
    count: "==0"
  - desc: dbl 没有被打断（跑完了）
    metric: marks.dbl.interrupted
    count: "==0"
  - desc: 模型拿到了 dbl 的真实输出（含结束令牌）
    metric: marks.dbl.token_seen
    count: ">=1"
budget: {wall_s: 1200}
