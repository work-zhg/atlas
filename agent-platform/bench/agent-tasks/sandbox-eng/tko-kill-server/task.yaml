# TKO-01 命令执行中 server 崩溃（§2.5）：接管后用同一个调用重放，接上原命令，不重跑
category: eng
tags: [sandbox, chaos, case-TKO-01]
instruction: |
  请调用 execute 运行 `sh marks/mark.sh slow 90`。这条命令会运行 90 秒：请等它自然结束（只运行一次，不要放到后台，不要设置 timeout，也不要重复运行）。
  结束后用 write_file 把输出的最后一行（MARK-DONE 开头）写入 done.txt。
actions:
  - desc: 命令跑到第 10 秒，强删持有这个 run 的 server Pod
    do: kill_server
    when: {event: tool.started, mark: slow}
    after_s: 10
expect:
  - desc: 故障注入做了（场景生效）
    gate: false
    metric: actions_done
    count: ">=1"
  - desc: 发生了接管（场景生效）
    gate: false
    event: run.resumed
    count: ">=1"
  - desc: 平台没有替模型重跑命令
    metric: platform_reruns
    count: "==0"
  - desc: slow 没有被打断（跑完了）
    metric: marks.slow.interrupted
    count: "==0"
  - desc: 模型拿到了 slow 的真实输出（含结束令牌）
    metric: marks.slow.token_seen
    count: ">=1"
budget: {wall_s: 900}
