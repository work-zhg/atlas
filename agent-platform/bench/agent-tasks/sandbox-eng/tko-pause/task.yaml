# TKO-08 实例假死后复活（§2.5）：复活的实例只停自己的本地执行，不碰接管者正在跟随的命令
# ★ 需要两个 server 副本：单副本时没人接管，暂停的实例会在兜底时间到后恢复，场景不生效
category: eng
tags: [sandbox, chaos, needs-2-replicas, case-TKO-08]
instruction: |
  请调用 execute 运行 `sh marks/mark.sh pz 120`（只运行一次，不要放到后台，不要设置 timeout，也不要重复运行）。
  结束后用 write_file 把输出的最后一行（MARK-DONE 开头）写入 done.txt。
actions:
  - desc: 命令跑到第 10 秒，暂停持有这个 run 的 server 进程
    do: pause_server
    when: {event: tool.started, mark: pz}
    after_s: 10
  - desc: 另一个实例接管之后（或 300 秒兜底）恢复它
    do: resume_server
    when: {event: run.resumed}
    after_s: 5
    deadline_s: 300
expect:
  - desc: 故障注入做了（场景生效）
    gate: false
    metric: actions_done
    count: ">=1"
  - desc: 发生了接管（场景生效）
    gate: false
    event: run.resumed
    count: ">=1"
  - desc: 平台没有替模型重跑命令
    metric: platform_reruns
    count: "==0"
  - desc: pz 没有被打断（跑完了）
    metric: marks.pz.interrupted
    count: "==0"
  - desc: 模型拿到了 pz 的真实输出（含结束令牌）
    metric: marks.pz.token_seen
    count: ">=1"
budget: {wall_s: 1200}
