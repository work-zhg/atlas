# TKO-05 批准后执行中崩溃（§2.5）：接管后不再弹审批（审批 id 由 run 与 tool_call_id 派生），接上原命令
category: eng
tags: [sandbox, chaos, approval, case-TKO-05]
instruction: |
  请调用 execute 运行 `sh marks/mark.sh ap 60`（只运行一次，不要放到后台，不要设置 timeout，也不要重复运行）。
  结束后用 write_file 把输出的最后一行（MARK-DONE 开头）写入 done.txt。
agent_patch:
  approval: {default_mode: manual, allowed_modes: [manual]}
actions:
  - desc: 批准后命令跑到第 10 秒，强删 server Pod
    do: kill_server
    when: {event: tool.started, mark: ap}
    after_s: 10
expect:
  - desc: 故障注入做了（场景生效）
    gate: false
    metric: actions_done
    count: ">=1"
  - desc: 发生了接管（场景生效）
    gate: false
    event: run.resumed
    count: ">=1"
  - desc: 平台没有替模型重跑命令
    metric: platform_reruns
    count: "==0"
  - desc: ap 没有被打断（跑完了）
    metric: marks.ap.interrupted
    count: "==0"
  - desc: 模型拿到了 ap 的真实输出（含结束令牌）
    metric: marks.ap.token_seen
    count: ">=1"
  - desc: 接管后没有再请示一次
    metric: marks.ap.approvals
    count: "==1"
budget: {wall_s: 900}
