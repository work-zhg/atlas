# TKO-03 并行的一批中途崩溃（§2.5）：已结束的读回结果，还在跑的接着跟随
category: eng
tags: [sandbox, chaos, case-TKO-03]
instruction: |
  请在同一步里并行发起三个 execute 调用（一起发出，不要合并，也不要一个一个等）：
    sh marks/mark.sh pa 5
    sh marks/mark.sh pb 60
    sh marks/mark.sh pc 90
  每条只运行一次，不要放到后台、不要设置 timeout、也不要重复运行。
  全部结束后，用 write_file 把三条命令输出的最后一行（MARK-DONE 开头）写入 done.txt，一行一个。
actions:
  - desc: 第一条命令开始 30 秒后（pa 已结束、pb pc 还在跑），强删 server Pod
    do: kill_server
    when: {event: tool.started, mark: pa}
    after_s: 30
expect:
  - desc: 故障注入做了（场景生效）
    gate: false
    metric: actions_done
    count: ">=1"
  - desc: 发生了接管（场景生效）
    gate: false
    event: run.resumed
    count: ">=1"
  - desc: 平台没有替模型重跑命令
    metric: platform_reruns
    count: "==0"
  - desc: pa 没有被打断（跑完了）
    metric: marks.pa.interrupted
    count: "==0"
  - desc: 模型拿到了 pa 的真实输出（含结束令牌）
    metric: marks.pa.token_seen
    count: ">=1"
  - desc: pb 没有被打断（跑完了）
    metric: marks.pb.interrupted
    count: "==0"
  - desc: 模型拿到了 pb 的真实输出（含结束令牌）
    metric: marks.pb.token_seen
    count: ">=1"
  - desc: pc 没有被打断（跑完了）
    metric: marks.pc.interrupted
    count: "==0"
  - desc: 模型拿到了 pc 的真实输出（含结束令牌）
    metric: marks.pc.token_seen
    count: ">=1"
budget: {wall_s: 900}
