# CRS-01（优雅删除组）命令执行中删会话 Pod（§2.9，沙箱用例 CLI-03）：bridge 先以 pod_terminating
# 取消这一轮再退出 → 这一轮 runtime_interrupted，不自动重做；下一轮用新 Pod，工作区与 CLI 的会话记录还在
category: eng
tags: [cli, chaos, multi-turn, case-CRS-01]
instruction: |
  请记住这个口令：松烟-5093-鹤鸣（不要写进任何文件）。然后用 Bash 运行 `sh marks/mark.sh crs 90`
  （只运行一次，不要放到后台，不要设置 timeout，也不要重复运行），结束后把输出的最后一行写入 done.txt。
actions:
  - desc: 命令跑到第 10 秒，优雅删除会话 Pod
    do: delete_sandbox
    args: {graceful: true}
    when: {event: tool.started, mark: crs}
    after_s: 10
run_outcomes:
  1: {status: failed, error_kind: [runtime_interrupted]}
turns:
  - wait_s: 10
    text: |
      上一轮我让你记住的口令是什么？只把口令本身写进 answer.txt。
      然后用 Bash 运行 `sh marks/mark.sh after 0`，把输出的最后一行写入 after.txt。
expect:
  - desc: 故障注入做了（场景前提）
    gate: false
    metric: actions_done
    count: "==1"
  - desc: 不自动重做：crs 最多执行了一次
    metric: marks.crs.start
    count: "<=1"
  - desc: 会话用过 2 个会话 Pod
    metric: sandbox_hosts
    count: "==2"
budget: {wall_s: 900}
