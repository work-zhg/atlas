# SES-02 会话 Pod 没了之后的下一轮（§2.2）：建新 Pod，CLI 按记下的会话 id 恢复上下文；工作区、
# CLI 的会话记录（CLAUDE_CONFIG_DIR，在 /data/home/.claude）还在，/tmp 里的没了（预期）。
# HOME 在本地盘（/tmp/home，按人共享改造后），重建后也没了：state.txt 里的 home 只记录不校验
category: eng
tags: [cli, chaos, multi-turn, case-SES-02]
instruction: |
  请记住这个口令：青瓷-2861-雁回。然后用 Bash 原样运行：
    echo note-in-workspace > ws-note.txt && mkdir -p ~/.bench && echo note-in-home > ~/.bench/note && echo note-in-tmp > /tmp/bench-note && sh marks/mark.sh before 0
  不要把口令写进任何文件，回复「好了」即可。
actions:
  - desc: 第一轮结束后强删会话 Pod（模拟驱逐）
    do: delete_sandbox
    args: {mark: before}
    when: {event: run.finished}
turns:
  - wait_s: 5
    text: |
      上一轮我让你记住的口令是什么？只把口令本身写进 answer.txt。然后用 Bash 原样运行：
        { [ -f ws-note.txt ] && echo ws=有 || echo ws=没有; [ -f ~/.bench/note ] && echo home=有 || echo home=没有; [ -f /tmp/bench-note ] && echo tmp=有 || echo tmp=没有; } > state.txt && sh marks/mark.sh after 0
expect:
  - desc: 故障注入做了（场景前提）
    gate: false
    metric: actions_done
    count: "==1"
  - desc: 第二轮在新的会话 Pod 里（会话用过 2 个 Pod）
    metric: sandbox_hosts
    count: "==2"
budget: {wall_s: 900}
