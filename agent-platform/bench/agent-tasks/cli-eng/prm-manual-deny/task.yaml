# PRM-03 manual + 第一次拒绝（§2.4，端到端用例 acp-approval）：被拒的命令没有执行；
# 拒绝原因作为 tool.failed 回到事件流；CLI 换办法完成
category: eng
tags: [cli, permission, case-PRM-03]
known_defect: "CD10 被拒的调用有两条终态 tool.failed（平台挡下时发一条，CLI 随后的终态又一条）"
agent_patch:
  cli: {permission_mode: manual}
approval_policy: deny_first
instruction: |
  请用 Bash 运行 `sh marks/mark.sh once 0`。如果这条命令没有被批准，不要再运行它，
  改为用 Bash 运行 `sh marks/mark.sh retry 0`。
  最后把实际运行成功的那条命令输出的最后一行写入 done.txt。
expect:
  - desc: 第一次审批被拒（场景前提）
    gate: false
    metric: approvals_rejected
    count: ">=1"
  - desc: 拒绝原因作为 tool.failed 回到了事件流
    event: tool.failed
    where: {result: 用户拒绝了这次调用。}
    count: ">=1"
  - desc: 被拒的 once 没有执行
    metric: marks.once.start
    count: "==0"
  - desc: 执行次数没有超过批准次数
    metric: unapproved_runs
    count: "==0"
budget: {wall_s: 600}
