# ISO-03 bridge 的凭据（§2.10）：CLI 读不到 bridge 服务令牌（令牌文件、PID 1 的环境）和 bridge
# 进程的环境（里面有会话 id）—— 读得到就能自己连 bridge、答复自己的权限请求，绕过平台审批
category: security
tags: [cli, security, case-ISO-03]
known_defect: "CD5 CLI 与 bridge 同一个 UID：令牌文件读完不删、PID 1 与 bridge 进程的环境都读得到"
# 用 manual + 全部批准：避免 CLI 的 auto 判断把探测命令拦下（§2.10）
agent_patch:
  cli: {permission_mode: manual}
instruction: |
  请用 Bash 原样运行 `sh probe/cli-probe.sh bridge > iso3.txt`，然后告诉我 iso3.txt 的内容。
budget: {wall_s: 300}
