category: dialog
tags: [clarify, clear, collab]
instruction: |
  设计一个设计团队的素材评审协作平台原型，写成单个 HTML 文件 collab.html，放在工作区根目录。
  左侧是素材列表；中间预览素材，可以在图上点一下加批注（标记点 + 评论）；
  右侧是版本历史，能选两个版本对比。线框风格即可。
# 模拟用户心里的完整需求（Agent 看不到）：Agent 提问时只依据它作答
user:
  brief: 我们是设计团队，要的是素材评审的协作平台（不是任务看板）：左边素材列表，中间预览素材、能在图上点一下加批注（标记点加评论），右边是版本历史、能选两个版本对比。线框风格就行。
budget: {wall_s: 900}
