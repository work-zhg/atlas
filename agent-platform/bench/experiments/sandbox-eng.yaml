# 沙箱工程用例 · 回归（bench/doc/sandbox-eng-cases.html）：不注入故障的那部分，L2 端到端。
#
#   uv run python -m atlas_bench agent run agent-platform/bench/experiments/sandbox-eng.yaml --gate
#
# ★ 新建的评测智能体要先在模型管理平台分配模型：先 --prepare-only 列出 id，再 client-key ensure。
# ★ life-reclaim 要查沙箱 Pod 是否回收：需要 kubectl（KUBECONFIG 指向被测集群，同 forward.sh）。
# ★ concurrency 2：112 单节点 CPU request 余量小，每个沙箱 request 100m（同 tbench.yaml）。
# ★ 不含故障集（tags: chaos → sandbox-chaos.yaml）、长跑（slow → sandbox-slow.yaml）。
name: sandbox-eng
suites: [sandbox-eng]
tags_none: [chaos, slow, needs-2-replicas]
trials: 1
concurrency: 2
approval_policy: approve_all
variants:
  # ★ 审批固定 manual：每条命令都经评测批准（审批次数可数、不受自动模式判断器的影响）
  native-sbx:
    description: 原生：文件 + Shell + 待办
    agent:
      system_prompt: 你在一个带 Linux 沙箱的工作区里完成用户的任务。直接动手做，做完自己验证，最后用一两句话说明结果。
      model: {model: deepseek-v4-pro, provider: anthropic}
      tool_names: [filesystem, bash, write_todos]
      limits: {max_steps: 80}
      approval: {default_mode: manual, allowed_modes: [manual]}
