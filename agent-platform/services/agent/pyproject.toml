[project]
name = "atlas-agent"
version = "0.1.0"
description = "Atlas agent 服务 — FastAPI, Postgres, Redis."
requires-python = ">=3.13"
dependencies = [
  "atlas-acp",
  "atlas-engine",
  "atlas-host",
  "atlas-jsonrpc",
  # 沙箱 ensure 的会话级锁（doc/sandbox-opensandbox-design.html §13）
  "atlas-redislock",
  # 只用 atlas_skill.schemas（对外契约）—— import-linter 守着
  "atlas-skill",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "httpx>=0.27",
  # MCP 客户端：langchain.mcp（langchain 主包，beta）+ FastMCP 的 client。
  #   langchain[mcp] 拉的是整个 fastmcp（含 server 那一套），这里只要 client。
  "fastmcp-slim[client]>=4.0.11,<5",
  "mcp>=2.3,<3",
  # 调 MCP 工具前按参数定义校验参数（MCP 方案设计 §6.2）。mcp 本来就依赖它，这里写明
  "jsonschema>=4.20",
  # 对象存储走 S3 协议：阿里云 OSS 的 S3 兼容端点、MinIO、AWS S3 同一份
  # 实现。测试用 moto 的内存桶，三种环境的断言等价。
  "boto3>=1.35",
  # 遥测（可观测性设计 §02）。★ 是必要依赖而不是可选 extra：
  #   opentelemetry-api 在没有配置 SDK 时是官方保证的 no-op，那正是它的
  #   设计目的。做成 extra 只会多出「开了 otel_enabled 却没装包」这一种
  #   失败模式，而开关本来就该是行为层面的（Settings.otel_enabled）。
  # ★ 导出走 http/protobuf 而不是 grpc：少一层 grpc 依赖，且 4318 这条路
  #   对代理与网关更友好。
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  # ★ 跨会话记忆走记忆服务（atlas-memory，doc/memory-design.html），只经 HTTP：
  #   mem0 / fastembed 已不再需要（旧记忆不迁移，设计 Q5）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agent"]
