# 会话 Pod 的 BatchSandbox 模板（doc/sandbox-opensandbox-design.html §7），opensandbox-cli 用。合并规则见 sbx-strict.yaml。
# ★ 种子：迁移 0035 把它写进 sandbox_template（模板 code = 文件名），deploy/local/opensandbox.sh 首次部署时
#   拿它建 ConfigMap。之后改模板走管理接口（修订、发布），不改这个文件。
#
# ★ 开放档（同 sbx-strict.yaml）：UID 1000、根可写、镜像里免密 sudo；搞坏了重建 Pod 就恢复。
# ★ UID 1000 只设在主容器上，不设在 pod 级：有 git 档案的会话会带 egress sidecar（Credential Vault），
#   它要以 root 跑 nft（只加了 NET_ADMIN）。pod 级 runAsUser 会让 sidecar 也变成 1000，nft 配不上。
# ★ 带 networkPolicy 时运行时会给主容器设 capabilities.drop: [NET_ADMIN]，sudo 也改不了 nft；
#   其余能力保留默认（sudo 提权后 apt 要用）。
# ★ 模型 key：Secret atlas-cli-model 以文件挂在 /run/secrets/atlas，bridge 读出后交给 adapter
#   （ATLAS_BRIDGE_AGENT_ENV_FILES）—— key 不进 Pod spec / CR。
metadata: {}
spec:
  replicas: 1
  template:
    spec:
      restartPolicy: Never
      # bridge 的三步终止：拒新请求 → 上报中断 → 刷 span
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sandbox
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: repos, mountPath: /repos}
            - {name: model, mountPath: /run/secrets/atlas, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
        - {name: repos, emptyDir: {sizeLimit: 5Gi}}
        - name: model
          secret: {secretName: atlas-cli-model, defaultMode: 0444, optional: true}
