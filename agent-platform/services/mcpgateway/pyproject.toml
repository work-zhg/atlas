[project]
name = "atlas-mcpgateway"
version = "0.1.0"
description = "MCP gateway — the only entry to MCP services: registry, tool review, API keys, auth and forwarding (doc/mcp-design.html)."
requires-python = ">=3.13"

# ★ 为什么独立成服务（MCP 方案设计 §2.1）：所有 MCP 调用（Atlas 的 Native、Pod 里的 CLI）
#   都经过它；认人、判权、执行复核、改写身份请求头都在这里。它在用户中心里是独立应用，
#   「谁能用哪个 MCP 服务」这个数据编码属于它。放进 atlas-server 等于让 Atlas 进数据面。
#
# ★ 不依赖 Redis：多副本之间没有要共享的状态 —— 会话标识原样透传给上游（Higress），
#   Key 与复核结论每个请求查库，判权结果在进程内短时缓存（§5.8）。
# ★ 与其它包互不 import（根 pyproject 的 import-linter 守着）：Atlas 只经 HTTP 调本服务。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  # 从上游拉工具定义、接入检查：和 Atlas 同一套 MCP 客户端（mcp 2.x）
  "fastmcp-slim[client]>=4.0.11,<5",
  "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mcpgateway"]
