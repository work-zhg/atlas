[project]
name = "atlas-mcpgateway"
version = "0.1.0"
description = "MCP gateway — the only entry to MCP services: proxies MCP servers, converts REST / gRPC into MCP tools, API keys as permission subjects, OpenTelemetry traces."
requires-python = ">=3.13"

# ★ 为什么独立成服务：所有 MCP 调用（Atlas 的 Native、Pod 里的 CLI、外部客户端）都经过它；
#   认 Key、判权（用户中心数据权限，授给 Key）、协议转换、注入上游凭据都在这里。它在用户中心里
#   是独立应用，McpServer / McpTool 这两个数据编码属于它。
#
# ★ 不依赖 Redis：数据面无状态（每个请求独立，不发会话标识），服务定义和 Key 在库里，
#   判权结果在进程内短时缓存。流量治理（跨实例计数）是通用组件，单独设计。
# ★ 与其它包互不 import（根 pyproject 的 import-linter 守着）：Atlas 只经 HTTP 调本服务。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  # 网关自己是 MCP 服务端（SDK 的 lowlevel Server）；调上游 MCP Server 用 FastMCP 客户端
  "fastmcp-slim[client]>=4.0.11,<5",
  "mcp>=2.3,<3",
  # gRPC 转换：动态消息、服务端反射。★ protobuf 不上 7：工作区里别的包还在 6.x
  "grpcio>=1.70",
  "grpcio-reflection>=1.70",
  "protobuf>=5.29,<7",
  # Trace（OTLP/HTTP 导出）
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  # OpenAPI 可以是 YAML
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mcpgateway"]
