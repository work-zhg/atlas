[project]
name = "atlas-modelgateway"
version = "0.1.0"
description = "Model platform (management) and the model gateway — the only entry to models."
requires-python = ">=3.13"

# ★ 为什么独立成服务（模型管理方案设计 §3.4）：所有模型调用（Atlas 的 Native、Pod 里的 CLI、
#   平台功能）都经过它；认人、判权、计量都在这里。它在用户中心里是独立应用，「谁能用哪个模型」
#   这个数据编码属于它。和 MCP 网关分开部署：流量特征、故障面、扩缩容节奏都不同。
#
# ★ 两个进程：管理平台（serve）和模型网关（gateway，所有模型调用的入口，设计稿
#   agent-platform/doc/design/model-gateway-design.html）。网关用 Redis 存几个实例共用的状态
#   （线路冷却、账号异常、计数、花费、配置版本号），丢了能重建。
# ★ 与其它包互不 import（根 pyproject 的 import-linter 守着）：Atlas、知识库只经 HTTP 调本服务。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  # 账号巡检、用户 Key 重算、调用记录保留是它的实例任务（jobs.py）
  "atlas-jobs",
  # 多租户：数据按当前租户自动过滤；运营接口（开通、停用、清除租户）
  "atlas-tenancy",
  "atlas-opsapi",
  # 统一 Redis 客户端中间件（三池隔离、原子限流、Singleflight 协同缓存与跨副本失效广播）
  "atlas-redis",
  # 网关几个实例共用的状态
  "redis>=5",
  # 账号密钥的信封加密
  "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_modelgateway"]
