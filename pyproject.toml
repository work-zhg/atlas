[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — agent platform (workspace root)"
requires-python = ">=3.13"
dependencies = ["atlas-acp", "atlas-agent", "atlas-appconfig", "atlas-bench", "atlas-bridge", "atlas-connect", "atlas-devicegw", "atlas-devicelink", "atlas-engine", "atlas-host", "atlas-jobs", "atlas-jsonrpc", "atlas-knowledge", "atlas-mcpgateway", "atlas-memory", "atlas-modelgateway", "atlas-redislock", "atlas-skill", "atlas-teamflow", "atlas-usercenter"]

# Workspace root is a container, not an installable package.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "agent-platform/libs/acp",
  "agent-platform/services/agent",
  "agent-platform/services/devicegw",
  "agent-platform/bench",
  "agent-platform/pod/bridge",
  "agent-platform/device/connector",
  "agent-platform/libs/devicelink",
  "agent-platform/libs/engine",
  "agent-platform/libs/host",
  "agent-platform/libs/jsonrpc",
  "infra-platform/libs/appconfig",
  "infra-platform/libs/jobs",
  "infra-platform/libs/redislock",
  "agent-platform/services/knowledge",
  "agent-platform/services/mcpgateway",
  "agent-platform/services/memory",
  "agent-platform/services/modelgateway",
  "agent-platform/services/skill",
  "teamflow/services/teamflow",
  "usercenter/services/usercenter",
]

[tool.uv.sources]
atlas-acp = { workspace = true }
atlas-agent = { workspace = true }
atlas-appconfig = { workspace = true }
atlas-bench = { workspace = true }
atlas-bridge = { workspace = true }
atlas-connect = { workspace = true }
atlas-devicegw = { workspace = true }
atlas-devicelink = { workspace = true }
atlas-engine = { workspace = true }
atlas-host = { workspace = true }
atlas-jobs = { workspace = true }
atlas-jsonrpc = { workspace = true }
atlas-knowledge = { workspace = true }
atlas-mcpgateway = { workspace = true }
atlas-memory = { workspace = true }
atlas-modelgateway = { workspace = true }
atlas-redislock = { workspace = true }
atlas-skill = { workspace = true }
atlas-teamflow = { workspace = true }
atlas-usercenter = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "import-linter>=2.1",
  "ruff>=0.8",
  "httpx>=0.27",
  "moto>=5.0",
  "datamodel-code-generator>=0.34",
  # 知识库解析测试：生成带版面（双栏、页眉页脚、表格、图片）的 PDF 样本
  "reportlab>=4.0",
]
# mypy 暂不纳入 dev group：本机网络下 13MB wheel 反复下载超时，
# 且 CI 步骤未调用它。需要类型检查时单独 `uv tool install mypy`。

# ---------------------------------------------------------------------------
# ★ 依赖单向的硬约束（文档 §2.1）。engine 一旦 import server/db/web 就 CI 红。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["atlas_acp", "atlas_agent", "atlas_appconfig", "atlas_bench", "atlas_bridge", "atlas_connect", "atlas_devicegw", "atlas_devicelink", "atlas_engine", "atlas_host", "atlas_jobs", "atlas_jsonrpc", "atlas_knowledge", "atlas_mcpgateway", "atlas_memory", "atlas_modelgateway", "atlas_redislock", "atlas_skill", "atlas_teamflow", "atlas_usercenter"]
# forbidden_modules 里有第三方包（fastapi/sqlalchemy/...），必须打开这个开关
include_external_packages = true

[[tool.importlinter.contracts]]
# Bridge 代码设计 §1.3：通用层，谁都能用，因此它不能依赖任何人
name = "atlas_jsonrpc 不得导入任何 atlas_* 包"
type = "forbidden"
source_modules = ["atlas_jsonrpc"]
forbidden_modules = ["atlas_acp", "atlas_bridge", "atlas_engine", "atlas_host", "atlas_agent"]

[[tool.importlinter.contracts]]
# Bridge 设计 §3 D2 / 代码设计 §1.3：上游协议运送 ACP 内容，但不理解它。
# ACP 的版本变化不应该改动上游协议的任何类型。
name = "atlas_host 不得导入 atlas_acp 及其它 atlas_* 包"
type = "forbidden"
source_modules = ["atlas_host"]
forbidden_modules = ["atlas_acp", "atlas_bridge", "atlas_engine", "atlas_jsonrpc", "atlas_agent"]

[[tool.importlinter.contracts]]
name = "engine 不得依赖 server / web / DB / HTTP 框架"
type = "forbidden"
source_modules = ["atlas_engine"]
forbidden_modules = [
  "atlas_agent",
  "fastapi",
  "sqlalchemy",
  "alembic",
  "redis",
  "uvicorn",
  "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "分层：server -> engine 单向"
type = "layers"
layers = ["atlas_agent", "atlas_engine"]

# engine = 原生运行时（方案 3，2026-11-07）：contracts（类型与协议，最底层）← kernel（中间件，
# 只依赖 contracts）← runtime（装配、驱动、消息/模型/工具适配，唯一面向框架的一层）。
# server 只认 contracts 和 runtime：不 import 框架，也不直捅 kernel —— langchain 升级的
# 影响面因此只有 engine。运行时同款守卫见 tests/test_engine_purity.py。
#
# 历史注：10 月曾把 spec / events / runner 搬进 server（「只有 server 一个使用方」），server 随之
# 到处 import langchain 和 kernel 内部。方案 3 把它们搬回 engine：理由不是共享词汇，而是框架
# 隔离 —— 边界切在 AgentRuntime 这条接缝上。
[[tool.importlinter.contracts]]
name = "server 不 import 框架（langchain / langgraph 只在 engine）"
type = "forbidden"
source_modules = ["atlas_agent"]
forbidden_modules = [
  "langchain",
  "langchain_core",
  "langchain_anthropic",
  "langchain_openai",
  "langgraph",
  "langsmith",
]
# 经 atlas_engine.runtime 间接用到框架是设计本身
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "server 不直捅 kernel（只认 atlas_engine.contracts 与 atlas_engine.runtime）"
type = "forbidden"
source_modules = ["atlas_agent"]
forbidden_modules = ["atlas_engine.kernel"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "engine 内部分层：runtime -> kernel -> contracts"
type = "layers"
layers = ["atlas_engine.runtime", "atlas_engine.kernel", "atlas_engine.contracts"]

[[tool.importlinter.contracts]]
name = "contracts 不碰框架"
type = "forbidden"
source_modules = ["atlas_engine.contracts"]
forbidden_modules = ["langchain", "langchain_core", "langchain_anthropic", "langgraph"]

# atlas_acp 会被装进 **Pod 镜像**（bridge 依赖它）。它必须能脱离整个 atlas
# 依赖树独立安装 —— 拖进 atlas_agent 就等于把 sqlalchemy/fastapi 塞进每个
# 会话 Pod。运行时同款守卫见 tests/test_acp_wire.py 的子进程 import 探测。
[[tool.importlinter.contracts]]
name = "atlas_acp 是叶子：不依赖本仓任何其它包，也不碰重依赖"
type = "forbidden"
source_modules = ["atlas_acp"]
forbidden_modules = [
  "atlas_engine",
  "atlas_agent",
  "sqlalchemy",
  "fastapi",
  "redis",
  "langchain",
  "langchain_core",
  "langgraph",
  "boto3",
]

# bridge 跑在 Pod 里，是独立部署物。它与 server 的唯一接口是 WS 上的线协议
# （atlas_acp）—— 代码级共享会让「升级 server 必须同步升级全部在跑的 Pod」，
# 而 Pod 在跑时没法原地升级。运行时同款守卫见 tests/test_bridge_boundary.py。
[[tool.importlinter.contracts]]
name = "bridge 只认 atlas_acp，不认识 server"
type = "forbidden"
source_modules = ["atlas_bridge"]
forbidden_modules = [
  "atlas_agent",
  "atlas_engine",
  "sqlalchemy",
  "fastapi",
  "redis",
  "langchain",
  "langgraph",
  "boto3",
]

[[tool.importlinter.contracts]]
name = "server 里只有 cli.translate 能读 ACP（Bridge 设计 §3 D1：server 不说 ACP 的控制语义）"
type = "forbidden"
source_modules = ["atlas_agent"]
forbidden_modules = ["atlas_acp"]
ignore_imports = ["atlas_agent.cli.translate.** -> atlas_acp.**"]
unmatched_ignore_imports_alerting = "none"

# server 只许认技能应用的**对外契约**（schemas，只依赖 pydantic），不许碰它的
# 库、存储、服务层。两边同是 Python，越界只要一行 import —— 所以要 CI 拦
# （doc/skill-mcp-backend-design.html §4.1）。
[[tool.importlinter.contracts]]
name = "server 只认 atlas_skill 的 schemas"
type = "forbidden"
source_modules = ["atlas_agent"]
forbidden_modules = [
  "atlas_skill.db",
  "atlas_skill.skill",
  "atlas_skill.api",
  "atlas_skill.storage",
  "atlas_skill.audit",
  "atlas_skill.auth",
  "atlas_skill.settings",
  "atlas_skill.errors",
  "atlas_skill.register",
]

# 技能应用不认识运行时：调用方向只有 server → skill。
[[tool.importlinter.contracts]]
name = "atlas_skill 不认识运行时"
type = "forbidden"
source_modules = ["atlas_skill"]
forbidden_modules = [
  "atlas_agent",
  "atlas_engine",
  "atlas_bridge",
  "atlas_acp",
  "atlas_host",
  "redis",
  "langchain",
  "langgraph",
]

# 用户中心是独立系统（prototype/usercenter/docs/system-design.html §05）：它不认识 atlas 的
# 任何包，atlas 的任何包也不认识它 —— Atlas 将来只通过 /open/v1 开放接口使用它。
[[tool.importlinter.contracts]]
name = "atlas_usercenter 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_usercenter"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
]

[[tool.importlinter.contracts]]
name = "atlas 其它包不认识 atlas_usercenter"
type = "forbidden"
source_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
]
forbidden_modules = ["atlas_usercenter"]

# AI TeamFlow 也是独立系统（prototype/teamflow/docs/system-design.html）：人员与权限只走用户中心
# 开放接口，Agent 只走 Atlas 的 HTTP 接口 —— 与 atlas 其它包（含用户中心）互不 import。
[[tool.importlinter.contracts]]
name = "atlas_teamflow 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_teamflow"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_usercenter",
]

[[tool.importlinter.contracts]]
name = "atlas 其它包不认识 atlas_teamflow"
type = "forbidden"
source_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_usercenter",
]
forbidden_modules = ["atlas_teamflow"]

# 知识库服务是独立部署物（doc/atlas-rag-design.html §4）：atlas-server 只经 HTTP 调它，
# 双方互不 import —— 同语言越界只要一行 import，所以要 CI 拦。
[[tool.importlinter.contracts]]
name = "atlas_knowledge 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_knowledge"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_teamflow",
  "atlas_usercenter",
]

[[tool.importlinter.contracts]]
name = "atlas 其它包不认识 atlas_knowledge"
type = "forbidden"
source_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_teamflow",
  "atlas_usercenter",
]
forbidden_modules = ["atlas_knowledge"]

# 记忆服务是独立部署物（doc/memory-design.html §2）：抽象的主题与条目存储，不关心存的是不是记忆。
# atlas-server 只经 HTTP 调它，双方互不 import。
[[tool.importlinter.contracts]]
name = "atlas_memory 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_memory"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_knowledge",
  "atlas_teamflow",
  "atlas_usercenter",
  "redis",
  "langchain",
  "langgraph",
]

[[tool.importlinter.contracts]]
name = "atlas 其它包不认识 atlas_memory"
type = "forbidden"
source_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_knowledge",
  "atlas_teamflow",
  "atlas_usercenter",
]
forbidden_modules = ["atlas_memory"]

# MCP 网关是独立部署物（doc/mcp-design.html §2.1）：所有 MCP 调用的唯一入口。atlas-server 只经
# HTTP 调它（内部接口 + 数据面 /mcp/*），双方互不 import。
[[tool.importlinter.contracts]]
name = "atlas_mcpgateway 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_mcpgateway"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_knowledge",
  "atlas_memory",
  "atlas_teamflow",
  "atlas_usercenter",
  "redis",
  "langchain",
  "langgraph",
]

[[tool.importlinter.contracts]]
name = "atlas 其它包不认识 atlas_mcpgateway"
type = "forbidden"
source_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_knowledge",
  "atlas_memory",
  "atlas_teamflow",
  "atlas_usercenter",
]
forbidden_modules = ["atlas_mcpgateway"]

# 模型网关是独立部署物（doc/model-design.html §3）：所有模型调用的唯一入口。Atlas、知识库只经
# HTTP 调它（内部接口 + 数据面 /v1/*），双方互不 import；和 MCP 网关也互不 import（各自一份）。
[[tool.importlinter.contracts]]
name = "atlas_modelgateway 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_modelgateway"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_knowledge",
  "atlas_mcpgateway",
  "atlas_memory",
  "atlas_teamflow",
  "atlas_usercenter",
  "redis",
  "langchain",
  "langgraph",
]

[[tool.importlinter.contracts]]
name = "atlas 其它包不认识 atlas_modelgateway"
type = "forbidden"
source_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_agent",
  "atlas_knowledge",
  "atlas_mcpgateway",
  "atlas_memory",
  "atlas_teamflow",
  "atlas_usercenter",
]
forbidden_modules = ["atlas_modelgateway"]

# 评测框架只走被测平台的公开 HTTP 接口（doc/rag-eval-design.html §2）：对 Atlas 与竞品一视同仁。
[[tool.importlinter.contracts]]
name = "atlas_bench 不认识 atlas 其它包"
type = "forbidden"
source_modules = ["atlas_bench"]
forbidden_modules = [
  "atlas_acp",
  "atlas_bridge",
  "atlas_skill",
  "atlas_engine",
  "atlas_host",
  "atlas_jsonrpc",
  "atlas_knowledge",
  "atlas_agent",
  "atlas_teamflow",
  "atlas_usercenter",
]

# server 里留下的纯计算层不许碰基础设施。原生运行时的装配、执行循环、词汇已在 engine，
# 由上面「engine 不得依赖 server / web / DB」兜住。
[[tool.importlinter.contracts]]
name = "server 纯计算层不得依赖基础设施"
type = "forbidden"
source_modules = [
  "atlas_agent.domain",
  # translate 是纯函数：一条 update 进、零或多条事件意图出。它必须能脱离
  # WS 与 DB 单测 —— §06 的表就是它的测试用例（acp 详设 §03）。
  "atlas_agent.cli.translate",
]
forbidden_modules = ["sqlalchemy", "fastapi", "redis", "alembic", "pydantic_settings"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  # 智能体评测的任务夹具（初始文件 / 校验脚本 / 参考答案）：内容就是题目本身，不做格式化与 lint
  "agent-platform/bench/agent-tasks",
  "agent-platform/services/agent/migrations/versions",
  "agent-platform/services/skill/src/atlas_skill/migrations/versions",
  "usercenter/services/usercenter/src/atlas_usercenter/migrations/versions",
  "usercenter/web",
  "teamflow/services/teamflow/src/atlas_teamflow/migrations/versions",
  "agent-platform/services/knowledge/src/atlas_knowledge/migrations/versions",
  "agent-platform/services/memory/src/atlas_memory/migrations/versions",
  "teamflow/web",
  "docs",          # 别去动设计文档里的示例代码块
  "prototype",
  "design-system",
  # 由 acp/scripts/generate_v1.py 从官方 schema 生成，不手改，也不按本仓风格检查
  "agent-platform/libs/acp/src/atlas_acp/v1/_generated.py",
  "agent-platform/libs/acp/src/atlas_acp/v1/methods.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 本项目注释与文档字符串使用中文（见 ~/.claude/CLAUDE.md），
# 全角标点是有意的，不是"易混淆字符"。
ignore = ["RUF001", "RUF002", "RUF003"]

# kernel/ 纳入检查以捕获真问题（F/B/SIM 等），
# 但不为继承来的风格大改。裁剪推进时可逐步收紧这里。
# FastAPI 的依赖写在参数默认值里是框架约定；require(...) 返回的就是一个 Depends
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "atlas_usercenter.api.deps.require", "atlas_teamflow.api.deps.require", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"agent-platform/libs/engine/src/atlas_engine/kernel/**" = ["E501", "RUF100", "UP", "B", "SIM", "RUF012"]

# ★ formatter 没有 per-file-ignores，是全有或全无 —— 只能在这里整体排除。
#   不排除的话 `ruff format` 会重排 kernel 下 31 个文件，与上面
#   "不为继承来的风格大改" 的决定自相矛盾，且淹没真正的改动。
#   裁剪到某个模块时，可把该模块从这里移出并单独格式化。
[tool.ruff.format]
exclude = ["agent-platform/libs/engine/src/atlas_engine/kernel/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent-platform/tests", "agent-platform/libs/devicelink/tests", "agent-platform/services/devicegw/tests", "agent-platform/device/connector/tests", "agent-platform/services/skill/tests", "usercenter/services/usercenter/tests", "teamflow/services/teamflow/tests", "agent-platform/services/knowledge/tests", "agent-platform/services/memory/tests", "agent-platform/services/mcpgateway/tests", "agent-platform/services/modelgateway/tests", "agent-platform/bench/tests", "infra-platform/libs/redislock/tests", "infra-platform/libs/appconfig/tests", "infra-platform/libs/jobs/tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
exclude = ["agent-platform/libs/engine/src/atlas_engine/vendor", "agent-platform/services/agent/migrations/versions"]

[[tool.importlinter.contracts]]
# 分布式锁是通用层，server / teamflow / knowledge 都可以用 —— 因此它不能认识其中任何一个
name = "atlas_redislock 不依赖本仓任何其它包"
type = "forbidden"
source_modules = ["atlas_redislock"]
forbidden_modules = ["atlas_acp", "atlas_bench", "atlas_bridge", "atlas_skill", "atlas_engine", "atlas_host", "atlas_jsonrpc", "atlas_knowledge", "atlas_agent", "atlas_teamflow", "atlas_usercenter"]

[[tool.importlinter.contracts]]
# 应用配置嵌入宿主应用（c4-model/infra-platform/code-appconfig.html）：Atlas、TeamFlow、用户中心都可以用，
# 因此它不能认识其中任何一个
