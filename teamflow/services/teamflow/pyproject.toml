[project]
name = "atlas-teamflow"
version = "0.1.0"
description = "AI TeamFlow —— 面向团队协作的 AI 工作流平台：数字员工按团队的流程干活。"
requires-python = ">=3.13"

# ★ 独立系统（prototype/teamflow/docs/system-design.html）：自己的库与进程。
#   人员、角色、操作码、菜单、团队数据权限都来自用户中心开放接口；Agent 来自 Atlas 的 HTTP 接口。
#   与 atlas 其它包（含 atlas_usercenter）互不 import —— 由根 pyproject 的 import-linter 守着。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  # 多实例协调（唤醒、实时事件、缓存失效广播）；统一走 atlas_redis 中间件
  "atlas-redis",
  "redis>=5",
  # 扫描排着的指令、通知器是它的实例任务（jobs.py）
  "atlas-jobs",
  # 多租户：业务表按当前租户自动过滤；运营接口（租户的创建、删除）
  "atlas-tenancy",
  "atlas-opsapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_teamflow"]
