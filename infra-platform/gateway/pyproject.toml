[project]
name = "atlas-gateway"
version = "0.1.0"
description = "Atlas API 网关 —— 宿主机上的 OpenResty：routes.yaml 校验后渲染成 Nginx 配置，Lua 只做 JWT 验签、CSRF 和登录失败封禁。"
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_gateway"]
