# 测试用的「内部 Ingress」：和网关跑在同一个容器里的另一个 OpenResty，只听 127.0.0.1:18080。
# 按 Host 和路径扮演各个服务：回显收到的请求、发 JWKS、登录、SSE、WebSocket。
worker_processes 1;
pid /tmp/stub.pid;
error_log /usr/local/openresty/nginx/logs/stub-error.log info;

events {
  worker_connections 256;
}

http {
  access_log off;
  client_max_body_size 200m;
  lua_package_path "/etc/openresty/stub/?.lua;;";
  server {
    listen 127.0.0.1:18080;
    location / {
      content_by_lua_block {
        require("stub").handle()
      }
    }
  }
}
