[project]
name = "atlas-tenancy"
version = "0.1.0"
description = "Atlas 租户隔离 —— 数据访问层按当前租户自动过滤，漏写条件报错而不是串数据。"
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_tenancy"]
