[project]
name = "atlas-redislock"
version = "0.1.0"
description = "Atlas 分布式锁 —— 单 Redis 实例、owner 校验、看门狗续租。"
requires-python = ">=3.13"
dependencies = ["redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_redislock"]
