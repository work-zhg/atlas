[project]
name = "atlas-opsapi"
version = "0.1.0"
description = "Atlas 运营接口 —— 业务服务实现运营中心要求的契约：只认运营中心、系统范围、幂等、本地租户状态。"
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "atlas-tenancy",
  "atlas-appconfig",
  "atlas-jobs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_opsapi"]
