[project]
name = "atlas-opsapi"
version = "0.1.0"
description = "Atlas 运营接口 —— 业务系统接入运营中心的中间件：只认运营中心；租户接入只有创建、删除。"
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "atlas-tenancy",
  "atlas-appconfig",
  "atlas-jobs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_opsapi"]
