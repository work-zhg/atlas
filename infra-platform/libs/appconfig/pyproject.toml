[project]
name = "atlas-appconfig"
version = "0.1.0"
description = "Atlas 应用配置 —— 嵌入宿主应用的、带类型、带版本、可回滚的运行期业务参数。"
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "fastapi>=0.115",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_appconfig"]
