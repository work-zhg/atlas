[project]
name = "atlas-usercenter"
version = "0.1.0"
description = "用户中心 —— 用户、组织与权限的唯一数据源；接入应用通过开放接口获取。"
requires-python = ">=3.13"

# ★ 独立服务（prototype/usercenter/docs/system-design.html §05）：自己的库、自己的迁移、
#   自己的进程。与 atlas 其它包互不 import —— 两个方向都由根 pyproject 的
#   import-linter 守着；Atlas 将来只通过 /open/v1 开放接口使用它。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  # 访问 JWT：Ed25519 签名（网关本地验签，c4-model/apigateway/code-auth.html）
  "pyjwt[crypto]>=2.9",
  "email-validator>=2.2",
  # 运营接口（c4-model/opscenter/code-gateway.html）：只认运营中心的签名。用户中心自己的租户
  # 过滤仍是 db/tenancy.py（上下文挂在会话上），不用 atlas_tenancy
  "atlas-opsapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_usercenter"]
