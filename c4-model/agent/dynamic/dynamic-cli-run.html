<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic View</title>
<style>
  body { margin: 0; background: #fff; color: #444; font-family: "Open Sans", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  main { padding: 24px 32px 48px; }
  svg { display: block; max-width: 100%; height: auto; }
  h2 { margin: 40px 0 12px; font-size: 15px; font-weight: 600; color: #666; }
  #c4-report { margin: 0 0 24px; padding: 12px 16px 12px 36px; border: 1px solid #e0b4b4; background: #fff6f6; font-size: 14px; line-height: 1.6; }
  #c4-report li[data-level="error"] { color: #b00020; }
  #c4-report li[data-level="warn"] { color: #8a5a00; }
  #c4-details { max-width: 1280px; }
  #c4-details article { margin: 0 0 28px; scroll-margin-top: 16px; }
  #c4-details article:target h3 { background: #fff8d6; }
  #c4-details h3 { margin: 0 0 8px; padding: 2px 4px; font-size: 15px; font-weight: 600; color: #333; }
  #c4-details h3 .tech { margin-left: 8px; font-size: 13px; font-weight: 400; color: #888; }
  #c4-details p { margin: 0 0 8px; font-size: 14px; line-height: 1.7; }
  #c4-details table { width: 100%; margin: 0 0 8px; border-collapse: collapse; table-layout: fixed; font-size: 13px; line-height: 1.6; }
  #c4-details th, #c4-details td { padding: 6px 10px; border: 1px solid #e3e3e3; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  #c4-details th { background: #f6f8fa; font-weight: 600; }
  #c4-details th:nth-child(1) { width: 14%; }
  #c4-details th:nth-child(2) { width: 46%; }
  #c4-details td.sample, #c4-details pre { font-family: Menlo, Consolas, "PingFang SC", monospace; }
  #c4-details td.sample { word-break: break-all; }
  #c4-details pre { margin: 0; padding: 10px 12px; border: 1px solid #e3e3e3; background: #f6f8fa; font-size: 12px; line-height: 1.5; overflow-x: auto; }
  svg a { cursor: pointer; }
</style>
</head>
<body>
<!--
  只改下面这段 JSON；渲染器不用动。字段说明见 dynamic/RULES.md 的「数据格式」。
-->
<script type="application/json" id="c4-model">
{
  "title": "动态图：Agent 平台 - CLI 智能体跑一轮",
  "description": "目标模型。Run 已提交并被领取（同 dynamic-run.html 的 1–9 步），这一轮交给会话 Pod 里的 CLI 智能体，中间有一次权限请求。会话 Pod 还没有组件图：bridge 对应 bridge/ 下的代码图，CLI 适配器是 bridge 拉起的 Node 子进程；CLI 调模型、调 MCP 直接走模型平台和 MCP 网关，图中未画；事件由执行器落库后发布，同原生",
  "boundaries": [
    {
      "id": "platform",
      "name": "Agent 平台",
      "type": "Software System"
    },
    {
      "id": "server",
      "name": "Agent 服务",
      "type": "Container: Python / FastAPI",
      "in": "platform"
    },
    {
      "id": "pod",
      "name": "会话 Pod",
      "type": "Container: K8s Pod：bridge + CLI 智能体",
      "in": "platform"
    }
  ],
  "participants": [
    {
      "id": "web",
      "kind": "container",
      "technology": "Next.js / React",
      "in": "platform",
      "name": "控制台"
    },
    {
      "id": "executor",
      "kind": "component",
      "technology": "asyncio 后台任务",
      "in": "server",
      "name": "Run 执行器"
    },
    {
      "id": "acp",
      "kind": "component",
      "technology": "atlas_host 协议客户端",
      "in": "server",
      "name": "CLI 运行时"
    },
    {
      "id": "tools",
      "kind": "component",
      "technology": "MCP 客户端 / httpx",
      "in": "server",
      "name": "工具接入"
    },
    {
      "id": "sandboxes",
      "kind": "component",
      "technology": "OpenSandbox / execd 客户端（httpx）",
      "in": "server",
      "name": "沙箱"
    },
    {
      "id": "approval",
      "kind": "component",
      "technology": "Python 模块",
      "in": "server",
      "name": "审批"
    },
    {
      "id": "bridge",
      "kind": "component",
      "technology": "Python / asyncio（atlas_bridge）",
      "in": "pod",
      "name": "bridge"
    },
    {
      "id": "cli",
      "kind": "component",
      "technology": "Node 子进程（claude-agent-acp + Claude Code）",
      "in": "pod",
      "name": "CLI 适配器"
    }
  ],
  "messages": [
    {
      "from": "executor",
      "to": "acp",
      "description": "跑一轮（AgentRuntime.run_turn）"
    },
    {
      "from": "acp",
      "to": "tools",
      "description": "要下发的 MCP：网关上的服务 + 知识库",
      "details": {
        "note": "CliToolHandoff.mcp_servers：服务级的网关地址带智能体的 Key，知识库 MCP 带签名令牌；Key 停用、没授权的服务不下发并提示。"
      }
    },
    {
      "from": "acp",
      "to": "sandboxes",
      "description": "确保这个会话的 Pod 在跑，取 bridge 地址和服务令牌",
      "details": {
        "note": "PodProvider.ensure(thread, cli, model, credentials)：按会话复用；每轮把凭据整份写进 egress 的 Credential Vault；等 bridge 的 /readyz 回 200。凭据不进 Pod。"
      }
    },
    {
      "from": "acp",
      "to": "bridge",
      "description": "接上会话：认识这个 bridge 实例就 attach，否则 open",
      "technology": "atlas.host.v1 / WebSocket",
      "details": {
        "note": "握手在升级前检查完：服务令牌、会话绑定头、子协议。接续信息（CLI 的会话 id、bridge 实例、确认点）存在 cli_session 表里，换实例接管的 server 也能 attach 回来、从确认点之后补发。",
        "items": [
          [
            "握手",
            "SessionLink",
            "Authorization: Bearer <服务令牌>；X-Session-Id: <会话 uuid>；子协议 atlas.host.v1"
          ],
          [
            "attach",
            "认识这个实例",
            "{bridgeInstance, lastSeq}"
          ],
          [
            "open",
            "不认识或 bridge 重启过",
            "{resume: {agentSessionId, replay: \"none\"}, mcpServers, defaults: {idleS, toolIdleS}}"
          ]
        ]
      }
    },
    {
      "from": "bridge",
      "to": "cli",
      "description": "（只在 open 时）按能力恢复会话：session/resume，恢复不成就 session/new",
      "technology": "ACP v1 / stdio",
      "details": {
        "note": "CLI 从持久化的 HOME 读回上下文；恢复不成如实报 resumed = false，server 产出 session.lost 告诉用户上下文丢了。"
      }
    },
    {
      "from": "acp",
      "to": "bridge",
      "description": "turn.start（turnId = run id、权限模式、时限）",
      "technology": "atlas.host.v1 / WebSocket",
      "details": {
        "note": "同一个 turnId 重复提交是安全的；已有一轮在跑就拒绝（不排队）。权限模式设不上而实际更宽松时，这一轮不跑。",
        "example": "{\n  \"turnId\": \"<run uuid>\",\n  \"prompt\": [{\"type\": \"text\", \"text\": \"…\"}],\n  \"mode\": \"default\",\n  \"limits\": {\"idleS\": 120, \"toolIdleS\": 600}\n}"
      }
    },
    {
      "from": "bridge",
      "to": "cli",
      "description": "session/prompt",
      "technology": "ACP v1 / stdio"
    },
    {
      "from": "cli",
      "to": "bridge",
      "description": "session/update（回答、思考、工具调用…）",
      "technology": "ACP v1 / stdio"
    },
    {
      "from": "bridge",
      "to": "acp",
      "description": "agent.update：带会话内序号，内容原样转交",
      "technology": "atlas.host.v1 / WebSocket",
      "details": {
        "note": "server 按序号去重，每 1 秒或每 200 条回一次 session.ack；bridge 收到确认才释放补发缓冲。断线只是通道断了，这一轮在 Pod 里照常进行，重连 attach 后补发。"
      }
    },
    {
      "from": "acp",
      "to": "executor",
      "description": "翻成平台事件交出（data 形状与原生逐字段一致）"
    },
    {
      "from": "cli",
      "to": "bridge",
      "description": "session/request_permission（要执行有副作用的动作）",
      "technology": "ACP v1 / stdio"
    },
    {
      "from": "bridge",
      "to": "acp",
      "description": "permission.ask（等多久不限）",
      "technology": "atlas.host.v1 / WebSocket",
      "details": {
        "note": "bridge 绝不自动批准，CLI 的请求永远有回应；这一轮被取消或结束时，挂起的询问一律回「已取消」并撤回。"
      }
    },
    {
      "from": "acp",
      "to": "approval",
      "description": "登记审批并在线等；run 标 awaiting_user，发 approval.required",
      "details": {
        "items": [
          [
            "审批 id",
            "uuid5(run_uuid, toolCallId)",
            "bridge 补发、接管后重问都落到同一行"
          ],
          [
            "run 状态",
            "仍是 running",
            "awaiting_user = true（进程在跑，不是挂起）"
          ]
        ]
      }
    },
    {
      "from": "web",
      "to": "approval",
      "description": "用户点「允许」",
      "technology": "JSON/HTTPS"
    },
    {
      "from": "approval",
      "to": "acp",
      "description": "决定信号：在线等待返回",
      "technology": "Redis Pub/Sub",
      "details": {
        "note": "等信号，低频回库检查兜底；信号丢了也能返回。处理这次请求的实例和连着 bridge 的实例可以不是同一个。"
      }
    },
    {
      "from": "acp",
      "to": "bridge",
      "description": "答复 permission.ask：选「允许一次」",
      "technology": "atlas.host.v1 / WebSocket",
      "details": {
        "note": "批准只选「允许一次」，绝不选「永远允许」——那是 CLI 侧的全局策略，不能从一次弹窗里溜进来。拒绝时把理由作为 tool.failed 送进事件流。"
      }
    },
    {
      "from": "bridge",
      "to": "cli",
      "description": "权限结果（selected: allow_once）",
      "technology": "ACP v1 / stdio"
    },
    {
      "from": "cli",
      "to": "bridge",
      "description": "session/prompt 响应（stopReason: end_turn）",
      "technology": "ACP v1 / stdio"
    },
    {
      "from": "bridge",
      "to": "acp",
      "description": "turn.state：ended（Completed、用时、等人用时）",
      "technology": "atlas.host.v1 / WebSocket",
      "details": {
        "note": "结束只宣告一次。取消、静默到点、CLI 退出、Pod 终止都以 ended 收场，结果里写原因。"
      }
    },
    {
      "from": "acp",
      "to": "executor",
      "description": "用量、终止事件（执行器先落库再发布 run.finished）"
    }
  ]
}
</script>

<main>
  <ul id="c4-report" hidden></ul>
  <svg id="c4-diagram" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
  <section id="c4-details" hidden></section>
  <h2>Diagram key</h2>
  <svg id="c4-key" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
</main>

<script>
(() => {
  'use strict';
  const FONT = '"Open Sans", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  const INK = '#444444';
  const LIFELINE = '#9a9a9a';
  const SCOPE_COLOR = '#1168bd';
  const PALETTE = {
    person: ['#297e06', '#1a849c', '#6b8e23'],
    system: ['#ed8609', '#bf101d', '#8411bd', '#5b6770', '#b8336a'],
  };
  const KIND_LABEL = { person: 'Person', system: 'Software System', container: 'Container', component: 'Component' };
  const MAX_MESSAGES = 20;
  const TXT = {
    name: { size: 17, weight: 400, lh: 22 },
    meta: { size: 12, weight: 400, lh: 16 },
    msg: { size: 15, weight: 400, lh: 20 },
    tech: { size: 12, weight: 400, lh: 16 },
    bname: { size: 18, weight: 700, lh: 22 },
    btype: { size: 12, weight: 700, lh: 16 },
    key: { size: 13, weight: 400, lh: 18 },
  };
  const BOX_H = 52, ICON_H = 30, HEADER_H = 48, LABEL_W = 260, MIN_GAP = 70, SELF_W = 36, MARGIN = 50;

  const svgNS = 'http://www.w3.org/2000/svg';
  const problems = [];
  const fail = (msg) => problems.push({ level: 'error', msg });
  const warn = (msg) => problems.push({ level: 'warn', msg });

  const ctx = document.createElement('canvas').getContext('2d');
  const measure = (s, st) => { ctx.font = `${st.weight} ${st.size}px ${FONT}`; return ctx.measureText(s).width; };

  // 中文按字断行，英文按词断行；行首不放标点
  const CJK = '\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f';
  const TOKEN = new RegExp(`[${CJK}]|[^\\s${CJK}]+|\\s+`, 'g');
  const NO_LINE_START = /^[，。、；：！？）》」』,.;:!?)]$/;
  function wrap(text, st, maxW) {
    const lines = [];
    for (const para of String(text || '').split('\n')) {
      let line = '';
      for (const tok of para.match(TOKEN) || []) {
        if (/^\s+$/.test(tok)) { if (line) line += ' '; continue; }
        const next = line + tok;
        if (line.trim() && measure(next.trimEnd(), st) > maxW && !NO_LINE_START.test(tok)) {
          lines.push(line.trimEnd());
          line = tok;
        } else {
          line = next;
        }
      }
      if (line.trim()) lines.push(line.trimEnd());
    }
    return lines;
  }

  // 行数不变的前提下收窄宽度，让各行长度接近，避免末行只剩一两个字
  function wrapBalanced(text, st, maxW) {
    const lines = wrap(text, st, maxW);
    if (lines.length < 2) return lines;
    let lo = maxW / 2, hi = maxW;
    while (hi - lo > 4) {
      const mid = (lo + hi) / 2;
      if (wrap(text, st, mid).length > lines.length) lo = mid; else hi = mid;
    }
    return wrap(text, st, hi);
  }

  function node(tag, attrs, parent) {
    const n = document.createElementNS(svgNS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent.appendChild(n);
    return n;
  }
  // top 是文字块上沿
  function textLines(parent, lines, x, top, st, color, anchor = 'middle') {
    const t = node('text', { x, y: top + st.lh / 2 + st.size * 0.35, 'text-anchor': anchor,
      'font-family': FONT, 'font-size': st.size, 'font-weight': st.weight, fill: color }, parent);
    lines.forEach((ln, i) => { node('tspan', { x, dy: i ? st.lh : 0 }, t).textContent = ln; });
    return t;
  }

  // 参与者头：人员和数据库画图标 + 文字，其余画方框
  const iconHead = (p) => p.kind === 'person' || (p.kind === 'container' && p.shape === 'database');
  function headSize(p) {
    const w = Math.max(measure(p.name, TXT.name), measure(p.meta, TXT.meta)) + 24;
    return { w, h: iconHead(p) ? ICON_H + 4 + TXT.name.lh + TXT.meta.lh : BOX_H };
  }
  function drawHead(g, p, cx, top) {
    const c = p.color;
    let textTop = top + (BOX_H - TXT.name.lh - TXT.meta.lh) / 2;
    if (p.kind === 'person') {
      node('circle', { cx, cy: top + 8, r: 7, fill: '#fff', stroke: c, 'stroke-width': 1.8 }, g);
      node('path', { d: `M${cx - 14} ${top + ICON_H} Q${cx - 14} ${top + 16} ${cx} ${top + 16} Q${cx + 14} ${top + 16} ${cx + 14} ${top + ICON_H} Z`, fill: '#fff', stroke: c, 'stroke-width': 1.8 }, g);
      textTop = top + ICON_H + 4;
    } else if (iconHead(p)) {
      const rx = 17, ry = 5, y0 = top + ry, y1 = top + ICON_H - ry;
      node('path', { d: `M${cx - rx} ${y0} V${y1} A${rx} ${ry} 0 0 0 ${cx + rx} ${y1} V${y0}`, fill: '#fff', stroke: c, 'stroke-width': 1.8 }, g);
      node('ellipse', { cx, cy: y0, rx, ry, fill: '#fff', stroke: c, 'stroke-width': 1.8 }, g);
      textTop = top + ICON_H + 4;
    } else {
      node('rect', { x: cx - p.size.w / 2, y: top, width: p.size.w, height: BOX_H, rx: 4, fill: '#fff', stroke: c, 'stroke-width': 1.6 }, g);
    }
    textLines(g, [p.name], cx, textTop, TXT.name, c);
    textLines(g, [p.meta], cx, textTop + TXT.name.lh, TXT.meta, c);
  }
  function drawArrow(g, x0, x1, y) {
    const dir = Math.sign(x1 - x0), L = 10, W = 7;
    node('line', { x1: x0, y1: y, x2: x1 - dir * L, y2: y, stroke: INK, 'stroke-width': 1.6, 'stroke-dasharray': '8 5' }, g);
    node('polygon', { points: `${x1},${y} ${x1 - dir * L},${y - W / 2} ${x1 - dir * L},${y + W / 2}`, fill: INK }, g);
  }

  function render() {
    const model = JSON.parse(document.getElementById('c4-model').textContent);
    if (model.title) document.title = model.title;
    else fail('缺少 title（建议「Dynamic View: 系统名 - 场景」）');

    // ---- 边界 ----
    const bById = new Map();
    for (const b of model.boundaries || []) {
      if (!b.id) { fail(`边界 ${b.name || ''}：缺少 id`); continue; }
      if (bById.has(b.id)) { fail(`边界 id 重复：${b.id}`); continue; }
      if (!b.name || !b.type) fail(`边界 ${b.id}：name、type 都要写，type 如「Software System」「Container: Python / FastAPI」`);
      bById.set(b.id, b);
    }
    const chain = (id) => {   // 从里到外的边界链
      const out = [];
      for (let cur = id; cur; cur = bById.get(cur) && bById.get(cur).in) {
        if (!bById.has(cur) || out.includes(cur)) return null;
        out.push(cur);
      }
      return out;
    };
    for (const b of bById.values()) {
      if (b.in && !chain(b.id)) { fail(`边界 ${b.id}：in 指向不存在的边界，或者边界互相嵌套成了环`); b.broken = true; }
    }

    // ---- 参与者 ----
    const pById = new Map();
    const ps = [];
    for (const p of model.participants || []) {
      const who = p.id || p.name || '(未命名参与者)';
      if (!p.id) { fail(`${who}：缺少 id`); continue; }
      if (pById.has(p.id)) { fail(`参与者 id 重复：${p.id}`); continue; }
      if (!KIND_LABEL[p.kind]) { fail(`${who}：kind 只能是 person / system / container / component`); continue; }
      if (!p.name) fail(`${who}：缺少 name`);
      if ((p.kind === 'container' || p.kind === 'component') && !p.technology) fail(`${who}：${p.kind} 缺少 technology`);
      if (p.in && (!bById.has(p.in) || bById.get(p.in).broken)) { fail(`${who}：in 指向的边界 ${p.in} 不存在`); p.in = null; }
      p.chain = p.in ? chain(p.in) : [];
      p.meta = p.technology && (p.kind === 'container' || p.kind === 'component') ? `[${KIND_LABEL[p.kind]}: ${p.technology}]` : `[${KIND_LABEL[p.kind]}]`;
      pById.set(p.id, p);
      ps.push(p);
    }
    if (ps.length < 2) fail('至少要有两个参与者');
    const assigned = new Map(), used = { person: 0, system: 0 };
    for (const p of ps) {
      if (p.color) continue;
      if (p.kind === 'container' || p.kind === 'component' || (p.kind === 'system' && p.scope)) { p.color = SCOPE_COLOR; continue; }
      const k = `${p.kind}:${p.tag || p.id}`;
      if (!assigned.has(k)) assigned.set(k, PALETTE[p.kind][used[p.kind]++ % PALETTE[p.kind].length]);
      p.color = assigned.get(k);
    }
    // 同一边界里的参与者在左右顺序上必须相邻，否则边界框会把别的参与者框进去
    for (const b of bById.values()) {
      const idx = ps.map((p, i) => (p.chain.includes(b.id) ? i : -1)).filter((i) => i >= 0);
      b.members = idx.map((i) => ps[i]);
      if (!idx.length) { fail(`边界「${b.name}」里没有任何参与者`); continue; }
      if (idx[idx.length - 1] - idx[0] + 1 !== idx.length) fail(`边界「${b.name}」里的参与者在 participants 里不相邻，调整顺序`);
    }

    // ---- 消息 ----
    const msgs = (model.messages || []).filter((m, i) => {
      const who = `第 ${i + 1} 条消息（${m.from} → ${m.to}）`;
      if (!pById.has(m.from) || !pById.has(m.to)) { fail(`${who}：端点 id 不存在`); return false; }
      if (!m.description) fail(`${who}：缺少 description（写做什么）`);
      const a = pById.get(m.from), b = pById.get(m.to);
      const crossProcess = a.kind !== 'person' && b.kind !== 'person' && !(a.kind === 'component' && b.kind === 'component') && a !== b;
      if (crossProcess && !m.technology) fail(`${who}：涉及 container 或软件系统，是跨进程交互，要写 technology`);
      if (m.details !== undefined) {
        const d = m.details;
        const isText = (v) => typeof v === 'string';
        if (!d || typeof d !== 'object' || Array.isArray(d)) {
          fail(`${who}：details 要写成对象 { note, items, example }`);
          m.details = undefined;
        } else {
          if (d.note !== undefined && !isText(d.note)) fail(`${who}：details.note 要写成字符串`);
          if (d.example !== undefined && !isText(d.example)) fail(`${who}：details.example 要写成字符串，多行用 \\n`);
          if (d.items !== undefined && !(Array.isArray(d.items) && d.items.every((r) => Array.isArray(r) && r.length === 3 && r.every(isText)))) {
            fail(`${who}：details.items 的每一行要写成 [项, 来源, 样例] 三个字符串`);
          }
          if (!d.note && !d.example && !(Array.isArray(d.items) && d.items.length)) warn(`${who}：details 是空的，删掉或补上内容`);
        }
      }
      m.n = i + 1;
      return true;
    });
    if (!msgs.length) fail('至少要有一条消息');
    if (msgs.length > MAX_MESSAGES) warn(`消息有 ${msgs.length} 条，超过 ${MAX_MESSAGES} 条：只画这个场景的关键交互，或者拆成几张图`);
    for (const p of ps) {
      if (!msgs.some((m) => m.from === p.id || m.to === p.id)) warn(`「${p.name}」没有参与任何消息：与这个场景无关就删掉`);
    }

    // ---- 横向：列间距按参与者宽度和消息标签宽度撑开 ----
    for (const p of ps) p.size = headSize(p);
    const index = new Map(ps.map((p, i) => [p.id, i]));
    for (const m of msgs) {
      m.lines = wrapBalanced(`${m.n}: ${m.description || ''}${m.details ? ' ⓘ' : ''}`, TXT.msg, LABEL_W);
      m.tech = m.technology ? `[${m.technology}]` : '';
      m.labelW = Math.max(...m.lines.map((s) => measure(s, TXT.msg)), m.tech ? measure(m.tech, TXT.tech) : 0);
      m.labelH = m.lines.length * TXT.msg.lh + (m.tech ? TXT.tech.lh : 0);
    }
    const gaps = ps.slice(1).map((p, i) => (ps[i].size.w + p.size.w) / 2 + MIN_GAP);
    let rightExtra = 0;
    const spanOf = (m) => Math.abs(index.get(m.to) - index.get(m.from));
    for (const m of [...msgs].sort((a, b) => spanOf(a) - spanOf(b))) {
      const i = index.get(m.from), j = index.get(m.to);
      if (i === j) {   // 自调用：标签在生命线右边，占下一列间距
        const need = SELF_W + 16 + m.labelW + 20;
        if (i < gaps.length) gaps[i] = Math.max(gaps[i], need); else rightExtra = Math.max(rightExtra, need);
        continue;
      }
      const lo = Math.min(i, j), hi = Math.max(i, j);
      const span = gaps.slice(lo, hi).reduce((s, g) => s + g, 0);
      const need = m.labelW + 40;
      if (span < need) for (let k = lo; k < hi; k++) gaps[k] += (need - span) / (hi - lo);
    }
    let x = 0;
    ps.forEach((p, i) => { if (i) x += gaps[i - 1]; p.x = x; });

    // ---- 纵向：边界标题 → 参与者头 → 消息 → 底部参与者头 ----
    const depthOf = (b) => chain(b.id).length;
    const live = [...bById.values()].filter((b) => !b.broken && b.members && b.members.length);
    const maxDepth = Math.max(0, ...live.map(depthOf));
    const headTop = maxDepth * HEADER_H + (maxDepth ? 10 : 0);
    const headH = Math.max(...ps.map((p) => p.size.h), BOX_H);
    let y = headTop + headH + 24;
    for (const m of msgs) {
      m.labelTop = y;
      m.y = y + m.labelH + 8;
      y = m.y + (m.from === m.to ? 46 : 26);
    }
    const bottomTop = y + 8, bottom = bottomTop + headH;

    // 边界框：外层比内层多留一圈
    const below = (b) => Math.max(0, ...live.filter((c) => c.in === b.id).map((c) => 1 + below(c)));
    for (const b of live) {
      const pad = 14 + 16 * below(b);
      const d = depthOf(b);
      b.rect = {
        x: Math.min(...b.members.map((p) => p.x - p.size.w / 2)) - pad,
        y: (d - 1) * HEADER_H,
        w: 0, h: 0,
      };
      b.rect.w = Math.max(...b.members.map((p) => p.x + p.size.w / 2)) + pad - b.rect.x;
      b.rect.h = bottom + 10 + 14 * below(b) - b.rect.y;
      const titleW = Math.max(measure(b.name, TXT.bname), measure(`[${b.type}]`, TXT.btype)) + 20;
      if (titleW > b.rect.w) warn(`边界「${b.name}」的标题比边界还宽，名字写短一点`);
    }
    for (const b of live) {
      for (const p of ps) {
        if (!b.members.includes(p) && p.x + p.size.w / 2 > b.rect.x && p.x - p.size.w / 2 < b.rect.x + b.rect.w) {
          fail(`「${p.name}」不在边界「${b.name}」里，却和边界框重叠，调整 participants 顺序`);
        }
      }
    }

    // ---- 绘制 ----
    const svg = document.getElementById('c4-diagram');
    const gB = node('g', {}, svg), gLife = node('g', {}, svg), gM = node('g', {}, svg), gH = node('g', {}, svg), gT = node('g', {}, svg);
    for (const b of [...live].sort((a, c) => depthOf(a) - depthOf(c))) {
      const r = b.rect;
      node('rect', { x: r.x, y: r.y, width: r.w, height: r.h, fill: 'none', stroke: SCOPE_COLOR, 'stroke-width': 1.6 }, gB);
      textLines(gB, [b.name], r.x + r.w / 2, r.y + 4, TXT.bname, SCOPE_COLOR);
      textLines(gB, [`[${b.type}]`], r.x + r.w / 2, r.y + 4 + TXT.bname.lh, TXT.btype, SCOPE_COLOR);
    }
    for (const p of ps) {
      node('line', { x1: p.x, y1: headTop + p.size.h, x2: p.x, y2: bottomTop, stroke: LIFELINE, 'stroke-width': 1, 'stroke-dasharray': '4 4' }, gLife);
      drawHead(gH, p, p.x, headTop);
      drawHead(gH, p, p.x, bottomTop);
    }
    for (const m of msgs) {
      const a = pById.get(m.from), b = pById.get(m.to);
      let lx;
      if (a === b) {
        const x0 = a.x, x1 = a.x + SELF_W;
        node('polyline', { points: `${x0},${m.y} ${x1},${m.y} ${x1},${m.y + 20} ${x0 + 10},${m.y + 20}`, fill: 'none', stroke: INK, 'stroke-width': 1.6, 'stroke-dasharray': '8 5' }, gM);
        node('polygon', { points: `${x0},${m.y + 20} ${x0 + 10},${m.y + 16.5} ${x0 + 10},${m.y + 23.5}`, fill: INK }, gM);
        lx = x1 + 12;
      } else {
        drawArrow(gM, a.x, b.x, m.y);
        lx = Math.min(a.x, b.x) + 12;
      }
      // 有 details 的消息：标签链接到图下方「消息说明」里的同号条目
      const gL = m.details ? node('a', { href: `#c4-msg-${m.n}` }, gM) : gM;
      node('rect', { x: lx - 3, y: m.labelTop - 1, width: m.labelW + 6, height: m.labelH + 2, fill: '#fff' }, gL);
      textLines(gL, m.lines, lx, m.labelTop, TXT.msg, INK, 'start');
      if (m.tech) textLines(gL, [m.tech], lx, m.labelTop + m.lines.length * TXT.msg.lh, TXT.tech, INK, 'start');
    }
    const minX = Math.min(...ps.map((p) => p.x - p.size.w / 2), ...live.map((b) => b.rect.x));
    let maxX = Math.max(...ps.map((p) => p.x + p.size.w / 2 + (p === ps[ps.length - 1] ? rightExtra : 0)), ...live.map((b) => b.rect.x + b.rect.w));
    let maxY = Math.max(bottom, ...live.map((b) => b.rect.y + b.rect.h));
    const title = { size: 26, weight: 400, lh: 34 }, sub = { size: 15, weight: 400, lh: 22 };
    textLines(gT, [model.title || ''], minX, maxY + 36, title, INK, 'start');
    if (model.description) textLines(gT, [model.description], minX, maxY + 36 + title.lh, sub, '#666', 'start');
    maxX = Math.max(maxX, minX + measure(model.title || '', title), minX + measure(model.description || '', sub));
    maxY += 36 + title.lh + (model.description ? sub.lh : 0);
    const vw = maxX - minX + 2 * MARGIN, vh = maxY + 2 * MARGIN;
    svg.setAttribute('viewBox', `${minX - MARGIN} ${-MARGIN} ${vw} ${vh}`);
    svg.setAttribute('width', vw);
    svg.setAttribute('aria-label', model.title || 'Dynamic diagram');

    renderKey(ps, live);
    renderDetails(msgs);
  }

  // ---- 消息说明：每条带 details 的消息一节（说明、[项, 来源, 样例] 表、数据样例）----
  function renderDetails(msgs) {
    const list = msgs.filter((m) => m.details);
    if (!list.length) return;
    const sec = document.getElementById('c4-details');
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    sec.appendChild(el('h2', '', '消息说明'));
    for (const m of list) {
      const d = m.details;
      const art = el('article');
      art.id = `c4-msg-${m.n}`;
      const h = el('h3', '', `${m.n}: ${m.description || ''}`);
      if (m.technology) h.appendChild(el('span', 'tech', `[${m.technology}]`));
      art.appendChild(h);
      if (typeof d.note === 'string' && d.note) art.appendChild(el('p', '', d.note));
      const rows = Array.isArray(d.items) ? d.items.filter((r) => Array.isArray(r)) : [];
      if (rows.length) {
        const table = el('table');
        const head = table.createTHead().insertRow();
        for (const c of ['项', '来源', '样例']) head.appendChild(el('th', '', c));
        const body = table.createTBody();
        for (const r of rows) {
          const tr = body.insertRow();
          r.slice(0, 3).forEach((c, i) => tr.appendChild(el('td', i === 2 ? 'sample' : '', String(c))));
        }
        art.appendChild(table);
      }
      if (typeof d.example === 'string' && d.example) art.appendChild(el('pre', '', d.example));
      sec.appendChild(art);
    }
    sec.hidden = false;
  }

  // ---- 图例：每种参与者一项，再加边界和消息 ----
  function renderKey(ps, boundaries) {
    const svg = document.getElementById('c4-key');
    const rank = { person: 0, system: 1, container: 2, component: 3 };
    const label = (p) => {
      if (p.kind === 'person') return `Person, ${p.tag || p.name}`;
      if (p.kind === 'system') return p.tag || p.name;
      if (p.kind === 'container') return p.shape === 'database' ? 'Container, Database' : 'Container';
      return 'Component';
    };
    const groups = new Map();
    for (const p of [...ps].sort((a, b) => rank[a.kind] - rank[b.kind])) {
      const k = `${p.kind}|${iconHead(p)}|${p.color}`;
      if (!groups.has(k)) groups.set(k, { proto: p, labels: [] });
      if (!groups.get(k).labels.includes(label(p))) groups.get(k).labels.push(label(p));
    }
    const items = [...groups.values()].map((g) => ({ kind: 'head', proto: g.proto, text: g.labels.join('、') }));
    if (boundaries.length) items.push({ kind: 'boundary', text: 'Boundary（系统 / 容器）' });
    items.push({ kind: 'message', text: 'n: 交互（编号 = 先后顺序）' });
    const CELL_W = 230, CELL_H = 110, PER_ROW = 6;
    items.forEach((it, i) => {
      const cx = (i % PER_ROW) * CELL_W + CELL_W / 2, top = Math.floor(i / PER_ROW) * CELL_H;
      const g = node('g', {}, svg);
      if (it.kind === 'head') {
        const p = { ...it.proto, name: it.text.length > 22 ? it.text.slice(0, 21) + '…' : it.text, meta: '' };
        p.size = { w: Math.min(CELL_W - 20, measure(p.name, TXT.name) + 24), h: BOX_H };
        drawHead(g, p, cx, top + 10);
        return;
      }
      if (it.kind === 'boundary') {
        node('rect', { x: cx - 95, y: top + 10, width: 190, height: 56, fill: 'none', stroke: SCOPE_COLOR, 'stroke-width': 1.6 }, g);
        textLines(g, [it.text], cx, top + 10 + 4, TXT.key, SCOPE_COLOR);
        return;
      }
      drawArrow(g, cx - 90, cx + 90, top + 46);
      textLines(g, [it.text], cx - 88, top + 18, TXT.key, INK, 'start');
    });
    const rows = Math.ceil(items.length / PER_ROW), cols = Math.min(items.length, PER_ROW);
    svg.setAttribute('viewBox', `0 0 ${cols * CELL_W} ${rows * CELL_H}`);
    svg.setAttribute('width', cols * CELL_W);
    svg.setAttribute('aria-label', 'Diagram key');
  }

  try {
    render();
  } catch (e) {
    fail(`渲染异常：${e && e.message}`);
    console.error(e);
  }
  const status = problems.some((p) => p.level === 'error') ? 'error' : problems.length ? 'warn' : 'ok';
  document.documentElement.dataset.c4Status = status;
  const report = document.getElementById('c4-report');
  for (const p of problems) {
    const li = document.createElement('li');
    li.dataset.level = p.level;
    li.textContent = p.msg;
    report.appendChild(li);
  }
  report.hidden = !problems.length;
  if (problems.length) console.warn('[c4]', problems);
})();
</script>
</body>
</html>
